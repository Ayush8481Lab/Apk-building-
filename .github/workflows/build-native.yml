name: Build Music8481 Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      # 🔧 FIX: override default packages — 'tools' no longer exists in SDK repo
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ═══════════════════════════════════════════════════════════
      # STEP 1 — Generate Gradle & Resource files
      # ═══════════════════════════════════════════════════════════
      - name: Generate Gradle + Resources
        run: |
          set -e
          mkdir -p native/app/src/main/java/com/music8481/app
          mkdir -p native/app/src/main/res/values
          mkdir -p native/app/src/main/res/mipmap-mdpi
          mkdir -p native/app/src/main/res/mipmap-hdpi
          mkdir -p native/app/src/main/res/mipmap-xhdpi
          mkdir -p native/app/src/main/res/mipmap-xxhdpi
          mkdir -p native/app/src/main/res/mipmap-xxxhdpi

          cat <<'EOF' > native/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Music8481"
          include(":app")
          EOF

          cat <<'EOF' > native/build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false
          }
          EOF

          cat <<'EOF' > native/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat <<'EOF' > native/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "com.music8481.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.music8481.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("release.keystore")
                      storePassword = "music8481"
                      keyAlias = "music8481"
                      keyPassword = "music8481"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

              val media3 = "1.5.0"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-session:$media3")
              implementation("androidx.media3:media3-datasource-okhttp:$media3")

              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
          }
          EOF

          cat <<'EOF' > native/app/proguard-rules.pro
          -keep class com.music8481.app.** { *; }
          -dontwarn org.jetbrains.annotations.**
          -keepclassmembers class kotlinx.serialization.json.** { *** Companion; }
          EOF

          cat <<'EOF' > native/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Music8481">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > native/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Music8481</string>
          </resources>
          EOF

          cat <<'EOF' > native/app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Music8481" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      # ═══════════════════════════════════════════════════════════
      # STEP 2 — Data + Network layer
      # ═══════════════════════════════════════════════════════════
      - name: Generate Data + API layer
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/Models.kt
          package com.music8481.app

          import android.net.Uri
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import kotlinx.serialization.SerialName
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json
          import kotlinx.serialization.json.JsonArray
          import kotlinx.serialization.json.JsonElement
          import kotlinx.serialization.json.JsonObject

          @Serializable
          data class Song(
              @SerialName("track_id") val trackId: String? = null,
              @SerialName("entity_id") val entityId: String? = null,
              val id: String? = null,
              @SerialName("track_title") val trackTitle: String? = null,
              val name: String? = null,
              val title: String? = null,
              @SerialName("artwork_large") val artworkLarge: String? = null,
              @SerialName("artwork_web") val artworkWeb: String? = null,
              val artwork: String? = null,
              val atw: String? = null,
              @SerialName("entity_type") val entityType: String? = null,
              val seokey: String? = null,
              @SerialName("entity_info") val entityInfo: List<EntityInfo>? = null,
              val artists: List<Artist>? = null,
              val singers: List<Artist>? = null
          ) {
              val songId: String get() = trackId ?: id ?: entityId ?: ""
              val displayTitle: String get() = trackTitle ?: name ?: title ?: "Unknown"

              val imageUrl: String
                  get() = (artworkLarge ?: artworkWeb ?: artwork ?: atw ?: "")
                      .replace(Regex("size_[ms]"), "size_l")
                      .replace("150x150", "500x500")
                      .replace("50x50", "500x500")

              val displayArtists: String
                  get() {
                      entityInfo?.firstOrNull { it.key == "artist" || it.key == "singers" }?.value?.let { v ->
                          try {
                              val arr = v as? JsonArray
                              val names = arr?.mapNotNull { (it as? JsonObject)?.get("name")?.toString()?.trim('"') }
                              if (!names.isNullOrEmpty()) return names.joinToString(", ")
                          } catch (_: Exception) {}
                      }
                      val list = artists ?: singers ?: emptyList()
                      return list.mapNotNull { it.name }.joinToString(", ").ifEmpty { "Unknown Artist" }
                  }

              fun toMediaItem(): MediaItem = MediaItem.Builder()
                  .setMediaId(songId)
                  .setUri(Uri.parse("music8481://resolve/$songId"))
                  .setMediaMetadata(
                      MediaMetadata.Builder()
                          .setTitle(displayTitle)
                          .setArtist(displayArtists)
                          .setArtworkUri(imageUrl.takeIf { it.isNotEmpty() }?.let { Uri.parse(it) })
                          .build()
                  )
                  .build()
          }

          @Serializable
          data class EntityInfo(val key: String? = null, val value: JsonElement? = null)

          @Serializable
          data class Artist(val name: String? = null, val id: String? = null, val seokey: String? = null)

          @Serializable
          data class HomeResponse(val data: JsonElement? = null) {
              fun getSongs(): List<Song> {
                  val d = data ?: return emptyList()
                  val json = Json { ignoreUnknownKeys = true; isLenient = true }
                  return try {
                      when {
                          d is JsonObject && d.containsKey("entities") ->
                              json.decodeFromJsonElement<List<Song>>(d["entities"]!!)
                          d is JsonObject && d.containsKey("tracks") ->
                              json.decodeFromJsonElement<List<Song>>(d["tracks"]!!)
                          d is JsonArray ->
                              json.decodeFromJsonElement<List<Song>>(d)
                          else -> emptyList()
                      }
                  } catch (_: Exception) { emptyList() }
              }
          }

          @Serializable
          data class StreamResponse(
              @SerialName("hls_url") val hlsUrl: String? = null,
              val url: String? = null,
              val data: StreamData? = null
          ) {
              val resolvedUrl: String?
                  get() = hlsUrl ?: data?.hlsUrl ?: data?.url ?: url
          }

          @Serializable
          data class StreamData(
              @SerialName("hlsUrl") val hlsUrl: String? = null,
              val url: String? = null
          )
          EOF

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/Api.kt
          package com.music8481.app

          import kotlinx.serialization.json.Json
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.kotlinx.serialization.asConverterFactory
          import retrofit2.http.GET
          import retrofit2.http.Query
          import java.util.concurrent.TimeUnit

          interface GaanaApi {
              @GET("home/showcase")
              suspend fun getShowcase(@Query("userlanguage") lang: String): HomeResponse

              @GET("home/smartfeed/765")
              suspend fun getTrending(
                  @Query("view") view: String = "all",
                  @Query("userlanguage") lang: String
              ): HomeResponse

              @GET("home/section-data")
              suspend fun getSection(
                  @Query("seokey") seokey: String,
                  @Query("view") view: String = "all",
                  @Query("userlanguage") lang: String
              ): HomeResponse
          }

          interface StreamApi {
              @GET("api/stream")
              suspend fun getStream(@Query("id") trackId: String): StreamResponse
          }

          object ApiClient {
              private const val BYPASS_SECRET = "pR3nSUsTI9HQxb2RbdasB5mjKqUoSP8m"

              private val okHttp: OkHttpClient = OkHttpClient.Builder()
                  .addInterceptor { chain ->
                      val req = chain.request().newBuilder()
                          .addHeader("x-vercel-protection-bypass", BYPASS_SECRET)
                          .addHeader("User-Agent", "Music8481-Android/1.0")
                          .build()
                      chain.proceed(req)
                  }
                  .connectTimeout(20, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()

              private val json = Json { ignoreUnknownKeys = true; isLenient = true }
              private val contentType = "application/json".toMediaType()

              val vercelApi: GaanaApi = Retrofit.Builder()
                  .baseUrl("https://gaanaayush.vercel.app/api/superserch/")
                  .client(okHttp)
                  .addConverterFactory(json.asConverterFactory(contentType))
                  .build().create(GaanaApi::class.java)

              val cfApi: GaanaApi = Retrofit.Builder()
                  .baseUrl("https://gaanaayush.wonder945177.workers.dev/api/superserch/")
                  .client(okHttp)
                  .addConverterFactory(json.asConverterFactory(contentType))
                  .build().create(GaanaApi::class.java)

              val streamApi: StreamApi = Retrofit.Builder()
                  .baseUrl("https://ayushgaana.vercel.app/")
                  .client(okHttp)
                  .addConverterFactory(json.asConverterFactory(contentType))
                  .build().create(StreamApi::class.java)
          }
          EOF

      # ═══════════════════════════════════════════════════════════
      # STEP 3 — Playback engine
      # ═══════════════════════════════════════════════════════════
      - name: Generate Playback engine
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/PlaybackService.kt
          package com.music8481.app

          import android.net.Uri
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.datasource.ResolvingDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import kotlinx.coroutines.runBlocking
          import java.io.IOException

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()

                  val dataSourceFactory = ResolvingDataSource.Factory(
                      DefaultHttpDataSource.Factory()
                          .setUserAgent("Music8481-Android/1.0")
                          .setAllowCrossProtocolRedirects(true),
                      { dataSpec ->
                          val songId = dataSpec.uri.lastPathSegment ?: throw IOException("No song ID")
                          val url = UrlResolver.get(songId)
                              ?: runBlocking { PlayerManager.fetchAndCacheUrl(songId) }
                              ?: throw IOException("Failed to resolve stream for $songId")
                          dataSpec.withUri(Uri.parse(url))
                      }
                  )

                  val player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(dataSourceFactory))
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .build(),
                          /* handleAudioFocus = */ true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .build()

                  mediaSession = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo) = mediaSession

              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/PlayerManager.kt
          package com.music8481.app

          import android.content.ComponentName
          import android.content.Context
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.MoreExecutors
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.util.concurrent.ConcurrentHashMap

          data class PlayerState(
              val isPlaying: Boolean = false,
              val isBuffering: Boolean = false,
              val currentSong: Song? = null,
              val positionMs: Long = 0L,
              val durationMs: Long = 0L,
              val bufferedMs: Long = 0L,
              val shuffle: Boolean = false,
              val repeatMode: Int = Player.REPEAT_MODE_OFF,
              val currentIndex: Int = 0,
              val queueSize: Int = 0
          )

          object UrlResolver {
              private val cache = ConcurrentHashMap<String, String>()
              fun get(id: String): String? = cache[id]
              fun put(id: String, url: String) { cache[id] = url }
              fun clear() = cache.clear()
          }

          object PlayerManager {
              private var controller: MediaController? = null
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              private val _state = MutableStateFlow(PlayerState())
              val state: StateFlow<PlayerState> = _state.asStateFlow()

              private var songsQueue: List<Song> = emptyList()

              suspend fun fetchAndCacheUrl(songId: String): String? {
                  UrlResolver.get(songId)?.let { return it }
                  return try {
                      val res = ApiClient.streamApi.getStream(songId)
                      val url = res.resolvedUrl
                      if (url != null) { UrlResolver.put(songId, url); url } else null
                  } catch (_: Exception) { null }
              }

              fun connect(context: Context) {
                  if (controller != null) return
                  val token = SessionToken(context, ComponentName(context, PlaybackService::class.java))
                  val future = MediaController.Builder(context.applicationContext, token).buildAsync()
                  future.addListener({
                      controller = try { future.get() } catch (_: Exception) { null }
                      controller?.addListener(object : Player.Listener {
                          override fun onMediaItemTransition(mediaItem: androidx.media3.common.MediaItem?, reason: Int) {
                              prefetchAhead()
                              updateState()
                          }
                          override fun onIsPlayingChanged(isPlaying: Boolean) = updateState()
                          override fun onPlaybackStateChanged(playbackState: Int) = updateState()
                          override fun onMediaMetadataChanged(mediaMetadata: androidx.media3.common.MediaMetadata) = updateState()
                          override fun onShuffleModeEnabledChanged(shuffleModeEnabled: Boolean) = updateState()
                          override fun onRepeatModeChanged(repeatMode: Int) = updateState()
                      })
                      scope.launch {
                          while (true) { if (controller?.isPlaying == true) updateState(); delay(500) }
                      }
                      updateState()
                  }, MoreExecutors.directExecutor())
              }

              private fun prefetchAhead() {
                  val c = controller ?: return
                  val idx = c.currentMediaItemIndex
                  if (idx < 0) return
                  scope.launch {
                      (1..3).forEach { offset ->
                          val i = idx + offset
                          songsQueue.getOrNull(i)?.let { song ->
                              launch { fetchAndCacheUrl(song.songId) }
                          }
                      }
                  }
              }

              private fun updateState() {
                  val c = controller ?: return
                  val song = c.currentMediaItem?.mediaId?.let { id -> songsQueue.firstOrNull { it.songId == id } }
                  _state.value = PlayerState(
                      isPlaying = c.isPlaying,
                      isBuffering = c.playbackState == Player.STATE_BUFFERING,
                      currentSong = song,
                      positionMs = c.currentPosition.coerceAtLeast(0),
                      durationMs = c.duration.coerceAtLeast(0),
                      bufferedMs = c.bufferedPosition.coerceAtLeast(0),
                      shuffle = c.shuffleModeEnabled,
                      repeatMode = c.repeatMode,
                      currentIndex = c.currentMediaItemIndex,
                      queueSize = c.mediaItemCount
                  )
              }

              fun play(songs: List<Song>, startIndex: Int) {
                  if (songs.isEmpty()) return
                  songsQueue = songs
                  val safeIndex = startIndex.coerceIn(0, songs.size - 1)
                  scope.launch {
                      val current = songs[safeIndex]
                      fetchAndCacheUrl(current.songId)

                      withContext(Dispatchers.Main) {
                          val items = songs.map { it.toMediaItem() }
                          controller?.setMediaItems(items, safeIndex, 0L)
                          controller?.prepare()
                          controller?.play()
                      }

                      val others = songs.filterIndexed { i, _ -> i != safeIndex }
                      others.map { song -> async { fetchAndCacheUrl(song.songId) } }.awaitAll()
                  }
              }

              fun togglePlayPause() {
                  controller?.let { if (it.isPlaying) it.pause() else it.play() }
              }
              fun next() = controller?.seekToNextMediaItem()
              fun previous() = controller?.seekToPreviousMediaItem()
              fun seekTo(ms: Long) = controller?.seekTo(ms)
              fun setShuffle(on: Boolean) { controller?.shuffleModeEnabled = on }
              fun cycleRepeat() {
                  controller?.let { c ->
                      c.repeatMode = when (c.repeatMode) {
                          Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                          Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                          else -> Player.REPEAT_MODE_OFF
                      }
                  }
              }
          }
          EOF

      # ═══════════════════════════════════════════════════════════
      # STEP 4 — HomeViewModel
      # ═══════════════════════════════════════════════════════════
      - name: Generate HomeViewModel
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/HomeViewModel.kt
          package com.music8481.app

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch

          data class HomeSection(val key: String, val title: String, val songs: List<Song>)

          class HomeViewModel : ViewModel() {
              private val _sections = MutableStateFlow<List<HomeSection>>(emptyList())
              val sections: StateFlow<List<HomeSection>> = _sections.asStateFlow()

              private val _isLoading = MutableStateFlow(false)
              val isLoading: StateFlow<Boolean> = _isLoading.asStateFlow()

              private data class SectionConfig(
                  val key: String,
                  val title: String,
                  val fetch: suspend (String) -> HomeResponse
              )

              private val configs = listOf(
                  SectionConfig("showcase", "Top Picks") { lang -> ApiClient.vercelApi.getShowcase(lang) },
                  SectionConfig("trending", "Trending Songs") { lang -> ApiClient.vercelApi.getTrending(lang = lang) },
                  SectionConfig("top_charts", "Top Charts") { lang -> ApiClient.cfApi.getSection("top-charts", lang = lang) },
                  SectionConfig("top_playlists", "Top Playlists") { lang -> ApiClient.cfApi.getSection("top-playlists-1", lang = lang) },
                  SectionConfig("90s", "Back to 90s") { lang -> ApiClient.cfApi.getSection("90s-2000s", lang = lang) },
                  SectionConfig("bhakti", "Bhakti") { lang -> ApiClient.cfApi.getSection("bhakti", lang = lang) },
                  SectionConfig("romance", "Romance") { lang -> ApiClient.cfApi.getSection("romance", lang = lang) },
                  SectionConfig("star_gallery", "Star Gallery") { lang -> ApiClient.cfApi.getSection("star-gallery", lang = lang) },
                  SectionConfig("city_charts", "City Top Charts") { lang -> ApiClient.cfApi.getSection("city-top-charts", lang = lang) },
                  SectionConfig("top_search", "Top Searched Artists") { lang -> ApiClient.cfApi.getSection("top-searched-artists", lang = lang) },
                  SectionConfig("just_arrived", "Just Arrived") { lang -> ApiClient.cfApi.getSection("just-arrived", lang = lang) },
                  SectionConfig("mehfil", "Mehfil-e-ghazal") { lang -> ApiClient.cfApi.getSection("mehfil-e-ghazal", lang = lang) }
              )

              private val language = "hindi"
              private var nextIndex = 0

              init {
                  loadNext(2)
              }

              fun loadMore() {
                  if (nextIndex < configs.size) loadNext(1)
              }

              private fun loadNext(count: Int) {
                  if (_isLoading.value) return
                  viewModelScope.launch {
                      _isLoading.value = true
                      try {
                          repeat(count) {
                              val idx = nextIndex
                              if (idx >= configs.size) return@repeat
                              val cfg = configs[idx]
                              val songs = runCatching { cfg.fetch(language).getSongs() }.getOrDefault(emptyList())
                              if (songs.isNotEmpty()) {
                                  _sections.update { current ->
                                      if (current.any { it.key == cfg.key }) current
                                      else current + HomeSection(cfg.key, cfg.title, songs)
                                  }
                              }
                              nextIndex++
                          }
                      } finally {
                          _isLoading.value = false
                      }
                  }
              }
          }
          EOF

      # ═══════════════════════════════════════════════════════════
      # STEP 5 — MainActivity (Compose UI)
      # ═══════════════════════════════════════════════════════════
      - name: Generate MainActivity (Compose UI)
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/MainActivity.kt
          package com.music8481.app

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.slideInVertically
          import androidx.compose.animation.slideOutVertically
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.view.WindowCompat
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewmodel.compose.viewModel
          import coil.compose.AsyncImage
          import kotlinx.coroutines.flow.distinctUntilChanged
          import kotlinx.coroutines.flow.snapshotFlow
          import androidx.compose.foundation.layout.WindowInsets
          import androidx.compose.foundation.layout.statusBars
          import androidx.compose.foundation.layout.windowInsetsPadding

          private val BgDark = Color(0xFF0B1320)
          private val CardBg = Color(0xFF131D30)
          private val Accent = Color(0xFF1DB954)

          class MainActivity : ComponentActivity() {
              private val notifPerm = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  PlayerManager.connect(applicationContext)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          notifPerm.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
                  setContent { Music8481Theme { AppRoot() } }
              }
          }

          @Composable
          fun Music8481Theme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Accent,
                      onPrimary = Color.Black,
                      background = BgDark,
                      onBackground = Color.White,
                      surface = CardBg,
                      onSurface = Color.White
                  ),
                  content = content
              )
          }

          @Composable
          fun AppRoot() {
              val playerState by PlayerManager.state.collectAsStateWithLifecycle()
              var showPlayer by remember { mutableStateOf(false) }

              Box(Modifier.fillMaxSize().background(BgDark)) {
                  HomeScreen(
                      modifier = Modifier.fillMaxSize(),
                      onSongClick = { song, allSongs ->
                          val idx = allSongs.indexOfFirst { it.songId == song.songId }
                          PlayerManager.play(allSongs, if (idx < 0) 0 else idx)
                          showPlayer = true
                      }
                  )

                  if (playerState.currentSong != null && !showPlayer) {
                      MiniPlayer(
                          playerState = playerState,
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .padding(horizontal = 8.dp, vertical = 8.dp),
                          onClick = { showPlayer = true }
                      )
                  }

                  AnimatedVisibility(
                      visible = showPlayer && playerState.currentSong != null,
                      enter = slideInVertically(initialOffsetY = { it }) + fadeIn(),
                      exit = slideOutVertically(targetOffsetY = { it }) + fadeOut()
                  ) {
                      PlayerScreen(playerState = playerState, onClose = { showPlayer = false })
                  }
              }
          }

          @Composable
          fun HomeScreen(
              modifier: Modifier = Modifier,
              viewModel: HomeViewModel = viewModel(),
              onSongClick: (Song, List<Song>) -> Unit
          ) {
              val sections by viewModel.sections.collectAsStateWithLifecycle()
              val isLoading by viewModel.isLoading.collectAsStateWithLifecycle()
              val listState = rememberLazyListState()

              LaunchedEffect(listState) {
                  snapshotFlow {
                      val info = listState.layoutInfo
                      val last = info.visibleItemsInfo.lastOrNull()?.index ?: 0
                      last >= info.totalItemsCount - 2 && info.totalItemsCount > 0
                  }.distinctUntilChanged().collect { nearEnd ->
                      if (nearEnd) viewModel.loadMore()
                  }
              }

              LazyColumn(
                  state = listState,
                  modifier = modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 90.dp)
              ) {
                  item { Header() }
                  sections.forEach { section ->
                      item(key = section.key) {
                          SectionRow(section = section, onSongClick = onSongClick)
                      }
                  }
                  if (isLoading) item { LoadingRow() }
              }
          }

          @Composable
          private fun Header() {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .windowInsetsPadding(WindowInsets.statusBars)
                      .padding(horizontal = 16.dp, vertical = 16.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier.size(36.dp).clip(CircleShape).background(Accent),
                      contentAlignment = Alignment.Center
                  ) { Text("M", color = Color.Black, fontWeight = FontWeight.Black, fontSize = 18.sp) }
                  Spacer(Modifier.width(12.dp))
                  Text("Music@8481", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Black)
              }
          }

          @Composable
          private fun SectionRow(section: HomeSection, onSongClick: (Song, List<Song>) -> Unit) {
              Column(Modifier.padding(vertical = 12.dp)) {
                  Text(
                      section.title,
                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp),
                      color = Color.White,
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Black
                  )
                  LazyRow(
                      contentPadding = PaddingValues(horizontal = 16.dp),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      items(section.songs, key = { it.songId + it.hashCode() }) { song ->
                          SongCard(song) { onSongClick(song, section.songs) }
                      }
                  }
              }
          }

          @Composable
          private fun SongCard(song: Song, onClick: () -> Unit) {
              Column(modifier = Modifier.width(140.dp).clickable { onClick() }) {
                  AsyncImage(
                      model = song.imageUrl,
                      contentDescription = song.displayTitle,
                      modifier = Modifier.size(140.dp).clip(RoundedCornerShape(16.dp)).background(CardBg),
                      contentScale = ContentScale.Crop
                  )
                  Text(
                      song.displayTitle,
                      modifier = Modifier.padding(top = 8.dp),
                      color = Color.White,
                      fontSize = 13.sp,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }

          @Composable
          private fun LoadingRow() {
              Row(
                  modifier = Modifier.fillMaxWidth().padding(24.dp),
                  horizontalArrangement = Arrangement.Center,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  CircularProgressIndicator(color = Accent, modifier = Modifier.size(24.dp), strokeWidth = 2.dp)
                  Spacer(Modifier.width(12.dp))
                  Text("Loading more…", color = Color.White.copy(alpha = 0.6f), fontSize = 13.sp)
              }
          }

          @Composable
          fun MiniPlayer(playerState: PlayerState, modifier: Modifier = Modifier, onClick: () -> Unit) {
              val song = playerState.currentSong ?: return
              val progress = if (playerState.durationMs > 0)
                  playerState.positionMs.toFloat() / playerState.durationMs else 0f

              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .height(64.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(CardBg)
                      .clickable { onClick() }
              ) {
                  Row(
                      modifier = Modifier.fillMaxSize().padding(horizontal = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      AsyncImage(
                          model = song.imageUrl,
                          contentDescription = null,
                          modifier = Modifier.size(44.dp).clip(RoundedCornerShape(6.dp)),
                          contentScale = ContentScale.Crop
                      )
                      Spacer(Modifier.width(10.dp))
                      Column(Modifier.weight(1f)) {
                          Text(song.displayTitle, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Text(song.displayArtists, color = Color.White.copy(alpha = 0.6f), fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                      IconButton(onClick = { PlayerManager.togglePlayPause() }) {
                          if (playerState.isBuffering) {
                              CircularProgressIndicator(color = Color.White, modifier = Modifier.size(20.dp), strokeWidth = 2.dp)
                          } else {
                              Icon(
                                  if (playerState.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                  contentDescription = null,
                                  tint = Color.White,
                                  modifier = Modifier.size(28.dp)
                              )
                          }
                      }
                  }
                  Box(Modifier.align(Alignment.BottomStart).fillMaxWidth().height(2.dp).background(Color.White.copy(alpha = 0.1f))) {
                      Box(Modifier.fillMaxHeight().fillMaxWidth(progress).background(Color.White))
                  }
              }
          }

          @Composable
          fun PlayerScreen(playerState: PlayerState, onClose: () -> Unit) {
              val song = playerState.currentSong ?: return
              val progress = if (playerState.durationMs > 0)
                  playerState.positionMs.toFloat() / playerState.durationMs else 0f

              Box(
                  modifier = Modifier.fillMaxSize().background(
                      Brush.verticalGradient(listOf(Color(0xFF1A2B45), BgDark))
                  )
              ) {
                  Column(Modifier.fillMaxSize().windowInsetsPadding(WindowInsets.statusBars)) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onClose) {
                              Icon(Icons.Default.KeyboardArrowDown, null, tint = Color.White, modifier = Modifier.size(28.dp))
                          }
                          Spacer(Modifier.weight(1f))
                          Text("Now Playing", color = Color.White.copy(alpha = 0.6f), fontSize = 11.sp, fontWeight = FontWeight.Medium)
                          Spacer(Modifier.weight(1f))
                          IconButton(onClick = { }) {
                              Icon(Icons.Default.MoreVert, null, tint = Color.White)
                          }
                      }

                      Spacer(Modifier.height(16.dp))

                      AsyncImage(
                          model = song.imageUrl,
                          contentDescription = null,
                          modifier = Modifier
                              .padding(horizontal = 32.dp)
                              .fillMaxWidth()
                              .aspectRatio(1f)
                              .clip(RoundedCornerShape(16.dp))
                              .shadow(20.dp),
                          contentScale = ContentScale.Crop
                      )

                      Spacer(Modifier.height(32.dp))

                      Text(
                          song.displayTitle,
                          modifier = Modifier.padding(horizontal = 24.dp),
                          color = Color.White,
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Black,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      Text(
                          song.displayArtists,
                          modifier = Modifier.padding(horizontal = 24.dp, vertical = 4.dp),
                          color = Color.White.copy(alpha = 0.65f),
                          fontSize = 14.sp,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )

                      Spacer(Modifier.weight(1f))

                      Slider(
                          value = progress.coerceIn(0f, 1f),
                          onValueChange = { v -> PlayerManager.seekTo((v * playerState.durationMs).toLong()) },
                          modifier = Modifier.padding(horizontal = 20.dp),
                          colors = SliderDefaults.colors(
                              thumbColor = Color.White,
                              activeTrackColor = Color.White,
                              inactiveTrackColor = Color.White.copy(alpha = 0.25f)
                          )
                      )
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 24.dp),
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text(formatMs(playerState.positionMs), color = Color.White.copy(alpha = 0.6f), fontSize = 11.sp)
                          Text(formatMs(playerState.durationMs), color = Color.White.copy(alpha = 0.6f), fontSize = 11.sp)
                      }

                      Spacer(Modifier.height(24.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 24.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = { PlayerManager.setShuffle(!playerState.shuffle) }) {
                              Icon(Icons.Default.Shuffle, null, tint = if (playerState.shuffle) Accent else Color.White)
                          }
                          IconButton(onClick = { PlayerManager.previous() }) {
                              Icon(Icons.Default.SkipPrevious, null, tint = Color.White, modifier = Modifier.size(40.dp))
                          }
                          Box(
                              modifier = Modifier
                                  .size(72.dp).clip(CircleShape).background(Color.White)
                                  .clickable { PlayerManager.togglePlayPause() },
                              contentAlignment = Alignment.Center
                          ) {
                              if (playerState.isBuffering) {
                                  CircularProgressIndicator(color = Color.Black, modifier = Modifier.size(30.dp), strokeWidth = 3.dp)
                              } else {
                                  Icon(
                                      if (playerState.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      null,
                                      tint = Color.Black,
                                      modifier = Modifier.size(38.dp)
                                  )
                              }
                          }
                          IconButton(onClick = { PlayerManager.next() }) {
                              Icon(Icons.Default.SkipNext, null, tint = Color.White, modifier = Modifier.size(40.dp))
                          }
                          IconButton(onClick = { PlayerManager.cycleRepeat() }) {
                              Icon(
                                  Icons.Default.Repeat, null,
                                  tint = if (playerState.repeatMode != androidx.media3.common.Player.REPEAT_MODE_OFF) Accent else Color.White
                              )
                          }
                      }

                      Spacer(Modifier.height(48.dp))
                  }
              }
          }

          private fun formatMs(ms: Long): String {
              if (ms <= 0) return "0:00"
              val totalSec = ms / 1000
              val m = totalSec / 60
              val s = totalSec % 60
              return "$m:${if (s < 10) "0$s" else s}"
          }
          EOF

      # ═══════════════════════════════════════════════════════════
      # STEP 6 — Launcher icons
      # ═══════════════════════════════════════════════════════════
      - name: Generate launcher icons
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for pair in "48:mdpi" "72:hdpi" "96:xhdpi" "144:xxhdpi" "192:xxxhdpi"; do
            size="${pair%%:*}"; density="${pair##*:}"
            convert -size "${size}x${size}" xc:"#1DB954" \
              -gravity center -fill white -pointsize $((size/2)) -font DejaVu-Sans-Bold \
              -annotate +0+0 "M" \
              "native/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      # ═══════════════════════════════════════════════════════════
      # STEP 7 — Signing keystore
      # ═══════════════════════════════════════════════════════════
      - name: Generate signing keystore
        run: |
          cd native
          keytool -genkeypair -v -keystore release.keystore \
            -alias music8481 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass music8481 -keypass music8481 \
            -dname "CN=Music8481, O=Music, C=IN" 2>&1 | tail -5

      # ═══════════════════════════════════════════════════════════
      # STEP 8 — Build APK
      # ═══════════════════════════════════════════════════════════
      - name: Build Release APK
        run: |
          cd native
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Native-APK
          path: native/app/build/outputs/apk/release/*.apk
          retention-days: 30
