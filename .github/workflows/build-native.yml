          EOF

      - name: Generate Playback engine
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/PlaybackService.kt
          package com.music8481.app

          import android.net.Uri
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.datasource.ResolvingDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import kotlinx.coroutines.runBlocking
          import java.io.IOException

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()

                  val dataSourceFactory = ResolvingDataSource.Factory(
                      DefaultHttpDataSource.Factory()
                          .setUserAgent("Music8481-Android/2.0")
                          .setAllowCrossProtocolRedirects(true),
                      { dataSpec ->
                          val songId = dataSpec.uri.lastPathSegment ?: throw IOException("No song ID")
                          val url = UrlResolver.get(songId)
                              ?: runBlocking { PlayerManager.fetchAndCacheUrl(songId) }
                              ?: throw IOException("Failed to resolve stream for $songId")
                          dataSpec.withUri(Uri.parse(url))
                      }
                  )

                  val player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(dataSourceFactory))
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .build(),
                          true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .build()

                  mediaSession = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo) = mediaSession

              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/PlayerManager.kt
          package com.music8481.app

          import android.content.ComponentName
          import android.content.Context
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.MoreExecutors
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.util.concurrent.ConcurrentHashMap

          data class PlayerState(
              val isPlaying: Boolean = false,
              val isBuffering: Boolean = false,
              val currentSong: Song? = null,
              val positionMs: Long = 0L,
              val durationMs: Long = 0L,
              val bufferedMs: Long = 0L,
              val shuffle: Boolean = false,
              val repeatMode: Int = Player.REPEAT_MODE_OFF,
              val currentIndex: Int = 0,
              val queueSize: Int = 0
          )

          object UrlResolver {
              private val cache = ConcurrentHashMap<String, String>()
              fun get(id: String): String? = cache[id]
              fun put(id: String, url: String) { cache[id] = url }
              fun clear() = cache.clear()
          }

          object PlayerManager {
              private var controller: MediaController? = null
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              private val _state = MutableStateFlow(PlayerState())
              val state: StateFlow<PlayerState> = _state.asStateFlow()

              private var songsQueue: List<Song> = emptyList()

              suspend fun fetchAndCacheUrl(songId: String): String? {
                  UrlResolver.get(songId)?.let { return it }
                  return try {
                      val res = ApiClient.streamApi.getStream(songId)
                      val url = res.resolvedUrl
                      if (url != null) { UrlResolver.put(songId, url); url } else null
                  } catch (_: Exception) { null }
              }

              fun connect(context: Context) {
                  if (controller != null) return
                  try {
                      val token = SessionToken(context, ComponentName(context, PlaybackService::class.java))
                      val future = MediaController.Builder(context.applicationContext, token).buildAsync()
                      future.addListener({
                          controller = try { future.get() } catch (_: Exception) { null }
                          controller?.addListener(object : Player.Listener {
                              override fun onMediaItemTransition(mediaItem: androidx.media3.common.MediaItem?, reason: Int) {
                                  prefetchAhead()
                                  updateState()
                              }
                              override fun onIsPlayingChanged(isPlaying: Boolean) = updateState()
                              override fun onPlaybackStateChanged(playbackState: Int) = updateState()
                              override fun onMediaMetadataChanged(mediaMetadata: androidx.media3.common.MediaMetadata) = updateState()
                              override fun onShuffleModeEnabledChanged(shuffleModeEnabled: Boolean) = updateState()
                              override fun onRepeatModeChanged(repeatMode: Int) = updateState()
                          })
                          scope.launch {
                              while (true) { if (controller?.isPlaying == true) updateState(); delay(500) }
                          }
                          updateState()
                      }, MoreExecutors.directExecutor())
                  } catch (_: Exception) { }
              }

              private fun prefetchAhead() {
                  val c = controller ?: return
                  val idx = c.currentMediaItemIndex
                  if (idx < 0) return
                  scope.launch {
                      (1..3).forEach { offset ->
                          val i = idx + offset
                          songsQueue.getOrNull(i)?.let { song ->
                              launch { fetchAndCacheUrl(song.songId) }
                          }
                      }
                  }
              }

              private fun updateState() {
                  val c = controller ?: return
                  val song = c.currentMediaItem?.mediaId?.let { id -> songsQueue.firstOrNull { it.songId == id } }
                  _state.value = PlayerState(
                      isPlaying = c.isPlaying,
                      isBuffering = c.playbackState == Player.STATE_BUFFERING,
                      currentSong = song,
                      positionMs = c.currentPosition.coerceAtLeast(0),
                      durationMs = c.duration.coerceAtLeast(0),
                      bufferedMs = c.bufferedPosition.coerceAtLeast(0),
                      shuffle = c.shuffleModeEnabled,
                      repeatMode = c.repeatMode,
                      currentIndex = c.currentMediaItemIndex,
                      queueSize = c.mediaItemCount
                  )
              }

              fun play(songs: List<Song>, startIndex: Int) {
                  if (songs.isEmpty()) return
                  songsQueue = songs
                  val safeIndex = startIndex.coerceIn(0, songs.size - 1)
                  scope.launch {
                      try {
                          val current = songs[safeIndex]
                          fetchAndCacheUrl(current.songId)
                          withContext(Dispatchers.Main) {
                              val items = songs.map { it.toMediaItem() }
                              controller?.setMediaItems(items, safeIndex, 0L)
                              controller?.prepare()
                              controller?.play()
                          }
                          val others = songs.filterIndexed { i, _ -> i != safeIndex }
                          others.map { song -> async { fetchAndCacheUrl(song.songId) } }.awaitAll()
                      } catch (_: Exception) { }
                  }
              }

              fun togglePlayPause() {
                  try { controller?.let { if (it.isPlaying) it.pause() else it.play() } } catch (_: Exception) {}
              }
              fun next() { try { controller?.seekToNextMediaItem() } catch (_: Exception) {} }
              fun previous() { try { controller?.seekToPreviousMediaItem() } catch (_: Exception) {} }
              fun seekTo(ms: Long) { try { controller?.seekTo(ms) } catch (_: Exception) {} }
              fun setShuffle(on: Boolean) { try { controller?.shuffleModeEnabled = on } catch (_: Exception) {} }
              fun cycleRepeat() {
                  try {
                      controller?.let { c ->
                          c.repeatMode = when (c.repeatMode) {
                              Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                              Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                              else -> Player.REPEAT_MODE_OFF
                          }
                      }
                  } catch (_: Exception) {}
              }
          }
          EOF

      - name: Generate HomeViewModel
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/HomeViewModel.kt
          package com.music8481.app

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch

          data class HomeSection(val key: String, val title: String, val songs: List<Song>)

          class HomeViewModel : ViewModel() {
              private val _sections = MutableStateFlow<List<HomeSection>>(emptyList())
              val sections: StateFlow<List<HomeSection>> = _sections.asStateFlow()

              private val _isLoading = MutableStateFlow(false)
              val isLoading: StateFlow<Boolean> = _isLoading.asStateFlow()

              private val _hasError = MutableStateFlow(false)
              val hasError: StateFlow<Boolean> = _hasError.asStateFlow()

              private data class SectionConfig(
                  val key: String,
                  val title: String,
                  val fetch: suspend (String) -> HomeResponse
              )

              private val configs = listOf(
                  SectionConfig("showcase", "Top Picks") { lang -> ApiClient.vercelApi.getShowcase(lang) },
                  SectionConfig("trending", "Trending Songs") { lang -> ApiClient.vercelApi.getTrending(lang = lang) },
                  SectionConfig("top_charts", "Top Charts") { lang -> ApiClient.cfApi.getSection("top-charts", lang = lang) },
                  SectionConfig("top_playlists", "Top Playlists") { lang -> ApiClient.cfApi.getSection("top-playlists-1", lang = lang) },
                  SectionConfig("90s", "Back to 90s") { lang -> ApiClient.cfApi.getSection("90s-2000s", lang = lang) },
                  SectionConfig("bhakti", "Bhakti") { lang -> ApiClient.cfApi.getSection("bhakti", lang = lang) },
                  SectionConfig("romance", "Romance") { lang -> ApiClient.cfApi.getSection("romance", lang = lang) },
                  SectionConfig("star_gallery", "Star Gallery") { lang -> ApiClient.cfApi.getSection("star-gallery", lang = lang) },
                  SectionConfig("city_charts", "City Top Charts") { lang -> ApiClient.cfApi.getSection("city-top-charts", lang = lang) },
                  SectionConfig("top_search", "Top Searched Artists") { lang -> ApiClient.cfApi.getSection("top-searched-artists", lang = lang) },
                  SectionConfig("just_arrived", "Just Arrived") { lang -> ApiClient.cfApi.getSection("just-arrived", lang = lang) },
                  SectionConfig("mehfil", "Mehfil-e-ghazal") { lang -> ApiClient.cfApi.getSection("mehfil-e-ghazal", lang = lang) }
              )

              private val language = "hindi"
              private var nextIndex = 0

              init { loadNext(2) }

              fun loadMore() { if (nextIndex < configs.size) loadNext(1) }

              fun retry() {
                  if (_sections.value.isEmpty()) {
                      nextIndex = 0
                      _hasError.value = false
                      loadNext(2)
                  }
              }

              private fun loadNext(count: Int) {
                  if (_isLoading.value) return
                  viewModelScope.launch {
                      _isLoading.value = true
                      try {
                          repeat(count) {
                              val idx = nextIndex
                              if (idx >= configs.size) return@repeat
                              val cfg = configs[idx]
                              val songs = runCatching { cfg.fetch(language).getSongs() }.getOrDefault(emptyList())
                              if (songs.isNotEmpty()) {
                                  _sections.update { current ->
                                      if (current.any { it.key == cfg.key }) current
                                      else current + HomeSection(cfg.key, cfg.title, songs)
                                  }
                              }
                              nextIndex++
                          }
                          if (_sections.value.isEmpty()) _hasError.value = true
                      } catch (_: Exception) {
                          _hasError.value = _sections.value.isEmpty()
                      } finally {
                          _isLoading.value = false
                      }
                  }
              }
          }
