                  @Query("userlanguage") lang: String
              ): HomeResponse
          }

          interface StreamApi {
              @GET("api/stream")
              suspend fun getStream(@Query("id") trackId: String): StreamResponse
          }

          object ApiClient {
              private const val BYPASS_SECRET = "pR3nSUsTI9HQxb2RbdasB5mjKqUoSP8m"

              private val okHttp: OkHttpClient = OkHttpClient.Builder()
                  .addInterceptor { chain ->
                      val req = chain.request().newBuilder()
                          .addHeader("x-vercel-protection-bypass", BYPASS_SECRET)
                          .addHeader("User-Agent", "Music8481-Android/2.0")
                          .build()
                      chain.proceed(req)
                  }
                  .connectTimeout(20, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()

              private val json = Json { ignoreUnknownKeys = true; isLenient = true }
              private val contentType = "application/json".toMediaType()

              val vercelApi: GaanaApi = Retrofit.Builder()
