name: Build Music8481 Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle + Resources
        run: |
          set -e
          mkdir -p native/app/src/main/java/com/music8481/app
          mkdir -p native/app/src/main/res/values
          mkdir -p native/app/src/main/res/mipmap-mdpi
          mkdir -p native/app/src/main/res/mipmap-hdpi
          mkdir -p native/app/src/main/res/mipmap-xhdpi
          mkdir -p native/app/src/main/res/mipmap-xxhdpi
          mkdir -p native/app/src/main/res/mipmap-xxxhdpi

          cat <<'EOF' > native/settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Music8481"
          include(":app")
          EOF

          cat <<'EOF' > native/build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false
          }
          EOF

          cat <<'EOF' > native/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat <<'EOF' > native/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "com.music8481.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.music8481.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("release.keystore")
                      storePassword = "music8481"
                      keyAlias = "music8481"
                      keyPassword = "music8481"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

              val media3 = "1.5.0"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-session:$media3")
              implementation("androidx.media3:media3-datasource-okhttp:$media3")

              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
          }
          EOF

          cat <<'EOF' > native/app/proguard-rules.pro
          -keep class com.music8481.app.** { *; }
          -dontwarn org.jetbrains.annotations.**
          EOF

          cat <<'EOF' > native/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Music8481">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > native/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Music8481</string></resources>
          EOF

          cat <<'EOF' > native/app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Music8481" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

      - name: Generate Data + API layer
        run: |
          set -e

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/Models.kt
          package com.music8481.app

          import android.net.Uri
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import kotlinx.serialization.SerialName
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json
          import kotlinx.serialization.json.JsonArray
          import kotlinx.serialization.json.JsonElement
          import kotlinx.serialization.json.JsonObject
          import kotlinx.serialization.json.decodeFromJsonElement

          @Serializable
          data class Song(
              @SerialName("track_id") val trackId: String? = null,
              @SerialName("entity_id") val entityId: String? = null,
              val id: String? = null,
              @SerialName("track_title") val trackTitle: String? = null,
              val name: String? = null,
              val title: String? = null,
              @SerialName("artwork_large") val artworkLarge: String? = null,
              @SerialName("artwork_web") val artworkWeb: String? = null,
              val artwork: String? = null,
              val atw: String? = null,
              @SerialName("entity_type") val entityType: String? = null,
              val seokey: String? = null,
              @SerialName("entity_info") val entityInfo: List<EntityInfo>? = null,
              val artists: List<Artist>? = null,
              val singers: List<Artist>? = null
          ) {
              val songId: String get() = trackId ?: id ?: entityId ?: ""
              val displayTitle: String get() = trackTitle ?: name ?: title ?: "Unknown"

              val imageUrl: String
                  get() = (artworkLarge ?: artworkWeb ?: artwork ?: atw ?: "")
                      .replace(Regex("size_[ms]"), "size_l")
                      .replace("150x150", "500x500")
                      .replace("50x50", "500x500")

              val displayArtists: String
                  get() {
                      entityInfo?.firstOrNull { it.key == "artist" || it.key == "singers" }?.value?.let { v ->
                          try {
                              val arr = v as? JsonArray
                              val names = arr?.mapNotNull { (it as? JsonObject)?.get("name")?.toString()?.trim('"') }
                              if (!names.isNullOrEmpty()) return names.joinToString(", ")
                          } catch (_: Exception) {}
                      }
                      val list = artists ?: singers ?: emptyList()
                      return list.mapNotNull { it.name }.joinToString(", ").ifEmpty { "Unknown Artist" }
                  }

              fun toMediaItem(): MediaItem = MediaItem.Builder()
                  .setMediaId(songId)
                  .setUri(Uri.parse("music8481://resolve/$songId"))
                  .setMediaMetadata(
                      MediaMetadata.Builder()
                          .setTitle(displayTitle)
                          .setArtist(displayArtists)
                          .setArtworkUri(imageUrl.takeIf { it.isNotEmpty() }?.let { Uri.parse(it) })
                          .build()
                  )
                  .build()
          }

          @Serializable
          data class EntityInfo(val key: String? = null, val value: JsonElement? = null)

          @Serializable
          data class Artist(val name: String? = null, val id: String? = null, val seokey: String? = null)

          @Serializable
          data class HomeResponse(val data: JsonElement? = null) {
              fun getSongs(): List<Song> {
                  val d = data ?: return emptyList()
                  val json = Json { ignoreUnknownKeys = true; isLenient = true }
                  return try {
                      when {
                          d is JsonObject && d.containsKey("entities") ->
                              json.decodeFromJsonElement<List<Song>>(d["entities"]!!)
                          d is JsonObject && d.containsKey("tracks") ->
                              json.decodeFromJsonElement<List<Song>>(d["tracks"]!!)
                          d is JsonArray ->
                              json.decodeFromJsonElement<List<Song>>(d)
                          else -> emptyList()
                      }
                  } catch (_: Exception) { emptyList() }
              }
          }

          @Serializable
          data class StreamResponse(
              @SerialName("hls_url") val hlsUrl: String? = null,
              val url: String? = null,
              val data: StreamData? = null
          ) {
              val resolvedUrl: String?
                  get() = hlsUrl ?: data?.hlsUrl ?: data?.url ?: url
          }

          @Serializable
          data class StreamData(
              @SerialName("hlsUrl") val hlsUrl: String? = null,
              val url: String? = null
          )
          EOF

          cat <<'EOF' > native/app/src/main/java/com/music8481/app/Api.kt
          package com.music8481.app

          import kotlinx.serialization.json.Json
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.kotlinx.serialization.asConverterFactory
          import retrofit2.http.GET
          import retrofit2.http.Query
          import java.util.concurrent.TimeUnit

          interface GaanaApi {
              @GET("home/showcase")
              suspend fun getShowcase(@Query("userlanguage") lang: String): HomeResponse

              @GET("home/smartfeed/765")
