              onSongClick: (Song, List<Song>) -> Unit
          ) {
              val sections by viewModel.sections.collectAsStateWithLifecycle()
              val isLoading by viewModel.isLoading.collectAsStateWithLifecycle()
              val hasError by viewModel.hasError.collectAsStateWithLifecycle()
              val listState = rememberLazyListState()

              LaunchedEffect(listState) {
                  snapshotFlow {
                      val info = listState.layoutInfo
                      val last = info.visibleItemsInfo.lastOrNull()?.index ?: 0
                      last >= info.totalItemsCount - 2 && info.totalItemsCount > 0
                  }.distinctUntilChanged().collect { nearEnd ->
                      if (nearEnd) viewModel.loadMore()
                  }
              }

              LazyColumn(
                  state = listState,
                  modifier = modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 140.dp)
              ) {
                  item(key = "header") { Header() }
                  item(key = "search") { SearchBar() }

                  sections.forEach { section ->
                      item(key = "section_${section.key}") {
                          SectionRow(section = section, onSongClick = onSongClick)
                      }
                  }

                  if (isLoading && sections.isEmpty()) {
                      item(key = "loading_first") { LoadingSkeletonRow() }
                  }
                  if (isLoading && sections.isNotEmpty()) {
                      item(key = "loading_more") { LoadingRow() }
                  }
                  if (hasError && sections.isEmpty() && !isLoading) {
                      item(key = "error") { ErrorState(onRetry = { viewModel.retry() }) }
                  }
              }
          }

