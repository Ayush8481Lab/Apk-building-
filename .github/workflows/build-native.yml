                  .build().create(GaanaApi::class.java)

              val cfApi: GaanaApi = Retrofit.Builder()
                  .baseUrl("https://gaanaayush.wonder945177.workers.dev/api/superserch/")
                  .client(okHttp)
                  .addConverterFactory(json.asConverterFactory(contentType))
                  .build().create(GaanaApi::class.java)

              val streamApi: StreamApi = Retrofit.Builder()
