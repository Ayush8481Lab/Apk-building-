                              color = Color.White,
                              fontSize = 14.sp,
                              fontWeight = FontWeight.Bold,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Spacer(Modifier.height(2.dp))
                          Text(
                              song.displayArtists,
                              color = Color.White.copy(alpha = 0.60f),
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Medium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      Spacer(Modifier.width(10.dp))
                      Box(
                          modifier = Modifier
                              .size(44.dp)
                              .clip(CircleShape)
                              .background(Color.White)
                              .clickable { PlayerManager.togglePlayPause() },
                          contentAlignment = Alignment.Center
                      ) {
                          if (playerState.isBuffering) {
                              CircularProgressIndicator(
                                  color = Color.Black,
                                  modifier = Modifier.size(20.dp),
                                  strokeWidth = 2.5.dp
                              )
                          } else {
                              Icon(
                                  if (playerState.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                  contentDescription = null,
                                  tint = Color.Black,
                                  modifier = Modifier.size(24.dp)
                              )
                          }
                      }
                  }
                  // Progress bar
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(3.dp)
                          .background(Color.White.copy(alpha = 0.08f))
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxHeight()
                              .fillMaxWidth(progress.coerceIn(0f, 1f))
                              .background(
                                  Brush.horizontalGradient(
                                      listOf(AccentPurple, AccentPink, AccentOrange)
                                  )
                              )
                      )
                  }
              }
          }

          // ═══════════════ FULL PLAYER ═══════════════
          @Composable
          fun PlayerScreen(playerState: PlayerState, onClose: () -> Unit) {
              val song = playerState.currentSong ?: return
              val progress = if (playerState.durationMs > 0)
                  playerState.positionMs.toFloat() / playerState.durationMs else 0f

              Box(Modifier.fillMaxSize().background(BgDeep)) {
                  // Blurred album art background
                  if (song.imageUrl.isNotEmpty()) {
                      AsyncImage(
                          model = song.imageUrl,
                          contentDescription = null,
                          modifier = Modifier.fillMaxSize(),
                          contentScale = ContentScale.Crop,
                          alpha = 0.22f
                      )
                  }
                  // Gradient overlay
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  listOf(
                                      BgDeep.copy(alpha = 0.55f),
                                      BgDeep.copy(alpha = 0.85f),
                                      BgDeep
                                  )
                              )
                          )
                  )
                  // Ambient blobs
                  PremiumBackground()

                  Column(
                      Modifier
                          .fillMaxSize()
                          .windowInsetsPadding(WindowInsets.statusBars)
                          .navigationBarsPadding()
                  ) {
                      // Top bar
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 10.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(42.dp)
                                  .clip(CircleShape)
                                  .background(Color.White.copy(alpha = 0.10f))
                                  .border(1.dp, Color.White.copy(alpha = 0.15f), CircleShape)
                                  .clickable { onClose() },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Default.KeyboardArrowDown, null, tint = Color.White, modifier = Modifier.size(26.dp))
                          }
                          Spacer(Modifier.weight(1f))
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  "NOW PLAYING",
                                  color = Color.White.copy(alpha = 0.55f),
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  letterSpacing = 1.5.sp
                              )
                              Text(
                                  "From your library",
                                  color = Color.White.copy(alpha = 0.85f),
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Medium
                              )
                          }
                          Spacer(Modifier.weight(1f))
                          Box(
                              modifier = Modifier
                                  .size(42.dp)
                                  .clip(CircleShape)
                                  .background(Color.White.copy(alpha = 0.10f))
                                  .border(1.dp, Color.White.copy(alpha = 0.15f), CircleShape),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Default.MoreVert, null, tint = Color.White, modifier = Modifier.size(22.dp))
                          }
                      }

                      Spacer(Modifier.height(20.dp))

                      // Album art with glass frame
                      Box(
                          modifier = Modifier
                              .padding(horizontal = 28.dp)
                              .fillMaxWidth()
                              .aspectRatio(1f)
                              .shadow(40.dp, RoundedCornerShape(28.dp))
                              .clip(RoundedCornerShape(28.dp))
                              .background(Color.White.copy(alpha = 0.06f))
                              .border(
                                  2.dp,
                                  Brush.linearGradient(
                                      listOf(
                                          Color.White.copy(alpha = 0.35f),
                                          Color.White.copy(alpha = 0.08f)
                                      )
                                  ),
                                  RoundedCornerShape(28.dp)
                              )
                      ) {
                          if (song.imageUrl.isNotEmpty()) {
                              AsyncImage(
                                  model = song.imageUrl,
                                  contentDescription = null,
                                  modifier = Modifier.fillMaxSize(),
                                  contentScale = ContentScale.Crop
                              )
                          } else {
                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .background(
                                          Brush.linearGradient(
                                              listOf(AccentPurple, AccentPink, AccentOrange)
                                          )
                                      ),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(
                                      Icons.Default.MusicNote, null,
                                      tint = Color.White.copy(alpha = 0.8f),
                                      modifier = Modifier.size(80.dp)
                                  )
                              }
                          }
                      }

                      Spacer(Modifier.height(30.dp))

                      // Song info
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 28.dp)
                      ) {
                          Text(
                              song.displayTitle,
                              color = Color.White,
                              fontSize = 26.sp,
                              fontWeight = FontWeight.Black,
                              letterSpacing = (-0.5).sp,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Spacer(Modifier.height(4.dp))
                          Text(
                              song.displayArtists,
                              color = Color.White.copy(alpha = 0.65f),
                              fontSize = 15.sp,
                              fontWeight = FontWeight.Medium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }

                      Spacer(Modifier.weight(1f))

                      // Progress bar
                      Column(modifier = Modifier.padding(horizontal = 28.dp)) {
                          Slider(
                              value = progress.coerceIn(0f, 1f),
                              onValueChange = { v ->
                                  try { PlayerManager.seekTo((v * playerState.durationMs).toLong()) } catch (_: Exception) {}
                              },
                              colors = SliderDefaults.colors(
                                  thumbColor = Color.White,
                                  activeTrackColor = AccentPink,
                                  inactiveTrackColor = Color.White.copy(alpha = 0.20f)
                              )
                          )
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(top = 4.dp),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text(
                                  formatMs(playerState.positionMs),
                                  color = Color.White.copy(alpha = 0.60f),
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Medium
                              )
                              Text(
                                  formatMs(playerState.durationMs),
                                  color = Color.White.copy(alpha = 0.60f),
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Medium
                              )
                          }
                      }

                      Spacer(Modifier.height(16.dp))

                      // Controls
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 32.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(46.dp)
                                  .clip(CircleShape)
                                  .clickable { PlayerManager.setShuffle(!playerState.shuffle) },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  Icons.Default.Shuffle, null,
                                  tint = if (playerState.shuffle) AccentPink else Color.White.copy(alpha = 0.75f),
                                  modifier = Modifier.size(24.dp)
                              )
                          }
                          Box(
                              modifier = Modifier
                                  .size(56.dp)
                                  .clip(CircleShape)
                                  .clickable { PlayerManager.previous() },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Default.SkipPrevious, null, tint = Color.White, modifier = Modifier.size(38.dp))
                          }

                          // Main play button — gradient with glow
                          Box(
                              modifier = Modifier
                                  .size(84.dp)
                                  .shadow(28.dp, CircleShape)
                                  .clip(CircleShape)
                                  .background(
                                      Brush.linearGradient(
                                          listOf(AccentPurple, AccentPink, AccentOrange)
                                      )
                                  )
                                  .clickable { PlayerManager.togglePlayPause() },
                              contentAlignment = Alignment.Center
                          ) {
                              if (playerState.isBuffering) {
                                  CircularProgressIndicator(
                                      color = Color.White,
                                      modifier = Modifier.size(32.dp),
                                      strokeWidth = 3.dp
                                  )
                              } else {
                                  Icon(
                                      if (playerState.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      contentDescription = null,
                                      tint = Color.White,
                                      modifier = Modifier.size(42.dp)
                                  )
                              }
                          }

                          Box(
                              modifier = Modifier
                                  .size(56.dp)
                                  .clip(CircleShape)
                                  .clickable { PlayerManager.next() },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Default.SkipNext, null, tint = Color.White, modifier = Modifier.size(38.dp))
                          }
                          Box(
                              modifier = Modifier
                                  .size(46.dp)
                                  .clip(CircleShape)
                                  .clickable { PlayerManager.cycleRepeat() },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  Icons.Default.Repeat, null,
                                  tint = if (playerState.repeatMode != androidx.media3.common.Player.REPEAT_MODE_OFF) AccentPink else Color.White.copy(alpha = 0.75f),
                                  modifier = Modifier.size(24.dp)
                              )
                          }
                      }

                      Spacer(Modifier.height(48.dp))
                  }
              }
          }

          private fun formatMs(ms: Long): String {
              if (ms <= 0) return "0:00"
              val totalSec = ms / 1000
              val m = totalSec / 60
              val s = totalSec % 60
              return "$m:${if (s < 10) "0$s" else s}"
          }
          EOF

      - name: Generate launcher icons
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for pair in "48:mdpi" "72:hdpi" "96:xhdpi" "144:xxhdpi" "192:xxxhdpi"; do
            size="${pair%%:*}"; density="${pair##*:}"
            convert -size "${size}x${size}" \
              gradient:'#8B5CF6-#EC4899' \
              -gravity center -fill white -pointsize $((size/2)) -font DejaVu-Sans-Bold \
              -annotate +0+0 "M" \
              "native/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Generate signing keystore
        run: |
          cd native
          keytool -genkeypair -v -keystore release.keystore \
            -alias music8481 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass music8481 -keypass music8481 \
            -dname "CN=Music8481, O=Music, C=IN" 2>&1 | tail -5

      - name: Build Release APK
        run: |
          cd native
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Native-APK-v2-LiquidGlass
          path: native/app/build/outputs/apk/release/*.apk
          retention-days: 30
