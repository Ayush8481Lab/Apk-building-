name: Build YouTube Muxer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project
        run: flutter create --project-name youtube_muxer_app .

      - name: Overwrite pubspec.yaml
        run: |
          cat > pubspec.yaml << 'EOF'
          name: youtube_muxer_app
          description: YouTube downloader with audio/video muxing.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_erfan_youtube_muxer_2025: ^1.0.0
            permission_handler: ^11.3.0
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Overwrite main.dart
        run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_erfan_youtube_muxer_2025/youtube_video_downloader.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'YT Muxer',
                theme: ThemeData(primarySwatch: Colors.red),
                home: const DownloaderPage(),
              );
            }
          }

          class DownloaderPage extends StatefulWidget {
            const DownloaderPage({super.key});
            @override
            State<DownloaderPage> createState() => _DownloaderPageState();
          }

          class _DownloaderPageState extends State<DownloaderPage> {
            final _urlController = TextEditingController();
            final _downloader = YoutubeDownloader();
            List<VideoQuality> _qualities = [];
            VideoQuality? _selectedQuality;
            bool _isLoading = false;
            String _status = 'Paste a YouTube link to start';
            double _progress = 0.0;

            @override
            void initState() {
              super.initState();
              _requestPermissions();
            }

            Future<void> _requestPermissions() async {
              await Permission.storage.request();
              await Permission.videos.request();
              await Permission.audio.request();
            }

            Future<void> _fetchQualities() async {
              final url = _urlController.text.trim();
              if (url.isEmpty) {
                _showSnack('Please enter a YouTube URL or video ID.');
                return;
              }
              setState(() {
                _isLoading = true;
                _status = 'Fetching qualities...';
                _qualities = [];
                _selectedQuality = null;
              });
              try {
                final qualities = await _downloader.getQualities(url);
                setState(() {
                  _qualities = qualities.where((q) => q.fps != 0).toList();
                  _isLoading = false;
                  _status = _qualities.isEmpty
                      ? 'No video qualities found.'
                      : 'Select a quality to download.';
                });
              } catch (e) {
                setState(() {
                  _isLoading = false;
                  _status = 'Error: ${e.toString()}';
                });
              }
            }

            Future<void> _downloadSelected() async {
              if (_selectedQuality == null) {
                _showSnack('Please select a quality first.');
                return;
              }
              final url = _urlController.text.trim();
              setState(() {
                _isLoading = true;
                _status = 'Downloading & merging...';
                _progress = 0.0;
              });
              try {
                await for (final progress in _downloader.downloadVideo(
                  _selectedQuality!,
                  url,
                )) {
                  setState(() {
                    _progress = progress.progress;
                    _status = '${progress.status} (${(progress.progress * 100).toStringAsFixed(1)}%)';
                  });
                  if (progress.status == DownloadStatus.completed) break;
                }
                setState(() {
                  _isLoading = false;
                  _status = 'Download complete! File saved.';
                });
              } catch (e) {
                setState(() {
                  _isLoading = false;
                  _status = 'Download failed: ${e.toString()}';
                });
              }
            }

            void _showSnack(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
            }

            @override
            void dispose() {
              _urlController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('YouTube Downloader & Muxer')),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: SingleChildScrollView(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        TextField(
                          controller: _urlController,
                          decoration: const InputDecoration(
                            labelText: 'YouTube URL or Video ID',
                            border: OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 12),
                        ElevatedButton(
                          onPressed: _isLoading ? null : _fetchQualities,
                          child: const Text('Fetch Qualities'),
                        ),
                        const SizedBox(height: 20),
                        if (_qualities.isNotEmpty)
                          DropdownButtonFormField<VideoQuality>(
                            value: _selectedQuality,
                            decoration: const InputDecoration(
                              labelText: 'Select Quality',
                              border: OutlineInputBorder(),
                            ),
                            items: _qualities.map((q) {
                              return DropdownMenuItem(
                                value: q,
                                child: Text('${q.qualityLabel ?? 'Unknown'} (${q.formatCode})'),
                              );
                            }).toList(),
                            onChanged: (val) => setState(() => _selectedQuality = val),
                          ),
                        const SizedBox(height: 20),
                        if (_selectedQuality != null)
                          ElevatedButton.icon(
                            onPressed: _isLoading ? null : _downloadSelected,
                            icon: const Icon(Icons.download),
                            label: const Text('Download & Merge'),
                          ),
                        const SizedBox(height: 30),
                        if (_isLoading)
                          LinearProgressIndicator(value: _progress == 0 ? null : _progress),
                        const SizedBox(height: 10),
                        Text(_status, textAlign: TextAlign.center),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Overwrite AndroidManifest.xml (permissions)
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.youtube_muxer_app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <application
                  android:label="YT Muxer"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
