          /* ============================================================== SEARCH */

          @Composable
          fun SearchTab(vm: MainVM, onOpen: (Channel, List<Channel>) -> Unit) {
              var q by rememberSaveable { mutableStateOf("") }
              val res = vm.search(q)
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
