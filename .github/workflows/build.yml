              fun recall() {
                  previous?.let { play(it, zapList) }
              }

              fun quickPlay(url: String, drmType: String = "", drmKey: String = "") {
                  var u = url.trim()
                  if (u.isEmpty()) return
                  var h: Map<String, String> = emptyMap()
                  val bar = u.indexOf('|')
                  if (bar > 0) {
                      h = parseHeaderString(u.substring(bar + 1))
                      u = u.substring(0, bar)
                  }
                  val nm = u.substringBefore('?').substringAfterLast('/').take(40).ifBlank { "Stream" }
                  play(Channel(0, nm, u, "", "Direct", "", "", "", drmType.trim(), drmKey.trim(), "", h), emptyList())
                  fullscreen = true
              }

              /* -------------------------------------------------------------- settings */

              fun setUa(v: String) {
                  userAgent = v
                  store.userAgent = v
              }

              fun updateExtraHeaders(v: String) {
                  extraHeaders = v
                  store.extraHeaders = v
              }

              fun updateAutoRefresh(v: Boolean) {
                  autoRefresh = v
                  store.autoRefresh = v
              }

              fun setResume(v: Boolean) {
                  resumeLast = v
                  store.resumeLast = v
              }

              fun updateAspect(v: Int) {
                  aspect = v
                  store.aspect = v
              }
          }
