          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.delay

          /* ================================================================== ROOT */

          @Composable
          fun AppRoot(vm: MainVM, pc: PlayerController, act: MainActivity) {
              val snack = remember { SnackbarHostState() }

              // start / restart playback whenever a channel (or its refreshed keys / url) is selected
              LaunchedEffect(vm.playNonce) {
                  vm.current?.let { pc.play(it, vm.userAgent, vm.extraHeaders) }
              }

              // leaving the READY phase (logout) must silence the player
              LaunchedEffect(vm.phase) {
                  if (vm.phase != Phase.READY) pc.stop()
              }

              // sleep timer
              LaunchedEffect(vm.sleepAt) {
                  if (vm.sleepAt > 0L) {
                      val wait = vm.sleepAt - System.currentTimeMillis()
                      if (wait > 0) delay(wait)
                      pc.stop()
                      vm.fullscreen = false
                      vm.sleepAt = 0L
                      vm.toast = "Sleep timer: playback stopped"
                  }
              }

              LaunchedEffect(vm.toast) {
                  vm.toast?.let {
                      snack.showSnackbar(it)
                      vm.toast = null
                  }
              }

              // immersive landscape player
              DisposableEffect(vm.fullscreen) {
                  val w = act.window
                  val c = WindowCompat.getInsetsController(w, w.decorView)
                  if (vm.fullscreen) {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      c.hide(WindowInsetsCompat.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  onDispose {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      c.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  when (vm.phase) {
                      Phase.TOKEN -> TokenScreen(vm)
                      Phase.LOADING -> Loading("Loading channels...")
                      Phase.READY -> if (vm.fullscreen) PlayerScreen(vm, pc, act) else HomeScreen(vm, pc)
                  }
                  SnackbarHost(snack, Modifier.align(Alignment.BottomCenter).padding(16.dp))
              }
          }

          /* ================================================================ PLAYER */

          private fun isZapUp(k: Int): Boolean =
              k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_CHANNEL_UP ||
                  k == KeyEvent.KEYCODE_PAGE_UP || k == KeyEvent.KEYCODE_MEDIA_NEXT

          private fun isZapDown(k: Int): Boolean =
              k == KeyEvent.KEYCODE_DPAD_DOWN || k == KeyEvent.KEYCODE_CHANNEL_DOWN ||
                  k == KeyEvent.KEYCODE_PAGE_DOWN || k == KeyEvent.KEYCODE_MEDIA_PREVIOUS

          /**
           * Fullscreen player, built for a TV remote (touch works as well):
           *   UP / CH+       next channel            DOWN / CH-   previous channel
           *   LEFT / OK      channel list            RIGHT / MENU options panel (audio, subtitles, quality, aspect, sleep ...)
           *   INFO           show / hide info card   LAST         last channel
           *   PLAY/PAUSE     pause / resume          BACK         closes a panel, otherwise leaves fullscreen
           * Touch: tap shows the info card + top buttons, swipe up / down zaps, double tap = last channel.
           * While no panel or dialog is open the root keeps focus, so every remote key reaches the handler below.
           */
          @Composable
          fun PlayerScreen(vm: MainVM, pc: PlayerController, act: MainActivity) {
              var showInfo by remember { mutableStateOf(true) }
              var showBar by remember { mutableStateOf(false) }
              var showList by remember { mutableStateOf(false) }
              var showOpts by remember { mutableStateOf(false) }
              var dialog by remember { mutableStateOf("") }
              val focus = remember { FocusRequester() }
              val ch = vm.current
              val inPip = act.inPip
              val panelOpen = showList || showOpts || dialog.isNotEmpty()

              // info card / touch buttons hide themselves
              LaunchedEffect(showInfo, showBar, panelOpen, vm.playNonce) {
                  if ((showInfo || showBar) && !panelOpen) {
                      delay(5000)
                      showInfo = false
                      showBar = false
                  }
              }
              // every channel change shows the info card
              LaunchedEffect(vm.playNonce) { showInfo = true }
              // give focus back to the root whenever the last panel / dialog closes
              LaunchedEffect(panelOpen) {
                  if (!panelOpen) {
                      delay(80)
                      try {
                          focus.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }

              // back closes a panel first, then leaves fullscreen (the channel keeps playing in the home preview)
              BackHandler {
                  if (dialog.isNotEmpty()) dialog = ""
                  else if (showOpts) showOpts = false
                  else if (showList) showList = false
                  else vm.fullscreen = false
              }

              val resize = when (vm.aspect) {
                  1 -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                  2 -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                  else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
              }
              val aspectName = listOf("Fit", "Zoom", "Stretch")[vm.aspect.coerceIn(0, 2)]

              Box(
                  Modifier.fillMaxSize().background(Color.Black)
                      .onPreviewKeyEvent { e ->
                          val k = e.nativeKeyEvent.keyCode
                          if (e.type != KeyEventType.KeyDown || e.nativeKeyEvent.repeatCount > 0 ||
                              panelOpen || k == KeyEvent.KEYCODE_BACK
                          ) {
                              false
                          } else if (isZapUp(k)) {
                              vm.zap(1)
                              true
                          } else if (isZapDown(k)) {
                              vm.zap(-1)
                              true
                          } else {
                              when (k) {
                                  KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER,
                                  KeyEvent.KEYCODE_NUMPAD_ENTER, KeyEvent.KEYCODE_GUIDE -> {
                                      showList = true
                                      true
                                  }
                                  KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_MENU, KeyEvent.KEYCODE_SETTINGS -> {
                                      showOpts = true
                                      true
                                  }
                                  KeyEvent.KEYCODE_INFO -> {
                                      showInfo = !showInfo
                                      true
                                  }
                                  KeyEvent.KEYCODE_LAST_CHANNEL -> {
                                      vm.recall()
                                      true
                                  }
                                  KeyEvent.KEYCODE_CAPTIONS -> {
                                      dialog = "sub"
                                      true
                                  }
                                  KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                                      pc.player.playWhenReady = !pc.player.playWhenReady
                                      true
                                  }
                                  else -> false
                              }
                          }
                      }
                      .focusRequester(focus)
                      .focusable()
              ) {
                  AndroidView(
                      factory = { c ->
                          PlayerView(c).apply {
                              useController = false
                              player = pc.player
                              setShutterBackgroundColor(android.graphics.Color.BLACK)
                              isFocusable = false
                              isFocusableInTouchMode = false
                              keepScreenOn = true
                          }
                      },
                      update = { it.resizeMode = resize },
                      onRelease = { it.player = null },
                      modifier = Modifier.fillMaxSize()
                  )

                  // gesture layer: tap = toggle UI, double tap = last channel, swipe up/down = zap
                  Box(
                      Modifier.fillMaxSize()
                          .pointerInput(Unit) {
                              detectTapGestures(
                                  onTap = {
                                      if (showList) showList = false
                                      else if (showOpts) showOpts = false
                                      else {
                                          val s = !(showInfo || showBar)
                                          showInfo = s
                                          showBar = s
                                      }
                                  },
                                  onDoubleTap = { vm.recall() }
                              )
                          }
                          .pointerInput(Unit) {
                              var total = 0f
                              detectVerticalDragGestures(
                                  onDragStart = { total = 0f },
                                  onDragEnd = {
                                      if (total < -120f) vm.zap(1) else if (total > 120f) vm.zap(-1)
                                  }
                              ) { _, dy -> total += dy }
                          }
                  )

                  if (pc.buffering && !inPip) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center), color = Accent)
                  }
                  pc.error?.let {
                      Text(
                          it,
                          Modifier.align(Alignment.Center).padding(horizontal = 32.dp)
                              .glass(RoundedCornerShape(20.dp), 0.14f, Color.Black).padding(16.dp),
                          color = Color.White, textAlign = TextAlign.Center, fontSize = 13.sp
                      )
                  }

                  // ---- touch buttons (top bar); TV remotes use the keys listed above
                  AnimatedVisibility(
                      visible = showBar && !panelOpen && !inPip,
                      modifier = Modifier.align(Alignment.TopCenter),
                      enter = fadeIn(),
                      exit = fadeOut()
                  ) {
                      Row(
                          Modifier.fillMaxWidth()
                              .background(Brush.verticalGradient(listOf(Color(0xCC000000), Color.Transparent)))
                              .padding(horizontal = 14.dp, vertical = 12.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          GlassIconButton(Icons.AutoMirrored.Filled.ArrowBack, "Back", size = 40.dp) {
                              vm.fullscreen = false
                          }
                          Text(
                              ch?.name ?: "", Modifier.weight(1f).padding(horizontal = 6.dp), color = Color.White,
                              fontSize = 18.sp, fontWeight = FontWeight.Bold, maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          GlassIconButton(Icons.Filled.SwapHoriz, "Last channel", size = 40.dp) { vm.recall() }
                          GlassIconButton(Icons.Filled.FormatListBulleted, "Channels", size = 40.dp) { showList = true }
                          GlassIconButton(Icons.Filled.Tune, "Options", size = 40.dp) { showOpts = true }
                      }
                  }

                  // ---- info card (bottom)
                  AnimatedVisibility(
                      visible = showInfo && !panelOpen && !inPip && ch != null,
                      modifier = Modifier.align(Alignment.BottomCenter),
                      enter = fadeIn(),
                      exit = fadeOut()
                  ) {
                      if (ch != null) InfoCard(vm, pc, ch)
                  }

                  // ---- channel list (left, LEFT / OK)
                  AnimatedVisibility(
                      visible = showList && !inPip,
                      modifier = Modifier.align(Alignment.CenterStart),
                      enter = slideInHorizontally { -it },
                      exit = slideOutHorizontally { -it }
                  ) {
                      ChannelPanel(vm) { showList = false }
                  }

                  // ---- options panel (right, RIGHT / MENU)
                  AnimatedVisibility(
                      visible = showOpts && !inPip,
                      modifier = Modifier.align(Alignment.CenterEnd),
                      enter = slideInHorizontally { it },
                      exit = slideOutHorizontally { it }
                  ) {
                      OptionsPanel(
                          vm, ch, aspectName,
                          onDialog = { d ->
                              showOpts = false
                              dialog = d
                          },
                          onList = {
                              showOpts = false
                              showList = true
                          },
                          onPip = {
                              showOpts = false
                              act.enterPip()
                          },
                          onClose = { showOpts = false }
                      )
                  }
              }

              // ---- dialogs
              when (dialog) {
                  "audio" -> TrackDialog("Audio", C.TRACK_TYPE_AUDIO, pc, null) { dialog = "" }
                  "sub" -> TrackDialog("Subtitles", C.TRACK_TYPE_TEXT, pc, "Off") { dialog = "" }
                  "video" -> TrackDialog("Video quality", C.TRACK_TYPE_VIDEO, pc, "Auto") { dialog = "" }
                  "log" -> LogDialog { dialog = "" }
                  "aspect" -> SimpleDialog("Aspect ratio", listOf("Fit", "Zoom", "Stretch"), vm.aspect, { vm.updateAspect(it) }) { dialog = "" }
                  "sleep" -> {
                      val mins = listOf(15, 30, 45, 60, 90, 120)
                      SimpleDialog(
                          if (vm.sleepAt > 0) "Sleep timer (running)" else "Sleep timer",
                          mins.map { "$it minutes" } + "Off", -1,
                          { i ->
                              vm.sleepAt = if (i < mins.size) System.currentTimeMillis() + mins[i] * 60_000L else 0L
                          }
                      ) { dialog = "" }
                  }
              }
          }

          /**
           * Bottom card: banner, title, time, description, up-next. Under it a single row (up to 10) of small cards
           * for the channels played before this one (newest first): channel name, its live programme banner and title.
           */
          @Composable
          fun InfoCard(vm: MainVM, pc: PlayerController, ch: Channel) {
              val nn = vm.nowNext(ch)
              val cur = nn.first
              val next = nn.second
              val bUrl = if (cur != null) bannerUrl(cur) else ""
              val hasBanner = bUrl.isNotBlank()
              val tint = rememberBannerColor(
                  bUrl, hashColor((cur?.title ?: ch.name) + (cur?.genre ?: ""))
              )
              val recent = remember(vm.recents, vm.channels, ch.id) {
                  vm.recents.filter { it != ch.id }
                      .mapNotNull { id -> vm.channels.firstOrNull { it.id == id } }
                      .take(10)
              }
              LaunchedEffect(recent) {
                  recent.forEach { c -> launch { vm.ensureEpg(c.id, 0) } }
              }
              Column(Modifier.fillMaxWidth()) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 16.dp, end = 16.dp, top = 16.dp, bottom = 4.dp)
                          .glass(RoundedCornerShape(26.dp), 0.10f, Color.Black)
                          .background(Color(0xCC000000))
                          .drawBehind {
                              drawRect(
                                  Brush.horizontalGradient(
                                      listOf(
                                          Color.Transparent,
                                          tint.copy(alpha = 0.16f),
                                          tint.copy(alpha = 0.46f)
                                      ),
                                      startX = size.width * 0.30f,
                                      endX = size.width
                                  )
                              )
                          }
                          .padding(14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      if (hasBanner) {
                          Box(
                              Modifier.width(150.dp).aspectRatio(16f / 9f).clip(RoundedCornerShape(14.dp))
                                  .background(Color.White.copy(alpha = 0.08f))
                          ) { Banner(bUrl, Modifier.fillMaxSize()) }
                      } else {
                          Logo(ch, 56.dp)
                      }
                      Spacer(Modifier.width(16.dp))
                      Column(Modifier.weight(1.7f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                          Text(ch.name, color = Dim, fontSize = 12.sp, maxLines = 1)
                          if (cur != null) {
                              Text(
                                  cur.title, color = Color.White, fontWeight = FontWeight.Bold,
                                  fontSize = 19.sp, maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  "${hm(cur.start)} - ${hm(cur.stop)}" +
                                      (if (cur.genre.isNotBlank()) "  -  ${cur.genre}" else ""),
                                  color = Accent, fontSize = 12.sp, maxLines = 1
                              )
                              LinearProgressIndicator(
                                  progress = { progressOf(cur, vm.now) },
                                  modifier = Modifier.fillMaxWidth().padding(vertical = 3.dp).height(3.dp),
                                  color = Accent, trackColor = Color.White.copy(alpha = 0.18f)
                              )
                              if (cur.desc.isNotBlank()) {
                                  Text(
                                      cur.desc, color = Color(0xFFDDE3EE), fontSize = 13.sp,
                                      lineHeight = 17.sp, maxLines = 3, overflow = TextOverflow.Ellipsis
                                  )
                              }
                          } else {
                              Text("Live", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 19.sp)
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(
                          Modifier.weight(1f),
                          horizontalAlignment = Alignment.End,
                          verticalArrangement = Arrangement.spacedBy(4.dp)
                      ) {
                          if (hasBanner) Logo(ch, 44.dp)
                          if (pc.videoRes.isNotEmpty()) {
                              Text(pc.videoRes, color = Color.White.copy(alpha = 0.8f), fontSize = 12.sp)
                          }
                          if (next != null) {
                              Text(
                                  "UP NEXT  ${hm(next.start)}", color = Color.White.copy(alpha = 0.85f),
                                  fontSize = 11.sp, fontWeight = FontWeight.Bold
                              )
                              Text(
                                  next.title, color = Color.White, fontSize = 13.sp,
                                  textAlign = TextAlign.End, maxLines = 2, overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }
                  if (recent.isNotEmpty()) {
                      LazyRow(
                          contentPadding = PaddingValues(horizontal = 16.dp, vertical = 4.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          items(recent, key = { it.id }) { c -> MiniChannelCard(vm, c) }
                      }
                  }
                  Text(
                      "UP / DOWN  channel     OK or LEFT  channel list (RIGHT hides it)     MENU  options     BACK  home",
                      Modifier.fillMaxWidth().padding(top = 2.dp, bottom = 8.dp),
                      color = Color.White.copy(alpha = 0.55f), fontSize = 11.sp, textAlign = TextAlign.Center
                  )
              }
          }

          /** Small "previously played" card: channel name, live programme banner, programme title. */
          @Composable
          fun MiniChannelCard(vm: MainVM, c: Channel) {
              val np = vm.nowNext(c).first
              val shape = RoundedCornerShape(12.dp)
              Column(
                  Modifier.width(150.dp).clip(shape)
                      .background(Color(0xD9000000))
                      .border(1.dp, Color.White.copy(alpha = 0.2f), shape)
                      .clickable { vm.play(c, vm.zapList) }
                      .padding(6.dp),
                  verticalArrangement = Arrangement.spacedBy(3.dp)
              ) {
                  Text(
                      c.name, color = Dim, fontSize = 10.sp, fontWeight = FontWeight.Bold,
                      maxLines = 1, overflow = TextOverflow.Ellipsis
                  )
                  Box(
                      Modifier.fillMaxWidth().aspectRatio(16f / 9f).clip(RoundedCornerShape(8.dp))
                          .background(Color.White.copy(alpha = 0.08f)),
                      contentAlignment = Alignment.Center
                  ) {
                      val u = if (np != null) bannerUrl(np) else ""
                      if (u.isNotBlank()) Banner(u, Modifier.fillMaxSize()) else Logo(c, 28.dp)
                  }
                  Text(
                      np?.title ?: "Live", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.SemiBold,
                      maxLines = 1, overflow = TextOverflow.Ellipsis
                  )
              }
          }

          /** Right-hand options panel; every entry is a focusable row, LEFT or BACK closes it. */
          @Composable
          fun OptionsPanel(
              vm: MainVM,
              ch: Channel?,
              aspectName: String,
              onDialog: (String) -> Unit,
              onList: () -> Unit,
              onPip: () -> Unit,
              onClose: () -> Unit
          ) {
              val fr = remember { FocusRequester() }
              LaunchedEffect(Unit) {
                  delay(200)
                  try {
                      fr.requestFocus()
                  } catch (e: Exception) {
                  }
              }
              val fav = ch != null && ch.id in vm.favorites
              val shape = RoundedCornerShape(topStart = 30.dp, bottomStart = 30.dp)
              Column(
                  Modifier.width(300.dp).fillMaxHeight().clip(shape)
                      .background(Color(0xF2000000)).glass(shape, 0.08f)
                      .onKeyEvent { e ->
                          if (e.type == KeyEventType.KeyDown && e.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_LEFT) {
                              onClose()
                              true
                          } else {
                              false
                          }
                      }
              ) {
                  Text(
                      "Options", Modifier.padding(start = 24.dp, top = 18.dp, bottom = 2.dp),
                      fontWeight = FontWeight.Bold, fontSize = 18.sp
                  )
                  LazyColumn(
                      contentPadding = PaddingValues(horizontal = 16.dp, vertical = 10.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item {
                          SideItem(
                              if (fav) "Remove favorite" else "Add to favorites",
                              if (fav) Icons.Filled.Star else Icons.Filled.StarBorder, fav,
                              Modifier.focusRequester(fr)
                          ) { if (ch != null) vm.toggleFav(ch) }
                      }
                      item { SideItem("Channel list", Icons.Filled.FormatListBulleted, false) { onList() } }
                      item {
                          SideItem("Last channel", Icons.Filled.SwapHoriz, false) {
                              vm.recall()
                              onClose()
                          }
                      }
                      item { SideItem("Audio", Icons.Filled.Audiotrack, false) { onDialog("audio") } }
                      item { SideItem("Subtitles", Icons.Filled.Subtitles, false) { onDialog("sub") } }
                      item { SideItem("Video quality", Icons.Filled.HighQuality, false) { onDialog("video") } }
                      item { SideItem("Aspect: $aspectName", Icons.Filled.AspectRatio, false) { onDialog("aspect") } }
                      item {
                          SideItem(
                              if (vm.sleepAt > 0) "Sleep timer (on)" else "Sleep timer",
                              Icons.Filled.Timer, vm.sleepAt > 0
                          ) { onDialog("sleep") }
                      }
                      item { SideItem("Picture in picture", Icons.Filled.PictureInPictureAlt, false) { onPip() } }
                      item { SideItem("Network log", Icons.Filled.BugReport, false) { onDialog("log") } }
                  }
              }
          }

          @Composable
          fun PlayerChannelRow(vm: MainVM, ch: Channel, selected: Boolean, modifier: Modifier, onClick: () -> Unit) {
              val np = vm.nowNext(ch).first
              val bu = if (np != null) bannerUrl(np) else ""
              Row(
                  modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 5.dp)
                      .focusGlow(corner = 16.dp, focusScale = 1.03f, onClick = onClick)
                      .glass(RoundedCornerShape(16.dp), if (selected) 0.20f else 0.07f, if (selected) Accent else Color.White)
                      .padding(10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Logo(ch, 42.dp)
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(ch.name, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(
                          np?.title ?: ch.category, fontSize = 12.sp, color = Dim,
                          maxLines = 1, overflow = TextOverflow.Ellipsis
                      )
                      if (np != null) {
                          LinearProgressIndicator(
                              progress = { progressOf(np, vm.now) },
                              modifier = Modifier.fillMaxWidth().padding(top = 3.dp).height(3.dp),
                              color = Accent, trackColor = Color.White.copy(alpha = 0.15f)
                          )
                      }
                  }
                  // small banner of the programme that is on now
                  if (bu.isNotBlank()) {
                      Spacer(Modifier.width(10.dp))
                      Banner(bu, Modifier.width(84.dp).aspectRatio(16f / 9f).clip(RoundedCornerShape(8.dp)))
                  }
              }
          }

          /** Left channel list: opens with OK / LEFT, closes with RIGHT (or BACK). */
          @Composable
          fun ChannelPanel(vm: MainVM, onPick: () -> Unit) {
              var g by remember { mutableStateOf(vm.category) }
              val all = listOf(G_ALL, G_FAV, G_RECENT) + vm.categories
              val list = remember(g, vm.channels, vm.favorites, vm.recents) { vm.filter(g) }
              val state = rememberLazyListState()
              val fr = remember { FocusRequester() }
              val curIdx = list.indexOfFirst { it.id == vm.current?.id }.coerceAtLeast(0)
              LaunchedEffect(g) {
                  state.scrollToItem(curIdx)
                  delay(150)
                  try {
                      fr.requestFocus()
                  } catch (e: Exception) {
                  }
              }
              // load EPG for the channels showing in this panel (chunks of 7, follows scrolling)
              LaunchedEffect(list, vm.epgTick) {
                  androidx.compose.runtime.snapshotFlow {
                      val v = state.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }
              val shape = RoundedCornerShape(topEnd = 30.dp, bottomEnd = 30.dp)
              Column(
                  Modifier.width(430.dp).fillMaxHeight().clip(shape)
                      .background(Color(0xF2000000)).glass(shape, 0.05f)
                      .onPreviewKeyEvent { e ->
                          if (e.type == KeyEventType.KeyDown && e.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                              onPick()
                              true
                          } else {
                              false
                          }
                      }
              ) {
                  Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                      GlassIconButton(Icons.Filled.ChevronLeft, "Previous group", size = 40.dp) {
                          g = all[(all.indexOf(g) - 1 + all.size).mod(all.size)]
                      }
                      Text(g, Modifier.weight(1f), textAlign = TextAlign.Center, fontWeight = FontWeight.Bold, maxLines = 1)
                      GlassIconButton(Icons.Filled.ChevronRight, "Next group", size = 40.dp) {
                          g = all[(all.indexOf(g) + 1).mod(all.size)]
                      }
                  }
                  if (list.isEmpty()) {
                      Text("Nothing here yet", Modifier.padding(16.dp), color = Dim)
                  }
                  LazyColumn(state = state) {
                      itemsIndexed(list, key = { _, c -> c.id }) { i, ch ->
                          PlayerChannelRow(
                              vm, ch, ch.id == vm.current?.id,
                              if (i == curIdx) Modifier.focusRequester(fr) else Modifier
                          ) {
                              vm.play(ch, list)
                              onPick()
                          }
                      }
                  }
              }
          }

          /** Dialog row: focusable with the same glow as the rest of the app, so it works with a D-pad. */
          @Composable
          fun PickRow(label: String, selected: Boolean, onClick: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 3.dp)
                      .focusGlow(corner = 14.dp, focusScale = 1.0f, onClick = onClick)
                      .padding(horizontal = 8.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  RadioButton(selected = selected, onClick = null)
                  Spacer(Modifier.width(12.dp))
                  Text(label)
              }
          }

          private val DialogBg = Color(0xF21A2030)

          @Composable
          fun SimpleDialog(
              title: String, options: List<String>, selected: Int,
              onPick: (Int) -> Unit, onDismiss: () -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = DialogBg,
                  shape = RoundedCornerShape(28.dp),
                  title = { Text(title) },
                  text = {
                      LazyColumn {
                          itemsIndexed(options) { i, o ->
                              PickRow(o, i == selected) {
                                  onPick(i)
                                  onDismiss()
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun TrackDialog(title: String, type: Int, pc: PlayerController, offLabel: String?, onDismiss: () -> Unit) {
              val opts = pc.options(type)
              val disabled = pc.isDisabled(type)
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = DialogBg,
                  shape = RoundedCornerShape(28.dp),
                  title = { Text(title) },
                  text = {
                      LazyColumn {
                          if (offLabel != null) {
                              item {
                                  PickRow(offLabel, if (type == C.TRACK_TYPE_VIDEO) false else disabled) {
                                      if (type == C.TRACK_TYPE_VIDEO) pc.auto(type) else pc.disable(type)
                                      onDismiss()
                                  }
                              }
                          }
                          if (opts.isEmpty()) {
                              item { Text("No tracks available", color = Dim) }
                          }
                          itemsIndexed(opts) { _, o ->
                              PickRow(o.label, o.selected && !disabled && type != C.TRACK_TYPE_VIDEO) {
                                  pc.select(o)
                                  onDismiss()
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun LogDialog(onDismiss: () -> Unit) {
              var tick by remember { mutableStateOf(0) }
              val lines = remember(tick) { NetLog.snapshot().reversed() }
              val clip = LocalClipboardManager.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = DialogBg,
                  shape = RoundedCornerShape(28.dp),
                  title = { Text("Network log (newest first)") },
                  text = {
                      LazyColumn(Modifier.heightIn(max = 320.dp)) {
                          if (lines.isEmpty()) item { Text("No requests yet") }
                          items(lines) { l ->
                              Text(l, fontSize = 11.sp, fontFamily = FontFamily.Monospace, modifier = Modifier.padding(vertical = 3.dp))
                          }
                      }
                  },
                  confirmButton = {
                      Row {
                          TextButton(onClick = { clip.setText(AnnotatedString(lines.joinToString("\n"))) }) { Text("Copy") }
                          TextButton(onClick = { NetLog.clear(); tick++ }) { Text("Clear") }
                          TextButton(onClick = { tick++ }) { Text("Refresh") }
                          TextButton(onClick = onDismiss) { Text("Close") }
                      }
                  }
              )
          }
          __SB_EOF__

          mkdir -p app/src/main/java/com/livetv/glass
          cat > app/src/main/java/com/livetv/glass/MainActivity.kt <<'__SB_EOF__'
          package com.livetv.glass

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import android.view.KeyEvent
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.viewModels
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.core.app.PictureInPictureModeChangedInfo
          import androidx.core.util.Consumer
          import coil.Coil
          import coil.ImageLoader
          import coil.disk.DiskCache
          import coil.memory.MemoryCache

          class MainActivity : ComponentActivity() {
              private val vm: MainVM by viewModels()
              private lateinit var pc: PlayerController

              var inPip by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  super.onCreate(savedInstanceState)
                  Coil.setImageLoader(
                      ImageLoader.Builder(this)
                          .memoryCache { MemoryCache.Builder(this).maxSizePercent(0.25).build() }
                          .diskCache {
                              DiskCache.Builder().directory(cacheDir.resolve("img")).maxSizeBytes(120L * 1024 * 1024).build()
                          }
                          .crossfade(false)
                          .respectCacheHeaders(false)
                          .build()
                  )
                  pc = PlayerController(this)

                  addOnPictureInPictureModeChangedListener(Consumer<PictureInPictureModeChangedInfo> { info ->
                      inPip = info.isInPictureInPictureMode
                  })

                  setContent {
                      AppTheme {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              AppRoot(vm, pc, this@MainActivity)
                          }
                      }
                  }
              }

              fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          enterPictureInPictureMode(
                              PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                          )
                      } catch (e: Exception) {
                          // device without PiP support
                      }
                  }
              }

              // Long-press Back on the home screen -> fullscreen the playing channel.
              // (startTracking lets the system tell a long press from a normal Back click.)
              override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK && event.repeatCount == 0) {
                      event.startTracking()
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyLongPress(keyCode: Int, event: KeyEvent): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK &&
                      vm.phase == Phase.READY && !vm.fullscreen && vm.current != null
                  ) {
                      vm.openFullscreen()
                      return true
                  }
                  return super.onKeyLongPress(keyCode, event)
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (vm.fullscreen && pc.player.isPlaying) enterPip()
              }

              override fun onStart() {
                  super.onStart()
                  // session may have expired while the app was in the background
                  vm.checkExpiry()
                  // resume the live preview / fullscreen stream
                  if (vm.current != null) vm.playNonce++
              }

              override fun onStop() {
                  super.onStop()
                  pc.stop()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (isFinishing) pc.release()
              }
          }
          __SB_EOF__


      - name: Build debug APK
        working-directory: LiveTVApp
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: LiveTVApp
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp LiveTVApp/app/build/outputs/apk/debug/app-debug.apk out/LiveTV-debug.apk
          cp LiveTVApp/app/build/outputs/apk/release/app-release.apk out/LiveTV-release.apk || true
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-APK
          path: out/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live TV build ${{ github.run_number }}
          files: out/*.apk
