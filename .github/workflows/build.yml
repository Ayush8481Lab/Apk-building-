                          .clickable(onClick = onClick).padding(6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Logo(ch, 36.dp)
                      Spacer(Modifier.width(6.dp))
                      Text(ch.name, maxLines = 2, fontSize = 13.sp, overflow = TextOverflow.Ellipsis)
                  }
                  var cursor = start
                  var any = false
                  for (p in progs) {
                      val s = maxOf(p.start, cursor)
                      val e = minOf(p.stop, end)
                      if (e <= s) continue
                      if (s > cursor) Spacer(Modifier.width(((s - cursor) / 60000f * dpm).dp))
                      val live = vm.now >= p.start && vm.now < p.stop
                      Box(
                          Modifier.width(((e - s) / 60000f * dpm).dp).fillMaxHeight().padding(1.dp)
                              .clip(RoundedCornerShape(4.dp))
                              .background(if (live) Accent.copy(alpha = 0.25f) else MaterialTheme.colorScheme.surfaceVariant)
                              .clickable(onClick = onClick).padding(6.dp)
                      ) {
                          Column {
                              Text(p.title, maxLines = 1, fontSize = 13.sp, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.Medium)
                              Text(
                                  "${hm(p.start)} - ${hm(p.stop)}", fontSize = 11.sp, maxLines = 1,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                      }
                      cursor = e
                      any = true
                  }
                  if (!any) {
                      Box(
                          Modifier.width((360 * dpm).dp).fillMaxHeight().padding(1.dp)
                              .background(MaterialTheme.colorScheme.surfaceVariant)
                              .clickable(onClick = onClick).padding(6.dp),
                          contentAlignment = Alignment.CenterStart
                      ) {
                          Text("No information", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
              }
          }

          /* =============================================================== SETTINGS */

          @Composable
          fun SettingsTab(vm: MainVM, onAdd: (String) -> Unit) {
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Playlists", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  vm.playlists.forEach { pl ->
                      Card {
                          Row(Modifier.padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                              RadioButton(selected = pl.id == vm.activeId, onClick = { vm.select(pl.id) })
                              Column(Modifier.weight(1f)) {
                                  Text(pl.name, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(
                                      if (pl.isFile) "Local file" else pl.source.take(60),
                                      fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                              IconButton(onClick = { if (pl.id == vm.activeId) vm.refresh() else vm.select(pl.id) }) {
                                  Icon(Icons.Filled.Refresh, "Refresh")
                              }
                              IconButton(onClick = { vm.delete(pl.id) }) { Icon(Icons.Filled.Delete, "Delete") }
                          }
                      }
                  }
                  Text("Add", fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                  AddButtons(onAdd)

                  HorizontalDivider()

                  val pl = vm.active()
                  if (pl != null) {
                      Text("EPG (XMLTV) for \"${pl.name}\"", fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                      var epgUrl by remember(pl.id, pl.epg) { mutableStateOf(pl.epg) }
                      OutlinedTextField(
                          value = epgUrl, onValueChange = { epgUrl = it }, singleLine = true,
                          label = { Text("XMLTV URL (.xml or .xml.gz)") }, modifier = Modifier.fillMaxWidth()
                      )
