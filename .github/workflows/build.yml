              private fun styleTab(i: Int) {
                  val v = tabViews[i]
                  val f = v.isFocused
                  val s = i == tab
                  v.setColorFilter(if (f || s) Color.WHITE else Color.argb(150, 255, 255, 255))
                  v.background = if (f || s) GradientDrawable().apply {
                      shape = GradientDrawable.OVAL; setColor(Color.argb(if (f) 70 else 35, 255, 255, 255))
                  } else null
                  v.animate().scaleX(if (f) 1.12f else 1f).scaleY(if (f) 1.12f else 1f).setDuration(120).start()
              }

              private fun selectTab(i: Int) {
                  if (inDetail) closeDetail(false)
                  tab = i
                  for (k in tabViews.indices) styleTab(k)
                  if (i == 2) {
                      content.visibility = View.VISIBLE
                      status.visibility = if (rows.isEmpty()) View.VISIBLE else View.GONE
                      if (!loaded) { loaded = true; loadShows() } else hero?.let { scheduleTrailer(it) }
                  } else {
                      stopTrailer()
                      content.visibility = View.GONE
                      status.visibility = View.VISIBLE
                      status.text = tabNames[i] + " — not wired yet"
                  }
              }

              // ---------------------------------------------------------------- Remote overlay
              private fun rbtn(label: String, w: Int = 52, h: Int = 46, action: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label; t.setTextColor(Color.WHITE); t.gravity = Gravity.CENTER; t.typeface = Typeface.DEFAULT_BOLD
                  tx(t, 16f)
                  t.background = GradientDrawable().apply { cornerRadius = u(12).toFloat(); setColor(Color.argb(255, 52, 56, 72)) }
                  t.isFocusable = false
                  t.setOnClickListener { action() }
                  t.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.86f).scaleY(0.86f).setDuration(60).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                      }
                      false
                  }
                  t.layoutParams = LinearLayout.LayoutParams(u(w), u(h)).apply { setMargins(u(3), u(3), u(3), u(3)) }
                  return t
              }

              private fun spacer(): View = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(u(52), u(46)).apply { setMargins(u(3), u(3), u(3), u(3)) }
              }

              private fun hrow(vararg v: View): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                  v.forEach { addView(it) }
              }

              private fun buildRemote() {
                  val tv = (getSystemService(UI_MODE_SERVICE) as UiModeManager).currentModeType == Configuration.UI_MODE_TYPE_TELEVISION
                  remote = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(u(10), u(6), u(10), u(10))
                      background = GradientDrawable().apply { cornerRadius = u(22).toFloat(); setColor(Color.argb(215, 22, 24, 34)) }
                      elevation = u(10).toFloat()
                  }
                  val handle = TextView(this).apply {
                      text = "⋮⋮  drag  ⋮⋮"; setTextColor(Color.argb(170, 255, 255, 255)); gravity = Gravity.CENTER
                      setPadding(0, u(4), 0, u(6))
                  }
                  tx(handle, 11f)
                  handle.setOnTouchListener(object : View.OnTouchListener {
                      var ox = 0f; var oy = 0f; var tx0 = 0f; var ty0 = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { ox = e.rawX; oy = e.rawY; tx0 = remote.translationX; ty0 = remote.translationY }
                              MotionEvent.ACTION_MOVE -> { remote.translationX = tx0 + e.rawX - ox; remote.translationY = ty0 + e.rawY - oy }
                          }
                          return true
                      }
                  })
                  remote.addView(handle)
                  remote.addView(hrow(spacer(), rbtn("▲") { move(View.FOCUS_UP) }, spacer()))
                  remote.addView(hrow(rbtn("◀") { move(View.FOCUS_LEFT) }, rbtn("OK") { okPress(false) }, rbtn("▶") { move(View.FOCUS_RIGHT) }))
                  remote.addView(hrow(spacer(), rbtn("▼") { move(View.FOCUS_DOWN) }, spacer()))
                  remote.addView(hrow(rbtn("BACK", 80) { onBackPressed() }, rbtn("HIDE", 80) { remote.visibility = View.GONE }))
                  root.addView(remote, lp(-2, -2, Gravity.BOTTOM or Gravity.END).apply { setMargins(0, 0, u(24), u(24)) })

                  chip = TextView(this).apply {
                      text = "REMOTE"; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(u(12), u(6), u(12), u(6))
                      background = GradientDrawable().apply { cornerRadius = u(14).toFloat(); setColor(Color.argb(200, 52, 56, 72)) }
                      setOnClickListener { remote.visibility = if (remote.visibility == View.VISIBLE) View.GONE else View.VISIBLE }
                  }
                  tx(chip, 11f)
                  root.addView(chip, lp(-2, -2, Gravity.TOP or Gravity.END).apply { setMargins(0, u(12), u(16), 0) })
                  if (tv) { remote.visibility = View.GONE; chip.visibility = View.GONE }
              }

              // ---------------------------------------------------------------- Navigation
              private fun rowNavActive(): Boolean {
                  if (inDetail || tab != 2 || content.visibility != View.VISIBLE || curRow < 0) return false
                  val f = currentFocus ?: return false
                  return tabViews.none { it === f }
              }

              // Shows page: up/down always lands on the FIRST card of the next / previous row
              private fun moveRow(delta: Int) {
                  val target = curRow + delta
                  if (target < 0 || target >= rows.size) return
                  focusRowFirst(target, 14)
              }

              private fun focusRowFirst(target: Int, tries: Int) {
                  val rvh = rowRv.findViewHolderForAdapterPosition(target) as? RowVH
                  if (rvh == null) {
                      if (tries == 14) smoothVertical(target)       // row not laid out yet: glide there, then focus
                      if (tries > 0) ui.postDelayed({ focusRowFirst(target, tries - 1) }, 60)
                      return
                  }
                  val first = rvh.rv.findViewHolderForAdapterPosition(0)?.itemView
                  if (first != null) first.requestFocus()
                  else {
                      rvh.rv.scrollToPosition(0)
                      if (tries > 0) ui.postDelayed({ focusRowFirst(target, tries - 1) }, 40)
                  }
              }

              // detail page: down = open episodes, up (from the Episodes tab) = back to the trailer view
              private fun handleVertical(dir: Int): Boolean {
                  if (inDetail) {
                      if (!epMode && dir == View.FOCUS_DOWN) { showEpisodes(); return true }
                      if (epMode && dir == View.FOCUS_UP && currentFocus === epTab) { hideEpisodes(); return true }
                      return false
                  }
                  if (rowNavActive()) { moveRow(if (dir == View.FOCUS_UP) -1 else 1); return true }
                  return false
              }

              // is the focus currently on an episode row?
              private fun inEpList(): Boolean {
                  val f = currentFocus ?: return false
                  return f.parent === dEpRv
              }

              // jump back to the SELECTED season in the left column (not the first one)
              private fun focusSeasonChip(): Boolean {
                  if (chips.size <= 1 || curSeason !in chips.indices) return false
                  chips[curSeason].requestFocus()
                  return true
              }

              // episodes list: LEFT goes back to the selected season (when there is a season column)
              private fun handleHorizontal(dir: Int): Boolean {
                  if (dir == View.FOCUS_LEFT && inDetail && epMode && inEpList()) return focusSeasonChip()
                  return false
              }

              private fun move(dir: Int) {
                  if (inPlayer) {
                      val code = when (dir) {
                          View.FOCUS_UP -> KeyEvent.KEYCODE_DPAD_UP
                          View.FOCUS_DOWN -> KeyEvent.KEYCODE_DPAD_DOWN
                          View.FOCUS_LEFT -> KeyEvent.KEYCODE_DPAD_LEFT
                          else -> KeyEvent.KEYCODE_DPAD_RIGHT
                      }
                      if (playerKey(code, 0)) return
                      currentFocus?.focusSearch(dir)?.requestFocus(dir)
                      return
                  }
                  if ((dir == View.FOCUS_UP || dir == View.FOCUS_DOWN) && handleVertical(dir)) return
                  if (dir == View.FOCUS_LEFT && handleHorizontal(dir)) return
                  val f = currentFocus
                  if (f == null) {
                      if (inDetail) {
                          val t: View? = if (epMode) dEpRv.getChildAt(0) else dWatch
                          t?.requestFocus()
                      } else rowRv.getChildAt(0)?.requestFocus()
                      return
                  }
                  f.focusSearch(dir)?.requestFocus(dir)
              }

              // OK button / tap. In the player with hidden controls: key OK = pause/play, touch tap = just show the controls.
              private fun okPress(touch: Boolean) {
                  if (inPlayer && panel == 0 && !ctrlVisible) {
                      if (!touch) togglePause()
                      showControls()
                      return
                  }
                  currentFocus?.performClick()
              }

              override fun dispatchKeyEvent(ev: KeyEvent): Boolean {
                  if (inPlayer) {
                      if (ev.action == KeyEvent.ACTION_DOWN && playerKey(ev.keyCode, ev.repeatCount)) return true
                      return super.dispatchKeyEvent(ev)
                  }
                  if (ev.action == KeyEvent.ACTION_DOWN) {
                      when (ev.keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> if (handleVertical(View.FOCUS_UP)) return true
                          KeyEvent.KEYCODE_DPAD_DOWN -> if (handleVertical(View.FOCUS_DOWN)) return true
                          KeyEvent.KEYCODE_DPAD_LEFT -> if (handleHorizontal(View.FOCUS_LEFT)) return true
                      }
                  }
                  return super.dispatchKeyEvent(ev)
              }

              private fun hit(v: View, ev: MotionEvent): Boolean {
                  if (!v.isShown) return false
                  val r = Rect()
                  return v.getGlobalVisibleRect(r) && r.contains(ev.rawX.toInt(), ev.rawY.toInt())
              }

              // swipe up/down/left/right = D-pad, tap = OK
              private var sx = 0f
              private var sy = 0f
              private var swiped = false
              private var forward = false

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.actionMasked == MotionEvent.ACTION_DOWN) forward = hit(remote, ev) || hit(chip, ev)
                  if (forward) return super.dispatchTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { sx = ev.rawX; sy = ev.rawY; swiped = false }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = ev.rawX - sx
                          val dy = ev.rawY - sy
                          if (max(abs(dx), abs(dy)) > u(55)) {
                              val d = if (abs(dy) > abs(dx)) { if (dy < 0) View.FOCUS_UP else View.FOCUS_DOWN }
                              else { if (dx < 0) View.FOCUS_LEFT else View.FOCUS_RIGHT }
                              move(d); swiped = true; sx = ev.rawX; sy = ev.rawY
                          }
                      }
                      MotionEvent.ACTION_UP -> if (!swiped) okPress(true)
                  }
                  return true
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (inPlayer) {
                      when (panel) {
                          2 -> {
                              // from the episode list: first go back to the selected season, next back closes the panel
                              if (inEpList() && focusSeasonChip()) return
                              closePlayerEps(true)
                          }
                          1 -> closeDrawer(true)
                          else -> closePlayer()
                      }
                      return
                  }
                  if (inDetail) {
                      if (epMode) {
                          // from the episode list: first go back to the selected season, next back closes the panel
                          if (inEpList() && focusSeasonChip()) return
                          hideEpisodes()
                      } else closeDetail(true)
                      return
                  }
                  val f = currentFocus
                  if (tab == 2 && f != null && tabViews.none { it === f }) tabViews[tab].requestFocus()
                  else super.onBackPressed()
              }

              // ---------------------------------------------------------------- Data
              private fun loadShows() {
                  status.text = "Loading…"; status.visibility = View.VISIBLE
                  Thread {
                      val page = Api.get(SHOWS_URL)
                      val cs = page?.optJSONObject("resultObj")?.optJSONArray("containers")
                      if (cs == null) {
                          ui.post { status.text = "Could not load Shows page\n" + Api.lastError + "\n\nSelect Shows again to retry"; loaded = false }
                          return@Thread
                      }
                      class Job(val title: String, val spot: Boolean, val f: Future<JSONObject?>)
                      val jobs = ArrayList<Job>()
                      var gotSpot = false
                      for (i in 0 until cs.length()) {
                          val c = cs.optJSONObject(i) ?: continue
                          if (isAd(c)) continue                                 // never load ad templates / ad spotlight
                          val layout = c.optString("layout")
                          val spot = layout == "spotlight_layout"
                          if (!spot && layout != "portrait_layout") continue   // skips ads, cards, landscape, square...
                          if (spot) { if (gotSpot) continue; gotSpot = true }
                          val uri = c.optJSONObject("retrieveItems")?.optString("uri").orEmpty()
                          if (uri.isEmpty()) continue
                          val cm = c.optJSONObject("metadata")
                          val title = cm?.str("title") ?: cm?.str("label") ?: c.str("title")
                              ?: c.optJSONObject("editorialMetadata")?.str("title") ?: ""
                          val url = BASE + uri + (if (spot) "" else "&from=0&to=15")
                          jobs.add(Job(title, spot, Api.pool.submit(Callable<JSONObject?> { Api.get(url) })))
                      }
                      for (j in jobs) {
                          val res = try { j.f.get() } catch (e: Exception) { null }
                          val ro = res?.optJSONObject("resultObj")
                          val arr = ro?.optJSONArray("containers")
                          val items = ArrayList<Item>()
                          if (arr != null) for (k in 0 until arr.length()) {
                              val c = arr.optJSONObject(k) ?: continue
                              if (isAd(c)) continue                             // LAUNCHER_ITEM ad slides are skipped
                              parseItem(c)?.let { items.add(it) }
                              if (j.spot) {
                                  val dual = c.optJSONObject("editorialMetadata")?.optJSONArray("dual_spotlight_items")
                                  if (dual != null) for (d in 0 until dual.length()) {
                                      dual.optJSONObject(d)?.let { parseItem(it) }?.let { items.add(it) }
                                  }
                              }
                          }
                          if (items.isEmpty()) continue
                          val title = if (j.title.isNotBlank()) j.title else (ro?.str("trayTitle") ?: "")
                          val row = Row(title, j.spot, items)
                          ui.post { addRow(row) }
                      }
                      ui.post { if (rows.isEmpty()) status.text = "No rows returned\n" + Api.lastError }
                  }.start()
              }

              private fun addRow(r: Row) {
                  rows.add(r)
                  rowAdapter.notifyItemInserted(rows.size - 1)
                  if (tab == 2 && !inDetail) status.visibility = View.GONE
                  if (rows.size == 1) focusFirst(12)
                  if (r.spotlight) r.items.forEach { prefetchHero(it) }
                  else if (rows.size <= 6) prefetchRow(r, 12)
              }

              private fun focusFirst(tries: Int) {
                  ui.postDelayed({
                      val ok = rowRv.getChildAt(0)?.requestFocus() ?: false
                      if (!ok && tries > 0) focusFirst(tries - 1)
                  }, 300)
              }

              // show detail json: memory cache first, then network (call from a background thread)
              private fun fetchDetail(cid: String): JSONObject? {
                  synchronized(detailCache) { detailCache[cid] }?.let { return it }
                  val j = Api.get(DETAIL_URL + cid)
                  if (j != null) synchronized(detailCache) { detailCache[cid] = j }
                  return j
              }

              // focused SHOW: warm everything the detail page needs, ahead of time.
              //  1) (main thread, instant) decode the DETAIL-size title image + banner into Glide's memory cache,
              //     so opening the show draws them with zero wait
              //  2) (background) fetch the detail json + download its banner / title / first episode thumbnails
              // (episodes / trailers / other VOD have no detail page yet, so nothing to prefetch)
              private fun prefetchDetail(item: Item) {
                  if (item.sub != SUB_SHOW || item.cid.isBlank()) return
                  if (item.logo != null) logoReq(item.logo, detLogoW, detLogoH).priority(Priority.NORMAL).preload()
                  img(item.bg ?: item.landscape, W_BG)?.let { bgBigReq(it).priority(Priority.LOW).preload() }
                  Api.pool.execute {
                      val j = fetchDetail(item.cid) ?: return@execute
                      val show = j.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0) ?: return@execute
                      Prefetch.add(detBgUrl(show), true)
                      Prefetch.add(detLogoUrl(show), true)
                      val data = parseSeasons(show)
                      data.seasons.firstOrNull()?.let { s ->
                          data.embedded[s.id].orEmpty().take(6).forEach { Prefetch.add(img(it.thumb, W_EP), true) }
                      }
                  }
              }

              // ---------------------------------------------------------------- Hero + trailer (home)
              private fun heroUrl(i: Item) = img(i.bg ?: i.spot ?: i.landscape, W_BG)
              private fun cardUrl(spot: Boolean, i: Item) =
                  if (spot) img(i.spot ?: i.landscape ?: i.portrait ?: i.bg, W_SPOT) else img(i.portrait ?: i.landscape ?: i.bg, W_PORTRAIT)
              private fun prefetchHero(i: Item, first: Boolean = false) {
                  Prefetch.add(heroUrl(i), first); Prefetch.add(i.logo, first)
              }
              // decode banner + title image of a card into memory BEFORE it gets focus => hero swap is instant
              private fun warmHero(i: Item) {
                  heroUrl(i)?.let { bgReq(it).priority(Priority.NORMAL).preload() }
                  if (i.logo != null) logoReq(i.logo, homeLogoW, homeLogoH).priority(Priority.NORMAL).preload()
              }
              private fun prefetchRow(r: Row, n: Int) {
                  r.items.take(n).forEach {
                      Prefetch.add(cardUrl(r.spotlight, it))
                      if (!r.spotlight) Prefetch.add(it.logo)          // title images: ready before the card is focused
                  }
                  r.items.take(3).forEach { prefetchHero(it) }
              }

              private fun isSpotRow() = rows.getOrNull(curRow)?.spotlight == true

              private fun onCardFocus(item: Item, row: Row, pos: Int, rowPos: Int) {
                  if (inDetail) return
                  curRow = rowPos; curPos = pos
                  snapTo(rowPos)
                  heroRun?.let { ui.removeCallbacks(it) }
                  val r = Runnable {
                      showHero(item)
                      // aggressive look-ahead: banners + titles of the next cards (downloaded AND decoded), detail data of the neighbours
                      row.items.getOrNull(pos + 1)?.let { prefetchHero(it, true); warmHero(it) }
                      row.items.getOrNull(pos + 2)?.let { prefetchHero(it, true); warmHero(it) }
                      row.items.getOrNull(pos - 1)?.let { prefetchHero(it); warmHero(it) }
                      if (!row.spotlight) row.items.getOrNull(pos + 1)?.let { prefetchDetail(it) }
                  }
                  heroRun = r
                  ui.postDelayed(r, 90)
              }

              private fun snapTo(pos: Int) {
                  if (pos == lastSnap) return
                  lastSnap = pos
                  for (d in 1..3) rows.getOrNull(pos + d)?.let { prefetchRow(it, 12) }   // next rows, in order, after banner
                  smoothVertical(pos)
              }

              // vertical row scroll: fixed ~300ms decelerate glide
              private fun smoothVertical(pos: Int) {
                  val s = object : LinearSmoothScroller(this) {
                      override fun getVerticalSnapPreference() = SNAP_TO_START
                      override fun calculateTimeForDeceleration(dx: Int): Int = 300
                  }
                  s.targetPosition = pos
                  rowRv.layoutManager?.startSmoothScroll(s)
              }

              private fun showHero(item: Item) {
                  if (hero?.id == item.id && hero?.title == item.title) return
                  hero = item
                  stopTrailer(false)
                  val token = ++heroToken
                  revealed = false
                  Prefetch.gate = false                      // banner + title of this screen first; prefetch waits
                  // hide old banner + text immediately => banner and text never mismatch
                  info.animate().cancel(); info.alpha = 0f
                  bg.animate().cancel(); bg.animate().alpha(0f).setDuration(100).start()
                  metaTv.text = item.meta
                  descTv.text = item.desc
                  var pending = 1 + (if (item.logo != null) 1 else 0)
                  val listener = doneListener {
                      if (token == heroToken) { pending--; if (pending <= 0) reveal(item, token) }
                  }
                  Glide.with(this).clear(bg)
                  bgReq(heroUrl(item)).priority(Priority.IMMEDIATE).listener(listener).into(bg)
                  if (item.logo != null) {
                      logo.visibility = View.VISIBLE; titleTv.visibility = View.GONE
                      Glide.with(this).clear(logo)
                      logoReq(item.logo, homeLogoW, homeLogoH).priority(Priority.IMMEDIATE).listener(listener).into(logo)
                  } else {
                      logo.setImageDrawable(null); logo.visibility = View.GONE
                      titleTv.text = item.title; titleTv.visibility = View.VISIBLE
                  }
                  ui.postDelayed({ reveal(item, token) }, 1800)   // safety if network is slow
              }

              private fun reveal(item: Item, token: Int) {
                  if (token != heroToken || revealed) return
                  revealed = true
                  Prefetch.gate = true
                  bg.animate().cancel(); bg.animate().alpha(1f).setDuration(250).start()
                  info.animate().cancel(); info.animate().alpha(1f).setDuration(250).start()
                  scheduleTrailer(item)      // trailer only after banner + title are on screen
                  prefetchDetail(item)       // then get the detail page data/images ready in the background (SHOW only)
              }

              // trailer for a home item. If the list item has no trailer url, look it up from DETAIL-V2 (cached).
              private fun scheduleTrailer(item: Item) {
                  stopTrailer(false)
                  val spot = isSpotRow()
                  val t = item.trailer
                  if (t != null) { schedulePlay(t, spot); return }
                  val cached = trailerCache[item.cid]
                  if (cached != null) {
                      if (cached.isNotEmpty()) schedulePlay(cached, spot) else spotAdvanceLater()
                      return
                  }
                  if (item.cid.isBlank()) { spotAdvanceLater(); return }
                  val token = heroToken
                  Thread {
                      val j = fetchDetail(item.cid)
                      val tu = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.let { trailerFrom(it) } ?: ""
                      if (j != null) trailerCache[item.cid] = tu
                      ui.post {
                          if (token == heroToken && !inDetail && hero?.id == item.id) {
                              if (tu.isNotEmpty()) schedulePlay(tu, spot) else spotAdvanceLater()
                          }
                      }
                  }.start()
              }

              private fun schedulePlay(url: String, spotLoop: Boolean) {
                  if (inPlayer) return                         // the real player is open: no trailers
                  stopTrailer(false)
                  val r = Runnable { playTrailer(url, spotLoop) }
                  trailerRun = r
                  ui.postDelayed(r, 700)
              }

              // spotlight card without any trailer: stay 6s then go to next card
              private fun spotAdvanceLater() {
                  if (!isSpotRow()) return
                  val r = Runnable { advanceSpot() }
                  advanceRun = r
                  ui.postDelayed(r, 6000)
              }

              // loop inside spotlight row: next card, wraps to first
              private fun advanceSpot() {
                  if (inDetail || tab != 2 || !isSpotRow()) return
                  val row = rows[curRow]
                  if (row.items.size <= 1) { player?.seekTo(0); player?.playWhenReady = true; return }
                  focusSpot((curPos + 1) % row.items.size, 10)
              }

              private fun focusSpot(pos: Int, tries: Int) {
                  val rv = (rowRv.findViewHolderForAdapterPosition(curRow) as? RowVH)?.rv ?: return
                  rv.scrollToPosition(pos)
                  ui.postDelayed({
                      if (inDetail || !isSpotRow()) return@postDelayed
                      val v = rv.findViewHolderForAdapterPosition(pos)?.itemView
                      if (v != null) v.requestFocus() else if (tries > 0) focusSpot(pos, tries - 1)
                  }, 80)
              }

              private fun playTrailer(url: String, spotLoop: Boolean) {
                  try {
                      spotLoopOn = spotLoop
                      curBox.animate().cancel(); curBox.alpha = 0f; curBox.visibility = View.VISIBLE
                      val p = player ?: ExoPlayer.Builder(this).build().also { pl ->
                          player = pl
                          pl.setAudioAttributes(AudioAttributes.DEFAULT, true)
                          // cap decode size => stable on weak TV boxes
                          pl.trackSelectionParameters = pl.trackSelectionParameters.buildUpon().setMaxVideoSize(1280, 720).build()
                          pl.addListener(object : Player.Listener {
                              override fun onVideoSizeChanged(videoSize: VideoSize) {
                                  if (videoSize.width == 0 || videoSize.height == 0) return
                                  val ar = videoSize.width * videoSize.pixelWidthHeightRatio / videoSize.height
                                  var w = curBoxW
                                  var h = (w / ar).toInt()
                                  if (h < curBoxH) { h = curBoxH; w = (h * ar).toInt() }       // cover the marked area
                                  curVideo.layoutParams = FrameLayout.LayoutParams(w, h, Gravity.CENTER)
                              }
                              override fun onRenderedFirstFrame() {
                                  curBox.animate().cancel(); curBox.animate().alpha(1f).setDuration(450).start()
                                  curBg.animate().cancel(); curBg.animate().alpha(0f).setDuration(450).start()   // no thumbnail behind video
                              }
                              override fun onPlaybackStateChanged(playbackState: Int) {
                                  if (playbackState == Player.STATE_ENDED && spotLoopOn && !inDetail) advanceSpot()
                              }
                              override fun onPlayerError(error: PlaybackException) {
                                  curBox.alpha = 0f; curBox.visibility = View.GONE
                                  curBg.animate().cancel(); curBg.animate().alpha(1f).setDuration(250).start()
                                  if (spotLoopOn && !inDetail) ui.postDelayed({ advanceSpot() }, 1500)
                              }
                          })
                      }
                      p.repeatMode = if (spotLoop) Player.REPEAT_MODE_OFF else Player.REPEAT_MODE_ONE
                      p.volume = if (TRAILER_MUTED) 0f else 1f
                      p.setVideoTextureView(curVideo)
                      p.setMediaItem(MediaItem.fromUri(url))
                      p.prepare()
                      p.playWhenReady = true
                  } catch (e: Exception) {
                      curBox.visibility = View.GONE
                  }
              }

              private fun stopTrailer(restoreBg: Boolean = true) {
                  trailerRun?.let { ui.removeCallbacks(it) }
                  advanceRun?.let { ui.removeCallbacks(it) }
                  spotLoopOn = false
                  videoBox.animate().cancel(); videoBox.alpha = 0f; videoBox.visibility = View.GONE
                  dBox.animate().cancel(); dBox.alpha = 0f; dBox.visibility = View.GONE
                  if (restoreBg) {
                      if (inDetail) { dBg.animate().cancel(); dBg.animate().alpha(1f).setDuration(250).start() }
                      else if (revealed) { bg.animate().cancel(); bg.animate().alpha(1f).setDuration(250).start() }
                  }
                  player?.let { it.stop(); it.clearMediaItems() }
              }

              override fun onStop() { super.onStop(); stopTrailer(); mainPlayer?.pause() }
              override fun onRestart() {
                  super.onRestart()
                  if (inPlayer) return
                  if (inDetail) { if (!epMode) detailTrailerUrl?.let { schedulePlay(it, false) } }
                  else if (tab == 2) hero?.let { scheduleTrailer(it) }
              }
              override fun onDestroy() {
                  super.onDestroy()
                  player?.release(); player = null
                  mainPlayer?.release(); mainPlayer = null
              }

              // ---------------------------------------------------------------- Detail page
              // Only objectSubtype == SHOW opens here. Episodes / trailers / other VOD: under development, click does nothing.
              private fun openDetail(item: Item, card: View) {
                  if (item.sub != SUB_SHOW || item.cid.isBlank()) return
                  lastCard = card
                  heroRun?.let { ui.removeCallbacks(it) }
                  heroToken++
                  stopTrailer(false)
                  inDetail = true; epMode = false
                  val tok = ++detailToken
                  epToken++
                  detGateRun?.let { ui.removeCallbacks(it) }
                  Prefetch.gate = false                       // this show's images first, everything else waits
                  curBox = dBox; curVideo = dVideo; curBg = dBg; curBoxW = detBoxW; curBoxH = detBoxH
                  content.visibility = View.GONE
                  status.visibility = View.GONE
                  side.visibility = View.GONE; brand.visibility = View.GONE
                  detail.visibility = View.VISIBLE
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  epLayer.animate().cancel(); epLayer.visibility = View.GONE; epLayer.translationY = H.toFloat()

                  // instant preview from the list item
                  showTitle = item.title
                  seasons.clear(); eps.clear(); epAdapter.notifyDataSetChanged()
                  sCol.removeAllViews(); chips.clear(); sScroll.visibility = View.GONE
                  epStatus.visibility = View.GONE
                  dHint.visibility = View.GONE
                  curSeason = -1; epFrom = 0; epHasMore = true; epLoading = false
                  detailTrailerUrl = null; latestEp = null
                  dBg.animate().cancel(); dBg.alpha = 1f
                  dBox.animate().cancel(); dBox.alpha = 0f; dBox.visibility = View.GONE
                  Glide.with(this).clear(dBg)
                  val previewBg = img(item.bg ?: item.landscape, W_BG)
                  shownBg = previewBg
                  bgBigReq(previewBg).priority(Priority.IMMEDIATE).into(dBg)
                  shownLogo = item.logo
                  showDetailLogo(item.logo, item.title)
                  dTag.visibility = View.GONE
                  dMeta.text = item.meta
                  dDesc.text = item.desc
                  dWatch.text = "▶  Watch Latest Episode"
                  dStatus.text = "Loading…"; dStatus.visibility = View.VISIBLE
                  dWatch.requestFocus()
                  ui.postDelayed({ if (inDetail && !epMode && !inPlayer) dWatch.requestFocus() }, 200)

                  val cachedJ = synchronized(detailCache) { detailCache[item.cid] }
                  if (cachedJ != null) bindDetail(cachedJ, item)
                  else Thread {
                      val j = fetchDetail(item.cid)
                      ui.post { if (inDetail && tok == detailToken) bindDetail(j, item) }
                  }.start()
              }

              private fun showDetailLogo(url: String?, title: String, l: RequestListener<Drawable>? = null) {
                  Glide.with(this).clear(dLogo)
                  if (url != null) {
                      dLogo.visibility = View.VISIBLE; dTitle.visibility = View.GONE
                      var r = logoReq(url, detLogoW, detLogoH).priority(Priority.IMMEDIATE)
                      if (l != null) r = r.listener(l)
                      r.into(dLogo)
                  } else {
                      dLogo.setImageDrawable(null); dLogo.visibility = View.GONE
                      dTitle.text = title; dTitle.visibility = View.VISIBLE
                  }
              }

              // The trailer starts ONLY after the title image, the background and the first episode thumbnails are loaded
              // (3s safety timeout). While they load, background prefetch is paused so they get all the bandwidth.
              // Title image / banner that are ALREADY on screen (same url as the instant preview) are not reloaded.
              private fun loadDetailAssets(tok: Int, title: String, logoUrl: String?, bgUrl: String?, thumbs: List<String>, trailer: String?) {
                  detGateRun?.let { ui.removeCallbacks(it) }
                  val needLogo = logoUrl != null && logoUrl != shownLogo
                  val needBg = bgUrl != null && bgUrl != shownBg
                  var pending = (if (needLogo) 1 else 0) + (if (needBg) 1 else 0) + thumbs.size
                  var fired = false
                  val fire: () -> Unit = {
                      if (!fired) {
                          fired = true
                          detGateRun?.let { ui.removeCallbacks(it) }
                          Prefetch.gate = true
                          if (tok == detailToken && inDetail && trailer != null && !epMode && !inPlayer) schedulePlay(trailer, false)
                      }
                  }
                  val l = doneListener {
                      if (tok == detailToken) { pending--; if (pending <= 0) fire() }
                  }
                  Prefetch.gate = false
                  if (needLogo) {                                            // 1) title image (rectangular masthead logo only)
                      shownLogo = logoUrl
                      showDetailLogo(logoUrl, title, l)
                  } else if (logoUrl == null && shownLogo == null) {
                      showDetailLogo(null, title)                            // no logo at all => plain title text
                  }
                  if (needBg) {                                              // 2) background
                      shownBg = bgUrl
                      Glide.with(this).clear(dBg)
                      bgBigReq(bgUrl).priority(Priority.IMMEDIATE).listener(l).into(dBg)
                  }
                  thumbs.forEach {                                           // 3) first episode thumbnails (same options as the list => cache hit)
                      cardReq(it, epImgW, epImgH).priority(Priority.HIGH).listener(l).preload()
                  }
                  if (pending <= 0) { fire(); return }
                  if (!fired) {
                      val r = Runnable { fire() }
                      detGateRun = r
                      ui.postDelayed(r, 3000)
                  }
              }

              private fun setWatchLabel(ep: Ep) {
                  latestEp = ep
                  val d = fmtDate(ep.air, false)
                  dWatch.text = "▶  Watch Latest Episode" + (if (d.isEmpty()) "" else "   $d")
              }

              private fun bindDetail(j: JSONObject?, item: Item) {
                  val show = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)
                  if (show == null) {
                      Prefetch.gate = true
                      dStatus.text = "Could not load details\n" + Api.lastError + "\n\nPress back"
                      return
                  }
                  val tok = detailToken
                  val m = show.optJSONObject("metadata") ?: JSONObject()
                  val e = m.optJSONObject("emfAttributes") ?: JSONObject()

                  val title = m.str("title") ?: item.title
                  showTitle = title
                  val desc = m.str("shortDescription") ?: m.str("longDescription") ?: item.desc

                  // "Hindi • 2026 • U/A 7+ • 16 Episodes • Comedy, Game show"
                  val parts = ArrayList<String>()
                  (m.str("languageLabel") ?: e.str("region_of_origin"))?.let { parts.add(it) }
                  m.str("year")?.let { parts.add(it) }
                  m.str("pcVodLabel")?.let { parts.add(it) }
                  val sn = m.optInt("seasonCount")
                  if (sn > 1) parts.add("$sn Seasons")
                  val ec = m.optInt("episodeCount")
                  if (ec > 0) parts.add("$ec Episodes")
                  m.optJSONArray("genres")?.let { g ->
                      val l = (0 until g.length()).map { k -> g.optString(k) }.filter { it.isNotBlank() }
                      if (l.isNotEmpty()) parts.add(l.joinToString(", "))
                  }
                  dMeta.text = parts.joinToString(" • ")
                  dDesc.text = desc
                  val tag = e.str("highlight_text")
                  if (tag != null) { dTag.text = tag; dTag.visibility = View.VISIBLE } else dTag.visibility = View.GONE

                  // seasons / bundles, newest first
                  val data = parseSeasons(show)
                  seasons.clear()
                  seasons.addAll(data.seasons)
                  data.latest?.let { setWatchLabel(it) }
                  dStatus.visibility = View.GONE

                  val trailer = trailerFrom(show)
                  detailTrailerUrl = trailer

                  // title image (masthead_logo_rectangualar, w=700) + background (w=1200) + first episode thumbnails => then the trailer
                  val logoUrl = detLogoUrl(show) ?: item.logo
                  val bgUrl = detBgUrl(show) ?: img(item.bg ?: item.landscape, W_BG)
                  val thumbs = data.seasons.firstOrNull()?.let { s ->
                      data.embedded[s.id].orEmpty().take(4).mapNotNull { img(it.thumb, W_EP) }
                  }.orEmpty()
                  loadDetailAssets(tok, title, logoUrl, bgUrl, thumbs, trailer)

                  if (seasons.isEmpty()) return
                  dHint.visibility = View.VISIBLE
                  buildSeasonCol()
                  selectSeason(0, false)      // newest bundle first; list loads in the background
              }

              // left column of bundles (only when there is more than one bundle)
              private fun buildSeasonCol() {
                  chips.clear(); sCol.removeAllViews()
                  if (seasons.size <= 1) { sScroll.visibility = View.GONE; return }
                  sScroll.visibility = View.VISIBLE
                  for (i in seasons.indices) {
                      val c = TextView(this).apply {
                          text = seasons[i].title
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(Color.WHITE)
                          setPadding(u(18), u(12), u(18), u(12))
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      tx(c, 18f)
                      c.setOnFocusChangeListener { _, has -> styleChip(i); if (has) scheduleSelect(i) }
                      c.setOnClickListener {
                          selRun?.let { ui.removeCallbacks(it) }
                          selectSeason(i, true)
                      }
                      chips.add(c)
                      sCol.addView(c, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = u(8) })
                  }
                  for (i in chips.indices) styleChip(i)
              }

              private fun styleChip(i: Int) {
                  val v = chips.getOrNull(i) ?: return
                  val f = v.isFocused
                  val sel = i == curSeason
                  v.setTextColor(if (f) Color.BLACK else Color.WHITE)
                  v.background = GradientDrawable().apply {
                      cornerRadius = u(10).toFloat()
                      setColor(if (f) Color.WHITE else if (sel) Color.argb(120, 200, 200, 210) else Color.TRANSPARENT)
                  }
              }

              // focusing a bundle selects it after a short pause (so fast scrolling doesn't spam the API)
              private fun scheduleSelect(i: Int) {
                  selRun?.let { ui.removeCallbacks(it) }
                  if (i == curSeason) return
                  val r = Runnable { selectSeason(i, false) }
                  selRun = r
                  ui.postDelayed(r, 350)
              }

              private fun selectSeason(i: Int, grab: Boolean) {
                  if (i !in seasons.indices) return
                  curSeason = i
                  epToken++
                  eps.clear(); epAdapter.notifyDataSetChanged()
                  epFrom = 0; epHasMore = true; epLoading = false
                  wantEpFocus = grab
                  for (k in chips.indices) styleChip(k)
                  epStatus.text = "Loading episodes…"; epStatus.visibility = View.VISIBLE
                  loadEpisodes()
              }

              // is the episode list on screen right now (detail episodes page OR the player's episodes panel)?
              private fun epActive(): Boolean = if (inPlayer) panel == 2 else (inDetail && epMode)

              // bundle api: from=0&to=29, then from=30&to=59 ... while scrolling
              private fun loadEpisodes() {
                  if (epLoading || !epHasMore || curSeason !in seasons.indices) return
                  epLoading = true
                  val tok = epToken
                  val s = seasons[curSeason]
                  val from = epFrom
                  val url = EP_URL + s.id + "?from=" + from + "&to=" + (from + EP_PAGE - 1) +
                          "&orderBy=episodeNumber&sortOrder=desc&kids_safe=false"
                  Thread {
                      val j = Api.get(url)
                      val arr = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.optJSONArray("containers")
                      val list = ArrayList<Ep>()
                      if (arr != null) for (k in 0 until arr.length()) parseEp(arr.optJSONObject(k))?.let { list.add(it) }
                      ui.post {
                          if (tok != epToken) return@post
                          epLoading = false
                          if (j == null) {
                              if (eps.isEmpty()) { epStatus.text = "Could not load episodes\n" + Api.lastError; epStatus.visibility = View.VISIBLE }
                              return@post
                          }
                          epFrom = from + EP_PAGE
                          if (list.size < EP_PAGE || (s.count > 0 && epFrom >= s.count)) epHasMore = false
                          val start = eps.size
                          eps.addAll(list)
                          epAdapter.notifyItemRangeInserted(start, list.size)
                          // thumbnails of this whole page: queue front (first 4 decoded into memory right away)
                          list.take(14).forEach { Prefetch.add(img(it.thumb, W_EP), true) }
                          list.take(4).forEach { cardReq(img(it.thumb, W_EP), epImgW, epImgH).priority(Priority.HIGH).preload() }
                          if (eps.isEmpty()) { epStatus.text = "No episodes"; epStatus.visibility = View.VISIBLE }
                          else epStatus.visibility = View.GONE
                          if (start == 0 && list.isNotEmpty()) {
                              if (curSeason == 0) setWatchLabel(list[0])
                              if (epActive() && wantEpFocus) { wantEpFocus = false; focusFirstEp(12) }
                          }
                      }
                  }.start()
              }

              private fun focusFirstEp(tries: Int) {
                  ui.postDelayed({
                      if (!epActive()) return@postDelayed
                      val v = dEpRv.findViewHolderForAdapterPosition(0)?.itemView ?: dEpRv.getChildAt(0)
                      val ok = v?.requestFocus() ?: false
                      if (!ok && tries > 0) focusFirstEp(tries - 1)
                  }, 200)
              }

              private fun focusEpDefault() {
                  wantEpFocus = false
                  val first = dEpRv.findViewHolderForAdapterPosition(0)?.itemView ?: dEpRv.getChildAt(0)
                  if (first != null) first.requestFocus()
                  else if (eps.isEmpty()) { wantEpFocus = true; epTab.requestFocus() }
                  else focusFirstEp(10)
              }

              // focus the episode that is playing (falls back to the first row)
              private fun focusPlayingEp() {
                  val id = curPlayEp?.id
                  val pos = if (id == null) -1 else eps.indexOfFirst { it.id == id }
                  if (pos < 0) { focusEpDefault(); return }
                  dEpRv.scrollToPosition(pos)
                  ui.postDelayed({
                      val v = dEpRv.findViewHolderForAdapterPosition(pos)?.itemView
                      if (v != null) v.requestFocus() else focusEpDefault()
                  }, 120)
              }

              // slide the episodes panel up (trailer view stays underneath, paused)
              private fun showEpisodes() {
                  if (epMode || seasons.isEmpty()) return
                  epMode = true
                  wantEpFocus = true
                  stopTrailer(true)
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.visibility = View.VISIBLE
                  epLayer.animate().cancel()
                  epLayer.translationY = H.toFloat()
                  epLayer.animate().translationY(0f).setDuration(300).setInterpolator(DecelerateInterpolator()).start()
                  if (eps.isEmpty()) loadEpisodes()
                  ui.postDelayed({ if (inDetail && epMode && !inPlayer) focusEpDefault() }, 200)
              }

              private fun hideEpisodes() {
                  if (!epMode) return
                  epMode = false
                  selRun?.let { ui.removeCallbacks(it) }
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  epLayer.animate().cancel()
                  epLayer.animate().translationY(H.toFloat()).setDuration(260).setInterpolator(DecelerateInterpolator())
                      .withEndAction { if (!epMode) epLayer.visibility = View.GONE }.start()
                  dWatch.requestFocus()
                  detailTrailerUrl?.let { schedulePlay(it, false) }
              }

              private fun closeDetail(refocus: Boolean) {
                  inDetail = false; epMode = false
                  detailToken++; epToken++
                  selRun?.let { ui.removeCallbacks(it) }
                  detGateRun?.let { ui.removeCallbacks(it) }
                  Prefetch.gate = true
                  stopTrailer(false)
                  detail.visibility = View.GONE
                  epLayer.animate().cancel(); epLayer.visibility = View.GONE; epLayer.translationY = H.toFloat()
                  heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  side.visibility = View.VISIBLE; brand.visibility = View.VISIBLE
                  content.visibility = View.VISIBLE
                  curBox = videoBox; curVideo = videoView; curBg = bg; curBoxW = homeBoxW; curBoxH = homeBoxH
                  bg.animate().cancel(); bg.alpha = 1f
                  info.animate().cancel(); info.alpha = 1f
                  if (!refocus) return
                  val c = lastCard
                  ui.postDelayed({
                      if (inDetail) return@postDelayed
                      if (c != null && c.isAttachedToWindow) c.requestFocus() else focusFirst(12)
                      hero?.let { scheduleTrailer(it) }
                  }, 100)
              }

              // ---------------------------------------------------------------- Player logic
              private fun playEpisode(ep: Ep) {
                  val sn = if (curSeason in seasons.indices) seasons[curSeason].num else 0
                  openPlayer(ep, sn)
              }

              private fun setPlayerTitles() {
                  val ep = curPlayEp ?: return
                  val pre = ((if (curPlaySeason > 0) "S$curPlaySeason " else "") + (if (ep.num > 0) "E${ep.num}" else "")).trim()
                  val name = if (ep.title.isNotBlank()) ep.title else showTitle
                  pTitle.text = if (pre.isNotEmpty()) "$pre • $name" else name
                  pSub.text = showTitle
              }

              // opens the player for an episode (from the detail page, or switching episode inside the player)
              private fun openPlayer(ep: Ep, seasonNum: Int) {
                  if (ep.id.isBlank()) return
                  val tok = ++playToken
                  curPlayEp = ep; curPlaySeason = seasonNum
                  if (!inPlayer) {
                      inPlayer = true
                      heroRun?.let { ui.removeCallbacks(it) }
                      detGateRun?.let { ui.removeCallbacks(it) }
                      stopTrailer(false)
                      Prefetch.paused = true                 // all bandwidth for the video
                      detail.visibility = View.GONE
                      playerLayer.visibility = View.VISIBLE
                  } else {
                      mainPlayer?.let { it.stop(); it.clearMediaItems() }
                      if (panel == 1) closeDrawer(false)
                      if (panel == 2) closePlayerEps(false)
                  }
                  panel = 0
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  pStatus.visibility = View.GONE
                  pCenter.visibility = View.GONE
                  pSpin.visibility = View.VISIBLE
                  pPause.setImageResource(R.drawable.ic_pause)
                  pSeek.pos = 0L; pSeek.buf = 0L; pSeek.dur = ep.dur * 1000L; pSeek.marks = emptyList(); pSeek.invalidate()
                  pTime.text = "00:00:00 / " + fmtClock(ep.dur * 1000L)
                  setPlayerTitles()
                  epAdapter.notifyDataSetChanged()           // "Now Playing" badge
                  showControls()
                  ui.removeCallbacks(tickRun); ui.postDelayed(tickRun, 500)

                  // stream url + license
                  Thread {
                      val s = fetchStream(ep.id)
                      ui.post {
                          if (tok != playToken || !inPlayer) return@post
                          if (s == null) {
                              pSpin.visibility = View.GONE
                              pStatus.text = "Stream unavailable for this content.\n" + Api.lastError
                              pStatus.visibility = View.VISIBLE
                          } else startPlayback(s)
                      }
                  }.start()

                  // ad-break markers + exact episode title from the episode DETAIL-V2 (best effort)
                  Thread {
                      val j = fetchDetail(ep.id)
                      val m = j?.optJSONObject("resultObj")?.optJSONArray("containers")?.optJSONObject(0)?.optJSONObject("metadata")
                      val marks = ArrayList<Long>()
                      val cps = m?.optJSONArray("advertisingInfoList")?.optJSONObject(0)?.optJSONArray("cuePointList")
                      if (cps != null) for (k in 0 until cps.length()) {
                          val c = cps.optJSONObject(k) ?: continue
                          if (c.optString("timePositionClass") == "MIDROLL") marks.add(c.optLong("contentTimePosition") * 1000L)
                      }
                      val sn = m?.optInt("season") ?: 0
                      val en = m?.optInt("episodeNumber") ?: 0
                      val et = m?.str("episodeTitle")
                      ui.post {
                          if (tok != playToken || !inPlayer) return@post
                          pSeek.marks = marks; pSeek.invalidate()
                          if (en > 0) {
                              curPlayEp = Ep(ep.id, et ?: ep.title, en, ep.desc, ep.thumb, ep.dur, ep.air)
                              if (sn > 0) curPlaySeason = sn
                              setPlayerTitles()
                          }
                      }
                  }.start()
              }

              private val mainListener = object : Player.Listener {
                  override fun onPlaybackStateChanged(playbackState: Int) {
                      refreshPlayUi()
                      if (playbackState == Player.STATE_ENDED) playNextOrExit()
                  }
                  override fun onPlayWhenReadyChanged(playWhenReady: Boolean, reason: Int) { refreshPlayUi() }
                  override fun onIsPlayingChanged(isPlaying: Boolean) { if (isPlaying) pStatus.visibility = View.GONE }
                  override fun onPlayerError(error: PlaybackException) {
                      pSpin.visibility = View.GONE
                      pCenter.visibility = View.GONE
                      pStatus.text = "Playback error\n" + error.errorCodeName + (error.cause?.message?.let { "\n" + it } ?: "")
                      pStatus.visibility = View.VISIBLE
                      showControls()
                  }
              }

              private fun ensureMainPlayer(): ExoPlayer {
                  mainPlayer?.let { return it }
                  // every manifest / segment request carries the same headers as the web player (Origin + Referer sonyliv.com)
                  val dsf = DefaultHttpDataSource.Factory()
                      .setUserAgent(STREAM_UA)
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(20000)
                      .setDefaultRequestProperties(STREAM_HEADERS)
                  val p = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(this).setDataSourceFactory(dsf))
                      .build()
                  p.setAudioAttributes(AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true)
                  p.addListener(mainListener)
                  mainPlayer = p
                  return p
              }

              private fun startPlayback(s: StreamInfo) {
                  val p = ensureMainPlayer()
                  p.setVideoSurfaceView(pSurface)
                  // subtitles OFF by default, quality AUTO
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .clearOverrides().setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true).build()
                  qualitySel = 0

                  val url = playableUrl(s.url)
                  val lower = url.lowercase()
                  val mime = when {
                      lower.contains(".m3u8") -> MimeTypes.APPLICATION_M3U8
                      lower.contains(".mpd") -> MimeTypes.APPLICATION_MPD
                      else -> null
                  }
                  val mb = MediaItem.Builder().setUri(url)
                  if (mime != null) mb.setMimeType(mime)
                  if (s.enc && s.laUrl.isNotBlank() && s.drm == "WIDEVINE") {
                      mb.setDrmConfiguration(
                          MediaItem.DrmConfiguration.Builder(C.WIDEVINE_UUID)
                              .setLicenseUri(s.laUrl)
                              .setLicenseRequestHeaders(STREAM_HEADERS)
                              .build()
                      )
                  }
                  // external subtitle files (only well known text formats)
                  val subs = ArrayList<MediaItem.SubtitleConfiguration>()
                  for (si in s.subs) {
                      val ul = si.url.lowercase().substringBefore("?")
                      val sm = when {
                          ul.endsWith(".vtt") -> MimeTypes.TEXT_VTT
                          ul.endsWith(".srt") -> MimeTypes.APPLICATION_SUBRIP
                          ul.endsWith(".ttml") || ul.endsWith(".xml") || ul.endsWith(".dfxp") -> MimeTypes.APPLICATION_TTML
                          else -> null
                      } ?: continue
                      subs.add(MediaItem.SubtitleConfiguration.Builder(Uri.parse(si.url))
                          .setMimeType(sm).setLanguage(si.lang).setLabel(si.label).setSelectionFlags(0).build())
                  }
                  if (subs.isNotEmpty()) mb.setSubtitleConfigurations(subs)

                  p.setMediaItem(mb.build())
                  p.prepare()
                  p.playWhenReady = true
                  pStatus.visibility = View.GONE
                  refreshPlayUi()
              }

              private fun refreshPlayUi() {
                  val p = mainPlayer ?: return
                  pPause.setImageResource(if (p.playWhenReady) R.drawable.ic_pause else R.drawable.ic_play)
                  val st = p.playbackState
                  pSpin.visibility = if (st == Player.STATE_BUFFERING && p.playWhenReady) View.VISIBLE else View.GONE
                  pCenter.visibility = if (!p.playWhenReady && st != Player.STATE_ENDED && pStatus.visibility != View.VISIBLE) View.VISIBLE else View.GONE
                  if (!p.playWhenReady) {
                      ui.removeCallbacks(hideRun)
                      if (panel == 0 && inPlayer) showControls()
                  } else schedHide()
              }

              private fun playNextOrExit() {
                  val cur = curPlayEp ?: run { closePlayer(); return }
                  val i = eps.indexOfFirst { it.id == cur.id }
                  if (i > 0) openPlayer(eps[i - 1], curPlaySeason) else closePlayer()
              }

              private fun updateProgress() {
                  val p = mainPlayer
                  val dur = if (p != null && p.duration > 0) p.duration else (curPlayEp?.dur ?: 0) * 1000L
                  val pos = p?.currentPosition ?: 0L
                  pSeek.dur = dur
                  pSeek.pos = pos
                  pSeek.buf = p?.bufferedPosition ?: 0L
                  pSeek.invalidate()
                  pTime.text = fmtClock(pos) + " / " + fmtClock(dur)
              }

              private fun togglePause() {
                  val p = mainPlayer ?: return
                  if (p.playbackState == Player.STATE_ENDED) { p.seekTo(0); p.play(); return }
                  if (p.playWhenReady) p.pause() else p.play()
              }

              private fun seekBy(deltaMs: Long) {
                  val p = mainPlayer ?: return
                  val dur = if (p.duration > 0) p.duration else (curPlayEp?.dur ?: 0) * 1000L
                  var t = p.currentPosition + deltaMs
                  if (t < 0L) t = 0L
                  if (dur > 0 && t > dur - 1000L) t = max(0L, dur - 1000L)
                  p.seekTo(t)
                  pSeek.pos = t
                  pSeek.invalidate()
                  pTime.text = fmtClock(t) + " / " + fmtClock(dur)
              }

              private fun showControls() {
                  if (!inPlayer || panel != 0) return
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = true
                  ctrl.animate().cancel()
                  ctrl.visibility = View.VISIBLE
                  ctrl.animate().alpha(1f).setDuration(150).start()
                  if (ctrl.findFocus() == null) pSeek.requestFocus()
                  schedHide()
              }

              private fun schedHide() {
                  ui.removeCallbacks(hideRun)
                  if (inPlayer && panel == 0 && mainPlayer?.playWhenReady == true) ui.postDelayed(hideRun, 5000)
              }

              private fun hideControls() {
                  ctrlVisible = false
                  ctrl.animate().cancel()
                  ctrl.animate().alpha(0f).setDuration(200).withEndAction { if (!ctrlVisible) ctrl.visibility = View.INVISIBLE }.start()
              }

              // all player key handling. returns true when the key was consumed.
              private fun playerKey(code: Int, repeat: Int): Boolean {
                  if (panel == 1) {                                  // drawer: up / down / OK handled by normal focus
                      return when (code) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> { closeDrawer(true); true }
                          KeyEvent.KEYCODE_DPAD_RIGHT -> true
                          else -> false
                      }
                  }
                  if (panel == 2) {                                  // episodes panel (same behaviour as the detail episodes page)
                      when (code) {
                          KeyEvent.KEYCODE_DPAD_UP -> if (currentFocus === epTab) { closePlayerEps(true); return true }
                          KeyEvent.KEYCODE_DPAD_LEFT -> if (inEpList()) return focusSeasonChip()
                      }
                      return false
                  }
                  when (code) {
                      KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { togglePause(); showControls(); return true }
                      KeyEvent.KEYCODE_MEDIA_PLAY -> { mainPlayer?.play(); return true }
                      KeyEvent.KEYCODE_MEDIA_PAUSE -> { mainPlayer?.pause(); return true }
                      KeyEvent.KEYCODE_MEDIA_FAST_FORWARD -> { seekBy(30000L); showControls(); return true }
                      KeyEvent.KEYCODE_MEDIA_REWIND -> { seekBy(-30000L); showControls(); return true }
                  }
                  val step = if (repeat > 3) 30000L else 10000L
                  if (!ctrlVisible) {                                // controls hidden: arrows seek, OK = pause / play
                      when (code) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> { seekBy(-step); showControls(); return true }
                          KeyEvent.KEYCODE_DPAD_RIGHT -> { seekBy(step); showControls(); return true }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER -> { togglePause(); showControls(); return true }
                          KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN -> { showControls(); return true }
                      }
                      return false
                  }
                  schedHide()
                  val f = currentFocus
                  val onPill = f === pillSub || f === pillSet || f === pillEps
                  when (code) {
                      KeyEvent.KEYCODE_DPAD_LEFT -> {
                          if (f === pSeek) { seekBy(-step); return true }
                          if (f === pillSub || f === pPause || f === pBack) return true
                      }
                      KeyEvent.KEYCODE_DPAD_RIGHT -> {
                          if (f === pSeek) { seekBy(step); return true }
                          if (f === pPause) { pSeek.requestFocus(); return true }
                          if (f === pillEps || f === pBack) return true
                      }
                      KeyEvent.KEYCODE_DPAD_UP -> {
                          if (f === pSeek) pPause.requestFocus()
                          else if (f === pPause) pBack.requestFocus()
                          else if (onPill) pSeek.requestFocus()
                          return true
                      }
                      KeyEvent.KEYCODE_DPAD_DOWN -> {
                          if (f === pBack) pPause.requestFocus()
                          else if (f === pSeek || f === pPause) pillSub.requestFocus()
                          return true
                      }
                  }
                  return false
              }

              // ---- drawer: Subtitle & Audio (kind 1) / Settings = video quality (kind 2)
              private fun trackLabel(f: Format, i: Int): String {
                  f.label?.takeIf { it.isNotBlank() }?.let { return it }
                  val lang = f.language
                  if (!lang.isNullOrBlank() && lang != "und") {
                      val n = Locale.forLanguageTag(lang).getDisplayLanguage(Locale.ENGLISH)
                      return if (n.isNotBlank()) n else lang
                  }
                  return "Track " + (i + 1)
              }

              private fun drawerHeader(t: String): TextView {
                  val h = TextView(this).apply {
                      text = t; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                      setPadding(u(8), u(16), u(8), u(10))
                  }
                  tx(h, 20f)
                  return h
              }

              private fun drawerRow(label: String, selected: Boolean, onClick: () -> Unit): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(u(16), u(14), u(16), u(14))
                      isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                  }
                  val ck = ImageView(this).apply {
                      setImageResource(R.drawable.ic_check)
                      visibility = if (selected) View.VISIBLE else View.INVISIBLE
                  }
                  val tv = TextView(this).apply { text = label; maxLines = 1; ellipsize = TextUtils.TruncateAt.END }
                  tx(tv, 18f)
                  row.addView(ck, LinearLayout.LayoutParams(u(24), u(24)).apply { rightMargin = u(16) })
                  row.addView(tv, LinearLayout.LayoutParams(0, -2, 1f))
                  fun st() {
                      val f = row.isFocused
                      tv.setTextColor(if (f) Color.parseColor("#222222") else Color.WHITE)
                      tv.typeface = if (f || selected) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                      ck.setColorFilter(if (f) Color.parseColor("#777777") else Color.parseColor("#FFC107"))
                      row.background = if (f) GradientDrawable().apply { cornerRadius = u(8).toFloat(); setColor(Color.WHITE) } else null
                  }
                  st()
                  row.setOnFocusChangeListener { _, _ -> st() }
                  row.setOnClickListener { onClick() }
                  return row
              }

              private class QOpt(val h: Int, val g: Tracks.Group, val idx: Int, val br: Int)

              private fun qualityOptions(): List<QOpt> {
                  val p = mainPlayer ?: return emptyList()
                  val best = HashMap<Int, QOpt>()
                  for (g in p.currentTracks.groups) {
                      if (g.type != C.TRACK_TYPE_VIDEO) continue
                      for (i in 0 until g.length) {
                          if (!g.isTrackSupported(i)) continue
                          val f = g.getTrackFormat(i)
                          if (f.height <= 0) continue
                          val cur = best[f.height]
                          if (cur == null || f.bitrate > cur.br) best[f.height] = QOpt(f.height, g, i, f.bitrate)
                      }
                  }
                  return best.values.sortedByDescending { it.h }
              }

              private fun selectText(g: Tracks.Group?, idx: Int) {
                  val p = mainPlayer ?: return
                  val b = p.trackSelectionParameters.buildUpon()
                  if (g == null) b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                  else {
                      b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                      b.setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx))
                  }
                  p.trackSelectionParameters = b.build()
              }

              private fun selectAudio(g: Tracks.Group, idx: Int) {
                  val p = mainPlayer ?: return
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx)).build()
              }

              private fun selectQuality(o: QOpt?) {
                  val p = mainPlayer ?: return
                  val b = p.trackSelectionParameters.buildUpon()
                  if (o == null) { b.clearOverridesOfType(C.TRACK_TYPE_VIDEO); qualitySel = 0 }
                  else { b.setOverrideForType(TrackSelectionOverride(o.g.mediaTrackGroup, o.idx)); qualitySel = o.h }
                  p.trackSelectionParameters = b.build()
              }

              private fun openDrawer(kind: Int) {
                  val p = mainPlayer ?: return
                  if (panel != 0) return
                  drawerKind = kind
                  drawerCol.removeAllViews()
                  var focusV: View? = null
                  fun add(v: LinearLayout, sel: Boolean) {
                      drawerCol.addView(v, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = u(6) })
                      if (sel && focusV == null) focusV = v
                  }
                  val tracks = p.currentTracks
                  if (kind == 1) {
                      drawerCol.addView(drawerHeader("Subtitles"))
                      val off = p.trackSelectionParameters.disabledTrackTypes.contains(C.TRACK_TYPE_TEXT)
                      class TR(val g: Tracks.Group, val i: Int, val label: String, val sel: Boolean)
                      val tl = ArrayList<TR>()
                      for (g in tracks.groups) if (g.type == C.TRACK_TYPE_TEXT) for (i in 0 until g.length) {
                          if (g.isTrackSupported(i)) tl.add(TR(g, i, trackLabel(g.getTrackFormat(i), tl.size), !off && g.isTrackSelected(i)))
                      }
                      add(drawerRow("OFF", off || tl.none { it.sel }) { selectText(null, 0); closeDrawer(true) }, off || tl.none { it.sel })
                      for (t in tl) add(drawerRow(t.label, t.sel) { selectText(t.g, t.i); closeDrawer(true) }, t.sel)

                      drawerCol.addView(drawerHeader("Audio"))
                      var anyAudio = false
                      for (g in tracks.groups) if (g.type == C.TRACK_TYPE_AUDIO) for (i in 0 until g.length) {
                          if (!g.isTrackSupported(i)) continue
                          anyAudio = true
                          val sel = g.isTrackSelected(i)
                          add(drawerRow(trackLabel(g.getTrackFormat(i), i), sel) { selectAudio(g, i); closeDrawer(true) }, sel)
                      }
                      if (!anyAudio) add(drawerRow("Default", true) { closeDrawer(true) }, true)
                  } else {
                      drawerCol.addView(drawerHeader("Video Quality"))
                      add(drawerRow("Auto", qualitySel == 0) { selectQuality(null); closeDrawer(true) }, qualitySel == 0)
                      for (o in qualityOptions()) {
                          add(drawerRow(o.h.toString() + "p", qualitySel == o.h) { selectQuality(o); closeDrawer(true) }, qualitySel == o.h)
                      }
                  }
                  panel = 1
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = false
                  ctrl.animate().cancel(); ctrl.alpha = 0f; ctrl.visibility = View.INVISIBLE
                  ctrl.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  drawer.animate().cancel()
                  drawer.visibility = View.VISIBLE
                  drawer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  drawer.translationX = drawerW.toFloat()
                  drawer.animate().translationX(0f).setDuration(220).setInterpolator(DecelerateInterpolator()).start()
                  ui.postDelayed({
                      if (inPlayer && panel == 1) (focusV ?: drawerCol.getChildAt(1))?.requestFocus()
                  }, 100)
              }

              private fun closeDrawer(refocus: Boolean) {
                  if (panel != 1) return
                  panel = 0
                  drawer.animate().cancel()
                  drawer.animate().translationX(drawerW.toFloat()).setDuration(200)
                      .withEndAction {
                          if (panel != 1) { drawer.visibility = View.GONE; drawer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS }
                      }.start()
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  if (refocus) {
                      showControls()
                      (if (drawerKind == 1) pillSub else pillSet).requestFocus()
                  }
              }

              // ---- episodes panel inside the player = the SAME episodes page (same list, same seasons), just see-through
              private fun moveEpLayerToPlayer() {
                  if (epLayer.parent === playerLayer) return
                  (epLayer.parent as? ViewGroup)?.removeView(epLayer)
                  playerLayer.addView(epLayer, lp(-1, -1))
              }

              private fun moveEpLayerToDetail() {
                  if (epLayer.parent !== detail) {
                      (epLayer.parent as? ViewGroup)?.removeView(epLayer)
                      detail.addView(epLayer, 1, lp(-1, -1))
                  }
                  epLayer.setBackgroundColor(Color.argb(255, 12, 13, 20))
                  epLayer.animate().cancel()
                  if (epMode) {
                      epLayer.visibility = View.VISIBLE; epLayer.translationY = 0f
                      epLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  } else {
                      epLayer.visibility = View.GONE; epLayer.translationY = H.toFloat()
                      epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  }
              }

              private fun openPlayerEps() {
                  if (panel != 0 || seasons.isEmpty()) return
                  panel = 2
                  ui.removeCallbacks(hideRun)
                  ctrlVisible = false
                  ctrl.animate().cancel(); ctrl.alpha = 0f; ctrl.visibility = View.INVISIBLE
                  ctrl.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  moveEpLayerToPlayer()
                  epLayer.setBackgroundColor(Color.argb(205, 8, 9, 14))      // a little transparent: video is still visible behind
                  epLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  epLayer.visibility = View.VISIBLE
                  epLayer.animate().cancel()
                  epLayer.translationY = H.toFloat()
                  epLayer.animate().translationY(0f).setDuration(300).setInterpolator(DecelerateInterpolator()).start()
                  epAdapter.notifyDataSetChanged()
                  if (eps.isEmpty()) loadEpisodes()
                  ui.postDelayed({ if (inPlayer && panel == 2) focusPlayingEp() }, 220)
              }

              private fun closePlayerEps(refocus: Boolean) {
                  if (panel != 2) return
                  panel = 0
                  selRun?.let { ui.removeCallbacks(it) }
                  epLayer.animate().cancel()
                  epLayer.animate().translationY(H.toFloat()).setDuration(260).setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          if (panel != 2) { epLayer.visibility = View.GONE; epLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS }
                      }.start()
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  if (refocus) {
                      showControls()
                      pillEps.requestFocus()
                  }
              }

              private fun closePlayer() {
                  playToken++
                  inPlayer = false
                  panel = 0
                  ui.removeCallbacks(hideRun); ui.removeCallbacks(tickRun)
                  mainPlayer?.let { it.stop(); it.clearVideoSurface(); it.release() }
                  mainPlayer = null
                  drawer.animate().cancel(); drawer.visibility = View.GONE; drawer.translationX = drawerW.toFloat()
                  drawer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  ctrl.animate().cancel(); ctrl.alpha = 1f; ctrl.visibility = View.VISIBLE; ctrlVisible = true
                  ctrl.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  playerLayer.visibility = View.GONE
                  moveEpLayerToDetail()
                  Prefetch.paused = false
                  Prefetch.gate = true
                  detail.visibility = View.VISIBLE
                  epAdapter.notifyDataSetChanged()
                  if (epMode) {
                      heroLayer.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                      ui.postDelayed({ if (inDetail && epMode && !inPlayer) focusPlayingEp() }, 150)
                  } else {
                      heroLayer.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                      dWatch.requestFocus()
                      detailTrailerUrl?.let { schedulePlay(it, false) }
                  }
              }

