          /* ================================================================== ROOT */

          @Composable
          fun AppRoot(vm: MainVM, pc: PlayerController, act: MainActivity) {
              val root = remember { FocusRequester() }

              // start / restart playback whenever a channel is (re)selected
              LaunchedEffect(vm.playNonce) {
                  vm.current?.let { pc.play(it, vm.userAgent, vm.extraHeaders) }
              }
              // keep audio only where a picture is visible
              LaunchedEffect(vm.fullscreen, vm.side) {
                  pc.player.playWhenReady = vm.fullscreen || vm.side == 1
              }
              // sleep timer
              LaunchedEffect(vm.sleepAt) {
                  if (vm.sleepAt > 0L) {
                      val wait = vm.sleepAt - System.currentTimeMillis()
                      if (wait > 0) delay(wait)
                      pc.stop()
                      vm.fullscreen = false
                      vm.sleepAt = 0L
                      vm.toast = "Sleep timer: playback stopped"
                  }
              }
              // immersive player
              DisposableEffect(vm.fullscreen) {
                  val w = act.window
                  val c = WindowCompat.getInsetsController(w, w.decorView)
                  if (vm.fullscreen) {
                      c.hide(WindowInsetsCompat.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  onDispose { c.show(WindowInsetsCompat.Type.systemBars()) }
              }
              // hand focus back to the key handler whenever the screen mode changes
              LaunchedEffect(vm.pane, vm.side, vm.fullscreen, vm.dialog, vm.guideOverlay, vm.playlists.size) {
                  val composePage = !vm.fullscreen && vm.pane == 2 && vm.pageIsCompose
                  if (vm.dialog.isEmpty() && !composePage) {
                      try {
                          root.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }
              LaunchedEffect(vm.toast) {
                  if (vm.toast != null) {
                      delay(3500)
                      vm.toast = null
                  }
              }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                  if (uri != null) {
                      val nm = uri.lastPathSegment?.substringAfterLast('/')?.take(30) ?: "Local playlist"
                      vm.addFile(uri, nm)
                  }
              }
              val onAdd: (String) -> Unit = { kind ->
                  if (kind == "file") picker.launch(arrayOf("*/*")) else vm.dialog = kind
              }

              BackHandler(enabled = vm.fullscreen || vm.pane != 0) { vm.back() }

              Box(
                  Modifier.fillMaxSize()
                      .onKeyEvent { handleKey(vm, pc, it.nativeKeyEvent) }
                      .focusRequester(root)
                      .focusable()
              ) {
                  if (vm.fullscreen) PlayerScreen(vm, pc, act) else HomeScreen(vm, pc, onAdd)

                  vm.toast?.let {
                      Box(Modifier.align(Alignment.BottomCenter).padding(bottom = 40.dp)) {
                          Text(
                              it, Modifier.background(Color(0xEE303030), RoundedCornerShape(8.dp)).padding(horizontal = 20.dp, vertical = 10.dp),
                              color = Color.White, fontSize = 16.sp
                          )
                      }
                  }
                  if (vm.numBuf.isNotEmpty()) {
                      Text(
                          vm.numBuf, Modifier.align(Alignment.TopEnd).padding(top = 60.dp, end = 40.dp)
                              .background(Color(0xCC000000), RoundedCornerShape(8.dp)).padding(horizontal = 22.dp, vertical = 8.dp),
                          color = Gold, fontSize = 48.sp, fontWeight = FontWeight.Bold
                      )
                  }
              }
              Dialogs(vm, pc, act)
          }

          /* ================================================================ PLAYER */

          @Composable
          fun PlayerScreen(vm: MainVM, pc: PlayerController, act: MainActivity) {
              val inPip = act.inPip
              LaunchedEffect(vm.fbar, vm.fstamp) {
                  if (vm.fbar > 0 && !vm.guideOverlay) {
                      delay(if (vm.fbar == 2) 9000 else 5000)
                      vm.fbar = 0
                  }
              }
              val resize = when (vm.aspect) {
                  1 -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                  2 -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                  else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
              }
              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  VideoSurface(pc, resize, Modifier.fillMaxSize())

                  // touch: tap = info, double tap = last channel
                  Box(
                      Modifier.fillMaxSize().pointerInput(Unit) {
                          detectTapGestures(
                              onTap = {
                                  vm.fbar = if (vm.fbar == 0) 2 else 0
                                  vm.fidx = 0
                              },
                              onDoubleTap = { vm.recall() }
                          )
                      }
                  )

                  if (pc.buffering && !inPip) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center).size(56.dp), color = Gold, strokeWidth = 5.dp)
                  }
                  pc.error?.let {
                      Text(
                          it, Modifier.align(Alignment.Center).padding(horizontal = 80.dp)
                              .background(Color(0xDD000000)).padding(16.dp),
                          color = Color.White, textAlign = TextAlign.Center, fontSize = 15.sp
                      )
                  }
                  if (!inPip && vm.guideOverlay) GuideOverlay(vm)
                  else if (!inPip && vm.fbar > 0) FullOverlay(vm, pc)
              }
          }

