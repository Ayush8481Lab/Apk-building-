          /* ------------------------------------------------------------------ TiviMate-like palette */
          val Gold = Color(0xFFFFB800)
          val GoldSoft = Color(0xFFFFE08A)
          val Bg = Color(0xFF181818)
          val SideBg = Color(0xFF212121)
          val SelGold = Color(0xFF6B5413)
          val SideSel = Color(0xFF7A5F1A)
          val CellBg = Color(0xFF2A2A2A)
          val CellRowBg = Color(0xFF454545)
          val CellSel = Color(0xFF6E6E6E)
          val TextDim = Color(0xFFA8A8A8)
          val LineC = Color(0xFFB8A25A)

          const val PPM = 7.9f          // dp per minute in the guide
          const val GRID_W = 940f       // visible width of the program area (dp)

          @Composable
          fun AppTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Gold,
                      onPrimary = Color.Black,
                      background = Bg,
                      surface = Color(0xFF1E1E1E),
                      surfaceVariant = Color(0xFF2A2A2A),
                      onSurface = Color(0xFFEDEDED),
                      onBackground = Color(0xFFEDEDED),
                      onSurfaceVariant = TextDim,
                      secondaryContainer = SelGold
                  ),
                  content = content
              )
          }

          /* ------------------------------------------------------------------ time helpers */
          private val HMF = SimpleDateFormat("hh:mm a", Locale.getDefault())
          private val HMF24 = SimpleDateFormat("hh:mm", Locale.getDefault())
          private val DTF = SimpleDateFormat("EEE, d MMM, h:mm a", Locale.getDefault())

          private fun ampm(s: String) = s.replace("AM", "am").replace("PM", "pm").replace("a.m.", "am").replace("p.m.", "pm")
          fun hm(ms: Long): String = ampm(HMF.format(Date(ms)))
          fun dateTime(ms: Long): String = ampm(DTF.format(Date(ms)))

          fun range(p: Program): String {
              val s = hm(p.start)
              val e = hm(p.stop)
              return if (s.takeLast(2) == e.takeLast(2)) HMF24.format(Date(p.start)) + " \u2014 " + e else "$s \u2014 $e"
          }

          fun progressOf(p: Program, now: Long): Float =
              ((now - p.start).toFloat() / (p.stop - p.start).coerceAtLeast(1L).toFloat()).coerceIn(0f, 1f)

          fun minsText(p: Program, now: Long): String {
              val live = now >= p.start && now < p.stop
              val m = if (live) (p.stop - now + 59_999L) / 60_000L else (p.stop - p.start) / 60_000L
              return "$m min"
          }

          /* ------------------------------------------------------------------ small building blocks */
          @Composable
          fun Modifier.tvFocus(shape: Shape = RoundedCornerShape(8.dp)): Modifier {
              var f by remember { mutableStateOf(false) }
              return this.onFocusChanged { f = it.hasFocus }
                  .then(if (f) Modifier.border(2.dp, Gold, shape) else Modifier)
          }

          /** touch-only click (D-pad focus is handled by the central key handler) */
          fun Modifier.tap(onClick: () -> Unit): Modifier =
              this.focusProperties { canFocus = false }.clickable(onClick = onClick)

          @Composable
          fun Logo(ch: Channel, w: Dp = 66.dp, h: Dp = 44.dp) {
              Box(Modifier.size(w, h), contentAlignment = Alignment.Center) {
                  if (ch.logo.isNotBlank()) {
                      AsyncImage(
                          model = ch.logo, contentDescription = null, contentScale = ContentScale.Fit,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else {
                      Text(ch.name.take(2).uppercase(), color = TextDim, fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun MiniBar(f: Float, w: Dp = 60.dp) {
              Box(Modifier.width(w).height(3.dp).clip(RoundedCornerShape(2.dp)).background(Color(0xFF666666))) {
                  Box(Modifier.fillMaxHeight().fillMaxWidth(f.coerceIn(0f, 1f)).background(Color(0xFFE6E6E6)))
              }
          }

          @Composable
          fun pageFocus(vm: MainVM): FocusRequester {
              val fr = remember { FocusRequester() }
              LaunchedEffect(vm.pane) {
                  if (vm.pane == 2) {
                      delay(80)
                      try {
                          fr.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }
              return fr
          }

          /* ================================================================================ HOME */
          @Composable
          fun HomeScreen(vm: MainVM, pc: PlayerController, onAdd: (String) -> Unit) {
              val tvPage = vm.side == 1 && vm.playlists.isNotEmpty()
              val sideW by animateDpAsState(if (vm.pane == 0) 326.dp else 82.dp, tween(160), label = "sideW")
              val shift by animateDpAsState(if (tvPage && vm.pane == 2) (-456).dp else 0.dp, tween(180), label = "shift")

              Box(Modifier.fillMaxSize().background(Bg).clipToBounds()) {
                  Row(
                      Modifier.wrapContentWidth(Alignment.Start, unbounded = true).fillMaxHeight()
                          .offset(x = shift)
                  ) {
                      Sidebar(vm, sideW)
                      if (tvPage) {
                          CategoryList(vm, Modifier.width(398.dp).fillMaxHeight())
                          GuidePane(vm, pc, Modifier.width(1316.dp).fillMaxHeight())
                      } else {
                          Box(Modifier.width(1340.dp - sideW).fillMaxHeight()) {
                              when (vm.side) {
                                  0 -> SearchPage(vm)
                                  1 -> Welcome(vm, onAdd)
                                  2 -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                      Text("Recording is not available in StreamBox", color = TextDim, fontSize = 22.sp)
                                  }
                                  3 -> MyListPage(vm)
                                  else -> SettingsPage(vm, onAdd)
                              }
                          }
                      }
                  }
                  if (vm.loading) LinearProgressIndicator(Modifier.fillMaxWidth(), color = Gold)
              }
          }

