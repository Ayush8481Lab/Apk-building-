              fun search(q: String): List<Channel> {
                  val s = q.trim().lowercase()
                  if (s.length < 2) return emptyList()
                  return channels.filter {
                      it.name.lowercase().contains(s) ||
                          it.category.lowercase().contains(s) ||
                          (nowNext(it).first?.title?.lowercase()?.contains(s) == true)
