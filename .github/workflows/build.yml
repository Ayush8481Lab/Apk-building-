          package com.livetv.glass

          import android.app.Application
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateMapOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import kotlinx.coroutines.withContext
          import java.io.File

          const val G_ALL = "All channels"
          const val G_FAV = "Favorites"
          const val G_RECENT = "Recently watched"

          /** The session is reloaded this long before the server says keys / stream urls expire. */
          const val REFRESH_BEFORE_MS = 10 * 60_000L

          /** EPG is fetched for this many channels at a time. */
          const val EPG_CHUNK = 7

          /** At most this many EPG downloads run at once, so the video stream always keeps the bandwidth. */
          const val EPG_PARALLEL = 3

          enum class Phase { TOKEN, LOADING, READY }

          private val GENERIC_TITLES = setOf(
              "filler", "fillers", "no information", "no information available", "to be announced", "tba",
              "programme", "program", "programs", "programmes", "closed", "off air", "no programme"
          )

          /** Entries this long (or longer) are treated as a "block" that real programmes may sit inside. */
          private const val BLOCK_MS = 5 * 3_600_000L
          private const val DAY_MS = 86_400_000L
          private const val IST_MS = 19_800_000L

          /** Two start times closer than this are the same programme listed twice. */
          private const val SAME_START_MS = 90_000L

          /** A short entry fully inside a programme at least this long (promo / duplicate) never cuts that programme. */
          private const val LONG_PROG_MS = 3_600_000L
          private const val INTERSTITIAL_MS = 20 * 60_000L

          private fun isGeneric(p: Program): Boolean =
              p.title.isBlank() || p.title.trim().lowercase() in GENERIC_TITLES

          /** Distance (ms) of [t] from the nearest IST midnight. */
          private fun midnightDist(t: Long): Long {
              val m = (t + IST_MS).mod(DAY_MS)
              return minOf(m, DAY_MS - m)
          }

          /** The EPG service cuts a programme that runs over midnight at 23:59:59 (the day file ends there). */
          private fun clippedAtMidnight(stop: Long): Boolean = (stop + IST_MS).mod(DAY_MS) >= DAY_MS - SAME_START_MS

          /** Of two entries that start together, is [a] the better one to keep (real title > Filler, more info > less, longer > shorter). */
          private fun better(a: Program, b: Program): Boolean {
              val ga = isGeneric(a)
              val gb = isGeneric(b)
              if (ga != gb) return gb
              val ia = (if (a.thumb.isNotBlank()) 2 else 0) + (if (a.desc.isNotBlank()) 1 else 0)
              val ib = (if (b.thumb.isNotBlank()) 2 else 0) + (if (b.desc.isNotBlank()) 1 else 0)
              if (ia != ib) return ia > ib
              return (a.stop - a.start) > (b.stop - b.start)
          }

          /**
           * Turns whatever the EPG service returned into a clean, TiviMate-like schedule: no overlaps, no title ever pushed or hidden.
           *  1. one entry per start time (the better one: real title beats "Filler", more info beats less);
           *  2. the START time is the truth: when a programme starts before the previous one ended, the PREVIOUS one is cut
           *     where the new one starts (the new one keeps its real start time and its full title);
           *  2b. exception (movie channels): a SHORT entry (<= 20 min) that lies completely inside a LONG programme (>= 1 h)
           *     is a promo / duplicate and is dropped, so the movie is not chopped into a stub + a hole;
           *  3. "background" entries (Filler / TBA / 5 h+ blocks) never cut a real programme, they only fill the gaps between them;
           *  4. a programme the service clipped at 23:59:59 and re-listed at 00:00 is joined, gaps under 3 minutes are closed.
           */
          fun normalizeEpg(raw: List<Program>): List<Program> {
              val byStart = HashMap<Long, Program>()
              for (p in raw) {
                  if (p.stop - p.start < 30_000L) continue
                  val o = byStart[p.start]
                  if (o == null || better(p, o)) byStart[p.start] = p
              }
              val all = byStart.values.sortedBy { it.start }
              if (all.isEmpty()) return all

              val bg = ArrayList<Program>()
              val chain = ArrayList<Program>()
              for (p in all) {
                  if (isGeneric(p) || p.stop - p.start >= BLOCK_MS) {
                      bg.add(p)
                      continue
                  }
                  val last = chain.lastOrNull()
                  if (last == null) {
                      chain.add(p)
                      continue
                  }
                  // movie cut at 23:59:59 and continued at 00:00 -> one block
                  if (p.title == last.title && clippedAtMidnight(last.stop) &&
                      p.start - last.stop <= SAME_START_MS && midnightDist(p.start) <= SAME_START_MS
                  ) {
                      chain[chain.size - 1] = last.copy(stop = maxOf(last.stop, p.stop))
                      continue
                  }
                  if (p.start >= last.stop) {
                      chain.add(p)
                      continue
                  }
                  // p starts before the previous programme ended
                  if (p.start - last.start < SAME_START_MS) {
                      if (better(p, last)) chain[chain.size - 1] = p.copy(start = last.start)
                      continue
                  }
                  if (p.stop <= last.stop && p.title == last.title) continue // same programme listed twice
                  // short promo / duplicate sitting inside a long programme: the long one keeps its full length
                  val ld = last.stop - last.start
                  val pd = p.stop - p.start
                  if (p.stop <= last.stop && ld >= LONG_PROG_MS && pd <= INTERSTITIAL_MS && pd * 4L <= ld) continue
                  chain[chain.size - 1] = last.copy(stop = p.start)
                  chain.add(p)
              }

              val placed = ArrayList<Program>(chain)
              for (a in bg.sortedBy { it.stop - it.start }) {
                  var cur = a.start
                  val pieces = ArrayList<Program>()
                  for (q in placed) {
                      if (q.stop <= cur) continue
                      if (q.start >= a.stop) break
                      if (q.start > cur) pieces.add(a.copy(start = cur, stop = minOf(q.start, a.stop)))
                      cur = maxOf(cur, q.stop)
                      if (cur >= a.stop) break
                  }
                  if (cur < a.stop) pieces.add(a.copy(start = cur))
                  for (pc in pieces) {
                      if (pc.stop - pc.start >= 60_000L) placed.add(pc)
                  }
                  placed.sortBy { it.start }
              }

              for (i in 0 until placed.size - 1) {
                  val gap = placed[i + 1].start - placed[i].stop
                  if (gap in 1L..179_999L) placed[i] = placed[i].copy(stop = placed[i + 1].start)
              }
              return placed
          }

          class MainVM(app: Application) : AndroidViewModel(app) {
              val store = Store(app)

              var token by mutableStateOf(store.token)
              var phase by mutableStateOf(if (store.token.isEmpty()) Phase.TOKEN else Phase.LOADING)
              var tokenError by mutableStateOf<String?>(null)

              var channels by mutableStateOf<List<Channel>>(emptyList())
              var categories by mutableStateOf<List<String>>(emptyList())
              var category by mutableStateOf(G_ALL)
              /** Home navigation: 0 live rows (TV), 2 search, 3 settings. */
              var tab by mutableIntStateOf(0)
              /** TiviMate-like side menu: 0 hidden, 1 categories panel, 2 nav + categories panel. */
              var menuLevel by mutableIntStateOf(0)
              var expire by mutableLongStateOf(0L)
              val epg = mutableStateMapOf<String, List<Program>>()
              val epgDays = mutableStateMapOf<String, Int>()
              var epgTick by mutableIntStateOf(0)

              var toast by mutableStateOf<String?>(null)
              var favorites by mutableStateOf(store.favorites())
              var recents by mutableStateOf(store.recents())

              var userAgent by mutableStateOf(store.userAgent)
              var extraHeaders by mutableStateOf(store.extraHeaders)
              var resumeLast by mutableStateOf(store.resumeLast)
              var aspect by mutableIntStateOf(store.aspect)
              var rows by mutableIntStateOf(store.rows)
              var headerPct by mutableIntStateOf(store.headerPct)

              var now by mutableLongStateOf(System.currentTimeMillis())
              var current by mutableStateOf<Channel?>(null)
              var previous by mutableStateOf<Channel?>(null)
              var focused by mutableStateOf<Channel?>(null)
              /** Programme block the remote / finger is currently on (home guide). The header shows its details. */
              var hover by mutableStateOf<Pair<Channel, Program>?>(null)
              var zapList by mutableStateOf<List<Channel>>(emptyList())
              var fullscreen by mutableStateOf(false)
              var playNonce by mutableIntStateOf(0)
              var sleepAt by mutableLongStateOf(0L)

              private var resumed = false
              private var busy = false
              private var epgJob: Job? = null
              private var epgKey = ""
              private val epgAt = HashMap<String, Long>()
              /** IST calendar day each epg entry was loaded for: after midnight everything is reloaded. */
              private val epgDay = HashMap<String, Long>()
              private val inflight = HashSet<String>()
              /** Limits parallel EPG downloads so they never starve the video stream. */
              private val epgGate = Semaphore(EPG_PARALLEL)

              init {
                  EpgApi.dir = File(app.cacheDir, "epg").apply { mkdirs() }
                  viewModelScope.launch(Dispatchers.IO) { EpgApi.cleanup() }

                  if (token.isNotEmpty()) viewModelScope.launch { login(token) }

                  // clock: 10 s tick keeps progress bars and "min left" accurate; EPG refresh check every 10 minutes
                  viewModelScope.launch {
                      var n = 0
                      var day = istDay()
                      while (true) {
                          delay(10_000)
                          now = System.currentTimeMillis()
                          n++
                          val d = istDay()
                          if (n % 60 == 0 || d != day) {
                              day = d
                              epgTick++
                          }
                      }
                  }

                  viewModelScope.launch {
                      while (true) {
                          val wait = if (expire > 0) expire * 1000 - REFRESH_BEFORE_MS - clock() else 30_000L
                          delay(wait.coerceIn(20_000L, 3_600_000L))
                          if (phase == Phase.READY && due()) login(token)
                      }
                  }
              }

              private fun clock(): Long = System.currentTimeMillis() + Http.jar.skew
              private fun due(): Boolean = expire > 0 && clock() >= expire * 1000 - REFRESH_BEFORE_MS

              fun checkExpiry() {
                  if (phase == Phase.READY && due()) viewModelScope.launch { login(token) }
              }

              /* ------------------------------------------------------------ session */

              fun submitToken(t: String) {
                  val s = t.trim()
                  if (s.isEmpty()) {
                      tokenError = "Enter your access token"
                      return
                  }
                  tokenError = null
                  phase = Phase.LOADING
                  viewModelScope.launch { login(s) }
              }

              fun refresh() {
                  viewModelScope.launch {
                      login(token)
                      if (phase == Phase.READY) toast = "Refreshed - ${channels.size} channels"
                  }
              }

              fun logout(msg: String? = null) {
                  epgJob?.cancel()
                  epgKey = ""
                  fullscreen = false
                  current = null
                  previous = null
                  focused = null
                  hover = null
                  channels = emptyList()
                  categories = emptyList()
                  epg.clear()
                  epgAt.clear()
                  epgDay.clear()
                  epgDays.clear()
                  tlCache.clear()
                  expire = 0L
                  token = ""
                  store.token = ""
                  tokenError = msg
                  resumed = false
                  tab = 0
                  menuLevel = 0
                  phase = Phase.TOKEN
              }

              private suspend fun login(t: String) {
                  if (busy) return
                  busy = true
                  val first = channels.isEmpty()
                  val r = withContext(Dispatchers.IO) { Api.channels(t) }
                  busy = false
                  when (r) {
                      is ApiResult.Ok -> {
                          token = t.trim()
                          store.token = token
                          tokenError = null
                          apply(r.session)
                          phase = Phase.READY
                      }
                      is ApiResult.Invalid -> {
                          if (first) {
                              store.token = ""
                              token = ""
                              tokenError = "Invalid access token"
                              phase = Phase.TOKEN
                          } else {
                              logout("Access token expired or revoked")
                          }
                      }
                      is ApiResult.NetErr -> {
                          if (first) {
                              tokenError = "Cannot reach server: ${r.msg}"
                              phase = Phase.TOKEN
                          } else {
                              toast = "Refresh failed (${r.msg}) - retrying"
                          }
                      }
                  }
              }

              private fun apply(s: Session) {
                  channels = s.channels
                  categories = s.channels.map { it.category }.distinct()
                  expire = s.expire
                  if (category != G_ALL && category != G_FAV && category != G_RECENT && category !in categories) {
                      category = G_ALL
                  }
                  val cur = current
                  if (cur != null) {
                      val n = channels.firstOrNull { it.id == cur.id }
                      if (n != null) {
                          val changed = n.url != cur.url || n.license != cur.license
                          current = n
                          if (changed) playNonce++
                      }
                  }
                  zapList = zapList.mapNotNull { z -> channels.firstOrNull { it.id == z.id } }

                  if (!resumed) {
                      resumed = true
                      val last = store.lastChannel
                      val start = channels.firstOrNull { it.id == last } ?: channels.firstOrNull()
                      if (start != null) {
                          play(start, channels, record = false)
                          if (resumeLast && last.isNotEmpty()) fullscreen = true
                      }
                  }
              }

              /* ---------------------------------------------------------------- EPG */

              /**
               * Chunked, priority EPG loading. [first]..[last] are the list indexes currently on screen.
               * Order: chunk(s) of 7 channels that are visible, then the next 7 below, then the 7 above.
               * Waits a moment first (so a channel start / fast scrolling is not disturbed) and downloads at most
               * EPG_PARALLEL files at a time.
               */
              fun loadEpgFor(list: List<Channel>, first: Int, last: Int) {
                  if (list.isEmpty() || phase != Phase.READY) return
                  val maxChunk = (list.size - 1) / EPG_CHUNK
                  val c0 = (first.coerceAtLeast(0) / EPG_CHUNK).coerceAtMost(maxChunk)
                  val c1 = (last.coerceAtLeast(first).coerceAtMost(list.size - 1) / EPG_CHUNK).coerceAtLeast(c0)
                  val order = ArrayList<Int>()
                  for (c in c0..c1) order.add(c)
                  if (c1 + 1 <= maxChunk) order.add(c1 + 1)
                  if (c0 - 1 >= 0) order.add(c0 - 1)

                  val key = order.joinToString(",") + "/" + list.size + "/" + (list.firstOrNull()?.id ?: "") + "/" + epgTick
                  if (key == epgKey && epgJob?.isActive == true) return
                  epgKey = key

                  epgJob?.cancel()
                  val snapshot = list
                  epgJob = viewModelScope.launch {
                      delay(350)
                      for (c in order) {
                          val part = snapshot.drop(c * EPG_CHUNK).take(EPG_CHUNK)
                          coroutineScope {
                              part.forEach { ch ->
                                  launch {
                                      ensureEpg(ch.id, 0)
                                      ensureEpg(ch.id, 1)
                                  }
                              }
                          }
                      }
                  }
              }

              suspend fun ensureEpg(id: String, offset: Int) {
                  val k = "$id:$offset"
                  val t = epgAt[k] ?: 0L
                  val today = istDay()
                  if (System.currentTimeMillis() - t < EPG_TTL_MS && epgDay[k] == today) return
                  if (!inflight.add(k)) return
                  try {
                      val l = epgGate.withPermit {
                          withContext(Dispatchers.IO) {
                              try {
                                  EpgApi.fetch(id, offset)
                              } catch (e: CancellationException) {
                                  throw e
                              } catch (e: Exception) {
                                  null
                              }
                          }
                      }
                      if (l != null) {
                          epg[k] = l
                          epgAt[k] = System.currentTimeMillis()
                      } else {
                          epgAt[k] = System.currentTimeMillis() - EPG_TTL_MS + 60_000L
                      }
                      epgDay[k] = today
                  } finally {
                      inflight.remove(k)
                  }
              }

              fun nowNext(ch: Channel): Pair<Program?, Program?> {
                  val tl = fullTimeline(ch)
                  val i = tl.indexOfFirst { now >= it.start && now < it.stop }
                  if (i >= 0) return Pair(tl[i], tl.getOrNull(i + 1))
                  return Pair(null, tl.firstOrNull { it.start > now })
              }

              /** How many day offsets (0 until n) this channel's home row currently shows. Starts at 2 (today + tomorrow). */
              fun daysLoaded(id: String): Int = epgDays[id] ?: 2

              fun loadMoreDays(id: String) {
                  val d = daysLoaded(id)
                  if (d > MAX_DAY_OFFSET) return
                  val prev = epg["$id:${d - 1}"]
                  if (prev == null) {
                      if (d >= 3) viewModelScope.launch { ensureEpg(id, d - 1) }
                      return
                  }
                  if (prev.isEmpty()) return
                  epgDays[id] = d + 1
                  viewModelScope.launch { ensureEpg(id, d) }
              }

              fun upcoming(ch: Channel): List<Program> {
                  val days = daysLoaded(ch.id)
                  val out = ArrayList<Program>()
                  for (o in 0 until days) {
                      epg["${ch.id}:$o"]?.let { out.addAll(it) }
                  }
                  return out.filter { it.stop > now }.distinctBy { it.start }.sortedBy { it.start }
              }

              private val tlCache = HashMap<String, Pair<Int, List<Program>>>()

              /** Clean, non-overlapping schedule of a channel (all loaded days). Cached until the channel's EPG data changes. */
              fun fullTimeline(ch: Channel): List<Program> {
                  val days = daysLoaded(ch.id)
                  var sig = days
                  val lists = ArrayList<List<Program>>()
                  for (o in 0 until days) {
                      val l = epg["${ch.id}:$o"]
                      sig = sig * 31 + (if (l == null) 0 else System.identityHashCode(l))
                      if (l != null) lists.add(l)
                  }
                  val c = tlCache[ch.id]
                  if (c != null && c.first == sig) return c.second
                  val res = normalizeEpg(lists.flatten())
                  tlCache[ch.id] = Pair(sig, res)
                  return res
              }

              fun timeline(ch: Channel, from: Long): List<Program> = fullTimeline(ch).filter { it.stop > from }

              /* ------------------------------------------------------------- channels */

              fun filter(g: String): List<Channel> = when (g) {
                  G_ALL -> channels
                  G_FAV -> channels.filter { it.id in favorites }
                  G_RECENT -> recents.mapNotNull { id -> channels.firstOrNull { it.id == id } }
                  else -> channels.filter { it.category == g }
              }

              fun search(q: String): List<Channel> {
                  val s = q.trim().lowercase()
                  if (s.length < 2) return emptyList()
                  return channels.filter {
                      it.name.lowercase().contains(s) ||
                          it.category.lowercase().contains(s) ||
                          (nowNext(it).first?.title?.lowercase()?.contains(s) == true)
                  }.take(200)
              }

              fun toggleFav(ch: Channel) {
                  favorites = if (ch.id in favorites) favorites - ch.id else favorites + ch.id
                  store.saveFavorites(favorites)
              }

              /* -------------------------------------------------------------- playback */

              fun play(ch: Channel, list: List<Channel>, record: Boolean = true) {
                  if (current?.id != ch.id) previous = current
                  current = ch
                  focused = ch
                  zapList = list
                  if (record) {
                      store.lastChannel = ch.id
                      recents = (listOf(ch.id) + recents.filter { it != ch.id }).take(30)
                      store.saveRecents(recents)
                  }
                  playNonce++
              }

              fun openFullscreen() {
                  menuLevel = 0
                  fullscreen = true
              }

              fun zap(d: Int) {
                  val l = zapList
                  if (l.isEmpty()) return
                  val i = l.indexOfFirst { it.id == current?.id }
                  play(l[(i + d + l.size).mod(l.size)], l)
              }

              fun recall() {
                  previous?.let { play(it, zapList) }
              }

              /* -------------------------------------------------------------- settings */

              fun setUa(v: String) {
                  userAgent = v
                  store.userAgent = v
              }

              fun updateExtraHeaders(v: String) {
                  extraHeaders = v
                  store.extraHeaders = v
              }

              fun setResume(v: Boolean) {
                  resumeLast = v
                  store.resumeLast = v
              }

              fun updateRows(v: Int) {
                  rows = v.coerceIn(MIN_ROWS, MAX_ROWS)
                  store.rows = rows
              }

              fun updateHeader(v: Int) {
                  headerPct = v.coerceIn(70, 110)
                  store.headerPct = headerPct
              }

              fun updateAspect(v: Int) {
                  aspect = v
                  store.aspect = v
              }
          }
