name: Build StreamBox APK

# StreamBox - a TiviMate-inspired IPTV / M3U8 player for Android (phone + Android TV).
# This single workflow generates the whole Android project, builds it and uploads the APKs.
# Usage: put this file at .github/workflows/build.yml -> push -> Actions tab -> download "StreamBox-APK".

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate project files
        run: |
          set -e
          rm -rf StreamBoxApp
          mkdir -p StreamBoxApp
          cd StreamBoxApp
          cat > settings.gradle.kts <<'__SB_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StreamBox"
          include(":app")
          __SB_EOF__

          cat > build.gradle.kts <<'__SB_EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          __SB_EOF__

          cat > gradle.properties <<'__SB_EOF__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.daemon=false
          __SB_EOF__

          mkdir -p app
          cat > app/build.gradle.kts <<'__SB_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.streambox.player"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.streambox.player"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // signed with the debug key so the release APK is directly installable
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.media3.common.util.UnstableApi",
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi"
                  )
              }
              buildFeatures { compose = true }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")

              val media3 = "1.4.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-exoplayer-dash:$media3")
              implementation("androidx.media3:media3-ui:$media3")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-datasource-okhttp:$media3")
          }
          __SB_EOF__

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__SB_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="StreamBox"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.StreamBox">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboard|keyboardHidden|navigation|uiMode|density|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:mimeType="application/vnd.apple.mpegurl" />
                          <data android:mimeType="application/x-mpegurl" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __SB_EOF__

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'__SB_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.StreamBox" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          __SB_EOF__

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'__SB_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0E1117" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#4C9AFF" android:pathData="M30,34h48a6,6 0 0 1 6,6v28a6,6 0 0 1 -6,6h-48a6,6 0 0 1 -6,-6v-28a6,6 0 0 1 6,-6z" />
              <path android:fillColor="#0E1117" android:pathData="M48,44l18,10l-18,10z" />
          </vector>
          __SB_EOF__

          mkdir -p app/src/main/java/com/streambox/player
          cat > app/src/main/java/com/streambox/player/Models.kt <<'__SB_EOF__'
          package com.streambox.player

          import android.content.Context
          import android.util.Xml
          import org.json.JSONArray
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.BufferedInputStream
          import java.io.File
          import java.io.IOException
          import java.io.InputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLDecoder
          import java.text.SimpleDateFormat
          import java.util.HashSet
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.GZIPInputStream

          const val DEFAULT_UA = "VLC/3.0.20 LibVLC/3.0.20"

          data class Channel(
              val num: Int,
              val name: String,
              val url: String,
              val logo: String,
              val group: String,
              val tvgId: String,
              val ua: String = "",
              val referer: String = "",
              val drmType: String = "",
              val drmKey: String = "",
              val mime: String = "",
              val headers: Map<String, String> = emptyMap()
          )

          /** Kodi style header strings ("A=b&C=d", values may be url-encoded). */
          fun decodeHv(v: String): String =
              if (v.contains('%')) {
                  try { URLDecoder.decode(v.replace("+", "%2B"), "UTF-8") } catch (e: Exception) { v }
              } else v

          /** "Name: value" or "Name=value", one per line. */
          fun parseHeaderLines(s: String): Map<String, String> {
              val m = LinkedHashMap<String, String>()
              s.lines().forEach { raw ->
                  val l = raw.trim()
                  if (l.isEmpty() || l.startsWith("#")) return@forEach
                  val c = l.indexOf(':')
                  val e = l.indexOf('=')
                  val i = if (c < 0) e else if (e < 0) c else minOf(c, e)
                  if (i > 0) m[l.substring(0, i).trim()] = l.substring(i + 1).trim()
              }
              return m
          }

          fun parseHeaderString(s: String): Map<String, String> {
              val m = LinkedHashMap<String, String>()
              s.split('&').forEach { p ->
                  val i = p.indexOf('=')
                  if (i > 0) m[p.substring(0, i).trim()] = decodeHv(p.substring(i + 1).trim())
              }
              return m
          }

          data class Playlist(
              val id: String,
              val name: String,
              val source: String,
              val isFile: Boolean,
              val epg: String = "",
              val updated: Long = 0L
          )

          data class Program(val start: Long, val stop: Long, val title: String, val desc: String)

          class EpgData(val byId: Map<String, List<Program>>, val nameToId: Map<String, String>) {
              companion object {
                  val EMPTY = EpgData(emptyMap(), emptyMap())
              }
          }

          data class Parsed(val channels: List<Channel>, val epgUrl: String)

          /* ---------------------------------------------------------------- storage */

          class Store(private val ctx: Context) {
              private val sp = ctx.getSharedPreferences("streambox", Context.MODE_PRIVATE)

              fun playlists(): List<Playlist> = try {
                  val a = JSONArray(sp.getString("playlists", "[]"))
                  (0 until a.length()).map { i ->
                      val o = a.getJSONObject(i)
                      Playlist(
                          o.getString("id"), o.optString("name"), o.optString("source"),
                          o.optBoolean("file"), o.optString("epg"), o.optLong("updated")
                      )
                  }
              } catch (e: Exception) {
                  emptyList()
              }

              fun savePlaylists(l: List<Playlist>) {
                  val a = JSONArray()
                  l.forEach {
                      a.put(
                          JSONObject().put("id", it.id).put("name", it.name).put("source", it.source)
                              .put("file", it.isFile).put("epg", it.epg).put("updated", it.updated)
                      )
                  }
                  sp.edit().putString("playlists", a.toString()).apply()
              }

              var activeId: String
                  get() = sp.getString("active", "") ?: ""
                  set(v) { sp.edit().putString("active", v).apply() }

              var userAgent: String
                  get() = sp.getString("ua", DEFAULT_UA) ?: DEFAULT_UA
                  set(v) { sp.edit().putString("ua", v).apply() }

              var extraHeaders: String
                  get() = sp.getString("xh", "") ?: ""
                  set(v) { sp.edit().putString("xh", v).apply() }

              var autoRefresh: Boolean
                  get() = sp.getBoolean("autoRefresh", true)
                  set(v) { sp.edit().putBoolean("autoRefresh", v).apply() }

              var resumeLast: Boolean
                  get() = sp.getBoolean("resumeLast", false)
                  set(v) { sp.edit().putBoolean("resumeLast", v).apply() }

              var lastChannel: String
                  get() = sp.getString("lastChannel", "") ?: ""
                  set(v) { sp.edit().putString("lastChannel", v).apply() }

              var aspect: Int
                  get() = sp.getInt("aspect", 0)
                  set(v) { sp.edit().putInt("aspect", v).apply() }

              fun favorites(): Set<String> = sp.getStringSet("fav", emptySet())?.toSet() ?: emptySet()
              fun saveFavorites(s: Set<String>) {
                  sp.edit().putStringSet("fav", HashSet(s)).apply()
              }

              fun recents(): List<String> = try {
                  val a = JSONArray(sp.getString("recents", "[]"))
                  (0 until a.length()).map { a.getString(it) }
              } catch (e: Exception) {
                  emptyList()
              }

              fun saveRecents(l: List<String>) {
                  val a = JSONArray()
                  l.forEach { a.put(it) }
                  sp.edit().putString("recents", a.toString()).apply()
              }

              fun file(id: String) = File(ctx.filesDir, "pl_$id.m3u")
              fun epgFile(id: String) = File(ctx.filesDir, "epg_$id.xml")
          }

          /* ------------------------------------------------------------- networking */

          object Net {
              fun open(url: String, ua: String): InputStream {
                  var u = url.trim()
                  for (i in 0 until 6) {
                      val c = URL(u).openConnection() as HttpURLConnection
                      c.connectTimeout = 15000
                      c.readTimeout = 30000
                      c.instanceFollowRedirects = false
                      c.setRequestProperty("User-Agent", ua)
                      c.setRequestProperty("Accept-Encoding", "identity")
                      val code = c.responseCode
                      if (code in 300..399) {
                          val loc = c.getHeaderField("Location") ?: throw IOException("Bad redirect")
                          u = URL(URL(u), loc).toString()
                          c.disconnect()
                          continue
                      }
                      if (code !in 200..299) throw IOException("HTTP $code")
                      return c.inputStream
                  }
                  throw IOException("Too many redirects")
              }

              /** Transparently un-gzips a stream when the gzip magic bytes are present. */
              fun sniff(input: InputStream): InputStream {
                  val b = BufferedInputStream(input, 16384)
                  b.mark(2)
                  val a = b.read()
                  val c = b.read()
                  b.reset()
                  return if (a == 0x1f && c == 0x8b) GZIPInputStream(b) else b
              }

              fun download(url: String, ua: String, dest: File, validatePlaylist: Boolean = false) {
                  val tmp = File(dest.path + ".tmp")
                  try {
                      sniff(open(url, ua)).use { inp -> tmp.outputStream().use { inp.copyTo(it) } }
                      if (validatePlaylist) {
                          val head = tmp.inputStream().use {
                              val buf = ByteArray(4096)
                              val n = it.read(buf)
                              if (n > 0) String(buf, 0, n) else ""
                          }
                          if (!head.contains("#EXTM3U") && !head.contains("#EXTINF")) {
                              throw IOException("Not a valid M3U playlist")
                          }
                      }
                      if (dest.exists()) dest.delete()
                      if (!tmp.renameTo(dest)) throw IOException("Could not save file")
                  } finally {
                      if (tmp.exists()) tmp.delete()
                  }
              }
          }

          /* --------------------------------------------------------------- M3U parse */

          object M3uParser {
              private val attr = Regex("([A-Za-z0-9_-]+)=\"([^\"]*)\"")

              private fun attrs(line: String): Map<String, String> =
                  attr.findAll(line).associate { it.groupValues[1].lowercase() to it.groupValues[2] }

              fun parse(text: String): Parsed {
                  val out = ArrayList<Channel>()
                  var epg = ""
                  var name = ""
                  var logo = ""
                  var group = ""
                  var tvg = ""
                  var ua = ""
                  var ref = ""
                  var extGrp = ""
                  var dType = ""
                  var dKey = ""
                  var mime = ""
                  val hdr = LinkedHashMap<String, String>()
                  var pending = false
                  var n = 0

                  for (raw in text.lineSequence()) {
                      val line = raw.trim().trimStart('\uFEFF')
                      if (line.isEmpty()) continue
                      if (line.startsWith("#EXTM3U", true)) {
                          val m = attrs(line)
                          epg = (m["url-tvg"] ?: m["x-tvg-url"] ?: "").split(",").first().trim()
                      } else if (line.startsWith("#EXTINF", true)) {
                          val m = attrs(line)
                          val q = line.lastIndexOf('"')
                          val comma = line.indexOf(',', if (q > 0) q else 0)
                          name = if (comma >= 0) line.substring(comma + 1).trim() else ""
                          if (name.isEmpty()) name = m["tvg-name"] ?: "Channel"
                          logo = m["tvg-logo"] ?: ""
                          group = m["group-title"] ?: ""
                          tvg = m["tvg-id"] ?: ""
                          ua = ""
                          ref = ""
                          pending = true
                      } else if (line.startsWith("#EXTGRP:", true)) {
                          extGrp = line.substringAfter(':').trim()
                      } else if (line.startsWith("#KODIPROP:", true)) {
                          val kv = line.substringAfter(':')
                          val k = kv.substringBefore('=').trim().lowercase()
                          val v = kv.substringAfter('=', "").trim()
                          if (k == "inputstream.adaptive.license_type") dType = v
                          else if (k == "inputstream.adaptive.license_key") dKey = v
                          else if (k == "inputstream.adaptive.manifest_type") mime = v.lowercase()
                          else if (k == "inputstream.adaptive.stream_headers" || k == "inputstream.adaptive.manifest_headers") {
                              hdr.putAll(parseHeaderString(v))
                              v.split('&').forEach { p ->
                                  val hk = p.substringBefore('=').trim().lowercase()
                                  val hv = p.substringAfter('=', "").trim()
                                  if (hk == "user-agent") ua = hv
                                  if (hk == "referer" || hk == "referrer") ref = hv
                              }
                          }
                      } else if (line.startsWith("#EXTHTTP:", true)) {
                          try {
                              val jo = JSONObject(line.substringAfter(':').trim())
                              val it = jo.keys()
                              while (it.hasNext()) {
                                  val hk = it.next()
                                  hdr[hk] = jo.optString(hk)
                              }
                          } catch (e: Exception) {
                              // ignore malformed json
                          }
                      } else if (line.startsWith("#EXTVLCOPT:", true)) {
                          val kv = line.substringAfter(':')
                          val k = kv.substringBefore('=').lowercase()
                          val v = kv.substringAfter('=', "")
                          if (k == "http-user-agent") ua = v
                          if (k == "http-referrer" || k == "http-referer") ref = v
                          if (k == "http-cookie") hdr["Cookie"] = v
                      } else if (line.startsWith("#")) {
                          // other directives ignored
                      } else if (pending) {
                          var url = line
                          var u2 = ua
                          var r2 = ref
                          var dt = dType
                          var dk = dKey
                          val h2 = LinkedHashMap<String, String>(hdr)
                          val bar = line.indexOf('|')
                          if (bar > 0) {
                              url = line.substring(0, bar)
                              line.substring(bar + 1).split('&').forEach { p ->
                                  val k = p.substringBefore('=').lowercase()
                                  val v = p.substringAfter('=', "")
                                  if (k == "user-agent") u2 = v
                                  if (k == "referer" || k == "referrer") r2 = v
                                  if (k == "drmscheme") dt = v
                                  if (k == "drmlicense") dk = v
                                  if (k != "drmscheme" && k != "drmlicense" && p.contains('=')) {
                                      h2[p.substringBefore('=').trim()] = decodeHv(v)
                                  }
                              }
                          }
                          val g = group.ifBlank { extGrp }.ifBlank { "Uncategorized" }
                          n++
                          out.add(Channel(n, name, url, logo, g.trim(), tvg.trim(), u2, r2, dt, dk, mime, h2))
                          pending = false
                          extGrp = ""
                          dType = ""
                          dKey = ""
                          mime = ""
                          hdr.clear()
                      }
                  }
                  return Parsed(out, epg)
              }
          }

          /* -------------------------------------------------------------- XMLTV parse */

          object EpgParser {
              private val fmt = SimpleDateFormat("yyyyMMddHHmmss Z", Locale.US)

              private fun time(s: String?): Long {
                  if (s.isNullOrBlank()) return 0L
                  val t = s.trim()
                  return try {
                      if (t.length > 14) {
                          val zone = t.substring(14).trim().ifEmpty { "+0000" }
                          fmt.parse(t.substring(0, 14) + " " + zone)!!.time
                      } else {
                          val f = SimpleDateFormat("yyyyMMddHHmmss", Locale.US)
                          f.timeZone = TimeZone.getTimeZone("UTC")
                          f.parse(t)!!.time
                      }
                  } catch (e: Exception) {
                      0L
                  }
              }

              fun parse(input: InputStream, wantedIds: Set<String>, wantedNames: Set<String>, now: Long): EpgData {
                  val p = Xml.newPullParser()
                  p.setInput(input, null)
                  val byId = HashMap<String, MutableList<Program>>()
                  val nameToId = HashMap<String, String>()
                  val ids = HashSet<String>(wantedIds)
                  var curChan: String? = null
                  var ev = p.eventType
                  while (ev != XmlPullParser.END_DOCUMENT) {
                      if (ev == XmlPullParser.START_TAG) {
                          when (p.name) {
                              "channel" -> curChan = p.getAttributeValue(null, "id")?.lowercase()
                              "display-name" -> {
                                  val dn = p.nextText().trim().lowercase()
                                  val c = curChan
                                  if (c != null) {
                                      if (!nameToId.containsKey(dn)) nameToId[dn] = c
                                      if (dn in wantedNames) ids.add(c)
                                  }
                              }
                              "programme" -> {
                                  val ch = p.getAttributeValue(null, "channel")?.lowercase() ?: ""
                                  val st = time(p.getAttributeValue(null, "start"))
                                  val en = time(p.getAttributeValue(null, "stop"))
                                  var title = ""
                                  var desc = ""
                                  while (true) {
                                      val e = p.next()
                                      if (e == XmlPullParser.END_DOCUMENT) break
                                      if (e == XmlPullParser.END_TAG && p.name == "programme") break
                                      if (e == XmlPullParser.START_TAG) {
                                          if (p.name == "title" && title.isEmpty()) title = p.nextText().trim()
                                          else if (p.name == "desc" && desc.isEmpty()) desc = p.nextText().trim()
                                      }
                                  }
                                  if (ch in ids && en > now - 2 * 3_600_000L && st < now + 36 * 3_600_000L) {
                                      byId.getOrPut(ch) { ArrayList() }.add(Program(st, en, title, desc))
                                  }
                              }
                          }
                      } else if (ev == XmlPullParser.END_TAG && p.name == "channel") {
                          curChan = null
                      }
                      ev = p.next()
                  }
                  val sorted = HashMap<String, List<Program>>()
                  byId.forEach { (k, v) -> sorted[k] = v.sortedBy { it.start } }
                  return EpgData(sorted, nameToId)
              }
          }
          __SB_EOF__

          mkdir -p app/src/main/java/com/streambox/player
          cat > app/src/main/java/com/streambox/player/Vm.kt <<'__SB_EOF__'
          package com.streambox.player

          import android.app.Application
          import android.net.Uri
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.util.UUID

          const val G_ALL = "All channels"
          const val G_FAV = "Favorites"
          const val G_RECENT = "Recently watched"

          class MainVM(app: Application) : AndroidViewModel(app) {
              val store = Store(app)

              var playlists by mutableStateOf(store.playlists())
              var activeId by mutableStateOf(store.activeId)
              var channels by mutableStateOf<List<Channel>>(emptyList())
              var groups by mutableStateOf<List<String>>(emptyList())
              var epg by mutableStateOf(EpgData.EMPTY)
              var loading by mutableStateOf(false)
              var toast by mutableStateOf<String?>(null)
              var favorites by mutableStateOf(store.favorites())
              var recents by mutableStateOf(store.recents())
              var group by mutableStateOf(G_ALL)

              var userAgent by mutableStateOf(store.userAgent)
              var extraHeaders by mutableStateOf(store.extraHeaders)
              var autoRefresh by mutableStateOf(store.autoRefresh)
              var resumeLast by mutableStateOf(store.resumeLast)
              var aspect by mutableIntStateOf(store.aspect)

              var now by mutableLongStateOf(System.currentTimeMillis())
              var current by mutableStateOf<Channel?>(null)
              var previous by mutableStateOf<Channel?>(null)
              var zapList by mutableStateOf<List<Channel>>(emptyList())
              var fullscreen by mutableStateOf(false)
              var playNonce by mutableIntStateOf(0)
              var sleepAt by mutableLongStateOf(0L)

              private var resumed = false

              init {
                  if (activeId.isEmpty() || playlists.none { it.id == activeId }) {
                      activeId = playlists.firstOrNull()?.id ?: ""
                      store.activeId = activeId
                  }
                  viewModelScope.launch {
                      while (true) {
                          delay(30_000)
                          now = System.currentTimeMillis()
                      }
                  }
                  viewModelScope.launch {
                      loadLocal(false)
                      val pl = active()
                      if (pl != null && autoRefresh && !pl.isFile &&
                          System.currentTimeMillis() - pl.updated > 12 * 3_600_000L
