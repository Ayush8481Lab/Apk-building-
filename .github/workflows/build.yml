          /** Left panel entries: (tab, label, icon). */
          private val NAV = listOf(
              Triple(0, "TV", Icons.Filled.LiveTv),
              Triple(2, "Search", Icons.Filled.Search),
              Triple(3, "Settings", Icons.Filled.Settings)
