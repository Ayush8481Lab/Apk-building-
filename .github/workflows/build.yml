          /** Far-left panel (level 2): TV, Search, Settings. RIGHT moves into the categories panel. */
          @Composable
          fun NavPanel(vm: MainVM, navFr: FocusRequester, catFr: FocusRequester) {
              val shape = RoundedCornerShape(topEnd = 26.dp, bottomEnd = 26.dp)
              AnimatedVisibility(
                  visible = vm.menuLevel >= 2,
                  enter = expandHorizontally(tween(340, easing = FastOutSlowInEasing)) + fadeIn(tween(300)),
                  exit = shrinkHorizontally(tween(300, easing = FastOutSlowInEasing)) + fadeOut(tween(220))
              ) {
                  Column(
                      Modifier.width(if (isWide()) 210.dp else 140.dp).fillMaxHeight()
                          .clip(shape)
                          .background(Color(0xEB05070D))
                          .glass(shape, 0.08f)
                          .onPreviewKeyEvent { e ->
                              if (e.type == KeyEventType.KeyDown && e.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                                  try {
                                      catFr.requestFocus()
                                  } catch (x: Exception) {
                                  }
                                  true
                              } else {
                                  false
                              }
                          }
                          .padding(horizontal = 14.dp, vertical = 14.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      NAV.forEach { n ->
                          SideItem(
                              n.second, n.third, vm.tab == n.first,
                              if (n.first == vm.tab) Modifier.focusRequester(navFr) else Modifier
                          ) {
                              vm.tab = n.first
                              // TV -> show the categories next; Search / Settings -> open the page
                              vm.menuLevel = if (n.first == 0) 1 else 0
                          }
                      }
                  }
              }
          }

          /** Categories panel (level 1 and 2). LEFT opens the TV / Search / Settings panel, RIGHT / picking a category closes it. */
          @Composable
          fun CatPanel(vm: MainVM, navFr: FocusRequester, catFr: FocusRequester) {
              val all = listOf(G_ALL, G_FAV, G_RECENT) + vm.categories
              val focusCat = if (vm.tab == 0) vm.category else G_ALL
              val shape = RoundedCornerShape(topEnd = 26.dp, bottomEnd = 26.dp)
              AnimatedVisibility(
                  visible = vm.menuLevel >= 1,
                  enter = expandHorizontally(tween(340, easing = FastOutSlowInEasing)) + fadeIn(tween(300)),
                  exit = shrinkHorizontally(tween(300, easing = FastOutSlowInEasing)) + fadeOut(tween(220))
              ) {
                  Column(
                      Modifier.width(if (isWide()) 270.dp else 190.dp).fillMaxHeight()
                          .clip(shape)
                          .background(Color(0xEB05070D))
                          .glass(shape, 0.08f)
                          .onPreviewKeyEvent { e ->
                              val k = e.nativeKeyEvent.keyCode
                              if (e.type != KeyEventType.KeyDown) {
                                  false
                              } else if (k == KeyEvent.KEYCODE_DPAD_LEFT) {
                                  if (vm.menuLevel < 2) {
                                      vm.menuLevel = 2
                                  } else {
                                      try {
                                          navFr.requestFocus()
                                      } catch (x: Exception) {
                                      }
                                  }
                                  true
                              } else if (k == KeyEvent.KEYCODE_DPAD_RIGHT) {
                                  vm.menuLevel = 0
                                  true
                              } else {
                                  false
                              }
                          }
                  ) {
                      LazyColumn(
                          Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 14.dp, vertical = 14.dp),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          items(all) { g ->
                              SideItem(
                                  g, catIcon(g), vm.tab == 0 && vm.category == g,
                                  if (g == focusCat) Modifier.focusRequester(catFr) else Modifier
                              ) {
                                  vm.category = g
                                  vm.tab = 0
                                  vm.menuLevel = 0
                              }
                          }
                      }
                  }
              }
          }

          /* ======================================================== LIVE ROWS (EPG) */

          /**
           * Home rows. The free height under the preview is split into the number of rows chosen in Settings
           * (2..6, default 4); more rows appear while scrolling. No header: all the space goes to the rows.
           */
          @Composable
          fun LiveEpg(vm: MainVM, onPick: (Channel, List<Channel>) -> Unit) {
              val list = remember(vm.channels, vm.category, vm.favorites, vm.recents) { vm.filter(vm.category) }
              val state = rememberLazyListState()
              val fr = remember { FocusRequester() }
              val curIdx = list.indexOfFirst { it.id == vm.current?.id }
              val focusIdx = if (curIdx >= 0) curIdx else 0

              // chunked EPG: whatever is on screen first (7 channels per chunk), then neighbours; reacts to scrolling
              LaunchedEffect(list, vm.epgTick) {
                  snapshotFlow {
                      val v = state.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }

              // new category / screen appears: jump to the playing channel, header goes back to the playing channel
              LaunchedEffect(vm.category) {
                  vm.hover = null
                  state.scrollToItem(focusIdx)
              }

              // focus the playing channel on entering home, after the fullscreen player and after the menu closes
              LaunchedEffect(vm.category, vm.menuLevel) {
                  if (vm.menuLevel == 0) {
                      delay(300)
                      try {
                          fr.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }

              if (list.isEmpty()) {
                  Text("Nothing here yet", color = Dim, modifier = Modifier.padding(24.dp))
              }
              BoxWithConstraints(Modifier.fillMaxSize()) {
                  // the chosen number of rows (Settings, 2..6, default 4) shares the available height
                  val rowH = maxOf((maxHeight - 8.dp) / vm.rows, 56.dp)
                  LazyColumn(
                      state = state,
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(horizontal = 16.dp, vertical = 4.dp)
                  ) {
                      itemsIndexed(list, key = { _, c -> c.id }) { i, ch ->
                          ChannelRow(
                              vm, ch, ch.id == vm.current?.id, rowH,
                              if (i == focusIdx) Modifier.focusRequester(fr) else Modifier
                          ) { onPick(ch, list) }
                      }
                  }
              }
          }

          /**
           * One channel row: a rectangular channel tile followed by a sideways list of 16:9 programme cards.
           * LEFT on the tile slides the categories panel in. Scrolling the cards towards their end loads the next
           * day from the EPG (offset 2, 3 ... up to 10).
           */
          @Composable
          fun ChannelRow(
              vm: MainVM,
              ch: Channel,
              selected: Boolean,
              rowH: Dp,
              focusMod: Modifier,
              onPick: () -> Unit
          ) {
              val wide = isWide()
              // a little extra headroom so a focused (zoomed) card is not clipped by its row
              val cellH = rowH - 18.dp
              val tileW = if (wide) 150.dp else 104.dp
              val progs = vm.upcoming(ch)
              val days = vm.daysLoaded(ch.id)
              val fav = ch.id in vm.favorites
              val rowState = rememberLazyListState()

              // side scroll: close to the last programme -> ask for one more day (restarts after every change)
              LaunchedEffect(ch.id, progs.size, days, vm.epgTick) {
                  snapshotFlow { rowState.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0 }
                      .collect { last ->
                          if (progs.isNotEmpty() && last >= progs.size - 4) vm.loadMoreDays(ch.id)
                      }
              }

              Row(
                  Modifier.fillMaxWidth().height(rowH),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.padding(start = 4.dp).width(tileW).height(cellH)
                          .onPreviewKeyEvent { e ->
                              if (e.type == KeyEventType.KeyDown && e.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_LEFT) {
                                  if (vm.menuLevel == 0) vm.menuLevel = 1
                                  true
                              } else {
                                  false
                              }
                          }
                          .then(focusMod)
                          .focusGlow(
                              corner = 14.dp, focusScale = 1.05f,
                              onFocusChange = { f -> if (f) vm.hover = null },
                              onLongClick = { vm.toggleFav(ch) }, onClick = onPick
                          )
                          .glass(RoundedCornerShape(14.dp), if (selected) 0.26f else 0.10f, if (selected) Accent else Color.White),
                      contentAlignment = Alignment.Center
                  ) {
                      var loaded by remember(ch.logo) { mutableStateOf(false) }
                      if (ch.logo.isNotBlank()) {
                          AsyncImage(
                              model = ch.logo, contentDescription = ch.name, contentScale = ContentScale.Fit,
                              onSuccess = { loaded = true },
                              modifier = Modifier.fillMaxSize().padding(8.dp)
                          )
                      }
                      if (!loaded) {
                          Text(
                              ch.name, fontSize = 12.sp, fontWeight = FontWeight.SemiBold,
                              textAlign = TextAlign.Center, maxLines = 2, overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.padding(8.dp)
                          )
                      }
                      if (selected) {
                          Icon(
                              Icons.Filled.PlayArrow, null, tint = Accent,
                              modifier = Modifier.align(Alignment.TopStart).padding(4.dp).size(16.dp)
                          )
                      }
                      if (fav) {
                          Icon(
                              Icons.Filled.Star, null, tint = Color(0xFFFFC107),
                              modifier = Modifier.align(Alignment.TopEnd).padding(4.dp).size(14.dp)
                          )
                      }
                  }
                  LazyRow(
                      state = rowState,
                      modifier = Modifier.weight(1f).fillMaxHeight(),
                      contentPadding = PaddingValues(start = 10.dp, end = 60.dp, top = 6.dp, bottom = 6.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      if (progs.isEmpty()) {
                          item {
                              Column(
                                  Modifier.width(190.dp).height(cellH)
                                      .glass(RoundedCornerShape(14.dp), 0.06f)
                                      .padding(12.dp),
                                  verticalArrangement = Arrangement.Center
                              ) {
                                  Text("No schedule available", color = Dim, fontSize = 13.sp)
                                  Text(ch.category, color = Dim.copy(alpha = 0.6f), fontSize = 11.sp)
                              }
                          }
                      } else {
                          items(progs, key = { it.start }) { p -> ProgCell(vm, ch, p, cellH, onPick) }
                      }
                  }
              }
          }

          /**
           * One programme: a 16:9 card whose banner fills the whole card. It never expands: when focused it only
           * glows and pops (zoom); its name / time / description appear in the header above instead.
           *  - live programme: no tag, just a progress bar along the bottom of the banner;
           *  - upcoming programme: white start time, 12-hour clock with am / pm, top-left of the banner;
           *  - title along the bottom edge.
           */
          @Composable
          fun ProgCell(vm: MainVM, ch: Channel, p: Program, cellH: Dp, onClick: () -> Unit) {
              val live = vm.now >= p.start && vm.now < p.stop
              val bw = cellH * (16f / 9f)
              val shape = RoundedCornerShape(14.dp)
              Box(
                  Modifier.width(bw).height(cellH)
                      .focusGlow(
                          corner = 14.dp, focusScale = 1.135f,
                          onFocusChange = { f -> if (f) vm.hover = Pair(ch, p) },
                          onClick = onClick
                      )
                      .glass(shape, if (live) 0.18f else 0.09f, if (live) Accent else Color.White)
              ) {
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.linearGradient(
                              listOf(hashColor(p.title).copy(alpha = 0.35f), Accent2.copy(alpha = 0.15f))
                          )
                      )
                  ) {
                      Banner(bannerUrl(p), Modifier.fillMaxSize())
                      // bottom scrim for the title
                      Box(
                          Modifier.fillMaxSize().background(
                              Brush.verticalGradient(0.4f to Color.Transparent, 1f to Color(0xCC05070D))
                          )
                      )
                      // upcoming programmes only: white start time, 12 hour with am / pm. Live card shows no tag.
                      if (!live) {
                          Text(
                              hm12(p.start), color = Color.White, fontSize = 10.sp,
                              fontWeight = FontWeight.SemiBold, maxLines = 1,
                              modifier = Modifier.align(Alignment.TopStart).padding(5.dp)
                                  .clip(RoundedCornerShape(6.dp))
                                  .background(Color.Black.copy(alpha = 0.55f))
                                  .padding(horizontal = 5.dp, vertical = 1.dp)
                          )
                      }
                      Text(
                          p.title, color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.SemiBold,
                          maxLines = 1, overflow = TextOverflow.Ellipsis,
                          modifier = Modifier.align(Alignment.BottomStart).fillMaxWidth()
                              .padding(start = 6.dp, end = 6.dp, bottom = if (live) 6.dp else 4.dp)
                      )
                      if (live) {
                          LinearProgressIndicator(
                              progress = { progressOf(p, vm.now) },
                              modifier = Modifier.align(Alignment.BottomStart).fillMaxWidth().height(3.dp),
                              color = Accent, trackColor = Color.Black.copy(alpha = 0.45f)
                          )
                      }
                  }
              }
          }

          private val HM12 = SimpleDateFormat("h:mm a", Locale.ENGLISH)

          /** 12-hour clock with am / pm written, e.g. "7:30 pm". */
          fun hm12(ms: Long): String = HM12.format(Date(ms)).lowercase()

          /* ============================================================== SEARCH */

          @Composable
          fun ChannelGrid(
              vm: MainVM,
              list: List<Channel>,
              modifier: Modifier,
              onOpen: (Channel, List<Channel>) -> Unit
          ) {
              val wide = isWide()
              val gs = rememberLazyGridState()
              LaunchedEffect(list, vm.epgTick) {
                  snapshotFlow {
                      val v = gs.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }
              LazyVerticalGrid(
                  state = gs,
                  columns = GridCells.Adaptive(if (wide) 230.dp else 160.dp),
                  contentPadding = PaddingValues(horizontal = 22.dp, vertical = 18.dp),
                  horizontalArrangement = Arrangement.spacedBy(18.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp),
                  modifier = modifier.fillMaxWidth()
              ) {
                  items(list, key = { it.id }) { ch ->
                      ChannelCard(vm, ch) { onOpen(ch, list) }
                  }
              }
          }

          @Composable
          fun ChannelCard(vm: MainVM, ch: Channel, onOpen: () -> Unit) {
              val np = vm.nowNext(ch).first
              val fav = ch.id in vm.favorites
              val url = if (np != null) bannerUrl(np) else ""
              Column(
                  Modifier.fillMaxWidth()
                      .focusGlow(
                          corner = 22.dp, focusScale = 1.08f,
                          onFocused = { vm.focused = ch },
                          onLongClick = { vm.toggleFav(ch) },
                          onClick = onOpen
                      )
                      .glass(RoundedCornerShape(22.dp), 0.10f)
              ) {
                  Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f)) {
                      if (url.isNotBlank()) {
                          Banner(url, Modifier.fillMaxSize())
                      } else {
                          Box(
                              Modifier.fillMaxSize().background(
                                  Brush.linearGradient(listOf(Accent.copy(alpha = 0.22f), Accent2.copy(alpha = 0.12f)))
                              )
                          )
                      }
                      Box(
                          Modifier.fillMaxSize().background(
                              Brush.verticalGradient(listOf(Color.Transparent, Color(0xAA05070D)))
                          )
                      )
                      Box(Modifier.align(Alignment.BottomStart).padding(8.dp)) { Logo(ch, 36.dp) }
                      if (fav) {
                          Icon(
                              Icons.Filled.Star, "Favorite", tint = Color(0xFFFFC107),
                              modifier = Modifier.align(Alignment.TopEnd).padding(8.dp).size(20.dp)
                          )
                      }
                  }
                  Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      Text(ch.name, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(
                          np?.title ?: ch.category, fontSize = 12.sp, color = Dim,
                          maxLines = 1, overflow = TextOverflow.Ellipsis
                      )
                      if (np != null) {
                          LinearProgressIndicator(
                              progress = { progressOf(np, vm.now) },
                              modifier = Modifier.fillMaxWidth().padding(top = 3.dp).height(3.dp),
                              color = Accent, trackColor = Color.White.copy(alpha = 0.15f)
                          )
                      }
                  }
              }
          }

          @Composable
          fun SearchTab(vm: MainVM, onOpen: (Channel, List<Channel>) -> Unit) {
              var q by rememberSaveable { mutableStateOf("") }
              val res = vm.search(q)
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
                      placeholder = { Text("Search channels, categories, programmes", color = Dim) },
                      leadingIcon = { Icon(Icons.Filled.Search, null, tint = Dim) },
                      colors = glassFieldColors(),
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 22.dp, vertical = 12.dp)
                  )
                  ChannelGrid(vm, res, Modifier.weight(1f), onOpen)
              }
          }

          /* ============================================================= SETTINGS */

          @Composable
          fun Section(title: String, content: @Composable () -> Unit) {
              Column(
                  Modifier.fillMaxWidth().glass(RoundedCornerShape(26.dp), 0.09f).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text(title, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                  content()
              }
          }

          @Composable
          fun SettingsTab(vm: MainVM) {
              val mins = if (vm.expire > 0) ((vm.expire * 1000 - (vm.now + Http.jar.skew)) / 60_000L).coerceAtLeast(0) else -1L
              val t = vm.token
              val masked = "*".repeat((t.length - 4).coerceAtLeast(0)) + t.takeLast(4)
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(22.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Section("Account") {
                      Text("Access token: $masked", color = Dim)
                      Text("${vm.channels.size} channels", color = Dim)
                      GlassButton("Change access token", icon = Icons.Filled.Lock) { vm.logout() }
                  }
                  Section("Session") {
                      Text(
                          if (mins >= 0) "Keys and stream links expire in about $mins min" else "Expiry unknown",
                          color = Dim
                      )
                      Text("Reloaded automatically 10 minutes before expiry.", color = Dim, fontSize = 12.sp)
                      GlassButton("Refresh now", icon = Icons.Filled.Refresh) { vm.refresh() }
                  }
                  Section("Home screen") {
                      Text("Number of channel rows shown under the preview (2 - 6, default 4)", color = Dim)
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          (MIN_ROWS..MAX_ROWS).forEach { n ->
                              GlassPill("$n", vm.rows == n) { vm.updateRows(n) }
                          }
                      }
                  }
                  Section("Player") {
                      OutlinedTextField(
                          value = vm.userAgent, onValueChange = { vm.setUa(it) }, singleLine = true,
                          label = { Text("Stream User-Agent") }, colors = glassFieldColors(),
                          shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()
                      )
                      OutlinedTextField(
                          value = vm.extraHeaders, onValueChange = { vm.updateExtraHeaders(it) },
                          label = { Text("Extra headers (Name: value, one per line)") },
                          minLines = 3, colors = glassFieldColors(),
                          shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()
                      )
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Resume last channel fullscreen on launch", Modifier.weight(1f))
                          Switch(checked = vm.resumeLast, onCheckedChange = { vm.setResume(it) })
                      }
                  }
                  Text(
                      "Menu: Back (or LEFT on a channel logo) slides the categories in, Back again adds TV / Search / Settings. " +
                          "TV opens the categories, picking a category (or RIGHT) hides the menu again. " +
                          "Long-press Back (or press OK on the playing channel / preview) for fullscreen. " +
                          "Long-press (or hold OK) on a channel to add it to Favorites. " +
                          "Move over a programme card to read its details in the header; scroll a row sideways to load up to 10 days. " +
                          "EPG is cached for 30 minutes.\n\n" +
