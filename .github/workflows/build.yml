                                          Modifier.width(150.dp).aspectRatio(16f / 9f).clip(RoundedCornerShape(14.dp))
                                              .background(Color.White.copy(alpha = 0.08f))
                                      ) { Banner(bannerUrl(now), Modifier.fillMaxSize()) }
                                  } else {
