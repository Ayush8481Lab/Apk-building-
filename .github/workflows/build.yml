                      HorizontalDivider()
                  }

                  Text("Player", fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                  OutlinedTextField(
                      value = vm.userAgent, onValueChange = { vm.setUa(it) }, singleLine = true,
                      label = { Text("User-Agent") }, modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = vm.extraHeaders, onValueChange = { vm.updateExtraHeaders(it) },
                      label = { Text("Extra headers for all streams (Name: value, one per line)") },
                      minLines = 3, modifier = Modifier.fillMaxWidth()
                  )
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Auto refresh playlist and EPG every 12h", Modifier.weight(1f))
                      Switch(checked = vm.autoRefresh, onCheckedChange = { vm.updateAutoRefresh(it) })
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Resume last channel on launch", Modifier.weight(1f))
                      Switch(checked = vm.resumeLast, onCheckedChange = { vm.setResume(it) })
                  }
                  Text(
                      "StreamBox does not provide any channels or content. Add only playlists you are allowed to use.",
                      fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
              }
          }
