                  GuideGrid(vm, Modifier.weight(1f).fillMaxWidth(), details = true, translucent = true)
              }
          }

          @Composable
          fun FullOverlay(vm: MainVM, pc: PlayerController) {
              val ch = vm.current ?: return
              val nn = vm.nowNext(ch)
              val np = nn.first
              val nx = nn.second
              Box(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(horizontal = 24.dp, vertical = 16.dp)) {
                      Text(ch.group, color = Color.White, fontSize = 22.sp)
                      Spacer(Modifier.weight(1f))
                      Text(dateTime(vm.now), color = Color.White, fontSize = 22.sp)
                  }
                  Column(
                      Modifier.align(Alignment.BottomCenter).fillMaxWidth()
                          .background(Brush.verticalGradient(listOf(Color.Transparent, Color(0xE8000000))))
                  ) {
                      Spacer(Modifier.height(50.dp))
                      Row(Modifier.padding(horizontal = 60.dp), verticalAlignment = Alignment.CenterVertically) {
                          Logo(ch, 180.dp, 90.dp)
                          Spacer(Modifier.width(26.dp))
                          Column {
                              Text(np?.title ?: ch.name, color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Spacer(Modifier.height(4.dp))
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  if (np != null) {
                                      Text(range(np), color = TextDim, fontSize = 20.sp)
                                      Spacer(Modifier.width(14.dp))
                                      MiniBar(progressOf(np, vm.now))
                                      Spacer(Modifier.width(14.dp))
                                      Text(minsText(np, vm.now), color = TextDim, fontSize = 20.sp)
                                      Spacer(Modifier.width(22.dp))
                                  }
                                  if (ch.num > 0) Text("${ch.num}  ", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                  Text(ch.name, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.width(14.dp))
                                  if (pc.vh > 0) Badge(if (pc.vh >= 2160) "4K" else if (pc.vh >= 720) "HD" else "SD")
                                  if (pc.fps > 0) Badge("${pc.fps} FPS")
                                  if (pc.ach > 0) Badge(if (pc.ach == 1) "MONO" else if (pc.ach == 2) "STEREO" else if (pc.ach == 6) "5.1" else "${pc.ach}CH")
                              }
                              if (nx != null) {
                                  Spacer(Modifier.height(2.dp))
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text(range(nx), color = TextDim, fontSize = 20.sp)
                                      Spacer(Modifier.width(14.dp))
                                      Text(nx.title, color = Color(0xFFB8B8B8), fontSize = 22.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                              }
                          }
                      }
                      Spacer(Modifier.height(14.dp))
                      SeekLine(if (np != null) progressOf(np, vm.now) else 0f, Modifier.padding(horizontal = 59.dp))
                      Spacer(Modifier.height(14.dp))
                      if (vm.fbar == 2) ButtonRow(vm)
                      else Box(Modifier.fillMaxWidth().height(60.dp), contentAlignment = Alignment.Center) {
                          Icon(Icons.Filled.KeyboardArrowDown, null, tint = TextDim, modifier = Modifier.size(34.dp))
                      }
                  }
              }
          }

