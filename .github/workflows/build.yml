          import androidx.compose.material3.Surface
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.core.app.PictureInPictureModeChangedInfo
          import androidx.core.util.Consumer

          class MainActivity : ComponentActivity() {
              private val vm: MainVM by viewModels()
              private lateinit var pc: PlayerController

              var inPip by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  super.onCreate(savedInstanceState)
                  pc = PlayerController(this)

                  addOnPictureInPictureModeChangedListener(Consumer<PictureInPictureModeChangedInfo> { info ->
                      inPip = info.isInPictureInPictureMode
                  })

                  setContent {
                      AppTheme {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              AppRoot(vm, pc, this@MainActivity)
                          }
                      }
                  }
                  handleIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIntent(intent)
              }

              private fun handleIntent(i: Intent?) {
                  if (i?.action == Intent.ACTION_VIEW) {
                      i.data?.toString()?.let { vm.quickPlay(it) }
                  }
              }

              fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          enterPictureInPictureMode(
                              PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                          )
                      } catch (e: Exception) {
                          // device without PiP support
                      }
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (vm.fullscreen && pc.player.isPlaying) enterPip()
              }

              override fun onStart() {
                  super.onStart()
                  // resume after having been stopped in the background
                  if (vm.fullscreen && vm.current != null) vm.playNonce++
              }

              override fun onStop() {
                  super.onStop()
                  pc.stop()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (isFinishing) pc.release()
              }
          }
          __SB_EOF__

      - name: Build debug APK
        working-directory: StreamBoxApp
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: StreamBoxApp
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp StreamBoxApp/app/build/outputs/apk/debug/app-debug.apk out/StreamBox-debug.apk
          cp StreamBoxApp/app/build/outputs/apk/release/app-release.apk out/StreamBox-release.apk || true
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamBox-APK
          path: out/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StreamBox build ${{ github.run_number }}
          files: out/*.apk
