          package com.streambox.player

          import android.view.KeyEvent

          private var okLong = false

          private fun guideKey(vm: MainVM, k: Int): Boolean {
              when (k) {
                  KeyEvent.KEYCODE_DPAD_UP -> vm.moveRow(-1)
                  KeyEvent.KEYCODE_DPAD_DOWN -> vm.moveRow(1)
                  KeyEvent.KEYCODE_CHANNEL_UP, KeyEvent.KEYCODE_PAGE_UP -> vm.moveRow(-7)
                  KeyEvent.KEYCODE_CHANNEL_DOWN, KeyEvent.KEYCODE_PAGE_DOWN -> vm.moveRow(7)
                  KeyEvent.KEYCODE_DPAD_RIGHT -> vm.moveProg(1)
                  KeyEvent.KEYCODE_DPAD_LEFT -> {
                      if (!vm.moveProg(-1)) {
                          if (vm.guideOverlay) {
                              val n = vm.cats().size
                              vm.setCat((vm.catIdx - 1 + n) % n)
                          } else vm.pane = 1
                      }
                  }
                  else -> return false
              }
              return true
          }

          private fun homeKey(vm: MainVM, k: Int): Boolean {
              when (vm.pane) {
                  0 -> when (k) {
                      KeyEvent.KEYCODE_DPAD_UP -> vm.side = (vm.side - 1).coerceAtLeast(0)
                      KeyEvent.KEYCODE_DPAD_DOWN -> vm.side = (vm.side + 1).coerceAtMost(4)
                      KeyEvent.KEYCODE_DPAD_RIGHT -> vm.pane = if (vm.side == 1 && vm.playlists.isNotEmpty()) 1 else 2
                      else -> return false
                  }
                  1 -> when (k) {
                      KeyEvent.KEYCODE_DPAD_UP -> vm.setCat(vm.catIdx - 1)
                      KeyEvent.KEYCODE_DPAD_DOWN -> vm.setCat(vm.catIdx + 1)
                      KeyEvent.KEYCODE_DPAD_LEFT -> vm.pane = 0
                      KeyEvent.KEYCODE_DPAD_RIGHT -> vm.pane = 2
                      else -> return false
                  }
                  else -> return if (vm.side == 1) guideKey(vm, k) else false
              }
              return true
          }

          private fun fullKey(vm: MainVM, k: Int): Boolean {
              if (vm.guideOverlay) return guideKey(vm, k)
              when (k) {
                  KeyEvent.KEYCODE_DPAD_UP -> if (vm.fbar == 2) vm.dialog = "menu" else vm.zap(1)
                  KeyEvent.KEYCODE_CHANNEL_UP -> vm.zap(1)
                  KeyEvent.KEYCODE_DPAD_DOWN -> if (vm.fbar != 2) vm.zap(-1)
                  KeyEvent.KEYCODE_CHANNEL_DOWN -> vm.zap(-1)
                  KeyEvent.KEYCODE_DPAD_LEFT -> if (vm.fbar == 2) vm.fidx = maxOf(0, vm.fidx - 1) else vm.openGuide()
                  KeyEvent.KEYCODE_DPAD_RIGHT -> {
                      if (vm.fbar == 2) vm.fidx = minOf(vm.cardCount() - 1, vm.fidx + 1)
                      else {
                          vm.fbar = 2
                          vm.fidx = 0
                      }
                  }
                  else -> return false
              }
              vm.touch()
              return true
          }

          /** Central D-pad / remote handling. Returns true when the key was consumed. */
          fun handleKey(vm: MainVM, pc: PlayerController, ne: KeyEvent): Boolean {
              if (vm.dialog.isNotEmpty()) return false
              // search / settings / welcome pages use normal Compose focus
              if (!vm.fullscreen && vm.pane == 2 && vm.pageIsCompose) return false
              val k = ne.keyCode
              val down = ne.action == KeyEvent.ACTION_DOWN

              if (k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER || k == KeyEvent.KEYCODE_NUMPAD_ENTER) {
                  if (down) {
                      if (ne.repeatCount == 0) okLong = false
                      else if (!okLong) {
                          okLong = true
                          vm.longOk()
                      }
                  } else {
                      if (!okLong) vm.ok()
                      okLong = false
                  }
                  return true
              }
              if (k >= KeyEvent.KEYCODE_0 && k <= KeyEvent.KEYCODE_9) {
                  if (down) vm.digit(k - KeyEvent.KEYCODE_0)
                  return true
              }
              val dpad = k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_DPAD_DOWN ||
                  k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_DPAD_RIGHT
              if (!down) return dpad

              when (k) {
                  KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE, KeyEvent.KEYCODE_MEDIA_PLAY, KeyEvent.KEYCODE_MEDIA_PAUSE -> {
                      pc.togglePlay()
                      return true
                  }
                  KeyEvent.KEYCODE_MENU -> {
                      vm.longOk()
                      return true
                  }
                  KeyEvent.KEYCODE_LAST_CHANNEL -> {
                      vm.recall()
                      return true
                  }
                  KeyEvent.KEYCODE_GUIDE -> {
                      if (vm.fullscreen) vm.openGuide()
                      return true
                  }
                  KeyEvent.KEYCODE_INFO -> {
                      if (vm.fullscreen) {
                          vm.fbar = if (vm.fbar == 0) 1 else 0
                          vm.touch()
                      }
                      return true
                  }
              }
              val handled = if (vm.fullscreen) fullKey(vm, k) else homeKey(vm, k)
              return handled || dpad
          }
