          private val HM = SimpleDateFormat("HH:mm", Locale.getDefault())
          fun hm(ms: Long): String = HM.format(Date(ms))

          fun progressOf(p: Program, now: Long): Float =
              ((now - p.start).toFloat() / (p.stop - p.start).coerceAtLeast(1L).toFloat()).coerceIn(0f, 1f)

          /** "in 3 minutes", "in 2 hours 15 minutes", "in 1 day 4 hours". */
          fun untilText(ms: Long): String {
              val m = (ms / 60_000L).coerceAtLeast(1L)
              val d = m / 1440L
              val h = (m % 1440L) / 60L
              val mi = m % 60L
              val parts = ArrayList<String>()
              if (d > 0L) parts.add("$d day" + (if (d > 1L) "s" else ""))
              if (h > 0L) parts.add("$h hour" + (if (h > 1L) "s" else ""))
              if (mi > 0L && d == 0L) parts.add("$mi minute" + (if (mi > 1L) "s" else ""))
              return "in " + parts.joinToString(" ")
          }

          @Composable
          fun isWide(): Boolean = LocalConfiguration.current.screenWidthDp >= 640

          /* ============================================================ colour helpers */

          /** Stable pleasant colour derived from some text (used when a programme has no banner). */
          fun hashColor(s: String): Color =
              Color.hsv(((s.hashCode() and 0x7fffffff) % 360).toFloat(), 0.55f, 0.95f)

          /** Dominant colour of a banner (Palette), animated; falls back to [fallback] while loading / without image. */
          @Composable
          fun rememberBannerColor(url: String, fallback: Color): Color {
              val ctx = LocalContext.current
              var c by remember(url) { mutableStateOf(fallback) }
              LaunchedEffect(url) {
                  if (url.isBlank()) return@LaunchedEffect
                  try {
                      val res = ctx.imageLoader.execute(
                          ImageRequest.Builder(ctx).data(url).allowHardware(false).size(160).build()
                      )
                      val bmp = ((res as? SuccessResult)?.drawable as? BitmapDrawable)?.bitmap
                      if (bmp != null) {
                          val p = withContext(Dispatchers.Default) {
                              Palette.from(bmp).maximumColorCount(12).generate()
                          }
                          val sw = p.vibrantSwatch ?: p.lightVibrantSwatch ?: p.dominantSwatch ?: p.mutedSwatch
                          if (sw != null) {
                              var k = Color(sw.rgb)
                              if (k.luminance() < 0.12f) k = lerp(k, Color.White, 0.3f)
                              c = k
                          }
                      }
                  } catch (e: Exception) {
                      // keep fallback
                  }
              }
              val target = if (url.isBlank()) fallback else c
              val animated by animateColorAsState(target, tween(900), label = "tint")
              return animated
          }

