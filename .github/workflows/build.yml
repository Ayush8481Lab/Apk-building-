name: Build Web APK

# =====================================================================
#  WebView APK builder
#  - Opens your website (BASE_URL) as the initial page inside the app
#  - ALWAYS desktop mode, same layout width on phone and tablet
#  - Full-screen video support (landscape, immersive, edge-to-edge)
#  - Punch-hole / notch safe
#  - Downloads a block list (Block.json) from GitHub at every app start
#    and blocks exact domains / exact URL endpoints in network requests
#  - Local capture/proxy server on 127.0.0.1:8481
#      http://127.0.0.1:8481/x?proxy=/home/newarticle&capdo=sample.com
#      -> loads BASE_URL/home/newarticle in a hidden WebView, watches the
#         network log, captures the first request to capdo (exact host or
#         any subdomain) and proxies that URL back to the caller
#      optional:
#        &out=proxy|json|redirect   (default proxy)
#        &contains=.m3u8            (URL must contain this text)
#        &timeout=25                (seconds, max 60)
#        &click=.play-btn           (CSS selector to click, URL-encode # as %23)
#        &js=...                    (your own JS, runs every 1.5s until captured)
#      on timeout the JSON reply contains "seen": every request the hidden
#      page made (for debugging)
#  - Builds a debug APK and uploads it as artifact
#
#  HOW TO USE:
#   1. Save this file as  .github/workflows/build-apk.yml  in your repo
#   2. Edit the values in the "env" section below (or run manually from
#      the Actions tab -> "Run workflow" and type them there)
#   3. Download the APK from the run's "Artifacts" section
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base domain / initial URL (e.g. https://yourdomain.com)"
        required: false
      app_name:
        description: "App name"
        required: false
      package_name:
        description: "Package name (e.g. com.example.webapp)"
        required: false
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://ayushdevlopott.com' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'Ayush ott' }}
  PACKAGE_NAME: ${{ github.event.inputs.package_name || 'com.example.webapp' }}
  BLOCK_API: 'https://raw.githubusercontent.com/Ayush8481-dev/Ayush/refs/heads/main/Block.json'
  ICON_URL: 'https://static.vecteezy.com/system/resources/previews/056/505/637/non_2x/jiohotstar-app-icon-on-transparent-background-free-png.png'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Android WebView project
        run: |
          set -e
          mkdir -p webapp && cd webapp
          PKG_PATH=$(echo "$PACKAGE_NAME" | tr . /)
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/drawable

          # ---------- optional icon ----------
          if [ -n "$ICON_URL" ]; then
            curl -fsSL "$ICON_URL" -o app/src/main/res/drawable/ic_launcher.png
            export ICON_REF="@drawable/ic_launcher"
          else
            export ICON_REF="@android:drawable/sym_def_app_icon"
          fi

          # ---------- settings.gradle ----------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          # ---------- root build.gradle ----------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # ---------- gradle.properties ----------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          # ---------- app/build.gradle ----------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '__PKG__'
              compileSdk 34
              defaultConfig {
                  applicationId '__PKG__'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # ---------- AndroidManifest.xml ----------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="__ICON_REF__"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|smallestScreenSize|screenLayout|uiMode|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ---------- MainActivity.java ----------
          cat > app/src/main/java/$PKG_PATH/MainActivity.java <<'EOF'
          package __PKG__;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.DisplayCutout;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicReference;

          public class MainActivity extends Activity {

              // Injected by the GitHub workflow
              private static final String BASE_URL  = "__BASE_URL__";
              private static final String BLOCK_API = "__BLOCK_API__";
              private static final String TAG = "WebApp";

              // Local capture/proxy server (only reachable from this phone)
              private static final int SERVER_PORT = 8481;

              private static final String DESKTOP_UA =
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                      + "Chrome/124.0.0.0 Safari/537.36";

              private static final int DESKTOP_WIDTH = 1024;

              private static final String VIEWPORT_JS =
                      "(function(){if(window.__dw)return;window.__dw=1;"
                      + "var C='width=" + DESKTOP_WIDTH + ", user-scalable=yes';"
                      + "function a(){var h=document.head||document.documentElement;if(!h)return;"
                      + "var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';h.appendChild(m);}"
                      + "if(m.getAttribute('content')!==C)m.setAttribute('content',C);}"
                      + "a();new MutationObserver(a).observe(document.documentElement,"
                      + "{childList:true,subtree:true,attributes:true,attributeFilter:['content']});})();";

              // Muted autoplay of any <video>/<audio> (used by the hidden capture page)
              private static final String AUTOPLAY_JS =
                      "(function(){try{document.querySelectorAll('video,audio').forEach(function(v){"
                      + "v.muted=true;var p=v.play();if(p&&p.catch)p.catch(function(){});});}catch(e){}})();";

              private static final String CORS =
                      "Access-Control-Allow-Origin: *\r\n"
                      + "Access-Control-Allow-Methods: GET, HEAD, OPTIONS\r\n"
                      + "Access-Control-Allow-Headers: *\r\n"
                      + "Access-Control-Allow-Private-Network: true\r\n"
                      + "Access-Control-Expose-Headers: *\r\n";

              private FrameLayout frame;
              private FrameLayout content;
              private FrameLayout fullscreenContainer;
              private WebView web;
              private SharedPreferences prefs;

              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;
              private int padL, padT, padR, padB;

              private ServerSocket serverSocket;
              private volatile boolean serverRunning = false;

              private final Set<String> blockDomains = Collections.synchronizedSet(new HashSet<String>());
              private final Set<String> blockUrls = Collections.synchronizedSet(new HashSet<String>());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("blocklist", MODE_PRIVATE);

                  Window w = getWindow();
                  w.setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  w.setStatusBarColor(Color.BLACK);
                  w.setNavigationBarColor(Color.BLACK);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }

                  frame = new FrameLayout(this);
                  frame.setBackgroundColor(Color.BLACK);

                  content = new FrameLayout(this);
                  web = new WebView(this);
                  content.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  fullscreenContainer.setVisibility(View.GONE);

                  frame.addView(content, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  frame.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(frame);

                  applyNormalSystemUi();

                  frame.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override
                      public WindowInsets onApplyWindowInsets(View v, WindowInsets in) {
                          int l = in.getSystemWindowInsetLeft();
                          int t = in.getSystemWindowInsetTop();
                          int r = in.getSystemWindowInsetRight();
                          int b = in.getSystemWindowInsetBottom();
                          if (Build.VERSION.SDK_INT >= 28) {
                              DisplayCutout dc = in.getDisplayCutout();
                              if (dc != null) {
                                  l = Math.max(l, dc.getSafeInsetLeft());
                                  t = Math.max(t, dc.getSafeInsetTop());
                                  r = Math.max(r, dc.getSafeInsetRight());
                                  b = Math.max(b, dc.getSafeInsetBottom());
                              }
                          }
                          padL = l; padT = t; padR = r; padB = b;
                          if (customView == null) content.setPadding(l, t, r, b);
                          return in;
                      }
                  });
                  frame.requestApplyInsets();

                  // ---------- main WebView ----------
                  configureWebView(web);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customCallback = callback;
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          content.setVisibility(View.INVISIBLE);
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          applyFullscreenSystemUi();
                      }

                      @Override
                      public void onHideCustomView() {
                          exitCustomView();
                      }

                      @Override
                      public Bitmap getDefaultVideoPoster() {
                          return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          view.evaluateJavascript(VIEWPORT_JS, null);
                      }

                      @Override
                      public void onPageCommitVisible(WebView view, String url) {
                          super.onPageCommitVisible(view, url);
                          view.evaluateJavascript(VIEWPORT_JS, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(VIEWPORT_JS, null);
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED: " + url);
                              return blockedResponse();
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED NAV: " + url);
                              return true;
                          }
                          String scheme = request.getUrl().getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl()));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  // start local capture/proxy server
                  startServer();

                  String cached = prefs.getString("json", null);
                  final boolean hadCache = cached != null && parse(cached);

                  if (hadCache) web.loadUrl(BASE_URL);

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          String json = download(BLOCK_API);
                          if (json != null && parse(json)) {
                              prefs.edit().putString("json", json).apply();
                          }
                          if (!hadCache) {
                              runOnUiThread(new Runnable() {
                                  @Override public void run() { web.loadUrl(BASE_URL); }
                              });
                          }
                      }
                  }).start();
              }

              // Shared WebView settings (main + hidden capture WebViews): always desktop mode
              private void configureWebView(WebView v) {
                  WebSettings s = v.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(DESKTOP_UA);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setTextZoom(100);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(v, true);
              }

              private WebResourceResponse blockedResponse() {
                  return new WebResourceResponse("text/plain", "UTF-8", 403, "Blocked",
                          new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
              }

              // ======================================================================
              //  LOCAL CAPTURE / PROXY SERVER  (127.0.0.1:8481)
              //
              //  GET /any?proxy=/home/newarticle&capdo=sample.com
              //    proxy    = path on BASE_URL (or a full http(s) URL) to open
              //    capdo    = domain to capture (exact host or any subdomain)
              //    out      = proxy (default) | json | redirect
              //    contains = optional text the captured URL must contain
              //    timeout  = seconds to wait (default 25, max 60)
              //    click    = optional CSS selector to click (retried)
              //    js       = optional JavaScript to run (retried)
              // ======================================================================

              private void startServer() {
                  if (serverRunning) return;
                  serverRunning = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              serverSocket = new ServerSocket();
                              serverSocket.setReuseAddress(true);
                              serverSocket.bind(new InetSocketAddress(InetAddress.getByName("127.0.0.1"), SERVER_PORT));
                              Log.d(TAG, "Server listening on 127.0.0.1:" + SERVER_PORT);
                              while (serverRunning) {
                                  final Socket c = serverSocket.accept();
                                  new Thread(new Runnable() {
                                      @Override public void run() { handleClient(c); }
                                  }).start();
                              }
                          } catch (Exception e) {
                              Log.e(TAG, "server stopped", e);
                          }
                      }
                  }).start();
              }

              private void stopServer() {
                  serverRunning = false;
                  try { if (serverSocket != null) serverSocket.close(); } catch (Exception ignored) { }
              }

              private void handleClient(Socket c) {
                  try {
                      c.setSoTimeout(10000);
                      BufferedReader in = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      OutputStream out = c.getOutputStream();

                      String reqLine = in.readLine();
                      if (reqLine == null) return;
                      String range = null;
                      String line;
                      while ((line = in.readLine()) != null && !line.isEmpty()) {
                          if (line.toLowerCase(Locale.ROOT).startsWith("range:")) {
                              range = line.substring(6).trim();
                          }
                      }
                      String[] parts = reqLine.split(" ");
                      String method = parts[0];
                      String target = parts.length > 1 ? parts[1] : "/";

                      if ("OPTIONS".equals(method)) {
                          send(out, 204, "No Content", "text/plain", new byte[0], null);
                          return;
                      }

                      Map<String, String> q = parseQuery(target);
                      String proxy = q.get("proxy");
                      String capdo = q.get("capdo");
                      if (proxy == null || proxy.isEmpty() || capdo == null || capdo.isEmpty()) {
                          JSONObject e = new JSONObject();
                          e.put("ok", false);
                          e.put("error", "use /path?proxy=/home/page&capdo=sample.com[&out=proxy|json|redirect][&contains=text][&timeout=25][&click=selector][&js=code]");
                          send(out, 400, "Bad Request", "application/json; charset=utf-8", e.toString().getBytes("UTF-8"), null);
                          return;
                      }

                      // normalise capdo: "https://Sample.com/x" -> "sample.com"
                      capdo = capdo.trim().toLowerCase(Locale.ROOT);
                      capdo = capdo.replaceFirst("^https?://", "");
                      int slash = capdo.indexOf('/');
                      if (slash >= 0) capdo = capdo.substring(0, slash);

                      String contains = q.get("contains");
                      if (contains != null) contains = contains.toLowerCase(Locale.ROOT);

                      int timeout = 25;
                      try { if (q.get("timeout") != null) timeout = Integer.parseInt(q.get("timeout")); }
                      catch (Exception ignored) { }
                      timeout = Math.max(1, Math.min(60, timeout));

                      String mode = q.get("out") == null ? "proxy" : q.get("out").toLowerCase(Locale.ROOT);
                      String pageUrl = buildPageUrl(proxy);

                      String clickSel = q.get("click");
                      String js = q.get("js");
                      List<String> all = Collections.synchronizedList(new ArrayList<String>());
                      List<String> seen = Collections.synchronizedList(new ArrayList<String>());
                      String first = capture(pageUrl, capdo, contains, timeout, all, seen, clickSel, js);

                      if (first == null) {
                          JSONObject e = new JSONObject();
                          e.put("ok", false);
                          e.put("error", "timeout: no request to " + capdo + " seen");
                          e.put("page", pageUrl);
                          JSONArray sa = new JSONArray();
                          synchronized (seen) { for (String s : seen) sa.put(s); }
                          e.put("seen", sa);
                          send(out, 504, "Gateway Timeout", "application/json; charset=utf-8", e.toString().getBytes("UTF-8"), null);
                          return;
                      }

                      if ("json".equals(mode)) {
                          JSONObject o = new JSONObject();
                          o.put("ok", true);
                          o.put("page", pageUrl);
                          o.put("url", first);
                          JSONArray arr = new JSONArray();
                          synchronized (all) { for (String s : all) arr.put(s); }
                          o.put("all", arr);
                          send(out, 200, "OK", "application/json; charset=utf-8", o.toString().getBytes("UTF-8"), null);
                      } else if ("redirect".equals(mode)) {
                          send(out, 302, "Found", "text/plain", new byte[0], "Location: " + first + "\r\n");
                      } else {
                          proxyFetch(first, range, out);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "client error", e);
                      try {
                          JSONObject o = new JSONObject();
                          o.put("ok", false);
                          o.put("error", String.valueOf(e));
                          send(c.getOutputStream(), 500, "Server Error", "application/json; charset=utf-8",
                                  o.toString().getBytes("UTF-8"), null);
                      } catch (Exception ignored) { }
                  } finally {
                      try { c.close(); } catch (Exception ignored) { }
                  }
              }

              private String buildPageUrl(String p) {
                  if (p.startsWith("http://") || p.startsWith("https://")) return p;
                  if (!p.startsWith("/")) p = "/" + p;
                  return stripSlash(BASE_URL) + p;
              }

              private static Map<String, String> parseQuery(String target) {
                  Map<String, String> m = new HashMap<String, String>();
                  int qi = target.indexOf('?');
                  if (qi < 0) return m;
                  String qs = target.substring(qi + 1);
                  int h = qs.indexOf('#');
                  if (h >= 0) qs = qs.substring(0, h);
                  for (String pair : qs.split("&")) {
                      if (pair.isEmpty()) continue;
                      int eq = pair.indexOf('=');
                      try {
                          String k = URLDecoder.decode(eq < 0 ? pair : pair.substring(0, eq), "UTF-8");
                          String v = eq < 0 ? "" : URLDecoder.decode(pair.substring(eq + 1), "UTF-8");
                          m.put(k, v);
                      } catch (Exception ignored) { }
                  }
                  return m;
              }

              private void send(OutputStream o, int code, String reason, String ctype, byte[] body, String extra)
                      throws IOException {
                  StringBuilder h = new StringBuilder();
                  h.append("HTTP/1.1 ").append(code).append(' ').append(reason).append("\r\n");
                  h.append("Content-Type: ").append(ctype).append("\r\n");
                  h.append("Content-Length: ").append(body.length).append("\r\n");
                  h.append(CORS);
                  if (extra != null) h.append(extra);
                  h.append("Connection: close\r\n\r\n");
                  o.write(h.toString().getBytes("UTF-8"));
                  o.write(body);
                  o.flush();
              }

              private void addSeen(List<String> seen, String url) {
                  if (seen.size() < 500) seen.add(url);
              }

              // Opens pageUrl in a hidden WebView and waits for the first request to capdo
              private String capture(final String pageUrl, final String capdo, final String contains,
                                     int timeoutSec, final List<String> all, final List<String> seen,
                                     final String clickSel, final String js) throws InterruptedException {
                  final CountDownLatch latch = new CountDownLatch(1);
                  final AtomicReference<String> first = new AtomicReference<String>(null);
                  final AtomicReference<WebView> holder = new AtomicReference<WebView>(null);

                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          final WebView wv = new WebView(MainActivity.this);
                          holder.set(wv);
                          configureWebView(wv);
                          wv.onResume();
                          wv.resumeTimers();
                          wv.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageStarted(WebView view, String url, Bitmap favicon) {
                                  super.onPageStarted(view, url, favicon);
                                  view.evaluateJavascript(VIEWPORT_JS, null);
                              }

                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  super.onPageFinished(view, url);
                                  view.evaluateJavascript(VIEWPORT_JS, null);
                                  poke(view, clickSel, js, latch, 8);
                              }

                              @Override
                              public void onLoadResource(WebView view, String url) {
                                  addSeen(seen, url);
                                  tryCapture(url, capdo, contains, all, first, latch);
                              }

                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                                  String u = request.getUrl().toString();
                                  addSeen(seen, u);
                                  if (tryCapture(u, capdo, contains, all, first, latch)) {
                                      // answer empty so single-use tokens are NOT consumed by the page;
                                      // the app fetches the URL itself afterwards
                                      return new WebResourceResponse("text/plain", "UTF-8", 200, "OK",
                                              new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                                  }
                                  if (isBlocked(u)) return blockedResponse();
                                  return super.shouldInterceptRequest(view, request);
                              }

                              @Override
                              public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                                  String u = request.getUrl().toString();
                                  addSeen(seen, u);
                                  if (tryCapture(u, capdo, contains, all, first, latch)) return true;
                                  if (isBlocked(u)) return true;
                                  String scheme = request.getUrl().getScheme();
                                  return !("http".equals(scheme) || "https".equals(scheme));
                              }
                          });
                          // sits underneath the visible content (index 0), user never sees it
                          frame.addView(wv, 0, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                          wv.loadUrl(pageUrl);
                      }
                  });

                  latch.await(timeoutSec, TimeUnit.SECONDS);

                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          WebView wv = holder.get();
                          if (wv != null) {
                              try {
                                  wv.stopLoading();
                                  frame.removeView(wv);
                                  wv.destroy();
                              } catch (Exception ignored) { }
                          }
                      }
                  });
                  return first.get();
              }

              // Repeatedly autoplay / click / run user JS until captured
              private void poke(final WebView v, final String clickSel, final String js,
                                final CountDownLatch latch, final int left) {
                  if (left <= 0 || latch.getCount() == 0) return;
                  v.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (latch.getCount() == 0) return;
                          try {
                              v.evaluateJavascript(AUTOPLAY_JS, null);
                              if (clickSel != null && !clickSel.isEmpty()) {
                                  v.evaluateJavascript("(function(){try{var e=document.querySelector("
                                          + JSONObject.quote(clickSel) + ");if(e)e.click();}catch(x){}})();", null);
                              }
                              if (js != null && !js.isEmpty()) {
                                  v.evaluateJavascript("(function(){try{" + js + "}catch(x){}})();", null);
                              }
                          } catch (Exception ignored) { }
                          poke(v, clickSel, js, latch, left - 1);
                      }
                  }, 1500);
              }

              private boolean tryCapture(String url, String capdo, String contains, List<String> all,
                                         AtomicReference<String> first, CountDownLatch latch) {
                  try {
                      String host = Uri.parse(url).getHost();
                      if (host == null) return false;
                      host = host.toLowerCase(Locale.ROOT);
                      if (!(host.equals(capdo) || host.endsWith("." + capdo))) return false;
                      if (contains != null && !contains.isEmpty()
                              && !url.toLowerCase(Locale.ROOT).contains(contains)) return false;
                      Log.d(TAG, "CAPTURED: " + url);
                      if (!all.contains(url)) all.add(url);
                      if (first.compareAndSet(null, url)) latch.countDown();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              // Fetches the captured URL and streams it back to the caller
              private void proxyFetch(String url, String range, OutputStream out) throws IOException {
                  HttpURLConnection h = (HttpURLConnection) new URL(url).openConnection();
                  try {
                      h.setInstanceFollowRedirects(true);
                      h.setConnectTimeout(10000);
                      h.setReadTimeout(30000);
                      h.setRequestProperty("User-Agent", DESKTOP_UA);
                      h.setRequestProperty("Referer", stripSlash(BASE_URL) + "/");
                      h.setRequestProperty("Origin", stripSlash(BASE_URL));
                      String ck = CookieManager.getInstance().getCookie(url);
                      if (ck != null && !ck.isEmpty()) h.setRequestProperty("Cookie", ck);
                      if (range != null) h.setRequestProperty("Range", range);

                      int code = h.getResponseCode();
                      InputStream is = code >= 400 ? h.getErrorStream() : h.getInputStream();

                      StringBuilder hd = new StringBuilder();
                      hd.append("HTTP/1.1 ").append(code).append(' ')
                        .append(h.getResponseMessage() == null ? "OK" : h.getResponseMessage()).append("\r\n");
                      String ct = h.getContentType();
                      hd.append("Content-Type: ").append(ct == null ? "application/octet-stream" : ct).append("\r\n");
                      long len = h.getContentLengthLong();
                      if (len >= 0) hd.append("Content-Length: ").append(len).append("\r\n");
                      String cr = h.getHeaderField("Content-Range");
                      if (cr != null) hd.append("Content-Range: ").append(cr).append("\r\n");
                      String ar = h.getHeaderField("Accept-Ranges");
                      if (ar != null) hd.append("Accept-Ranges: ").append(ar).append("\r\n");
                      hd.append("X-Captured-Url: ").append(url.replace("\r", "").replace("\n", "")).append("\r\n");
                      hd.append(CORS);
                      hd.append("Connection: close\r\n\r\n");
                      out.write(hd.toString().getBytes("UTF-8"));

                      if (is != null) {
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = is.read(buf)) != -1) out.write(buf, 0, n);
                          is.close();
                      }
                      out.flush();
                  } finally {
                      h.disconnect();
                  }
              }

              // ---------------- system UI helpers ----------------

              private void applyNormalSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              private void applyFullscreenSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              private void exitCustomView() {
                  if (customView == null) return;
                  fullscreenContainer.removeView(customView);
                  fullscreenContainer.setVisibility(View.GONE);
                  content.setVisibility(View.VISIBLE);
                  customView = null;
                  WebChromeClient.CustomViewCallback cb = customCallback;
                  customCallback = null;
                  if (cb != null) cb.onCustomViewHidden();
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  applyNormalSystemUi();
                  content.setPadding(padL, padT, padR, padB);
                  frame.requestApplyInsets();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      if (customView != null) applyFullscreenSystemUi();
                      else applyNormalSystemUi();
                  }
              }

              // ---------------- block list ----------------

              private boolean parse(String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      Set<String> d = new HashSet<String>();
                      Set<String> u = new HashSet<String>();
                      JSONArray da = o.optJSONArray("blockDomains");
                      JSONArray ua = o.optJSONArray("blockUrls");
                      if (da != null) for (int i = 0; i < da.length(); i++)
                          d.add(da.getString(i).trim().toLowerCase(Locale.ROOT));
                      if (ua != null) for (int i = 0; i < ua.length(); i++)
                          u.add(endpointKey(ua.getString(i).trim()));
                      blockDomains.clear(); blockDomains.addAll(d);
                      blockUrls.clear();    blockUrls.addAll(u);
                      Log.d(TAG, "Block list loaded: " + d.size() + " domains, " + u.size() + " urls");
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "parse error", e);
                      return false;
                  }
              }

              private static String stripSlash(String s) {
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              private boolean isBlocked(String url) {
                  try {
                      String host = Uri.parse(url).getHost();
                      if (host != null && blockDomains.contains(host.toLowerCase(Locale.ROOT))) {
                          return true;
                      }
                      if (blockUrls.contains(endpointKey(url))) {
                          return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private static String endpointKey(String url) {
                  Uri u = Uri.parse(url);
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase(Locale.ROOT);
                  String path = u.getPath() == null ? "" : u.getPath().toLowerCase(Locale.ROOT);
                  return host + stripSlash(path);
              }

              private String download(String link) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(link).openConnection();
                      c.setConnectTimeout(5000);
                      c.setReadTimeout(5000);
                      if (c.getResponseCode() != 200) return null;
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line).append('\n');
                      r.close();
                      return sb.toString();
                  } catch (Exception e) {
                      Log.e(TAG, "download error", e);
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      exitCustomView();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  stopServer();
                  super.onDestroy();
              }
          }
          EOF

          # ---------- inject values (perl keeps special chars like & safe) ----------
          export PKG="$PACKAGE_NAME"
          for f in app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/$PKG_PATH/MainActivity.java; do
            perl -pi -e 's/__PKG__/$ENV{PKG}/g; s/__BASE_URL__/$ENV{BASE_URL}/g; s/__BLOCK_API__/$ENV{BLOCK_API}/g; s/__APP_NAME__/$ENV{APP_NAME}/g; s/__ICON_REF__/$ENV{ICON_REF}/g' "$f"
          done

      - name: Build debug APK
        working-directory: webapp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp webapp/app/build/outputs/apk/debug/app-debug.apk "out/webapp.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-apk
          path: out/webapp.apk
          if-no-files-found: error
