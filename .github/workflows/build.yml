name: Build Premium Downloader APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Premium Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session
          npm install @capacitor/splash-screen

      - name: Initialize Capacitor Config & Offline UI
        run: |
          mkdir -p www
          echo "<html><body>Loading Music8481...</body></html>" > www/index.html
          npx cap init Music8481 com.music8481.app --web-dir www

          rm capacitor.config.ts || true
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.music8481.app",
            "appName": "Music8481",
            "webDir": "www",
            "server": {
              "url": "https://ayushgaana.vercel.app",
              "cleartext": true
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidSplashResourceName": "splash",
                "showSpinner": true,
                "spinnerColor": "#1DB954"
              }
            }
          }
          EOF

      - name: Add Native Android Platform
        run: npx cap add android

      # NEW: Inject FFmpeg-Kit into Android Gradle
      - name: Inject FFmpeg Dependency
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');
          gradle = gradle.replace('dependencies {', 'dependencies {\n    implementation \"com.arthenica:ffmpeg-kit-audio:6.0-2\"\n');
          fs.writeFileSync(path, gradle);
          "

      # NEW: Inject Read/Write Storage Permissions for Downloading
      - name: Inject Permissions & Vivo Meta-Data
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
          \`;
          
          const vivoTags = \`
              <meta-data android:name=\"com.vivo.dynamic.island.support\" android:value=\"true\" />
              <meta-data android:name=\"android.media.playback.ALWAYS_SHOW_LOCK_SCREEN_CONTROLS\" android:value=\"true\" />
              <meta-data android:name=\"com.vivo.music.lockscreen.support\" android:value=\"true\" />
          \`;

          if (!xml.includes('android.permission.WAKE_LOCK')) {
              xml = xml.replace('<application', perms + '\n    <application');
              xml = xml.replace('<application', '<application android:hardwareAccelerated=\"true\" android:largeHeap=\"true\"');
              xml = xml.replace('<activity', '<activity android:supportsPictureInPicture=\"true\"');
              xml = xml.replace('</application>', vivoTags + '\n    </application>');
              fs.writeFileSync(path, xml);
          }
          "

      - name: Force Android App Theme to Edge-to-Edge
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, 'utf8');
              const edgeToEdge = \`
                  <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>
                  <item name=\"android:statusBarColor\">@android:color/transparent</item>
                  <item name=\"android:navigationBarColor\">@android:color/transparent</item>
                  <item name=\"android:windowDrawsSystemBarBackgrounds\">true</item>
              \`;
              xml = xml.replace('</style>', edgeToEdge + '\n</style>');
              fs.writeFileSync(path, xml);
          }
          "

      # NEW: Deep Java Injection for Native FFmpeg Audio, DownloadManager Video, and URL Interceptor
      - name: Inject Native Premium Downloader Engine
        run: |
          cat <<EOF > android/app/src/main/java/com/music8481/app/MainActivity.java
          package com.music8481.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;
          
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.JavascriptInterface;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.content.Context;
          import android.os.PowerManager;
          import android.media.AudioManager;
          import android.view.WindowManager;
          import android.app.PictureInPictureParams;
          import android.content.pm.ActivityInfo;
          import android.util.Rational;
          import android.content.res.Configuration;

          // NATIVE DOWNLOADER IMPORTS
          import com.arthenica.ffmpegkit.FFmpegKit;
          import com.arthenica.ffmpegkit.ReturnCode;
          import android.os.Environment;
          import java.io.File;
          import android.app.NotificationManager;
          import android.app.NotificationChannel;
          import androidx.core.app.NotificationCompat;
          import android.app.DownloadManager;
          import android.net.Uri;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;
              private boolean isVideoFullscreen = false;
              private boolean isVideoModeActive = false;

              public class WebAppInterface {
                  @JavascriptInterface
                  public void setVideoMode(boolean isVideo) {
                      isVideoModeActive = isVideo;
                  }

                  // TRIGGERS NATIVE FFMPEG M3U8 -> MP3 BUILDER
                  @JavascriptInterface
                  public void downloadAudio(String m3u8Url, String title, String artist, String album) {
                      runOnUiThread(() -> startNativeAudioDownload(m3u8Url, title, artist, album));
                  }

                  // TRIGGERS NATIVE ANDROID DOWNLOAD MANAGER FOR MP4 VIDEO
                  @JavascriptInterface
                  public void downloadVideo(String url, String filename) {
                      runOnUiThread(() -> startNativeVideoDownload(url, filename));
                  }
              }

              // NATIVE VIDEO DOWNLOADER WITH PAUSE/CANCEL NOTIFICATIONS
              private void startNativeVideoDownload(String url, String filename) {
                  // Request Storage Permissions
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q && ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 102);
                  }

                  // Use Public Movies Directory -> Music8481/Musicvideo
                  File videoDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "Music8481/Musicvideo");
                  if (!videoDir.exists()) videoDir.mkdirs();

                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                  request.setTitle(filename);
                  request.setDescription("Downloading Video natively...");
                  // VISIBILITY_VISIBLE_NOTIFY_COMPLETED gives the user a Pause and Cancel button on supported OS versions
                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_MOVIES, "Music8481/Musicvideo/" + filename);

                  DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  if (manager != null) manager.enqueue(request);
              }

              // NATIVE FFMPEG AUDIO PACKER
              private void startNativeAudioDownload(String m3u8Url, String title, String artist, String album) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q && ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 102);
                  }

                  File musicDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC), "Music8481/Music");
                  if (!musicDir.exists()) musicDir.mkdirs();
                  
                  String cleanTitle = title.replaceAll("[\\\\/:*?\"<>|]", "");
                  File outputFile = new File(musicDir, cleanTitle + ".mp3");

                  NotificationManager notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  String channelId = "download_channel";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(channelId, "Downloads", NotificationManager.IMPORTANCE_LOW);
                      notificationManager.createNotificationChannel(channel);
                  }

                  int notificationId = (int) System.currentTimeMillis();
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("Packing: " + cleanTitle)
                      .setContentText("Downloading and processing audio natively...")
                      .setProgress(100, 0, true)
                      .setOngoing(true);
                      
                  notificationManager.notify(notificationId, builder.build());

                  // Execute FFmpeg on Android CPU: Input M3U8 -> Output 320kbps MP3 with ID3 Tags!
                  String command = String.format("-y -i \"%s\" -c:a libmp3lame -b:a 320k -metadata title=\"%s\" -metadata artist=\"%s\" -metadata album=\"%s\" \"%s\"", 
                      m3u8Url, title, artist, album, outputFile.getAbsolutePath());

                  FFmpegKit.executeAsync(command, session -> {
                      ReturnCode returnCode = session.getReturnCode();
                      if (ReturnCode.isSuccess(returnCode)) {
                          builder.setContentText("Saved to Music/Music8481")
                                 .setProgress(0, 0, false)
                                 .setOngoing(false)
                                 .setSmallIcon(android.R.drawable.stat_sys_download_done);
                      } else {
                          builder.setContentText("Download Failed")
                                 .setProgress(0, 0, false)
                                 .setOngoing(false);
                      }
                      notificationManager.notify(notificationId, builder.build());
                  });
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams attributes = getWindow().getAttributes();
                      attributes.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(attributes);
                  }
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Music8481::BackgroundAudioLock");
                  wakeLock.acquire();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      
                      settings.setMediaPlaybackRequiresUserGesture(false); 
                      webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      settings.setDomStorageEnabled(true);

                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidApp");
                      
                      // GLOBAL INTERCEPTOR: Watches for clicks on your Vercel URL and hands them to FFmpeg natively!
                      webView.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              webView.evaluateJavascript(
                                  "document.addEventListener('click', function(e) {" +
                                  "  var a = e.target.closest('a');" +
                                  "  if (a && a.href && a.href.includes('ayushdownload.vercel.app/api/dl')) {" +
                                  "      e.preventDefault();" +
                                  "      var url = new URL(a.href);" +
                                  "      var m3u8 = url.searchParams.get('url');" +
                                  "      var title = url.searchParams.get('title') || 'Song';" +
                                  "      var artist = url.searchParams.get('artist') || 'Artist';" +
                                  "      var album = url.searchParams.get('album') || 'Album';" +
                                  "      if (window.AndroidApp) window.AndroidApp.downloadAudio(m3u8, title, artist, album);" +
                                  "  }" +
                                  "}, true);" +
                                  "setInterval(function() {" +
                                  "  var hasVideo = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]') !== null;" +
                                  "  if (window.AndroidApp) window.AndroidApp.setVideoMode(hasVideo);" +
                                  "}, 1000);", null);
                          }
                      }, 2000);

                      final WebChromeClient originalClient = webView.getWebChromeClient();
                      webView.setWebChromeClient(new WebChromeClient() {
                          private View mCustomView;
                          private WebChromeClient.CustomViewCallback mCustomViewCallback;
                          private int mOriginalSystemUiVisibility;

                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              if (mCustomView != null) { onHideCustomView(); return; }
                              mCustomView = view;
                              isVideoFullscreen = true;
                              mOriginalSystemUiVisibility = getWindow().getDecorView().getSystemUiVisibility();
                              mCustomViewCallback = callback;

                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                              getWindow().getDecorView().setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);

                              ((FrameLayout) getWindow().getDecorView()).addView(mCustomView, new FrameLayout.LayoutParams(-1, -1));
                          }

                          @Override
                          public void onHideCustomView() {
                              ((FrameLayout) getWindow().getDecorView()).removeView(mCustomView);
                              mCustomView = null;
                              isVideoFullscreen = false;
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);
                              getWindow().getDecorView().setSystemUiVisibility(mOriginalSystemUiVisibility);
                              if (mCustomViewCallback != null) { mCustomViewCallback.onCustomViewHidden(); mCustomViewCallback = null; }
                          }
                          @Override
                          public void onPermissionRequest(android.webkit.PermissionRequest request) { if (originalClient != null) originalClient.onPermissionRequest(request); }
                          @Override
                          public boolean onShowFileChooser(WebView webView, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) { return originalClient != null && originalClient.onShowFileChooser(webView, filePathCallback, fileChooserParams); }
                          @Override
                          public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) { return originalClient != null && originalClient.onConsoleMessage(consoleMessage); }
                      });
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      if (isInPictureInPictureMode) {
                          webView.evaluateJavascript(
                              "var iframe = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]');" +
                              "if(iframe) {" +
                              "  iframe.style.position = 'fixed';" +
                              "  iframe.style.top = '0'; iframe.style.left = '0';" +
                              "  iframe.style.width = '100vw'; iframe.style.height = '100vh';" +
                              "  iframe.style.zIndex = '999999';" +
                              "  iframe.setAttribute('data-pip', 'true');" +
                              "}", null);
                      } else {
                          webView.evaluateJavascript(
                              "var iframe = document.querySelector('iframe[data-pip=\"true\"]');" +
                              "if(iframe) {" +
                              "  iframe.style.position = '';" +
                              "  iframe.style.top = ''; iframe.style.left = '';" +
                              "  iframe.style.width = '100%'; iframe.style.height = '100%';" +
                              "  iframe.style.zIndex = '';" +
                              "  iframe.removeAttribute('data-pip');" +
                              "}", null);
                      }
                  }
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try { enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).build()); } catch (Exception e) {}
                  }
              }

              @Override
              public void onBackPressed() {
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try { enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).build()); } catch (Exception e) { super.onBackPressed(); }
                  } else { super.onBackPressed(); }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().onResume(); 
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              }
          }
          EOF

      - name: Fix Kotlin Duplicate Classes (Gradle Bug)
        run: |
          cat <<EOF >> android/app/build.gradle
          
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Generate App Icon & Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p assets
          
          wget -q https://raw.githubusercontent.com/Ayush8481Lab/Ayushgaana/refs/heads/main/app/android-chrome-512x512.png -O assets/icon.png
          convert -size 2732x2732 xc:"#000000" assets/icon.png -gravity center -composite assets/splash.png
          npx @capacitor/assets generate --android

      - name: Fix Gradle Daemon & Memory Issues
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Generate Android Keystore (For App Signing)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      - name: Build & Auto-Sign Android APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload Independent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Premium-APK
          path: android/app/build/outputs/apk/release/app-release.apk
