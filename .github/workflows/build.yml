name: Build Live TV APK

# Live TV - token-gated live channel app for Android (phone + Android TV).
# Liquid-glass UI, TiviMate-style home (live preview + EPG rows + push-aside slide menu), DRM (ClearKey / Widevine), auto session refresh, cached chunked Jio EPG.
# v5.3: header 1.15x bigger and re-laid out (name / time + progress + minutes left / description / next programme),
#       focused programme card only glows + pops (its details move to the header), TiviMate-style side panels that push the player aside
#       (Back or LEFT: categories | Back again: TV / Search / Settings | categories), Guide button removed.
# v5.2: preview header 0.8x smaller, no LIVE tag on the live card, upcoming cards show white 12h time (am/pm), focused programme card zooms stronger.
# v5.1: TV-remote fullscreen player, rectangular logo tiles, 16:9 programme cards, 2-6 home rows (default 4), EPG loads up to 10 days while scrolling sideways.
# Usage: put this file at .github/workflows/build.yml -> push -> Actions tab -> download "LiveTV-APK".

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate project files
        run: |
          set -e
          rm -rf LiveTVApp
          mkdir -p LiveTVApp
          cd LiveTVApp
          cat > settings.gradle.kts <<'__SB_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiveTV"
          include(":app")
          __SB_EOF__

          cat > build.gradle.kts <<'__SB_EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          __SB_EOF__

          cat > gradle.properties <<'__SB_EOF__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.daemon=false
          __SB_EOF__

          mkdir -p app
          cat > app/build.gradle.kts <<'__SB_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.livetv.glass"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.livetv.glass"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 8
                  versionName = "5.3"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // signed with the debug key so the release APK is directly installable
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.media3.common.util.UnstableApi",
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi"
                  )
              }
              buildFeatures { compose = true }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")

              val media3 = "1.4.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-exoplayer-dash:$media3")
              implementation("androidx.media3:media3-ui:$media3")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("androidx.palette:palette-ktx:1.0.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-datasource-okhttp:$media3")
          }
          __SB_EOF__

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__SB_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/ic_launcher"
                  android:label="Live TV"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.LiveTV">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboard|keyboardHidden|navigation|uiMode|density|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __SB_EOF__

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'__SB_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LiveTV" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          __SB_EOF__

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'__SB_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#05070D" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#7AB8FF" android:pathData="M30,34h48a6,6 0 0 1 6,6v28a6,6 0 0 1 -6,6h-48a6,6 0 0 1 -6,-6v-28a6,6 0 0 1 6,-6z" />
              <path android:fillColor="#05070D" android:pathData="M48,44l18,10l-18,10z" />
          </vector>
          __SB_EOF__

          mkdir -p app/src/main/java/com/livetv/glass
          cat > app/src/main/java/com/livetv/glass/Models.kt <<'__SB_EOF__'
          package com.livetv.glass

          import android.content.Context
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.net.URLDecoder
          import java.util.concurrent.TimeUnit

          /** Default User-Agent for the stream requests (editable in Settings). */
          const val DEFAULT_UA = "okhttp/4.12.13"
          private const val OLD_DEFAULT_UA = "VLC/3.0.20 LibVLC/3.0.20"
          const val API_UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          const val API_BASE = "https://ayush8481tvpl8481.pages.dev/live/"
          const val EPG_API = "https://jiotvapi.cdn.jio.com/apis/v1.3/getepg/get"
          const val IMG_BASE = "https://jiotvimages.cdn.jio.com/dare_images/shows/"

          /** EPG responses are cached (disk + memory) for this long. */
          const val EPG_TTL_MS = 30 * 60_000L

          /** Furthest EPG day offset (0 = today) the home rows can scroll into. */
          const val MAX_DAY_OFFSET = 10

          /** Home screen row count limits (Settings). */
          const val MIN_ROWS = 2
          const val MAX_ROWS = 6
          const val DEFAULT_ROWS = 4

          data class Channel(
              val id: String,
              val name: String,
              val category: String,
              val logo: String,
              val license: String,
              val url: String,
              val headers: Map<String, String> = emptyMap()
          )

          data class Program(
              val start: Long,
              val stop: Long,
              val title: String,
              val desc: String,
              val thumb: String,
              val genre: String,
              val category: String
          )

          data class Session(val expire: Long, val channels: List<Channel>)

          sealed class ApiResult {
              class Ok(val session: Session) : ApiResult()
              object Invalid : ApiResult()
              class NetErr(val msg: String) : ApiResult()
          }

          /** Program banner through Jio's image optimizer. */
          fun bannerUrl(p: Program): String {
              val t = p.thumb.trim()
              if (t.isEmpty()) return ""
              if (t.startsWith("http")) return t
              return IMG_BASE + t.removePrefix("/") + "?width=700&optimize=medium&format=jpg"
          }

          fun decodeHv(v: String): String =
              if (v.contains('%')) {
                  try { URLDecoder.decode(v.replace("+", "%2B"), "UTF-8") } catch (e: Exception) { v }
              } else v

          /** "Name: value" or "Name=value", one per line. */
          fun parseHeaderLines(s: String): Map<String, String> {
              val m = LinkedHashMap<String, String>()
              s.lines().forEach { raw ->
                  val l = raw.trim()
                  if (l.isEmpty() || l.startsWith("#")) return@forEach
                  val c = l.indexOf(':')
                  val e = l.indexOf('=')
                  val i = if (c < 0) e else if (e < 0) c else minOf(c, e)
                  if (i > 0) m[l.substring(0, i).trim()] = l.substring(i + 1).trim()
              }
              return m
          }

          /** "A=b&C=d" (Kodi style, values may be url-encoded). */
          fun parseHeaderString(s: String): Map<String, String> {
              val m = LinkedHashMap<String, String>()
              s.split('&').forEach { p ->
                  val i = p.indexOf('=')
                  if (i > 0) m[p.substring(0, i).trim()] = decodeHv(p.substring(i + 1).trim())
              }
              return m
          }

          private fun JSONObject.str(k: String): String = if (isNull(k)) "" else optString(k).trim()

          private fun niceCat(s: String): String {
              val t = s.trim()
              if (t.isEmpty()) return "Other"
              return t.lowercase().split(' ').filter { it.isNotEmpty() }
                  .joinToString(" ") { w -> w.replaceFirstChar { c -> c.uppercase() } }
          }

          /* ---------------------------------------------------------------- storage */

          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("livetv", Context.MODE_PRIVATE)

              var token: String
                  get() = sp.getString("token", "") ?: ""
                  set(v) { sp.edit().putString("token", v).apply() }

              var userAgent: String
                  get() {
                      val v = sp.getString("ua", DEFAULT_UA) ?: DEFAULT_UA
                      // upgrade installs that still carry the old built-in default
                      return if (v.isBlank() || v == OLD_DEFAULT_UA) DEFAULT_UA else v
                  }
                  set(v) { sp.edit().putString("ua", v).apply() }

              var extraHeaders: String
                  get() = sp.getString("xh", "") ?: ""
                  set(v) { sp.edit().putString("xh", v).apply() }

              var resumeLast: Boolean
                  get() = sp.getBoolean("resumeLast", false)
                  set(v) { sp.edit().putBoolean("resumeLast", v).apply() }

              var lastChannel: String
                  get() = sp.getString("lastChannel", "") ?: ""
                  set(v) { sp.edit().putString("lastChannel", v).apply() }

              var aspect: Int
                  get() = sp.getInt("aspect", 0)
                  set(v) { sp.edit().putInt("aspect", v).apply() }

              /** Channel rows visible on the home screen (2..6, default 4). */
              var rows: Int
                  get() = sp.getInt("rows", DEFAULT_ROWS).coerceIn(MIN_ROWS, MAX_ROWS)
                  set(v) { sp.edit().putInt("rows", v.coerceIn(MIN_ROWS, MAX_ROWS)).apply() }

              fun favorites(): Set<String> = sp.getStringSet("fav", emptySet())?.toSet() ?: emptySet()
              fun saveFavorites(s: Set<String>) {
                  sp.edit().putStringSet("fav", HashSet(s)).apply()
              }

              fun recents(): List<String> = try {
                  val a = JSONArray(sp.getString("recents", "[]"))
                  (0 until a.length()).map { a.getString(it) }
              } catch (e: Exception) {
                  emptyList()
              }

              fun saveRecents(l: List<String>) {
                  val a = JSONArray()
                  l.forEach { a.put(it) }
                  sp.edit().putString("recents", a.toString()).apply()
              }
          }

          /* ---------------------------------------------------------------- API */

          object Api {
              val client: OkHttpClient = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(25, TimeUnit.SECONDS)
                  .build()

              /** Blocking: call from Dispatchers.IO. */
              fun channels(token: String): ApiResult {
                  val t = token.trim()
                  if (t.isEmpty()) return ApiResult.Invalid
                  return try {
                      val url = API_BASE.toHttpUrl().newBuilder().addPathSegment(t).build()
                      val req = Request.Builder().url(url)
                          .header("User-Agent", API_UA)
                          .header("Accept", "application/json")
                          .build()
                      client.newCall(req).execute().use { r ->
                          val code = r.code
                          val body = r.body?.string() ?: ""
                          if (code == 401 || code == 403 || code == 404) ApiResult.Invalid
                          else if (code !in 200..299) ApiResult.NetErr("HTTP $code")
                          else parse(body)
                      }
                  } catch (e: IOException) {
                      ApiResult.NetErr(e.message ?: "Network error")
                  } catch (e: Exception) {
                      ApiResult.NetErr(e.message ?: "Unexpected error")
                  }
              }

              private fun parse(body: String): ApiResult {
                  val o = try { JSONObject(body) } catch (e: Exception) { return ApiResult.Invalid }
                  val arr = o.optJSONArray("channels") ?: return ApiResult.Invalid
                  val list = ArrayList<Channel>()
                  for (i in 0 until arr.length()) {
                      val c = arr.optJSONObject(i) ?: continue
                      val raw = c.str("url")
                      if (raw.isEmpty()) continue
                      var url = raw
                      var h: Map<String, String> = emptyMap()
                      val bar = raw.indexOf('|')
                      if (bar > 0) {
                          url = raw.substring(0, bar)
                          h = parseHeaderString(raw.substring(bar + 1))
                      }
                      val id = c.str("id").ifEmpty { i.toString() }
                      list.add(
                          Channel(
                              id = id,
                              name = c.str("name").ifEmpty { "Channel ${i + 1}" },
                              category = niceCat(c.str("category")),
                              logo = c.str("logo"),
                              license = c.str("license"),
                              url = url,
                              headers = h
                          )
                      )
                  }
                  return ApiResult.Ok(Session(o.optLong("expire", 0L), list.distinctBy { it.id }))
              }
          }

          object EpgApi {
              /** Set once from the ViewModel; EPG responses are cached here for [EPG_TTL_MS]. */
              @Volatile
              var dir: File? = null

              private fun cacheFile(id: String, offset: Int): File? {
                  val d = dir ?: return null
                  val safe = id.replace(Regex("[^A-Za-z0-9_-]"), "_")
                  return File(d, "epg_${safe}_$offset.json")
              }

              private fun download(id: String, offset: Int): String {
                  val url = EPG_API.toHttpUrl().newBuilder()
                      .addQueryParameter("channel_id", id)
                      .addQueryParameter("offset", offset.toString())
                      .build()
                  val req = Request.Builder().url(url).header("User-Agent", API_UA).build()
                  Api.client.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) throw IOException("EPG HTTP ${r.code}")
                      return r.body?.string() ?: ""
                  }
              }

              private fun parse(body: String): List<Program> {
                  val arr = JSONObject(body).optJSONArray("epg") ?: return emptyList()
                  val out = ArrayList<Program>()
                  for (i in 0 until arr.length()) {
                      val p = arr.optJSONObject(i) ?: continue
                      val st = p.optLong("startEpoch", 0L)
                      val en = p.optLong("endEpoch", 0L)
                      if (en <= st) continue
                      val genre = p.optJSONArray("showGenre")?.optString(0) ?: ""
                      val thumb = p.str("episodeThumbnail").ifEmpty { p.str("episodePoster") }
                      out.add(
                          Program(
                              st, en, p.str("showname"), p.str("description"),
                              thumb, genre, p.str("showCategory")
                          )
                      )
                  }
                  return out.sortedBy { it.start }
              }

              /** Blocking: call from Dispatchers.IO. offset 0 = today (resets by UTC), up to 10. */
              fun fetch(id: String, offset: Int): List<Program> {
                  val f = cacheFile(id, offset)

                  // 1) fresh cache (younger than 30 min) -> no network call at all
                  if (f != null && f.exists() && System.currentTimeMillis() - f.lastModified() < EPG_TTL_MS) {
                      try {
                          return parse(f.readText())
                      } catch (e: Exception) {
                          // corrupt cache file, fall through to the network
                      }
                  }

                  // 2) network, then store the raw response
                  try {
                      val body = download(id, offset)
                      val out = parse(body)
                      if (f != null && out.isNotEmpty()) {
                          try {
                              f.writeText(body)
                          } catch (e: Exception) {
                              // cache write failure is harmless
                          }
                      }
                      return out
                  } catch (e: Exception) {
                      // 3) network failed: an older cached copy is better than nothing
                      if (f != null && f.exists()) {
                          try {
                              return parse(f.readText())
                          } catch (e2: Exception) {
                              // ignore
                          }
                      }
                      throw e
                  }
              }
          }
          __SB_EOF__

          mkdir -p app/src/main/java/com/livetv/glass
          cat > app/src/main/java/com/livetv/glass/Http.kt <<'__SB_EOF__'
          package com.livetv.glass

          import okhttp3.Cookie
          import okhttp3.CookieJar
          import okhttp3.HttpUrl
          import okhttp3.Interceptor
          import okhttp3.OkHttpClient
          import java.io.IOException
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs

          /** Ring buffer of recent HTTP activity, shown in the player's "Network log" dialog. */
          object NetLog {
              private val lines = ArrayDeque<String>()

              @Synchronized
              fun add(s: String) {
                  lines.addLast(s)
                  while (lines.size > 150) lines.removeFirst()
              }

              @Synchronized
              fun snapshot(): List<String> = lines.toList()

              @Synchronized
              fun last(n: Int): List<String> = lines.takeLast(n)

              @Synchronized
              fun clear() {
                  lines.clear()
              }
          }

          /**
           * Cookie jar tuned for CDN streams:
           *  - cookies from the manifest / redirects / key responses are replayed on every later request;
           *  - cookies are also sent to sibling hosts of the same site;
           *  - expiry is judged on the SERVER clock (Date header), so a wrong device clock cannot break tokens;
           *  - Set-Cookie lines OkHttp refuses to parse are still kept (lenient fallback).
           */
          class MemoryCookieJar : CookieJar {
              private class Entry(val c: Cookie, val origin: String)

              private val store = ArrayList<Entry>()

              @Volatile
              var fixed: String = ""

              @Volatile
              var skew: Long = 0L

              private fun now(): Long = System.currentTimeMillis() + skew

              private val secondLevel = setOf("co", "com", "org", "net", "gov", "edu", "ac", "or", "ne", "go")

              private fun base(host: String): String {
                  if (host.contains(':') || host.all { it.isDigit() || it == '.' }) return host
                  val p = host.split('.')
                  if (p.size <= 2) return host
                  val n = if (p.last().length == 2 && p[p.size - 2] in secondLevel) 3 else 2
                  return p.takeLast(n).joinToString(".")
              }

              private fun sibling(e: Entry, url: HttpUrl): Boolean {
                  if (base(e.origin) != base(url.host)) return false
                  if (e.c.secure && !url.isHttps) return false
                  val p = e.c.path
                  return p == "/" || url.encodedPath.startsWith(p)
              }

              @Synchronized
              override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) {
                  val now = now()
                  for (c in cookies) {
                      store.removeAll { it.c.name == c.name && it.c.domain == c.domain && it.c.path == c.path }
                      if (c.expiresAt > now && c.value.isNotEmpty()) store.add(Entry(c, url.host))
                  }
              }

              @Synchronized
              fun addLoose(url: HttpUrl, name: String, value: String) {
                  if (name.isEmpty() || value.isEmpty()) return
                  try {
                      val c = Cookie.Builder().name(name).value(value).hostOnlyDomain(url.host).path("/").build()
                      store.removeAll { it.c.name == name && it.c.domain == c.domain && it.c.path == "/" }
                      store.add(Entry(c, url.host))
                  } catch (e: Exception) {
                      // ignore
                  }
              }

              @Synchronized
              override fun loadForRequest(url: HttpUrl): List<Cookie> {
                  val now = now()
                  store.removeAll { it.c.expiresAt <= now }
                  val out = ArrayList<Cookie>()
                  val seen = HashSet<String>()
                  for (e in store.sortedByDescending { it.c.path.length }) {
                      if (e.c.name in seen) continue
                      if (e.c.matches(url) || sibling(e, url)) {
                          out.add(e.c)
                          seen.add(e.c.name)
                      }
                  }
                  val f = fixed
                  if (f.isNotBlank()) {
                      for (part in f.split(';')) {
                          val i = part.indexOf('=')
                          if (i <= 0) continue
                          val n = part.substring(0, i).trim()
                          val v = part.substring(i + 1).trim()
                          if (n.isEmpty() || n in seen) continue
                          try {
                              out.add(Cookie.Builder().name(n).value(v).domain(url.host).build())
                          } catch (e: Exception) {
                              // ignore malformed manual cookie
                          }
                      }
                  }
                  return out
              }

              @Synchronized
              fun clear() {
                  store.clear()
                  skew = 0L
              }
          }

          object Http {
              val jar = MemoryCookieJar()

              private fun where(url: HttpUrl): String = url.host + url.encodedPath.takeLast(60)

              private val logger = Interceptor { chain ->
                  val req = chain.request()
                  val t0 = System.currentTimeMillis()
                  val sent = req.header("Cookie")?.split(';')?.map { it.substringBefore('=').trim() } ?: emptyList()
                  try {
                      val resp = chain.proceed(req)

                      resp.headers.getDate("Date")?.let { d ->
                          val diff = d.time - System.currentTimeMillis()
                          jar.skew = if (abs(diff) > 300_000L) diff else 0L
                      }

                      val rawSet = resp.headers("Set-Cookie")
                      for (h in rawSet) {
                          if (Cookie.parse(req.url, h) == null) {
                              val nv = h.substringBefore(';')
                              val i = nv.indexOf('=')
                              if (i > 0) {
                                  val n = nv.substring(0, i).trim()
                                  jar.addLoose(req.url, n, nv.substring(i + 1).trim())
                                  NetLog.add("lenient cookie kept: $n")
                              }
                          }
                      }

                      val set = rawSet.map { it.substringBefore('=').trim() }
                      val loc = resp.header("Location")?.let { req.url.resolve(it)?.host }
                      val sb = StringBuilder()
                      sb.append(resp.code).append(' ').append(req.method).append(' ').append(where(req.url))
                      sb.append("  ").append(System.currentTimeMillis() - t0).append("ms")
                      sb.append("  cookies sent=").append(if (sent.isEmpty()) "none" else sent.joinToString(","))
                      if (set.isNotEmpty()) sb.append("  set=").append(set.joinToString(","))
                      if (loc != null) sb.append("  -> ").append(loc)
                      NetLog.add(sb.toString())
                      resp
                  } catch (e: IOException) {
                      NetLog.add("ERR " + req.method + " " + where(req.url) + "  " + e.javaClass.simpleName + ": " + e.message)
                      throw e
                  }
              }

              val client: OkHttpClient = OkHttpClient.Builder()
                  .cookieJar(jar)
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(25, TimeUnit.SECONDS)
                  .followRedirects(true)
                  .followSslRedirects(true)
                  .retryOnConnectionFailure(true)
                  .addNetworkInterceptor(logger)
                  .build()

              private val tokenRe = Regex("^[!#$%&'*+.^_`|~0-9A-Za-z-]+$")

              fun cleanHeaders(m: Map<String, String>): LinkedHashMap<String, String> {
                  val out = LinkedHashMap<String, String>()
                  for ((k, v0) in m) {
                      val v = v0.trim()
                      val bad = v.any { (it <= '\u001f' && it != '\t') || it >= '\u007f' }
                      if (!tokenRe.matches(k) || bad) {
                          NetLog.add("skipped invalid header: $k")
                      } else {
                          out[k] = v
                      }
                  }
                  return out
              }
          }
