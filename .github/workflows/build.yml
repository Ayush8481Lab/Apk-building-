          @Composable
          fun CategoryList(vm: MainVM, modifier: Modifier) {
              val cats = vm.cats()
              val state = rememberLazyListState()
              BoxWithConstraints(modifier) {
                  val pad = (maxHeight / 2 - 29.dp).coerceAtLeast(0.dp)
                  LaunchedEffect(vm.catIdx) { state.scrollToItem(vm.catIdx) }
                  LazyColumn(state = state, contentPadding = PaddingValues(vertical = pad)) {
                      itemsIndexed(cats) { i, g ->
                          val sel = i == vm.catIdx
                          Box(
                              Modifier.padding(start = 25.dp, end = 48.dp).fillMaxWidth().height(58.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(if (sel) (if (vm.pane == 1) SelGold else Color(0xFF2E2E2E)) else Color.Transparent)
                                  .tap {
                                      vm.setCat(i)
                                      vm.pane = 2
                                  },
                              contentAlignment = Alignment.CenterStart
                          ) {
                              Text(
                                  g, Modifier.padding(start = 18.dp), fontSize = 23.sp, color = Color.White,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }
              }
          }

          /* ================================================================================ GUIDE */
          @Composable
          fun VideoSurface(pc: PlayerController, resize: Int, modifier: Modifier) {
              androidx.compose.ui.viewinterop.AndroidView(
                  factory = { c ->
                      androidx.media3.ui.PlayerView(c).apply {
                          useController = false
                          player = pc.player
                          setShutterBackgroundColor(android.graphics.Color.BLACK)
                          setKeepContentOnPlayerReset(true)
                          isFocusable = false
                          isFocusableInTouchMode = false
                          keepScreenOn = true
                      }
                  },
                  update = {
                      it.resizeMode = resize
                      if (it.player !== pc.player) it.player = pc.player
                  },
                  onRelease = { it.player = null },
                  modifier = modifier
              )
          }

          @Composable
          fun GuidePane(vm: MainVM, pc: PlayerController, modifier: Modifier) {
              Column(modifier) {
                  Row(Modifier.padding(top = 18.dp).height(267.dp).fillMaxWidth()) {
                      Box(
                          Modifier.width(474.dp).fillMaxHeight().clip(RoundedCornerShape(10.dp)).background(Color.Black)
                      ) {
                          if (vm.current != null) VideoSurface(pc, 0, Modifier.fillMaxSize())
                          else Text("Press OK on a channel", Modifier.align(Alignment.Center), color = TextDim)
                          if (pc.buffering) {
                              CircularProgressIndicator(Modifier.align(Alignment.Center).size(40.dp), color = Gold, strokeWidth = 4.dp)
                          }
                          pc.error?.let {
                              Text(
                                  it.lineSequence().first(), Modifier.align(Alignment.BottomCenter).padding(8.dp),
                                  color = Color.White, fontSize = 13.sp, textAlign = TextAlign.Center
                              )
                          }
                      }
                      Spacer(Modifier.width(33.dp))
                      ProgramInfo(vm, vm.shown.getOrNull(vm.chIdx), Modifier.weight(1f).fillMaxHeight().padding(end = 36.dp))
                  }
                  Spacer(Modifier.height(16.dp))
                  GuideGrid(vm, Modifier.weight(1f).fillMaxWidth(), details = false, translucent = false)
              }
          }

          @Composable
          fun ProgramInfo(vm: MainVM, ch: Channel?, modifier: Modifier) {
              val p = if (ch != null) vm.programAt(ch, vm.selTime) else null
              Row(modifier) {
                  Column(Modifier.weight(1f)) {
                      Text(
                          p?.title ?: ch?.name ?: "", fontSize = 26.sp, color = Color.White,
                          maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.Medium
                      )
                      if (p != null) {
                          Spacer(Modifier.height(6.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(range(p), fontSize = 19.sp, color = TextDim)
                              Spacer(Modifier.width(14.dp))
                              MiniBar(if (vm.now >= p.start && vm.now < p.stop) progressOf(p, vm.now) else 0f)
                              Spacer(Modifier.width(14.dp))
                              Text(minsText(p, vm.now), fontSize = 19.sp, color = TextDim)
                          }
                          Spacer(Modifier.height(10.dp))
                          Text(p.desc, fontSize = 19.sp, color = TextDim, maxLines = 3, overflow = TextOverflow.Ellipsis)
                      } else if (ch != null) {
                          Spacer(Modifier.height(6.dp))
                          Text("No information available", fontSize = 19.sp, color = TextDim)
                      }
                  }
                  if (ch != null) {
                      Column(horizontalAlignment = Alignment.End) {
                          val fav = ch.url in vm.favorites
                          Icon(
                              if (fav) Icons.Filled.Star else Icons.Filled.StarBorder, null,
                              tint = if (fav) Gold else TextDim, modifier = Modifier.size(30.dp)
                          )
                          Spacer(Modifier.height(6.dp))
                          Text(ch.group, fontSize = 20.sp, color = Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                  }
              }
          }

          @Composable
          fun GuideGrid(vm: MainVM, modifier: Modifier, details: Boolean, translucent: Boolean) {
              val list = vm.shown
              val gs = vm.gridStart
              val state = rememberLazyListState()
              val focused = vm.pane == 2 || vm.guideOverlay

              LaunchedEffect(vm.chIdx, list.size, details) {
                  if (list.isNotEmpty()) {
                      val vis = state.layoutInfo.visibleItemsInfo
                      val i = vm.chIdx
                      if (vis.isEmpty() || i <= vis.first().index || i >= vis.last().index) {
                          state.scrollToItem((i - 2).coerceAtLeast(0))
                      }
                  }
              }

              Box(modifier) {
                  Column(Modifier.fillMaxSize()) {
                      GuideHeader(vm, gs)
                      if (list.isEmpty()) {
                          Box(Modifier.fillMaxWidth().padding(40.dp), contentAlignment = Alignment.Center) {
                              Text(
                                  if (vm.catName() == G_FAV) "No favorites yet. Long-press OK on a channel to add one."
                                  else "No channels here", color = TextDim, fontSize = 20.sp
                              )
                          }
                      }
                      LazyColumn(state = state, modifier = Modifier.fillMaxWidth().weight(1f)) {
                          itemsIndexed(list, key = { _, c -> c.num }) { i, ch ->
                              GuideRow(vm, ch, i, i == vm.chIdx && focused, gs, translucent, details && i == vm.chIdx && focused)
                          }
                      }
                  }
                  val x = (vm.now - gs) / 60000f * PPM
                  if (x in 0f..GRID_W) {
                      Box(
                          Modifier.padding(start = 376.dp + x.dp, top = 40.dp).width(1.5.dp).fillMaxHeight()
                              .background(LineC.copy(alpha = 0.75f))
                      )
                      Box(Modifier.padding(start = 376.dp + x.dp - 4.dp, top = 36.dp).size(9.dp).clip(CircleShape).background(LineC))
                  }
              }
          }

          @Composable
          fun GuideHeader(vm: MainVM, gs: Long) {
              Box(Modifier.fillMaxWidth().height(44.dp)) {
                  Text(
                      dateTime(vm.now), Modifier.align(Alignment.CenterStart), fontSize = 22.sp, color = GoldSoft,
                      maxLines = 1
                  )
                  Box(Modifier.padding(start = 376.dp).fillMaxSize()) {
                      for (i in 0..4) {
                          Text(
                              hm(gs + i * SLOT),
                              Modifier.align(Alignment.CenterStart).offset(x = (i * 30 * PPM - 41f).dp),
                              fontSize = 22.sp, color = TextDim, maxLines = 1
                          )
                      }
                  }
                  HorizontalDivider(Modifier.align(Alignment.BottomCenter), color = Color(0xFF303030))
              }
          }

          @Composable
          fun GuideRow(vm: MainVM, ch: Channel, idx: Int, sel: Boolean, gs: Long, tr: Boolean, showDetail: Boolean) {
              val playing = ch.url == vm.current?.url
              val progs = vm.programs(ch)
              val selP = if (sel) vm.programAt(ch, vm.selTime) else null
              val a = if (tr) 0.78f else 1f
              Column(Modifier.fillMaxWidth()) {
                  Row(
                      Modifier.fillMaxWidth().height(58.dp).tap {
                          vm.chIdx = idx
                          vm.pane = 2
                          vm.activateRow()
                      }
                  ) {
                      Row(Modifier.width(376.dp).fillMaxHeight(), verticalAlignment = Alignment.CenterVertically) {
                          Text(
                              if (ch.num > 0) ch.num.toString() else "", Modifier.width(40.dp),
                              textAlign = TextAlign.Center, fontSize = 22.sp, color = if (sel) Gold else Color.White
                          )
                          Spacer(Modifier.width(13.dp))
                          Logo(ch, 66.dp, 42.dp)
                          Spacer(Modifier.width(15.dp))
                          Text(
                              ch.name, Modifier.weight(1f), fontSize = 22.sp, fontWeight = FontWeight.Bold,
                              color = if (sel) Gold else Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis
                          )
                          if (playing) Icon(Icons.Filled.PlayArrow, null, tint = Gold, modifier = Modifier.size(30.dp))
                          Spacer(Modifier.width(8.dp))
                      }
                      Box(Modifier.weight(1f).fillMaxHeight().clipToBounds()) {
                          val end = gs + (GRID_W / PPM * 60000f).toLong()
                          var any = false
                          for (p in progs) {
                              if (p.stop <= gs || p.start >= end) continue
                              val s = maxOf(p.start, gs)
                              val e = minOf(p.stop, end)
                              val w = (e - s) / 60000f * PPM
                              if (w < 6f) continue
                              any = true
                              val left = (s - gs) / 60000f * PPM
                              val live = vm.now >= p.start && vm.now < p.stop
                              val isSel = selP != null && selP.start == p.start
                              val bg = when {
                                  isSel -> if (live) SelGold else CellSel
                                  sel || playing -> CellRowBg
                                  else -> CellBg
                              }
                              Box(
                                  Modifier.offset(x = left.dp).width(w.dp).fillMaxHeight()
                                      .padding(horizontal = 1.5.dp, vertical = 3.dp)
                                      .clip(RoundedCornerShape(4.dp)).background(bg.copy(alpha = a)),
                                  contentAlignment = Alignment.CenterStart
                              ) {
                                  Text(
                                      p.title, Modifier.padding(start = 16.dp, end = 8.dp), fontSize = 21.sp,
                                      color = if (sel || playing) Color.White else Color(0xFFB4B4B4),
                                      maxLines = 1, overflow = TextOverflow.Ellipsis
                                  )
                              }
                          }
                          if (!any) {
                              Box(
                                  Modifier.fillMaxSize().padding(horizontal = 1.5.dp, vertical = 3.dp)
                                      .clip(RoundedCornerShape(4.dp))
                                      .background((if (sel) CellRowBg else CellBg).copy(alpha = a)),
                                  contentAlignment = Alignment.CenterStart
                              ) {
                                  Text("No information", Modifier.padding(start = 16.dp), fontSize = 20.sp, color = TextDim)
                              }
                          }
                      }
                  }
                  if (showDetail) {
                      Row(Modifier.fillMaxWidth().padding(vertical = 10.dp)) {
                          Box(Modifier.width(376.dp), contentAlignment = Alignment.Center) { Logo(ch, 190.dp, 100.dp) }
                          ProgramInfo(vm, ch, Modifier.weight(1f).padding(start = 16.dp, end = 30.dp))
                      }
                  }
              }
          }

