          @Composable
          fun FormDialog(
              title: String, labels: List<String>, okLabel: String,
              onDismiss: () -> Unit, onOk: (List<String>) -> Unit
          ) {
              val values = remember { mutableStateListOf<String>().apply { labels.forEach { add("") } } }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(8.dp)) {
