name: Build Independent WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Media Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session

      - name: Initialize Capacitor Config & Set URL
        run: |
          mkdir -p www
          echo "<html><body>Loading Music8481...</body></html>" > www/index.html
          
          npx cap init Music8481 com.music8481.app --web-dir www

          rm capacitor.config.ts || true
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.music8481.app",
            "appName": "Music8481",
            "webDir": "www",
            "server": {
              "url": "https://ayushgaana.vercel.app",
              "cleartext": true
            }
          }
          EOF

      - name: Add Native Android Platform
        run: npx cap add android

      # DEEP FIX 1: Modifies the downloaded plugin directly to strictly enforce Android 14+ Foreground Media rules. 
      # Without this, Android silently crashes the Notification and kills background play!
      - name: Patch Media Session Plugin for Android 14+
        run: |
          node -e "
          const fs = require('fs');
          const path = 'node_modules/@capgo/capacitor-media-session/android/src/main/AndroidManifest.xml';
          if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, 'utf8');
              xml = xml.replace('<service', '<service android:foregroundServiceType=\"mediaPlayback\"');
              fs.writeFileSync(path, xml);
          }
          "

      # DEEP FIX 2: Uses Node.js to securely inject all 6 necessary Wake Lock & Background permissions
      - name: Inject Deep Android Permissions
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\" />
          \`;
          xml = xml.replace('<application', perms + '<application');
          fs.writeFileSync(path, xml);
          "

      # DEEP FIX 3: Writes a Custom Native Java file to hold CPU Wake Locks and override WebView lifecycle
      - name: Inject Native Premium Background Engine
        run: |
          cat <<EOF > android/app/src/main/java/com/music8481/app/MainActivity.java
          package com.music8481.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.content.Context;
          import android.os.PowerManager;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Trigger Android 13+ Notification Permission Popup automatically
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  // Acquire CPU WakeLock to prevent Deep Sleep stuttering
                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Music8481::BackgroundAudioLock");
                  wakeLock.acquire();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings settings = this.bridge.getWebView().getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false); // Allows auto-playing next track in background
                  }
              }

              // MAGIC FIX: Prevent Android OS from pausing the WebView engine when minimizing the app
              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null) {
                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume(); 
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release(); // Clean up memory
                  }
              }
          }
          EOF

      - name: Fix Kotlin Duplicate Classes (Gradle Bug)
        run: |
          cat <<EOF >> android/app/build.gradle
          
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Generate App Icon & Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p assets
          
          convert -size 512x512 xc:"#1DB954" assets/icon.png
          convert -size 2732x2732 xc:"#000000" assets/splash.png
          
          npx @capacitor/assets generate --android

      - name: Fix Gradle Daemon & Memory Issues (CI Stability)
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Generate Android Keystore (For App Signing)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      - name: Build & Auto-Sign Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload Independent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Independent-APK
          path: android/app/build/outputs/apk/release/app-release.apk
