              val slot = 30 * 60_000L
              val start = remember(vm.now / slot) { vm.now / slot * slot }
              val end = start + 6 * 3_600_000L
              val list = remember(vm.group, vm.channels, vm.favorites, vm.recents) { vm.filter(vm.group) }
              val dpm = 4
              Column(Modifier.fillMaxSize()) {
                  if (vm.epg.byId.isEmpty()) {
                      Text(
