                  Spacer(Modifier.height(4.dp))
                  Text(ch.name, fontSize = 10.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, color = if (selected) Color.White else Dim)
              }
          }

          @Composable
          fun ProgramRow(vm: MainVM, p: Program, onClick: () -> Unit) {
              val live = vm.now >= p.start && vm.now < p.stop
              val past = vm.now >= p.stop
              Row(
                  Modifier.fillMaxWidth().alpha(if (past) 0.55f else 1f)
                      .focusGlow(corner = 20.dp, focusScale = 1.03f, onClick = onClick)
                      .glass(RoundedCornerShape(20.dp), if (live) 0.18f else 0.09f, if (live) Accent else Color.White)
                      .padding(10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.width(150.dp).aspectRatio(16f / 9f).clip(RoundedCornerShape(12.dp))
                          .background(Color.White.copy(alpha = 0.08f))
                  ) { Banner(bannerUrl(p), Modifier.fillMaxSize()) }
                  Spacer(Modifier.width(14.dp))
                  Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      Row {
                          Text("${hm(p.start)} - ${hm(p.stop)}", color = Accent, fontSize = 12.sp)
                          if (live) Text("   LIVE", color = Color(0xFFFF6B6B), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                      Text(p.title, fontWeight = FontWeight.Bold, fontSize = 16.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      val sub = listOf(p.genre, p.category).filter { it.isNotBlank() }.distinct().joinToString("  -  ")
                      if (sub.isNotEmpty()) Text(sub, color = Dim, fontSize = 12.sp, maxLines = 1)
                      if (p.desc.isNotBlank()) Text(p.desc, color = Dim, fontSize = 12.sp, maxLines = 2, overflow = TextOverflow.Ellipsis)
                      if (live) {
                          LinearProgressIndicator(
                              progress = { progressOf(p, vm.now) },
                              modifier = Modifier.fillMaxWidth().padding(top = 4.dp).height(3.dp),
                              color = Accent, trackColor = Color.White.copy(alpha = 0.15f)
                          )
                      }
                  }
              }
          }

          /* ============================================================= SETTINGS */

          @Composable
          fun Section(title: String, content: @Composable () -> Unit) {
              Column(
                  Modifier.fillMaxWidth().glass(RoundedCornerShape(26.dp), 0.09f).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text(title, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                  content()
              }
          }

          @Composable
          fun SettingsTab(vm: MainVM) {
              val mins = if (vm.expire > 0) ((vm.expire * 1000 - (vm.now + Http.jar.skew)) / 60_000L).coerceAtLeast(0) else -1L
              val t = vm.token
              val masked = "*".repeat((t.length - 4).coerceAtLeast(0)) + t.takeLast(4)
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(22.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Section("Account") {
                      Text("Access token: $masked", color = Dim)
                      Text("${vm.channels.size} channels", color = Dim)
                      GlassButton("Change access token", icon = Icons.Filled.Lock) { vm.logout() }
                  }
                  Section("Session") {
                      Text(
                          if (mins >= 0) "Keys and stream links expire in about $mins min" else "Expiry unknown",
                          color = Dim
                      )
                      Text("Reloaded automatically 10 minutes before expiry.", color = Dim, fontSize = 12.sp)
                      GlassButton("Refresh now", icon = Icons.Filled.Refresh) { vm.refresh() }
                  }
                  Section("Player") {
                      OutlinedTextField(
                          value = vm.userAgent, onValueChange = { vm.setUa(it) }, singleLine = true,
                          label = { Text("Stream User-Agent") }, colors = glassFieldColors(),
                          shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()
                      )
                      OutlinedTextField(
                          value = vm.extraHeaders, onValueChange = { vm.updateExtraHeaders(it) },
                          label = { Text("Extra headers (Name: value, one per line)") },
                          minLines = 3, colors = glassFieldColors(),
                          shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()
                      )
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Resume last channel on launch", Modifier.weight(1f))
                          Switch(checked = vm.resumeLast, onCheckedChange = { vm.setResume(it) })
                      }
                  }
                  Text(
                      "Long-press (or hold OK) on a channel to add it to Favorites.",
                      fontSize = 12.sp, color = Dim
                  )
              }
          }
