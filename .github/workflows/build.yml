                  val f = store.file(pl.id)
                  if (!f.exists()) return
                  val parsed = withContext(Dispatchers.IO) { M3uParser.parse(f.readText()) }
                  channels = parsed.channels
                  groups = parsed.channels.map { it.group }.distinct()
                  if (group != G_ALL && group != G_FAV && group != G_RECENT && group !in groups) group = G_ALL
                  if (parsed.channels.isEmpty()) toast = "No channels found in this playlist"
                  loadEpg(pl, parsed, forceEpg)

                  if (!resumed) {
                      resumed = true
                      if (resumeLast && store.lastChannel.isNotEmpty()) {
                          parsed.channels.firstOrNull { it.url == store.lastChannel }?.let {
                              play(it, parsed.channels)
                              fullscreen = true
                          }
                      }
                  }
              }

              private fun loadEpg(pl: Playlist, parsed: Parsed, force: Boolean) {
                  val url = pl.epg.ifBlank { parsed.epgUrl }
                  val f = store.epgFile(pl.id)
                  viewModelScope.launch {
                      try {
                          val data = withContext(Dispatchers.IO) {
                              val stale = autoRefresh && f.exists() &&
                                  System.currentTimeMillis() - f.lastModified() > 12 * 3_600_000L
                              if ((force || !f.exists() || stale) && url.isNotBlank()) {
                                  Net.download(url, userAgent, f)
                              }
                              if (!f.exists()) return@withContext null
                              val ids = parsed.channels.filter { it.tvgId.isNotEmpty() }
                                  .map { it.tvgId.lowercase() }.toSet()
                              val names = parsed.channels.map { it.name.lowercase() }.toSet()
                              Net.sniff(f.inputStream().buffered()).use {
                                  EpgParser.parse(it, ids, names, System.currentTimeMillis())
                              }
                          }
                          if (data != null && pl.id == activeId) epg = data
                      } catch (e: Exception) {
                          toast = "EPG failed: ${e.message}"
                      }
                  }
              }

              /* ------------------------------------------------------------- channels */

              fun filter(g: String): List<Channel> = when (g) {
                  G_ALL -> channels
                  G_FAV -> channels.filter { it.url in favorites }
                  G_RECENT -> recents.mapNotNull { u -> channels.firstOrNull { it.url == u } }
                  else -> channels.filter { it.group == g }
              }

              fun search(q: String): List<Channel> {
                  val s = q.trim().lowercase()
                  if (s.length < 2) return emptyList()
                  return channels.filter {
                      it.name.lowercase().contains(s) ||
                          it.group.lowercase().contains(s) ||
                          (nowNext(it).first?.title?.lowercase()?.contains(s) == true)
                  }.take(300)
              }

              fun toggleFav(ch: Channel) {
                  favorites = if (ch.url in favorites) favorites - ch.url else favorites + ch.url
                  store.saveFavorites(favorites)
              }

              fun programs(ch: Channel): List<Program> {
                  val direct = if (ch.tvgId.isNotEmpty()) epg.byId[ch.tvgId.lowercase()] else null
                  if (direct != null) return direct
                  val id = epg.nameToId[ch.name.lowercase()] ?: return emptyList()
                  return epg.byId[id] ?: emptyList()
              }

              fun nowNext(ch: Channel): Pair<Program?, Program?> {
                  val l = programs(ch)
                  if (l.isEmpty()) return Pair(null, null)
                  val i = l.indexOfFirst { now >= it.start && now < it.stop }
                  return if (i >= 0) Pair(l[i], l.getOrNull(i + 1))
                  else Pair(null, l.firstOrNull { it.start > now })
              }

              /* -------------------------------------------------------------- playback */

              fun play(ch: Channel, list: List<Channel>) {
                  if (current?.url != ch.url) previous = current
                  current = ch
                  zapList = list
                  store.lastChannel = ch.url
                  recents = (listOf(ch.url) + recents.filter { it != ch.url }).take(30)
                  store.saveRecents(recents)
                  playNonce++
              }

              fun zap(d: Int) {
                  val l = zapList
                  if (l.isEmpty()) return
                  val i = l.indexOfFirst { it.url == current?.url }
                  play(l[(i + d + l.size).mod(l.size)], l)
