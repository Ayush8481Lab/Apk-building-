          val Accent = Color(0xFF7AB8FF)
          val Accent2 = Color(0xFFB69CFF)
          val Ink = Color(0xFF05070D)
          val Dim = Color(0xFFB5BDCC)

          /** Shared 0..360 phase that drives every glow / aurora animation (read only in draw phase). */
          val LocalGlow = compositionLocalOf<State<Float>> { mutableStateOf(0f) }

          @Composable
          fun AppTheme(content: @Composable () -> Unit) {
              val t = rememberInfiniteTransition(label = "glow")
              val phase = t.animateFloat(
                  initialValue = 0f,
                  targetValue = 360f,
                  animationSpec = infiniteRepeatable(animation = tween(9000, easing = LinearEasing), repeatMode = RepeatMode.Restart),
                  label = "phase"
              )
              CompositionLocalProvider(LocalGlow provides phase) {
                  MaterialTheme(
                      colorScheme = darkColorScheme(
                          primary = Accent,
                          onPrimary = Color.Black,
                          background = Ink,
                          surface = Color(0xFF121826),
                          surfaceVariant = Color(0x33FFFFFF),
                          onSurface = Color.White,
                          onBackground = Color.White,
                          onSurfaceVariant = Dim,
                          secondaryContainer = Color(0xFF26324A)
                      ),
                      content = content
                  )
              }
          }

          /** Slowly drifting colour blobs - gives the glass something to refract. */
          @Composable
          fun Aurora(modifier: Modifier = Modifier) {
              val phase = LocalGlow.current
              Canvas(modifier.fillMaxSize()) {
                  drawRect(Ink)
                  val r = phase.value * (PI.toFloat() / 180f)
                  val w = size.width
                  val h = size.height
                  val big = maxOf(w, h)
                  fun blob(c: Color, cx: Float, cy: Float, rad: Float) {
                      drawCircle(
                          brush = Brush.radialGradient(listOf(c, Color.Transparent), center = Offset(cx, cy), radius = rad),
                          radius = rad,
                          center = Offset(cx, cy)
                      )
                  }
                  blob(Color(0x663D7BFF), w * (0.2f + 0.12f * sin(r)), h * (0.25f + 0.10f * cos(r)), big * 0.6f)
                  blob(Color(0x55A855FF), w * (0.8f + 0.10f * cos(r)), h * (0.30f + 0.12f * sin(r * 2f)), big * 0.55f)
                  blob(Color(0x4422D3EE), w * (0.5f + 0.15f * sin(r * 2f)), h * (0.90f + 0.06f * cos(r * 3f)), big * 0.6f)
              }
          }

          /** Frosted "liquid glass" surface: tinted gradient, specular top sheen, bright rim. */
          fun Modifier.glass(
              shape: Shape = RoundedCornerShape(24.dp),
              alpha: Float = 0.12f,
              tint: Color = Color.White
          ): Modifier = this
              .clip(shape)
              .background(Brush.linearGradient(listOf(tint.copy(alpha = alpha * 1.7f), tint.copy(alpha = alpha * 0.6f))))
              .drawWithContent {
                  drawContent()
                  drawRect(
                      brush = Brush.verticalGradient(
                          listOf(Color.White.copy(alpha = 0.16f), Color.Transparent),
                          startY = 0f,
                          endY = size.height * 0.45f
                      ),
                      size = Size(size.width, size.height * 0.45f)
                  )
              }
              .border(
                  1.dp,
                  Brush.linearGradient(listOf(Color.White.copy(alpha = 0.55f), Color.White.copy(alpha = 0.08f), Color.White.copy(alpha = 0.28f))),
                  shape
              )

          /**
           * Blends the edges of an image into whatever is behind it (like TV / OTT hero banners).
           * left / top / bottom = fraction of the size (0..1) over which that edge fades to transparent.
           */
          fun Modifier.fadeEdges(left: Float = 0f, top: Float = 0f, bottom: Float = 0f): Modifier =
              this
                  .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                  .drawWithContent {
                      drawContent()
                      if (left > 0f) {
                          drawRect(
                              brush = Brush.horizontalGradient(0f to Color.Transparent, left to Color.Black, 1f to Color.Black),
                              blendMode = BlendMode.DstIn
                          )
                      }
                      if (top > 0f) {
                          drawRect(
                              brush = Brush.verticalGradient(0f to Color.Transparent, top to Color.Black, 1f to Color.Black),
                              blendMode = BlendMode.DstIn
                          )
                      }
                      if (bottom > 0f) {
                          drawRect(
                              brush = Brush.verticalGradient(0f to Color.Black, (1f - bottom) to Color.Black, 1f to Color.Transparent),
                              blendMode = BlendMode.DstIn
                          )
                      }
                  }

          /**
           * Apple TV style focus: soft springy scale + slight lift, layered halo that fades in smoothly,
           * a brighter surface and a travelling light on the rim.
           * Apply BEFORE .glass() so the scale/halo wrap the glass surface.
           */
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun Modifier.focusGlow(
              corner: Dp = 22.dp,
              focusScale: Float = 1.06f,
              onFocused: (() -> Unit)? = null,
              onFocusChange: ((Boolean) -> Unit)? = null,
              onLongClick: (() -> Unit)? = null,
              onClick: () -> Unit
          ): Modifier {
              val src = remember { MutableInteractionSource() }
              val focused by src.collectIsFocusedAsState()
              val pressed by src.collectIsPressedAsState()
              val scale by animateFloatAsState(
                  if (pressed) 0.97f else if (focused) focusScale else 1f,
                  spring(dampingRatio = 0.78f, stiffness = 240f),
                  label = "scale"
              )
              val glow by animateFloatAsState(
                  if (focused) 1f else 0f,
                  tween(450, easing = FastOutSlowInEasing),
                  label = "glow"
              )
              val phase = LocalGlow.current
              val cb by rememberUpdatedState(onFocused)
              val cb2 by rememberUpdatedState(onFocusChange)
              LaunchedEffect(focused) {
                  cb2?.invoke(focused)
                  if (focused) cb?.invoke()
              }

              return this
                  .graphicsLayer {
                      scaleX = scale
                      scaleY = scale
                      translationY = -glow * 3.dp.toPx()
                  }
                  .drawBehind {
                      if (glow > 0.01f) {
                          val r = corner.toPx()
                          for (i in 1..6) {
                              val g = i * 4.dp.toPx()
                              drawRoundRect(
                                  color = Accent.copy(alpha = 0.10f * glow * (1f - i / 7f)),
                                  topLeft = Offset(-g, -g),
                                  size = Size(size.width + 2 * g, size.height + 2 * g),
                                  cornerRadius = CornerRadius(r + g)
                              )
                          }
                      }
                  }
                  .drawWithContent {
                      drawContent()
                      if (glow > 0.01f) {
                          val r = CornerRadius(corner.toPx())
                          drawRoundRect(color = Color.White.copy(alpha = 0.07f * glow), cornerRadius = r)
                          val rad = phase.value * (PI.toFloat() / 180f)
                          val n = 24
                          val cols = List(n + 1) { i ->
                              val k = i % n
                              val s = 0.5f + 0.5f * sin(2f * PI.toFloat() * k / n - rad)
                              lerp(Accent2, Color.White, s * s)
                          }
                          drawRoundRect(
                              brush = Brush.sweepGradient(cols),
                              cornerRadius = r,
                              style = Stroke(width = 2.5.dp.toPx()),
                              alpha = glow
                          )
                      }
                  }
                  .combinedClickable(
                      interactionSource = src,
                      indication = null,
                      onLongClick = onLongClick,
                      onClick = onClick
                  )
          }

          @Composable
          fun GlassButton(
              label: String,
              modifier: Modifier = Modifier,
              icon: ImageVector? = null,
              primary: Boolean = false,
              onClick: () -> Unit
          ) {
              Row(
                  modifier
                      .focusGlow(corner = 100.dp, focusScale = 1.08f, onClick = onClick)
                      .glass(RoundedCornerShape(50), if (primary) 0.30f else 0.12f, if (primary) Accent else Color.White)
                      .padding(horizontal = 22.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.Center
              ) {
                  if (icon != null) {
                      Icon(icon, null, tint = Color.White)
                      Spacer(Modifier.width(8.dp))
                  }
                  Text(label, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1)
              }
          }

          @Composable
          fun GlassIconButton(
              icon: ImageVector,
              desc: String,
              modifier: Modifier = Modifier,
              tint: Color = Color.White,
              size: Dp = 44.dp,
              onClick: () -> Unit
          ) {
              Box(
                  modifier.size(size)
                      .focusGlow(corner = 100.dp, focusScale = 1.15f, onClick = onClick)
                      .glass(CircleShape, 0.14f),
                  contentAlignment = Alignment.Center
              ) {
                  Icon(icon, desc, tint = tint, modifier = Modifier.size(size * 0.5f))
              }
          }

          @Composable
          fun GlassPill(
              label: String,
              selected: Boolean,
              modifier: Modifier = Modifier,
              icon: ImageVector? = null,
              onClick: () -> Unit
          ) {
              Row(
                  modifier
                      .focusGlow(corner = 100.dp, focusScale = 1.08f, onClick = onClick)
                      .glass(RoundedCornerShape(50), if (selected) 0.30f else 0.10f, if (selected) Accent else Color.White)
                      .padding(horizontal = if (label.isEmpty()) 12.dp else 16.dp, vertical = 9.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (icon != null) {
                      Icon(icon, null, tint = if (selected) Color.White else Dim, modifier = Modifier.size(20.dp))
                      if (label.isNotEmpty()) Spacer(Modifier.width(8.dp))
                  }
                  if (label.isNotEmpty()) {
                      Text(
                          label, color = if (selected) Color.White else Dim, fontSize = 14.sp,
                          fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal,
                          maxLines = 1, overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

          @Composable
          fun glassFieldColors() = OutlinedTextFieldDefaults.colors(
              focusedBorderColor = Accent,
              unfocusedBorderColor = Color.White.copy(alpha = 0.28f),
              focusedContainerColor = Color.White.copy(alpha = 0.07f),
              unfocusedContainerColor = Color.White.copy(alpha = 0.04f),
              cursorColor = Accent,
              focusedLabelColor = Accent,
              unfocusedLabelColor = Dim
          )
