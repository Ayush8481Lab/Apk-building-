          /* =============================================================== HOME */

          /** Left panel entries: (tab, label, icon). Guide was removed. */
          private val NAV = listOf(
              Triple(0, "TV", Icons.Filled.LiveTv),
              Triple(2, "Search", Icons.Filled.Search),
              Triple(3, "Settings", Icons.Filled.Settings)
          )

          private fun catIcon(g: String): ImageVector = when (g) {
              G_ALL -> Icons.Filled.LiveTv
              G_FAV -> Icons.Filled.Star
              G_RECENT -> Icons.Filled.History
              else -> Icons.Filled.Category
          }

          /**
           * TiviMate-like home. The side panels PUSH the player / rows to the right instead of floating over them:
           *   level 0:  | player + rows |
           *   level 1:  | categories | player + rows |          (Back, or LEFT on a channel logo)
           *   level 2:  | TV / Search / Settings | categories | player + rows |   (Back again)
           * TV -> level 1 (pick a category), a category -> level 0, Search / Settings -> level 0 on that page.
           */
          @Composable
          fun HomeScreen(vm: MainVM, pc: PlayerController) {
              val tab = vm.tab
              val navFr = remember { FocusRequester() }
              val catFr = remember { FocusRequester() }
              val onOpen: (Channel, List<Channel>) -> Unit = { ch, l ->
                  vm.play(ch, l)
                  vm.openFullscreen()
              }
              // first click plays in the preview, clicking the playing channel again goes fullscreen
              val onPick: (Channel, List<Channel>) -> Unit = { ch, l ->
                  if (vm.current?.id == ch.id) vm.openFullscreen() else vm.play(ch, l)
              }

              DisposableEffect(Unit) {
                  onDispose { vm.hover = null }
              }

              // move focus into the panel that just slid in
              LaunchedEffect(vm.menuLevel) {
                  if (vm.menuLevel > 0) {
                      delay(320)
                      try {
                          if (vm.menuLevel >= 2) navFr.requestFocus() else catFr.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }

              // TiviMate-like Back: other page -> TV; TV -> categories -> + TV/Search/Settings -> (exit)
              BackHandler(enabled = tab != 0 || vm.menuLevel < 2) {
                  if (tab != 0) {
                      vm.tab = 0
                      vm.menuLevel = 0
                  } else {
                      vm.menuLevel = vm.menuLevel + 1
                  }
              }

              val cur = vm.current ?: vm.channels.firstOrNull()
              val bgUrl = cur?.let { c -> vm.nowNext(c).first?.let { bannerUrl(it) } } ?: ""

              Box(Modifier.fillMaxSize()) {
                  // blurred banner of the playing programme behind the glass
                  Crossfade(bgUrl, animationSpec = tween(900), label = "bg") { u ->
                      if (u.isNotBlank()) {
                          AsyncImage(
                              model = u, contentDescription = null, contentScale = ContentScale.Crop,
                              modifier = Modifier.fillMaxSize().blur(36.dp).alpha(0.38f)
                          )
                      }
                  }
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.verticalGradient(listOf(Color(0x6605070D), Color(0xCC05070D)))
                      )
                  )
                  Row(Modifier.fillMaxSize().systemBarsPadding()) {
                      NavPanel(vm, navFr, catFr)
                      CatPanel(vm, navFr, catFr)
                      Column(Modifier.weight(1f).fillMaxHeight()) {
                          Preview(vm, pc) { vm.openFullscreen() }
                          Box(Modifier.weight(1f).fillMaxWidth()) {
                              when (tab) {
                                  0 -> LiveEpg(vm, onPick)
                                  2 -> SearchTab(vm, onOpen)
                                  else -> SettingsTab(vm)
                              }
                          }
                      }
                  }
              }
          }

          /**
           * Live preview (header), 1.15x taller than v5.2 (137dp -> 158dp wide, 96dp -> 110dp narrow).
           * Left: the shared player. Right: text, auto fitted to the header height:
           *   1  programme name
           *   2  time 02:30--03:00 + progress bar + minutes left      (upcoming programme: "in 2 hours 15 minutes" instead of the bar)
           *   3  description, up to 3 lines
           *   4  "Next: name - in 3 minutes"                           (only for a live programme)
           * While the remote / finger is on a programme card of the rows below, the header shows THAT programme's details.
           * The 16:9 programme banner is drawn behind the right side when there is enough room.
           */
          @Composable
          fun Preview(vm: MainVM, pc: PlayerController, onFull: () -> Unit) {
              val wide = isWide()
              val ch = vm.current
              LaunchedEffect(ch?.id, vm.epgTick) {
                  if (ch != null) {
                      vm.ensureEpg(ch.id, 0)
                      vm.ensureEpg(ch.id, 1)
                  }
              }
              val np = if (ch != null) vm.nowNext(ch).first else null
              val hv = vm.hover
              val hp: Program? = if (hv != null) hv.second else np
              val hc: Channel? = if (hv != null) hv.first else ch
              val live = hp != null && vm.now >= hp.start && vm.now < hp.stop
              val next: Program? = if (live && hc != null) vm.nowNext(hc).second else null
              val url = if (hp != null) bannerUrl(hp) else ""
              val shape = RoundedCornerShape(24.dp)
              val tf = if (wide) 12.sp else 10.sp

              BoxWithConstraints(
                  Modifier.fillMaxWidth()
                      .padding(horizontal = if (wide) 22.dp else 12.dp, vertical = 6.dp)
                      .height(if (wide) 158.dp else 110.dp)
                      .clip(shape)
                      .background(Brush.horizontalGradient(listOf(Color(0xE60A0F1A), Color(0xB3101828))))
                      .border(
                          1.dp,
                          Brush.linearGradient(listOf(Color.White.copy(alpha = 0.45f), Color.White.copy(alpha = 0.06f), Color.White.copy(alpha = 0.2f))),
                          shape
                      )
              ) {
                  val showBanner = maxWidth >= (if (wide) 700.dp else 300.dp)
                  // programme banner: 16:9, pinned to the right, left + bottom edges dissolve into the card
                  if (showBanner) {
                      Box(
                          Modifier.align(Alignment.CenterEnd).fillMaxHeight().aspectRatio(16f / 9f)
                              .alpha(if (wide) 1f else 0.6f)
                              .fadeEdges(left = 0.55f, bottom = 0.22f)
                      ) {
                          Crossfade(url, animationSpec = tween(900), label = "pv") { u ->
                              if (u.isNotBlank()) Banner(u, Modifier.fillMaxSize())
                          }
                      }
                  }
                  // soft scrim for text legibility
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.horizontalGradient(
                              0f to Color(0xB305070D), 0.6f to Color(0x4D05070D), 1f to Color.Transparent
                          )
                      )
                  )
                  Row(
                      Modifier.fillMaxSize().padding(10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      // video: plain box, no glass / glow / overlay on top of it
                      Box(
                          Modifier.fillMaxHeight().aspectRatio(16f / 9f)
                              .clip(RoundedCornerShape(16.dp))
                              .background(Color.Black)
                              .clickable(
                                  interactionSource = remember { MutableInteractionSource() },
                                  indication = null,
                                  onClick = onFull
                              )
                      ) {
                          AndroidView(
                              factory = { c ->
                                  PlayerView(c).apply {
                                      useController = false
                                      player = pc.player
                                      setShutterBackgroundColor(android.graphics.Color.BLACK)
                                      isFocusable = false
                                      isFocusableInTouchMode = false
                                      keepScreenOn = true
                                  }
                              },
                              onRelease = { it.player = null },
                              modifier = Modifier.fillMaxSize()
                          )
                          if (pc.buffering) {
                              CircularProgressIndicator(
                                  Modifier.align(Alignment.Center).size(26.dp), color = Accent, strokeWidth = 3.dp
                              )
                          }
                          pc.error?.let {
                              Text(
                                  it.lineSequence().firstOrNull() ?: "",
                                  Modifier.align(Alignment.Center).padding(6.dp),
                                  color = Color.White, fontSize = 10.sp, textAlign = TextAlign.Center, maxLines = 3
                              )
                          }
                      }
                      Spacer(Modifier.width(14.dp))
                      Column(
                          Modifier.weight(1f).fillMaxHeight()
                              .padding(end = if (showBanner) (if (wide) 140.dp else 40.dp) else 34.dp),
                          verticalArrangement = Arrangement.spacedBy(if (wide) 3.dp else 1.dp, Alignment.CenterVertically)
                      ) {
                          if (hp != null) {
                              Text(
                                  hp.title.ifBlank { "Live now" }, fontSize = if (wide) 18.sp else 13.sp,
                                  fontWeight = FontWeight.ExtraBold, maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("${hm(hp.start)}--${hm(hp.stop)}", color = Accent, fontSize = tf, maxLines = 1)
                                  Spacer(Modifier.width(8.dp))
                                  if (live) {
                                      val left = ((hp.stop - vm.now + 59_999L) / 60_000L).coerceAtLeast(1L)
                                      LinearProgressIndicator(
                                          progress = { progressOf(hp, vm.now) },
                                          modifier = Modifier.weight(1f).height(3.dp),
                                          color = Accent, trackColor = Color.White.copy(alpha = 0.18f)
                                      )
                                      Spacer(Modifier.width(8.dp))
                                      Text("$left min left", color = Dim, fontSize = tf, maxLines = 1)
                                  } else {
                                      Text(untilText(hp.start - vm.now), color = Dim, fontSize = tf, maxLines = 1)
                                  }
                              }
                              if (hp.desc.isNotBlank()) {
                                  Text(
                                      hp.desc, color = Dim, fontSize = if (wide) 13.sp else 10.sp,
                                      lineHeight = if (wide) 16.sp else 12.sp,
                                      maxLines = 3, overflow = TextOverflow.Ellipsis
                                  )
                              }
                              if (next != null) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text(
                                          "Next: ${next.title}", color = Color.White, fontSize = tf,
                                          fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                          modifier = Modifier.weight(1f, fill = false)
                                      )
                                      Text(
                                          "  -  " + untilText(next.start - vm.now), color = Accent,
                                          fontSize = tf, maxLines = 1
                                      )
                                  }
                              }
                          } else if (ch != null) {
                              Text("Live now", fontSize = if (wide) 18.sp else 13.sp, fontWeight = FontWeight.ExtraBold)
                          } else {
                              Text("Select a channel", color = Dim)
                          }
                      }
                  }
                  // menu button (touch users; TV remotes use Back / LEFT)
                  GlassIconButton(
                      Icons.Filled.Menu, "Menu",
                      Modifier.align(Alignment.TopEnd).padding(8.dp),
                      size = 30.dp
                  ) { vm.menuLevel = if (vm.menuLevel > 0) 0 else 2 }
              }
          }

          @Composable
