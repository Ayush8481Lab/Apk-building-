          private val DATE_FMT = SimpleDateFormat("EEE, d MMM, h:mm a", Locale.ENGLISH)
          private val TICK_FMT = SimpleDateFormat("hh:mm a", Locale.ENGLISH)
          private val RANGE_FMT = SimpleDateFormat("hh:mm a", Locale.ENGLISH)

          fun dateText(ms: Long): String =
              DATE_FMT.format(Date(ms)).replace("AM", "am").replace("PM", "pm")

          private fun tickText(ms: Long): String = TICK_FMT.format(Date(ms)).lowercase()

          /** "12:01 \u2014 02:14 am" (am / pm written once when both ends share it). */
          fun rangeText(p: Program): String {
              val s = RANGE_FMT.format(Date(p.start)).lowercase()
              val e = RANGE_FMT.format(Date(p.stop)).lowercase()
              return if (s.takeLast(2) == e.takeLast(2)) s.dropLast(3) + " \u2014 " + e else s + " \u2014 " + e
          }

          /**
           * TiviMate layout, every size is a fraction of the reference screenshot (1340 x 800) scaled by [u].
           * Side panels push the whole screen to the right:
           *   level 0:  | header + guide |
           *   level 1:  | categories | header + guide |          (Back, or LEFT on the first programme of a row)
           *   level 2:  | menu | categories | header + guide |   (Back again)
           */
          @Composable
          fun HomeScreen(vm: MainVM, pc: PlayerController) {
              val tab = vm.tab
              val navFr = remember { FocusRequester() }
              val catFr = remember { FocusRequester() }
              val onOpen: (Channel, List<Channel>) -> Unit = { ch, l ->
                  vm.play(ch, l)
                  vm.openFullscreen()
              }
              // first click plays in the header, clicking the playing channel again goes fullscreen
              val onPick: (Channel, List<Channel>) -> Unit = { ch, l ->
                  if (vm.current?.id == ch.id) vm.openFullscreen() else vm.play(ch, l)
              }

              DisposableEffect(Unit) {
                  onDispose { vm.hover = null }
              }

              LaunchedEffect(vm.menuLevel) {
                  if (vm.menuLevel > 0) {
                      delay(240)
                      try {
                          if (vm.menuLevel >= 2) navFr.requestFocus() else catFr.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }

              BackHandler(enabled = tab != 0 || vm.menuLevel < 2) {
                  if (tab != 0) {
                      vm.tab = 0
                      vm.menuLevel = 0
                  } else {
                      vm.menuLevel = vm.menuLevel + 1
                  }
              }

              val d0 = LocalDensity.current
              CompositionLocalProvider(LocalDensity provides Density(d0.density, 1f)) {
              ProvideTextStyle(TextStyle(fontFamily = CondFont)) {
              BoxWithConstraints(Modifier.fillMaxSize().background(Color(0xFF111111))) {
                  val u = minOf(maxHeight.value / 800f, maxWidth.value / 1340f).coerceAtLeast(0.3f)
                  val navW = (326 * u).dp
                  val catW = (373 * u).dp
                  val density = LocalDensity.current
                  val totalPx = with(density) { (navW + catW).toPx() }
                  val targetPx = with(density) {
                      (if (vm.menuLevel >= 2) navW + catW else if (vm.menuLevel == 1) catW else 0.dp).toPx()
                  }
                  val shift = animateFloatAsState(targetPx, tween(210, easing = FastOutSlowInEasing), label = "shift")
                  val showPanels by remember { derivedStateOf { vm.menuLevel > 0 || shift.value > 0.5f } }

                  // grey + programme-colour graded, blurred background behind everything
                  AmbientBg(vm)

                  if (showPanels) {
                      Row(
                          Modifier.fillMaxHeight().systemBarsPadding()
                              .offset { IntOffset((shift.value - totalPx).roundToInt(), 0) }
                      ) {
                          NavPanel(vm, navFr, catFr, navW, u)
                          CatPanel(vm, navFr, catFr, catW, u)
                      }
                  }
                  Column(
                      Modifier.fillMaxSize().systemBarsPadding()
                          .offset { IntOffset(shift.value.roundToInt(), 0) }
                  ) {
                      Preview(vm, pc, u * (vm.headerPct / 100f)) { vm.openFullscreen() }
                      Box(Modifier.weight(1f).fillMaxWidth()) {
                          when (tab) {
                              0 -> EpgGrid(vm, u, onPick)
                              2 -> SearchTab(vm, onOpen)
                              else -> SettingsTab(vm)
                          }
                      }
                  }
              }
              }
              }
          }

          /**
           * Soft grey background tinted with the colour of the highlighted programme's banner. A tiny copy of the banner
           * (48 px) stretched over the screen gives a real blur for free (no RenderEffect, works on every TV box).
           */
          @Composable
          fun AmbientBg(vm: MainVM) {
              val ch = vm.current
              val np = if (ch != null) vm.nowNext(ch).first else null
              val hp = vm.hover?.second ?: np
              val url = if (hp != null) bannerUrl(hp) else ""
              val tint = rememberBannerColor(url, Color(0xFF3C3C3C))
              val top = lerp(Color(0xFF2B2B2B), tint, 0.34f)
              val ctx = LocalContext.current
              Box(Modifier.fillMaxSize()) {
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.verticalGradient(listOf(top, Color(0xFF1C1C1C), Color(0xFF121212)))
                      )
                  )
                  Crossfade(url, animationSpec = tween(450), label = "amb") { u ->
                      if (u.isNotBlank()) {
                          AsyncImage(
                              model = ImageRequest.Builder(ctx).data(u).size(48, 27).build(),
                              contentDescription = null, contentScale = ContentScale.Crop,
                              filterQuality = FilterQuality.Low,
                              modifier = Modifier.fillMaxSize().alpha(0.40f)
                          )
                      }
                  }
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.verticalGradient(0f to Color.Transparent, 0.5f to Color(0x99121212), 1f to Color(0xEE121212))
                      )
                  )
              }
          }

          /**
           * Header: video (left), programme name, "12:01 - 02:14 am" + progress bar + minutes left, description (6 lines),
           * and the programme banner on the right. Shows the highlighted programme (time included); otherwise the playing one.
           */
          @Composable
          fun Preview(vm: MainVM, pc: PlayerController, u: Float, onFull: () -> Unit) {
              val ch = vm.current
              LaunchedEffect(ch?.id, vm.epgTick) {
                  if (ch != null) {
                      vm.ensureEpg(ch.id, 0)
                      vm.ensureEpg(ch.id, 1)
                  }
              }
              val np = if (ch != null) vm.nowNext(ch).first else null
              val hv = vm.hover
              val hp: Program? = if (hv != null) hv.second else np
              val hc: Channel? = if (hv != null) hv.first else ch
              val live = hp != null && vm.now >= hp.start && vm.now < hp.stop
              val url = if (hp != null) bannerUrl(hp) else ""
              val fav = hc != null && hc.id in vm.favorites
              val bannerW = (285f * u * 16f / 9f).dp
              val shadow = TextStyle(shadow = Shadow(Color.Black, blurRadius = 8f))

              Box(Modifier.fillMaxWidth().height((285 * u).dp)) {
                  if (url.isNotBlank()) {
                      Box(
                          Modifier.align(Alignment.TopEnd).width(bannerW).fillMaxHeight()
                              .fadeEdges(left = 0.62f, bottom = 0.2f)
                      ) {
                          Crossfade(url, animationSpec = tween(260), label = "pv") { x ->
                              Banner(x, Modifier.fillMaxSize())
                          }
                      }
                  }
                  Row(Modifier.fillMaxSize().padding(start = (24 * u).dp, top = (18 * u).dp)) {
                      Box(
                          Modifier.width((474 * u).dp).height((267 * u).dp)
                              .clip(RoundedCornerShape((12 * u).dp))
                              .background(Color.Black)
                              .clickable(
                                  interactionSource = remember { MutableInteractionSource() },
                                  indication = null,
                                  onClick = onFull
                              )
                      ) {
                          AndroidView(
                              factory = { c ->
                                  PlayerView(c).apply {
                                      useController = false
                                      player = pc.player
                                      setShutterBackgroundColor(android.graphics.Color.BLACK)
                                      setKeepContentOnPlayerReset(true)
                                      isFocusable = false
                                      isFocusableInTouchMode = false
                                      keepScreenOn = true
                                  }
                              },
                              onRelease = { it.player = null },
                              modifier = Modifier.fillMaxSize()
                          )
                          if (pc.buffering) {
                              CircularProgressIndicator(
                                  Modifier.align(Alignment.Center).size((34 * u).dp), color = Accent, strokeWidth = 3.dp
                              )
                          }
                          pc.error?.let {
                              Text(
                                  it.lineSequence().firstOrNull() ?: "",
                                  Modifier.align(Alignment.Center).padding(6.dp),
                                  color = Color.White, fontSize = (16 * u).sp, textAlign = TextAlign.Center, maxLines = 3
                              )
                          }
                      }
                      Spacer(Modifier.width((33 * u).dp))
                      Column(Modifier.weight(1f).padding(top = (10 * u).dp, end = bannerW * 0.42f)) {
                          if (hp != null) {
                              Text(
                                  hp.title.ifBlank { "Live now" }, color = Color.White, fontSize = (30 * u).sp,
                                  lineHeight = (36 * u).sp, maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                              Spacer(Modifier.height((12 * u).dp))
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      rangeText(hp), color = TextDim, fontSize = (20 * u).sp,
                                      fontFamily = CondLight, maxLines = 1
                                  )
                                  Spacer(Modifier.width((20 * u).dp))
                                  if (live) {
                                      val left = ((hp.stop - vm.now + 59_999L) / 60_000L).coerceAtLeast(1L)
                                      Box(
                                          Modifier.width((58 * u).dp).height((4 * u).dp)
                                              .clip(RoundedCornerShape(2.dp)).background(BarTrack)
                                      ) {
                                          Box(
                                              Modifier.fillMaxHeight().fillMaxWidth(progressOf(hp, vm.now)).background(BarFill)
                                          )
                                      }
                                      Spacer(Modifier.width((20 * u).dp))
                                      Text(
                                          "$left min", color = TextDim, fontSize = (20 * u).sp,
                                          fontFamily = CondLight, maxLines = 1
                                      )
                                  } else {
                                      Text(
                                          untilText(hp.start - vm.now), color = TextDim, fontSize = (20 * u).sp,
                                          fontFamily = CondLight, maxLines = 1, overflow = TextOverflow.Ellipsis
                                      )
                                  }
                              }
                              if (hp.desc.isNotBlank()) {
                                  Spacer(Modifier.height((12 * u).dp))
                                  Text(
                                      hp.desc, color = TextDim, fontSize = (20 * u).sp, lineHeight = (24 * u).sp,
                                      fontFamily = CondLight, maxLines = 6, overflow = TextOverflow.Ellipsis
                                  )
                              }
                          } else if (ch != null) {
                              Text("Live now", color = Color.White, fontSize = (30 * u).sp)
                          } else {
                              Text("Select a channel", color = TextDim, fontSize = (24 * u).sp)
                          }
                      }
                  }
                  Column(
                      Modifier.align(Alignment.TopEnd).padding(top = (28 * u).dp, end = (24 * u).dp),
                      horizontalAlignment = Alignment.End
                  ) {
                      Icon(
                          if (fav) Icons.Filled.Star else Icons.Filled.StarBorder, "Favorite",
                          tint = if (fav) Accent else Color.White,
                          modifier = Modifier.size((30 * u).dp)
                      )
                      if (hp != null && hp.genre.isNotBlank()) {
                          Spacer(Modifier.height((14 * u).dp))
                          Text(
                              hp.genre, color = Color.White, fontSize = (20 * u).sp, maxLines = 1,
                              overflow = TextOverflow.Ellipsis, style = shadow
                          )
                      }
                  }
              }
          }

