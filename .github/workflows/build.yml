          data class TrackOpt(val label: String, val group: Tracks.Group, val index: Int, val selected: Boolean)

          /** Helpers to turn license strings into a DRM configuration. */
          object Drm {
              private val hex = Regex("^[0-9a-fA-F]+$")

              private fun b64(s: String): String {
                  val t = s.trim()
                  return if (t.length == 32 && hex.matches(t)) {
                      val bytes = ByteArray(t.length / 2) { t.substring(it * 2, it * 2 + 2).toInt(16).toByte() }
                      Base64.encodeToString(bytes, Base64.URL_SAFE or Base64.NO_PADDING or Base64.NO_WRAP)
                  } else {
                      t.replace('+', '-').replace('/', '_').trimEnd('=')
                  }
              }

              private fun build(pairs: List<Pair<String, String>>): String? {
                  if (pairs.isEmpty()) return null
                  val keys = pairs.map {
                      "{\"kty\":\"oct\",\"k\":\"" + b64(it.second) + "\",\"kid\":\"" + b64(it.first) + "\"}"
                  }
                  return "{\"keys\":[" + keys.joinToString(",") + "],\"type\":\"temporary\"}"
              }

              private fun fromJson(s: String): String? {
                  return try {
                      val pairs = ArrayList<Pair<String, String>>()
                      if (s.startsWith("[")) {
                          val arr = JSONArray(s)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              pairs.add(Pair(o.getString("kid"), o.getString("k")))
                          }
                      } else {
                          val root = JSONObject(s)
                          if (root.has("keys")) {
                              val arr = root.getJSONArray("keys")
                              for (i in 0 until arr.length()) {
                                  val o = arr.getJSONObject(i)
                                  pairs.add(Pair(o.getString("kid"), o.getString("k")))
                              }
                          } else {
                              val iter = root.keys()
                              while (iter.hasNext()) {
                                  val kk = iter.next()
                                  if (kk != "type") pairs.add(Pair(kk, root.getString(kk)))
                              }
                          }
                      }
                      build(pairs)
                  } catch (e: Exception) {
                      null
                  }
              }

              fun clearKeyJson(spec: String): String? {
                  var s = spec.trim()
                  if (s.length >= 2 && ((s.startsWith("\"") && s.endsWith("\"")) || (s.startsWith("'") && s.endsWith("'")))) {
                      s = s.substring(1, s.length - 1).trim()
                  }
                  if (s.startsWith("{") || s.startsWith("[")) return fromJson(s)
                  val pairs = ArrayList<Pair<String, String>>()
                  for (pair in s.split(',', ';')) {
                      val p = pair.trim()
                      if (p.isEmpty()) continue
                      val i = p.indexOf(':')
                      if (i <= 0) return null
                      pairs.add(Pair(p.substring(0, i), p.substring(i + 1)))
                  }
                  return build(pairs)
              }

              /** JSON keys / "kid:key" -> ClearKey, http(s) url -> Widevine license server, empty -> clear stream. */
              fun scheme(license: String): UUID? {
                  val k = license.trim()
                  if (k.isEmpty()) return null
                  return if (k.startsWith("{") || k.startsWith("[") || (!k.startsWith("http", true) && k.contains(':'))) {
                      C.CLEARKEY_UUID
                  } else {
                      C.WIDEVINE_UUID
                  }
              }

              /** "https://license|Header=a&Header2=b" (Kodi style) -> url + headers */
              fun license(k: String): Pair<String, Map<String, String>> {
                  val parts = k.trim().split('|')
                  val hdr = HashMap<String, String>()
                  if (parts.size > 1) {
                      parts[1].split('&').forEach { p ->
                          val i = p.indexOf('=')
                          if (i > 0) hdr[p.substring(0, i).trim()] = p.substring(i + 1).trim()
                      }
                  }
                  return Pair(parts[0].trim(), hdr)
              }
          }

          class PlayerController(private val ctx: Context) {
              private val http = OkHttpDataSource.Factory(Http.client)

              private val defaultDrm = DefaultDrmSessionManagerProvider().apply { setDrmHttpDataSourceFactory(http) }
              private var localDrm: DrmSessionManager? = null

              /**
               * Fast-start tuning for live TV:
               *  - playback starts after only 700 ms of media (rebuffer: 2 s), steady buffer 20-50 s absorbs network jitter,
               *  - bandwidth estimate starts at 8 Mbit/s so the first segments are already picked in good quality,
               *  - asynchronous MediaCodec queueing + decoder fallback = smoother decoding on weak TV boxes.
               */
              val player: ExoPlayer = ExoPlayer.Builder(
                  ctx,
                  DefaultRenderersFactory(ctx)
                      .setEnableDecoderFallback(true)
                      .forceEnableMediaCodecAsynchronousQueueing()
              )
                  .setMediaSourceFactory(
                      DefaultMediaSourceFactory(ctx)
                          .setDataSourceFactory(DefaultDataSource.Factory(ctx, http))
                          .setDrmSessionManagerProvider { mi -> localDrm ?: defaultDrm.get(mi) }
                  )
                  .setBandwidthMeter(
                      DefaultBandwidthMeter.Builder(ctx).setInitialBitrateEstimate(8_000_000L).build()
                  )
                  .setLoadControl(
                      DefaultLoadControl.Builder()
                          .setBufferDurationsMs(20_000, 50_000, 700, 2_000)
                          .setPrioritizeTimeOverSizeThresholds(true)
                          .setBackBuffer(0, false)
                          .build()
                  )
                  .setHandleAudioBecomingNoisy(true)
                  .build()

              var buffering by mutableStateOf(false)
              var error by mutableStateOf<String?>(null)
              var tracks by mutableStateOf(Tracks.EMPTY)
              var playing by mutableStateOf(false)
              var videoRes by mutableStateOf("")
              /** "SD" / "HD" / "FHD" / "4K" badge, "25 FPS" badge and "STEREO" badge for the fullscreen info. */
              var videoClass by mutableStateOf("")
              var videoFps by mutableStateOf("")
              var audioDesc by mutableStateOf("")

              private var retries = 0
              private val handler = Handler(Looper.getMainLooper())

              init {
                  player.setAudioAttributes(
                      AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                          .build(),
                      true
                  )
                  player.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(state: Int) {
                          buffering = state == Player.STATE_BUFFERING
                          if (state == Player.STATE_READY) {
                              error = null
                              retries = 0
                              refreshInfo()
                          }
                      }

                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          playing = isPlaying
                      }

                      override fun onTracksChanged(t: Tracks) {
                          tracks = t
                          refreshInfo()
                      }

                      override fun onVideoSizeChanged(v: VideoSize) {
                          videoRes = if (v.height > 0) "${v.width}x${v.height}" else ""
                          videoClass = when {
                              v.height <= 0 -> ""
                              v.height <= 576 -> "SD"
                              v.height <= 720 -> "HD"
                              v.height <= 1080 -> "FHD"
                              else -> "4K"
                          }
                          refreshInfo()
                      }

                      override fun onPlayerError(e: PlaybackException) {
                          if (e.errorCode == PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW) {
                              player.seekToDefaultPosition()
                              player.prepare()
                              return
                          }
                          val detail = describe(e)
                          val isDrm = e.errorCode in 6000..6999
                          if (!isDrm && retries < 5) {
                              retries++
                              error = "Reconnecting ($retries/5)\n$detail" + netTail()
                              handler.postDelayed({ player.prepare() }, 1200)
                          } else {
                              error = "Playback failed\n$detail" + hint(e.errorCode) + netTail()
                          }
                      }
                  })
              }

              private fun refreshInfo() {
                  val vf = player.videoFormat
                  videoFps = if (vf != null && vf.frameRate > 0f) "${vf.frameRate.roundToInt()} FPS" else ""
                  val ac = player.audioFormat?.channelCount ?: 0
                  audioDesc = when {
                      ac <= 0 -> ""
                      ac == 1 -> "MONO"
                      ac == 2 -> "STEREO"
                      ac == 6 -> "5.1"
                      else -> "${ac}CH"
                  }
              }

              /** Home preview does not need full resolution: capping it keeps the guide animations smooth on weak TV boxes. */
              fun setPreviewMode(on: Boolean) {
                  val b = player.trackSelectionParameters.buildUpon()
                  if (on) b.setMaxVideoSize(960, 540) else b.setMaxVideoSize(Int.MAX_VALUE, Int.MAX_VALUE)
                  player.trackSelectionParameters = b.build()
              }

              private fun describe(e: PlaybackException): String {
                  val sb = StringBuilder(e.errorCodeName).append(" (").append(e.errorCode).append(")")
                  var c: Throwable? = e.cause
                  var n = 0
                  while (c != null && n < 4) {
                      if (c is HttpDataSource.InvalidResponseCodeException) {
                          sb.append("\nHTTP ").append(c.responseCode).append(" from ").append(c.dataSpec.uri.host)
                      } else {
                          sb.append("\n").append(c.javaClass.simpleName)
                          val m = c.message
                          if (!m.isNullOrBlank()) sb.append(": ").append(m)
                      }
                      c = c.cause
                      n++
                  }
                  return sb.toString().take(700)
              }

              private fun hint(code: Int): String = when (code) {
                  6001 -> "\n\nThis device does not support the DRM scheme used by the stream."
                  6002 -> "\n\nDRM provisioning failed (device certificate could not be fetched)."
                  6003 -> "\n\nThe license server rejected the request. The session may have expired."
                  6004 -> "\n\nDRM operation not allowed on this device."
                  6006 -> "\n\nThis device's DRM certificate was revoked."
                  6007 -> "\n\nThe DRM license has expired."
                  6008 -> "\n\nDRM content error - for ClearKey this usually means a wrong KID:KEY."
                  2004 -> "\n\nThe server answered with an HTTP error. The link may be expired or need a different User-Agent."
                  2001 -> "\n\nNo network connection."
                  3001, 3002 -> "\n\nThe manifest could not be parsed. Is it really an MPD/HLS stream?"
                  else -> ""
              }

              private fun netTail(): String {
                  val l = NetLog.last(4)
                  return if (l.isEmpty()) "" else "\n\nLast requests:\n" + l.joinToString("\n")
              }

              private fun supported(u: UUID): Boolean = try {
                  MediaDrm.isCryptoSchemeSupported(u)
              } catch (e: Exception) {
                  false
              }

              fun play(ch: Channel, defaultUa: String, extra: String = "") {
                  handler.removeCallbacksAndMessages(null)
                  retries = 0
                  error = null
                  localDrm = null
                  Http.jar.clear()
                  val hdr = LinkedHashMap<String, String>(parseHeaderLines(extra))
                  hdr.putAll(ch.headers)
                  val cookieKey = hdr.keys.firstOrNull { it.equals("Cookie", true) }
                  Http.jar.fixed = if (cookieKey != null) (hdr.remove(cookieKey) ?: "") else ""
                  val uaOverride = hdr.entries.firstOrNull { it.key.equals("User-Agent", true) }?.value
                  hdr.keys.removeAll { it.equals("User-Agent", true) }
                  val ua = uaOverride ?: defaultUa
                  val clean = Http.cleanHeaders(hdr)
                  http.setUserAgent(ua)
                  http.setDefaultRequestProperties(clean)
                  val scheme = Drm.scheme(ch.license)
                  NetLog.add(
                      "PLAY " + ch.name + "  " + ch.url.substringAfter("://").substringBefore('?').take(60) +
                          "  UA=" + ua.take(30) + "  headers=" + clean.keys.joinToString(",").ifEmpty { "none" } +
                          "  drm=" + (if (scheme == null) "no" else if (scheme == C.CLEARKEY_UUID) "clearkey" else "widevine")
                  )

                  val url = ch.url
                  val low = url.lowercase()
                  val b = MediaItem.Builder().setUri(url)
                      .setLiveConfiguration(
                          MediaItem.LiveConfiguration.Builder()
                              .setMinPlaybackSpeed(0.98f)
                              .setMaxPlaybackSpeed(1.03f)
                              .build()
                      )

                  if (scheme != null) {
                      if (!supported(scheme)) {
                          val nm = when (scheme) {
                              C.CLEARKEY_UUID -> "ClearKey"
                              C.WIDEVINE_UUID -> "Widevine"
                              else -> "PlayReady"
                          }
                          error = "This device does not support $nm DRM.\n(MediaDrm.isCryptoSchemeSupported = false)"
                          return
                      }
                      val key = ch.license.trim()
                      val dc = MediaItem.DrmConfiguration.Builder(scheme).setMultiSession(true)
                      if (scheme == C.CLEARKEY_UUID) {
                          val json = Drm.clearKeyJson(key)
                          if (json == null) {
                              error = "Invalid ClearKey received from the server."
                              return
                          }
                          localDrm = DefaultDrmSessionManager.Builder()
                              .setUuidAndExoMediaDrmProvider(C.CLEARKEY_UUID, FrameworkMediaDrm.DEFAULT_PROVIDER)
                              .setMultiSession(true)
                              .build(LocalMediaDrmCallback(json.toByteArray()))
                      } else {
                          val (licUrl, lh) = Drm.license(key)
                          dc.setLicenseUri(licUrl).setLicenseRequestHeaders(lh).setForceDefaultLicenseUri(true)
                      }
                      b.setDrmConfiguration(dc.build())
                  }

                  val isHls = low.contains(".m3u8")
                  val isMpd = low.contains(".mpd") || (scheme != null && !isHls)
                  if (isMpd) b.setMimeType(MimeTypes.APPLICATION_MPD)
                  else if (isHls) b.setMimeType(MimeTypes.APPLICATION_M3U8)

                  player.setMediaItem(b.build())
                  player.prepare()
                  player.playWhenReady = true
              }

              fun stop() {
                  handler.removeCallbacksAndMessages(null)
                  player.stop()
              }

              fun release() {
                  handler.removeCallbacksAndMessages(null)
                  player.release()
              }

              private fun label(f: Format, type: Int, i: Int): String {
                  if (type == C.TRACK_TYPE_VIDEO) {
                      val fps = if (f.frameRate > 0) " ${f.frameRate.roundToInt()}fps" else ""
                      return if (f.height > 0) "${f.height}p$fps" else "Video ${i + 1}"
                  }
                  val lang = f.language?.let { Locale.forLanguageTag(it).displayLanguage } ?: ""
                  var base = f.label ?: lang
                  if (base.isBlank()) base = "Track ${i + 1}"
                  if (type == C.TRACK_TYPE_AUDIO && f.channelCount > 0) base += " (${f.channelCount}ch)"
                  return base
              }

              fun options(type: Int): List<TrackOpt> {
                  val out = ArrayList<TrackOpt>()
                  for (g in tracks.groups) {
                      if (g.type != type) continue
                      for (i in 0 until g.length) {
                          if (!g.isTrackSupported(i)) continue
                          out.add(TrackOpt(label(g.getTrackFormat(i), type, i), g, i, g.isTrackSelected(i)))
                      }
                  }
                  return out
              }

              fun select(o: TrackOpt) {
                  player.trackSelectionParameters = player.trackSelectionParameters.buildUpon()
                      .setTrackTypeDisabled(o.group.type, false)
                      .setOverrideForType(TrackSelectionOverride(o.group.mediaTrackGroup, o.index))
                      .build()
              }

              fun disable(type: Int) {
                  player.trackSelectionParameters = player.trackSelectionParameters.buildUpon()
                      .clearOverridesOfType(type)
                      .setTrackTypeDisabled(type, true)
                      .build()
              }

              fun auto(type: Int) {
                  player.trackSelectionParameters = player.trackSelectionParameters.buildUpon()
                      .clearOverridesOfType(type)
                      .setTrackTypeDisabled(type, false)
                      .build()
              }

              fun isDisabled(type: Int): Boolean =
                  player.trackSelectionParameters.disabledTrackTypes.contains(type)
          }
