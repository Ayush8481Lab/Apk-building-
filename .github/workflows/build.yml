                  HorizontalDivider(color = Color(0xFF333333))
                  Text("Player", fontSize = 20.sp, color = Gold)
                  OutlinedTextField(
                      value = vm.userAgent, onValueChange = { vm.setUa(it) }, singleLine = true,
                      label = { Text("User-Agent") }, modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = vm.extraHeaders, onValueChange = { vm.updateExtraHeaders(it) },
                      label = { Text("Extra headers for all streams (Name: value, one per line)") },
                      minLines = 3, modifier = Modifier.fillMaxWidth()
                  )
                  SwitchRow("Auto refresh playlist and EPG every 12h", vm.autoRefresh) { vm.updateAutoRefresh(it) }
                  SwitchRow("Play last channel on launch (preview)", vm.resumeLast) { vm.setResume(it) }
                  SwitchRow("Start in full screen", vm.startFull) { vm.setStartFull(it) }
                  Text(
