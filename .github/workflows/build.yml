name: Build Premium WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Premium Plugins
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capgo/capacitor-media-session
          npm install @capacitor/splash-screen

      - name: Initialize Capacitor Config & Offline UI
        run: |
          mkdir -p www
          echo "<html><body>Loading Music8481...</body></html>" > www/index.html
          
          # Beautiful Offline UI Fallback
          cat <<EOF > www/error.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Offline</title>
            <style>
              body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              .spinner { width: 50px; height: 50px; border: 3px solid rgba(29, 185, 84, 0.3); border-top-color: #1DB954; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
              @keyframes spin { 100% { transform: rotate(360deg); } }
              h1 { font-size: 24px; margin: 0 0 10px; }
              p { color: #a7a7a7; font-size: 14px; text-align: center; max-width: 80%; }
              button { margin-top: 20px; background: #1DB954; color: #000; border: none; padding: 12px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
              button:active { transform: scale(0.95); }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <h1>You're Offline</h1>
            <p>Please check your internet connection to stream music.</p>
            <button onclick="window.location.href='https://ayushgaana.vercel.app'">Retry Connection</button>
          </body>
          </html>
          EOF
          
          npx cap init Music8481 com.music8481.app --web-dir www

          # FIX: Included StatusBar Transparent overlay to support Edge-to-Edge Punch Hole Drawing
          rm capacitor.config.ts || true
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.music8481.app",
            "appName": "Music8481",
            "webDir": "www",
            "server": {
              "url": "https://ayushgaana.vercel.app",
              "cleartext": true,
              "errorPath": "error.html"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidSplashResourceName": "splash",
                "showSpinner": true,
                "spinnerColor": "#1DB954"
              },
              "StatusBar": {
                "transparent": true,
                "overlay": true
              }
            }
          }
          EOF

      - name: Add Native Android Platform
        run: npx cap add android

      # DEEP FIX 1: Inject Permissions, PiP & Vivo Meta-Data
      - name: Inject Permissions & Vivo Meta-Data
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
          \`;
          
          const vivoTags = \`
              <!-- Bypass Vivo OriginOS & Xiaomi Lockscreen limits -->
              <meta-data android:name=\"com.vivo.dynamic.island.support\" android:value=\"true\" />
              <meta-data android:name=\"android.media.playback.ALWAYS_SHOW_LOCK_SCREEN_CONTROLS\" android:value=\"true\" />
              <meta-data android:name=\"com.vivo.music.lockscreen.support\" android:value=\"true\" />
          \`;

          if (!xml.includes('android.permission.WAKE_LOCK')) {
              xml = xml.replace('<application', perms + '\n    <application');
              xml = xml.replace('<application', '<application android:hardwareAccelerated=\"true\" android:largeHeap=\"true\"');
              xml = xml.replace('<activity', '<activity android:supportsPictureInPicture=\"true\"');
              xml = xml.replace('</application>', vivoTags + '\n    </application>');
              fs.writeFileSync(path, xml);
          }
          "

      # DEEP FIX 2: Inject Android System Styles to force drawing under the Camera Punch Hole
      - name: Force Android App Theme to Edge-to-Edge
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, 'utf8');
              const edgeToEdge = \`
                  <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>
                  <item name=\"android:windowTranslucentStatus\">true</item>
                  <item name=\"android:windowTranslucentNavigation\">true</item>
                  <item name=\"android:enforceNavigationBarContrast\">false</item>
                  <item name=\"android:enforceStatusBarContrast\">false</item>
              \`;
              xml = xml.replace('</style>', edgeToEdge + '\n</style>');
              fs.writeFileSync(path, xml);
          }
          "

      # DEEP FIX 3: Inject Smart PiP Tracker (Home + Back Buttons) and Native System Overrides
      - name: Inject Native Premium Engine
        run: |
          cat <<EOF > android/app/src/main/java/com/music8481/app/MainActivity.java
          package com.music8481.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;
          
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.JavascriptInterface;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.content.Context;
          import android.os.PowerManager;
          import android.media.AudioManager;
          import android.view.WindowManager;
          import android.app.PictureInPictureParams;
          import android.content.pm.ActivityInfo;
          import android.util.Rational;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;
              private boolean isVideoFullscreen = false;
              private boolean isVideoModeActive = false; // Secretly tracks if video is playing ANYWHERE in app

              // Hidden Bridge to talk to your React App without changing Vercel code
              public class WebAppInterface {
                  @JavascriptInterface
                  public void setVideoMode(boolean isVideo) {
                      isVideoModeActive = isVideo;
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // ULTIMATE EDGE-TO-EDGE PUNCH HOLE FIX
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams attributes = getWindow().getAttributes();
                      attributes.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(attributes);
                  }
                  // Force app to draw underneath Status/Nav bars natively
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  // PREMIUM AUDIO ENHANCEMENT
                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      setVolumeControlStream(AudioManager.STREAM_MUSIC);
                  }

                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Music8481::BackgroundAudioLock");
                  wakeLock.acquire();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      
                      settings.setMediaPlaybackRequiresUserGesture(false); 
                      webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      settings.setDomStorageEnabled(true);

                      // SECRET JAVASCRIPT INJECTION: Automatically detects when your React App enters Video Mode
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidApp");
                      webView.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              webView.evaluateJavascript(
                                  "setInterval(function() {" +
                                  "  var hasVideo = document.querySelector('iframe[src*=\"ayushcom.vercel.app\"]') !== null;" +
                                  "  if (window.AndroidApp) window.AndroidApp.setVideoMode(hasVideo);" +
                                  "}, 1000);", null);
                          }
                      }, 3000);

                      final WebChromeClient originalClient = webView.getWebChromeClient();
                      webView.setWebChromeClient(new WebChromeClient() {
                          private View mCustomView;
                          private WebChromeClient.CustomViewCallback mCustomViewCallback;
                          private int mOriginalSystemUiVisibility;

                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              if (mCustomView != null) {
                                  onHideCustomView();
                                  return;
                              }
                              mCustomView = view;
                              isVideoFullscreen = true;
                              mOriginalSystemUiVisibility = getWindow().getDecorView().getSystemUiVisibility();
                              mCustomViewCallback = callback;

                              // FORCE LANDSCAPE AUTO-ROTATE
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                              getWindow().getDecorView().setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);

                              ((FrameLayout) getWindow().getDecorView()).addView(mCustomView, new FrameLayout.LayoutParams(-1, -1));
                          }

                          @Override
                          public void onHideCustomView() {
                              ((FrameLayout) getWindow().getDecorView()).removeView(mCustomView);
                              mCustomView = null;
                              isVideoFullscreen = false;
                              
                              // REVERT TO PORTRAIT
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);
                              
                              getWindow().getDecorView().setSystemUiVisibility(mOriginalSystemUiVisibility);
                              if (mCustomViewCallback != null) {
                                  mCustomViewCallback.onCustomViewHidden();
                                  mCustomViewCallback = null;
                              }
                          }

                          @Override
                          public void onPermissionRequest(android.webkit.PermissionRequest request) {
                              if (originalClient != null) originalClient.onPermissionRequest(request);
                          }
                          @Override
                          public boolean onShowFileChooser(WebView webView, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                              return originalClient != null && originalClient.onShowFileChooser(webView, filePathCallback, fileChooserParams);
                          }
                          @Override
                          public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) {
                              return originalClient != null && originalClient.onConsoleMessage(consoleMessage);
                          }
                      });
                  }
              }

              // SMART PIP: Triggers when user hits the HOME Button or RECENTS Button
              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          PictureInPictureParams.Builder builder = new PictureInPictureParams.Builder();
                          builder.setAspectRatio(new Rational(16, 9)); 
                          enterPictureInPictureMode(builder.build());
                      } catch (Exception e) { e.printStackTrace(); }
                  }
              }

              // SMART PIP: Triggers when user hits the BACK Button
              @Override
              public void onBackPressed() {
                  if ((isVideoFullscreen || isVideoModeActive) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          PictureInPictureParams.Builder builder = new PictureInPictureParams.Builder();
                          builder.setAspectRatio(new Rational(16, 9)); 
                          enterPictureInPictureMode(builder.build());
                      } catch (Exception e) { 
                          super.onBackPressed(); 
                      }
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().onResume(); 
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
              }
          }
          EOF

      - name: Fix Kotlin Duplicate Classes (Gradle Bug)
        run: |
          cat <<EOF >> android/app/build.gradle
          
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Generate App Icon & Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p assets
          
          wget -q https://raw.githubusercontent.com/Ayush8481Lab/Ayushgaana/refs/heads/main/app/android-chrome-512x512.png -O assets/icon.png
          convert -size 2732x2732 xc:"#000000" assets/icon.png -gravity center -composite assets/splash.png
          npx @capacitor/assets generate --android

      - name: Fix Gradle Daemon & Memory Issues (CI Stability)
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Generate Android Keystore (For App Signing)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      - name: Build & Auto-Sign Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload Independent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Independent-APK
          path: android/app/build/outputs/apk/release/app-release.apk
