          @Composable
          fun ButtonRow(vm: MainVM) {
              val next = vm.nextChannels()
              val state = rememberLazyListState()
              LaunchedEffect(vm.fidx) { state.animateScrollToItem((vm.fidx - 3).coerceAtLeast(0)) }
              LazyRow(
                  state = state,
                  contentPadding = PaddingValues(horizontal = 47.dp),
                  horizontalArrangement = androidx.compose.foundation.layout.Arrangement.spacedBy(8.dp),
                  modifier = Modifier.fillMaxWidth().height(150.dp).padding(bottom = 12.dp)
              ) {
                  item {
                      FCard(vm.fidx == 0, { vm.fidx = 0; vm.activateCard() }) {
                          Spacer(Modifier.weight(1f))
                          Icon(Icons.AutoMirrored.Filled.ViewList, null, tint = Color.White, modifier = Modifier.size(44.dp))
                          Text("TV guide", color = Color.White, fontSize = 22.sp, modifier = Modifier.padding(top = 6.dp, bottom = 22.dp))
                      }
                  }
                  item {
                      FCard(vm.fidx == 1, { vm.fidx = 1; vm.activateCard() }) {
