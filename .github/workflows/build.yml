              var zapList by mutableStateOf<List<Channel>>(emptyList())
              var fullscreen by mutableStateOf(false)
              var playNonce by mutableIntStateOf(0)
              var sleepAt by mutableLongStateOf(0L)

              // ---- remote-control navigation state (TiviMate style) ----
              /** 0 search, 1 TV, 2 recordings, 3 my list, 4 settings */
              var side by mutableIntStateOf(1)

              /** 0 sidebar, 1 categories, 2 guide / page content */
              var pane by mutableIntStateOf(2)
              var catIdx by mutableIntStateOf(1)
              var chIdx by mutableIntStateOf(0)
              var selTime by mutableLongStateOf(System.currentTimeMillis())
              var gridStart by mutableLongStateOf(System.currentTimeMillis() / SLOT * SLOT)
              var guideOverlay by mutableStateOf(false)
              var dialog by mutableStateOf("")
              var numBuf by mutableStateOf("")

              // fullscreen overlay: 0 hidden, 1 info only, 2 info + button row
              var fbar by mutableIntStateOf(0)
              var fidx by mutableIntStateOf(0)
              var fstamp by mutableIntStateOf(0)

              private var resumed = false
              private var numJob: Job? = null

              fun cats(): List<String> = listOf(G_FAV, G_ALL) + groups
              fun catName(): String = cats().getOrElse(catIdx) { G_ALL }

              val shown: List<Channel> by derivedStateOf { filter(catName()) }

              val pageIsCompose: Boolean
                  get() = side == 0 || side == 3 || side == 4 || (side == 1 && playlists.isEmpty())

              init {
                  if (activeId.isEmpty() || playlists.none { it.id == activeId }) {
                      activeId = playlists.firstOrNull()?.id ?: ""
                      store.activeId = activeId
                  }
                  viewModelScope.launch {
                      while (true) {
                          delay(30_000)
                          val oldBase = base()
                          now = System.currentTimeMillis()
                          if (selTime < now - 30_000L) selTime = now
                          if (gridStart <= oldBase && gridStart < base() && selTime <= now + 60_000L) gridStart = base()
                      }
                  }
                  viewModelScope.launch {
                      loadLocal(false)
                      val pl = active()
                      if (pl != null && autoRefresh && !pl.isFile &&
                          System.currentTimeMillis() - pl.updated > 12 * 3_600_000L
                      ) doRefresh()
                  }
              }

              fun base(): Long = now / SLOT * SLOT

              fun active(): Playlist? = playlists.firstOrNull { it.id == activeId }

              /* ------------------------------------------------------------ playlists */

              fun addUrl(name: String, url: String, epgUrl: String) {
                  register(
                      Playlist(
                          newId(), name.ifBlank { "Playlist ${playlists.size + 1}" },
                          url.trim(), false, epgUrl.trim()
                      )
                  )
              }

              fun addXtream(name: String, server: String, user: String, pass: String) {
                  var s = server.trim().trimEnd('/')
                  if (!s.startsWith("http", true)) s = "http://$s"
                  val m3u = "$s/get.php?username=$user&password=$pass&type=m3u_plus&output=ts"
                  val epgUrl = "$s/xmltv.php?username=$user&password=$pass"
                  register(Playlist(newId(), name.ifBlank { "Xtream" }, m3u, false, epgUrl))
              }

              fun addFile(uri: Uri, name: String) {
                  val pl = Playlist(newId(), name.ifBlank { "Local playlist" }, "", true)
                  viewModelScope.launch {
                      try {
                          withContext(Dispatchers.IO) {
                              val input = getApplication<Application>().contentResolver.openInputStream(uri)
                                  ?: throw Exception("Cannot open file")
                              input.use { i -> store.file(pl.id).outputStream().use { i.copyTo(it) } }
                          }
                          register(pl)
                      } catch (e: Exception) {
                          toast = "Import failed: ${e.message}"
                      }
                  }
              }

              private fun newId() = UUID.randomUUID().toString().take(8)

              private fun register(pl: Playlist) {
                  playlists = playlists + pl
                  store.savePlaylists(playlists)
                  select(pl.id)
                  side = 1
                  pane = 1
              }

              fun select(id: String) {
                  activeId = id
                  store.activeId = id
                  channels = emptyList()
                  groups = emptyList()
                  epg = EpgData.EMPTY
                  catIdx = 1
                  viewModelScope.launch {
                      if (store.file(id).exists()) loadLocal(false) else doRefresh()
                  }
              }

              fun delete(id: String) {
                  store.file(id).delete()
                  store.epgFile(id).delete()
                  playlists = playlists.filter { it.id != id }
                  store.savePlaylists(playlists)
                  if (activeId == id) {
                      val next = playlists.firstOrNull()?.id ?: ""
                      if (next.isEmpty()) {
                          activeId = ""
                          store.activeId = ""
                          channels = emptyList()
                          groups = emptyList()
                          epg = EpgData.EMPTY
                      } else select(next)
                  }
              }

              fun refresh() {
                  viewModelScope.launch { doRefresh() }
              }

              fun setEpgUrl(url: String) {
                  val pl = active() ?: return
                  playlists = playlists.map { if (it.id == pl.id) it.copy(epg = url.trim()) else it }
                  store.savePlaylists(playlists)
                  viewModelScope.launch { loadLocal(true) }
              }

              private suspend fun doRefresh() {
                  val pl = active() ?: return
                  loading = true
                  try {
                      if (!pl.isFile) {
                          withContext(Dispatchers.IO) {
                              Net.download(pl.source, userAgent, store.file(pl.id), true)
                          }
                      }
                      playlists = playlists.map {
                          if (it.id == pl.id) it.copy(updated = System.currentTimeMillis()) else it
                      }
                      store.savePlaylists(playlists)
                      loadLocal(true)
                      toast = "Loaded ${channels.size} channels"
                  } catch (e: Exception) {
                      toast = "Failed: ${e.message}"
                  }
                  loading = false
              }

              private suspend fun loadLocal(forceEpg: Boolean) {
                  val pl = active() ?: return
                  val f = store.file(pl.id)
                  if (!f.exists()) return
                  val parsed = withContext(Dispatchers.IO) { M3uParser.parse(f.readText()) }
                  channels = parsed.channels
                  groups = parsed.channels.map { it.group }.distinct()
                  if (catIdx >= cats().size) catIdx = 1
                  if (parsed.channels.isEmpty()) toast = "No channels found in this playlist"
                  loadEpg(pl, parsed, forceEpg)

                  if (!resumed) {
                      resumed = true
                      if (resumeLast && store.lastChannel.isNotEmpty()) {
                          parsed.channels.firstOrNull { it.url == store.lastChannel }?.let {
                              play(it, parsed.channels)
                              if (startFull) enterFull()
                          }
                      }
                  }
                  syncRow()
              }

              private fun loadEpg(pl: Playlist, parsed: Parsed, force: Boolean) {
                  val url = pl.epg.ifBlank { parsed.epgUrl }
                  val f = store.epgFile(pl.id)
                  viewModelScope.launch {
                      try {
                          val data = withContext(Dispatchers.IO) {
                              val stale = autoRefresh && f.exists() &&
                                  System.currentTimeMillis() - f.lastModified() > 12 * 3_600_000L
                              if ((force || !f.exists() || stale) && url.isNotBlank()) {
                                  Net.download(url, userAgent, f)
                              }
                              if (!f.exists()) return@withContext null
                              val ids = parsed.channels.filter { it.tvgId.isNotEmpty() }
                                  .map { it.tvgId.lowercase() }.toSet()
                              val names = parsed.channels.map { it.name.lowercase() }.toSet()
                              Net.sniff(f.inputStream().buffered()).use {
                                  EpgParser.parse(it, ids, names, System.currentTimeMillis())
                              }
                          }
                          if (data != null && pl.id == activeId) epg = data
                      } catch (e: Exception) {
                          toast = "EPG failed: ${e.message}"
                      }
                  }
              }

              /* ------------------------------------------------------------- channels */

              fun filter(g: String): List<Channel> = when (g) {
                  G_ALL -> channels
                  G_FAV -> channels.filter { it.url in favorites }
                  else -> channels.filter { it.group == g }
              }

              fun search(q: String): List<Channel> {
                  val s = q.trim().lowercase()
                  if (s.length < 2) return emptyList()
                  return channels.filter {
                      it.name.lowercase().contains(s) ||
                          it.group.lowercase().contains(s) ||
                          (nowNext(it).first?.title?.lowercase()?.contains(s) == true)
                  }.take(300)
              }

              fun toggleFav(ch: Channel) {
                  favorites = if (ch.url in favorites) favorites - ch.url else favorites + ch.url
                  store.saveFavorites(favorites)
              }

              fun programs(ch: Channel): List<Program> {
                  val direct = if (ch.tvgId.isNotEmpty()) epg.byId[ch.tvgId.lowercase()] else null
                  if (direct != null) return direct
                  val id = epg.nameToId[ch.name.lowercase()] ?: return emptyList()
                  return epg.byId[id] ?: emptyList()
              }

              fun programAt(ch: Channel, t: Long): Program? = programs(ch).firstOrNull { t >= it.start && t < it.stop }

              fun nowNext(ch: Channel): Pair<Program?, Program?> {
                  val l = programs(ch)
                  if (l.isEmpty()) return Pair(null, null)
                  val i = l.indexOfFirst { now >= it.start && now < it.stop }
                  return if (i >= 0) Pair(l[i], l.getOrNull(i + 1))
                  else Pair(null, l.firstOrNull { it.start > now })
              }

              /* ------------------------------------------------------------ navigation */

              fun setCat(i: Int) {
                  catIdx = i.coerceIn(0, cats().size - 1)
                  syncRow()
              }

              /** put the guide cursor on the playing channel, at the current time */
              fun syncRow() {
                  val i = shown.indexOfFirst { it.url == current?.url }
                  chIdx = if (i >= 0) i else 0
                  selTime = now
                  gridStart = base()
              }

              fun moveRow(d: Int) {
                  val n = shown.size
                  if (n == 0) return
                  chIdx = (chIdx + d).coerceIn(0, n - 1)
              }

              private fun fit(p: Program) {
                  if (now >= p.start && now < p.stop) {
                      gridStart = base()
                      return
                  }
                  val visible = 112 * 60_000L
                  if (p.start < gridStart || p.start + 10 * 60_000L > gridStart + visible) {
                      gridStart = p.start / SLOT * SLOT
                  }
              }

              /** returns false when the cursor is already on the live program and LEFT should leave the grid */
              fun moveProg(dir: Int): Boolean {
                  val ch = shown.getOrNull(chIdx) ?: return dir > 0
                  val l = programs(ch)
                  val cur = l.firstOrNull { it.stop > selTime }
                  if (dir > 0) {
                      val nx = if (cur == null) null else l.firstOrNull { it.start >= cur.stop }
                      if (nx != null) {
                          selTime = nx.start + 1
                          fit(nx)
                      }
                      return true
                  }
                  if (cur == null || (now >= cur.start && now < cur.stop) || selTime <= now) return false
                  val pv = l.lastOrNull { it.start < cur.start } ?: return false
                  selTime = if (now >= pv.start && now < pv.stop) now else pv.start + 1
                  fit(pv)
                  return true
              }

              fun openGuide() {
                  val i = shown.indexOfFirst { it.url == current?.url }
                  chIdx = if (i >= 0) i else 0
                  selTime = now
                  gridStart = base()
                  guideOverlay = true
              }

              fun enterFull() {
                  fullscreen = true
                  guideOverlay = false
                  fbar = 1
                  fstamp++
              }

              fun touch() {
                  fstamp++
              }

              fun cardCount(): Int = 2 + nextChannels().size

              fun nextChannels(n: Int = 12): List<Channel> {
                  val l = zapList
                  if (l.size < 2) return emptyList()
                  val i = l.indexOfFirst { it.url == current?.url }.coerceAtLeast(0)
                  return (1..minOf(n, l.size - 1)).map { l[(i + it) % l.size] }
              }

              fun activateRow() {
                  val ch = shown.getOrNull(chIdx) ?: return
                  if (guideOverlay) {
                      guideOverlay = false
                      if (current?.url != ch.url) play(ch, shown)
                      return
                  }
                  if (current?.url == ch.url) enterFull() else play(ch, shown)
              }

              fun activateCard() {
                  when (fidx) {
                      0 -> openGuide()
                      1 -> dialog = "history"
                      else -> nextChannels().getOrNull(fidx - 2)?.let { play(it, zapList) }
                  }
              }

              fun ok() {
                  if (fullscreen) {
                      if (guideOverlay) {
                          activateRow()
                          return
                      }
                      if (fbar < 2) {
                          fbar = 2
                          fidx = 0
                          touch()
                      } else {
                          activateCard()
                          touch()
                      }
                      return
                  }
                  when (pane) {
                      0 -> pane = if (side == 1 && playlists.isNotEmpty()) 1 else 2
                      1 -> pane = 2
                      else -> if (side == 1) activateRow()
                  }
              }

              fun longOk() {
                  if (fullscreen && !guideOverlay) dialog = "menu"
                  else if (guideOverlay || (pane == 2 && side == 1)) dialog = "options"
              }

              fun back() {
                  if (fullscreen) {
                      when {
                          guideOverlay -> guideOverlay = false
                          fbar > 0 -> fbar = 0
                          else -> {
                              fullscreen = false
                              syncRow()
                          }
                      }
                      return
                  }
                  when (pane) {
                      2 -> pane = if (side == 1 && playlists.isNotEmpty()) 1 else 0
                      1 -> pane = 0
                  }
              }

              fun digit(d: Int) {
                  if (numBuf.length >= 4) numBuf = ""
                  numBuf += d.toString()
                  numJob?.cancel()
                  numJob = viewModelScope.launch {
                      delay(1500)
                      val n = numBuf.toIntOrNull()
                      numBuf = ""
                      if (n != null) {
                          val i = channels.indexOfFirst { it.num == n }
                          if (i >= 0) {
                              play(channels[i], channels)
                              if (!fullscreen) {
                                  catIdx = 1
                                  chIdx = i
                                  selTime = now
                                  gridStart = base()
                              }
                          } else toast = "No channel $n"
                      }
                  }
              }

              /* -------------------------------------------------------------- playback */

              fun play(ch: Channel, list: List<Channel>) {
                  if (current?.url != ch.url) previous = current
                  current = ch
                  zapList = list
                  store.lastChannel = ch.url
                  recents = (listOf(ch.url) + recents.filter { it != ch.url }).take(30)
                  store.saveRecents(recents)
                  playNonce++
                  if (fullscreen) {
                      if (fbar == 0) fbar = 1
                      fstamp++
                  }
              }

              fun zap(d: Int) {
                  val l = zapList
                  if (l.isEmpty()) return
                  val i = l.indexOfFirst { it.url == current?.url }
                  play(l[(i + d + l.size).mod(l.size)], l)
              }

              fun recall() {
                  previous?.let { play(it, zapList) }
              }

              fun quickPlay(url: String, drmType: String = "", drmKey: String = "") {
                  var u = url.trim()
                  if (u.isEmpty()) return
                  var h: Map<String, String> = emptyMap()
                  val bar = u.indexOf('|')
                  if (bar > 0) {
                      h = parseHeaderString(u.substring(bar + 1))
                      u = u.substring(0, bar)
                  }
                  val nm = u.substringBefore('?').substringAfterLast('/').take(40).ifBlank { "Stream" }
                  play(Channel(0, nm, u, "", "Direct", "", "", "", drmType.trim(), drmKey.trim(), "", h), emptyList())
                  enterFull()
              }

              /* -------------------------------------------------------------- settings */

              fun setUa(v: String) {
                  userAgent = v
                  store.userAgent = v
              }

              fun updateExtraHeaders(v: String) {
                  extraHeaders = v
                  store.extraHeaders = v
              }

              fun updateAutoRefresh(v: Boolean) {
                  autoRefresh = v
                  store.autoRefresh = v
              }

              fun setResume(v: Boolean) {
                  resumeLast = v
                  store.resumeLast = v
              }

              fun setStartFull(v: Boolean) {
                  startFull = v
                  store.startFull = v
              }

              fun updateAspect(v: Int) {
                  aspect = v
                  store.aspect = v
              }
          }
