name: Build Independent WebView APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX: Capacitor 6 and Gradle 8.11+ strictly require Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android @capacitor/assets

      - name: Initialize Capacitor Config & Set URL
        run: |
          # Capacitor requires a local web directory to initialize properly
          mkdir -p www
          echo "<html><body>Loading Music8481...</body></html>" > www/index.html
          
          # Initialize the Capacitor project
          npx cap init Music8481 com.music8481.app --web-dir www

          # Overwrite config to point directly to your remote Web App URL
          rm capacitor.config.ts || true
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.music8481.app",
            "appName": "Music8481",
            "webDir": "www",
            "server": {
              "url": "https://ayushgaana.vercel.app",
              "cleartext": true
            }
          }
          EOF

      - name: Add Native Android Platform
        run: npx cap add android

      - name: Generate App Icon & Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p assets
          
          # Create a 512x512 app icon (Spotify green color as placeholder)
          convert -size 512x512 xc:"#1DB954" assets/icon.png
          # Create a 2732x2732 splash screen (black background)
          convert -size 2732x2732 xc:"#000000" assets/splash.png
          
          # Apply the icons natively to the Android project
          npx @capacitor/assets generate --android

      - name: Fix Gradle Daemon & Memory Issues (CI Stability)
        run: |
          # Optimize memory to prevent 'Could not reserve enough space' CI crashes
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Generate Android Keystore (For App Signing)
        run: |
          # Generate the keystore in the root workspace directory
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      # FIX: Let Gradle securely auto-sign and auto-zipalign the APK using injected arguments
      - name: Build & Auto-Sign Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload Independent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-Independent-APK
          # Gradle outputs a clean, signed 'app-release.apk' when signing properties are injected
          path: android/app/build/outputs/apk/release/app-release.apk
