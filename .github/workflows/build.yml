          /* =============================================================== GUIDE */

          @Composable
          fun GuideTab(vm: MainVM, onOpen: (Channel, List<Channel>) -> Unit) {
              var selId by rememberSaveable { mutableStateOf(vm.current?.id ?: vm.channels.firstOrNull()?.id ?: "") }
              var day by rememberSaveable { mutableIntStateOf(0) }
              val ch = vm.channels.firstOrNull { it.id == selId } ?: vm.channels.firstOrNull()
              LaunchedEffect(ch?.id, day) { ch?.let { vm.ensureEpg(it.id, day) } }
              val progs = if (ch != null) (vm.epg["${ch.id}:$day"] ?: emptyList()) else emptyList()
              val state = rememberLazyListState()
              LaunchedEffect(ch?.id, day, progs.size) {
                  val li = if (day == 0) progs.indexOfFirst { System.currentTimeMillis() >= it.start && System.currentTimeMillis() < it.stop } else 0
                  state.scrollToItem(if (li > 0) li else 0)
              }
              Column(Modifier.fillMaxSize()) {
                  LazyRow(
                      contentPadding = PaddingValues(horizontal = 20.dp, vertical = 12.dp),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      items((0..10).toList()) { d -> GlassPill(dayLabel(d, vm.now), d == day) { day = d } }
                  }
                  LazyRow(
                      contentPadding = PaddingValues(horizontal = 20.dp, vertical = 12.dp),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      items(vm.channels, key = { it.id }) { c ->
                          ChannelChip(c, c.id == ch?.id) { selId = c.id }
                      }
                  }
                  if (progs.isEmpty()) {
                      Text("No schedule available", color = Dim, modifier = Modifier.padding(24.dp))
                  }
                  LazyColumn(
                      state = state, modifier = Modifier.weight(1f),
                      contentPadding = PaddingValues(horizontal = 22.dp, vertical = 14.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      items(progs) { p ->
                          ProgramRow(vm, p) { if (ch != null) onOpen(ch, vm.channels) }
                      }
                  }
              }
          }

