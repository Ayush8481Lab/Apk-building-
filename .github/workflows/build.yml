          /**
           * Light "glass" surface for a black background: translucent tint + thin rim.
           * (No gradients / sheen: those cost a lot of GPU time when dozens of cards are on screen.)
           */
          fun Modifier.glass(
              shape: Shape = RoundedCornerShape(24.dp),
              alpha: Float = 0.12f,
              tint: Color = Color.White
          ): Modifier = this
              .clip(shape)
              .background(tint.copy(alpha = alpha))
              .border(1.dp, tint.copy(alpha = (alpha * 1.1f + 0.08f).coerceAtMost(0.75f)), shape)

          /**
           * Blends the edges of an image into whatever is behind it (like TV / OTT hero banners).
           * left / top / bottom = fraction of the size (0..1) over which that edge fades to transparent.
           */
          fun Modifier.fadeEdges(left: Float = 0f, top: Float = 0f, bottom: Float = 0f): Modifier =
              this
                  .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                  .drawWithContent {
                      drawContent()
                      if (left > 0f) {
                          drawRect(
                              brush = Brush.horizontalGradient(0f to Color.Transparent, left to Color.Black, 1f to Color.Black),
                              blendMode = BlendMode.DstIn
                          )
                      }
                      if (top > 0f) {
                          drawRect(
                              brush = Brush.verticalGradient(0f to Color.Transparent, top to Color.Black, 1f to Color.Black),
                              blendMode = BlendMode.DstIn
                          )
                      }
                      if (bottom > 0f) {
                          drawRect(
                              brush = Brush.verticalGradient(0f to Color.Black, (1f - bottom) to Color.Black, 1f to Color.Transparent),
                              blendMode = BlendMode.DstIn
                          )
                      }
                  }

          /**
           * TV focus: ONE short animation (zoom + glow share it), everything is read in the layer / draw phase so
           * focusing never recomposes anything. Halo (3 soft rects) + bright accent rim, no per-frame allocations.
           * Apply BEFORE .glass() so the scale / halo wrap the surface.
           */
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun Modifier.focusGlow(
              corner: Dp = 22.dp,
              focusScale: Float = 1.06f,
              onFocused: (() -> Unit)? = null,
              onFocusChange: ((Boolean) -> Unit)? = null,
              onLongClick: (() -> Unit)? = null,
              onClick: () -> Unit
          ): Modifier {
              val src = remember { MutableInteractionSource() }
              val focused by src.collectIsFocusedAsState()
              val pressed by src.collectIsPressedAsState()
              val f = animateFloatAsState(
                  if (focused) 1f else 0f,
                  tween(170, easing = FastOutSlowInEasing),
                  label = "focus"
              )
              val cb by rememberUpdatedState(onFocused)
              val cb2 by rememberUpdatedState(onFocusChange)
              LaunchedEffect(focused) {
                  cb2?.invoke(focused)
                  if (focused) cb?.invoke()
              }

              return this
                  .zIndex(if (focused) 1f else 0f)
                  .graphicsLayer {
                      val s = if (pressed) 0.97f else 1f + (focusScale - 1f) * f.value
                      scaleX = s
                      scaleY = s
                  }
                  .drawBehind {
                      val g = f.value
                      if (g > 0.01f) {
                          val r = corner.toPx()
                          for (i in 1..3) {
                              val d = i * 5.dp.toPx()
                              drawRoundRect(
                                  color = Accent.copy(alpha = 0.13f * g * (1f - i / 4f)),
                                  topLeft = Offset(-d, -d),
                                  size = Size(size.width + 2 * d, size.height + 2 * d),
                                  cornerRadius = CornerRadius(r + d)
                              )
                          }
                      }
                  }
                  .drawWithContent {
                      drawContent()
                      val g = f.value
                      if (g > 0.01f) {
                          val r = CornerRadius(corner.toPx())
                          drawRoundRect(color = Color.White.copy(alpha = 0.06f * g), cornerRadius = r)
                          drawRoundRect(
                              color = Color.White.copy(alpha = 0.95f * g),
                              cornerRadius = r,
                              style = Stroke(width = 2.dp.toPx())
                          )
                      }
                  }
                  .combinedClickable(
                      interactionSource = src,
                      indication = null,
                      onLongClick = onLongClick,
                      onClick = onClick
                  )
          }

