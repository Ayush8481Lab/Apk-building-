          @Composable
          fun SettingsPage(vm: MainVM, onAdd: (String) -> Unit) {
              val fr = pageFocus(vm)
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(32.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text("Settings", fontSize = 30.sp, fontWeight = FontWeight.Bold)
                  Text("Add", fontSize = 20.sp, color = Gold)
                  AddButtons(fr, onAdd)
                  HorizontalDivider(color = Color(0xFF333333))
                  Text("Playlists", fontSize = 20.sp, color = Gold)
                  vm.playlists.forEach { pl ->
                      Row(
                          Modifier.fillMaxWidth().tvFocus().clickable { vm.select(pl.id) }.padding(8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          RadioButton(selected = pl.id == vm.activeId, onClick = null)
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Text(pl.name, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
