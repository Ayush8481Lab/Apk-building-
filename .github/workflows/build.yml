              fun nowNext(ch: Channel): Pair<Program?, Program?> {
                  val a = epg["${ch.id}:0"] ?: emptyList()
                  val b = epg["${ch.id}:1"] ?: emptyList()
                  var i = a.indexOfFirst { now >= it.start && now < it.stop }
                  if (i >= 0) {
                      val cur = a[i]
                      return Pair(cur, a.getOrNull(i + 1) ?: b.firstOrNull { it.start >= cur.stop })
                  }
                  i = b.indexOfFirst { now >= it.start && now < it.stop }
                  if (i >= 0) return Pair(b[i], b.getOrNull(i + 1))
                  return Pair(null, a.firstOrNull { it.start > now } ?: b.firstOrNull { it.start > now })
