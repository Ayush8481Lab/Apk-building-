name: Build Web APK

# =====================================================================
#  WebView APK  +  LOCAL VIDEO-ONLY PROXY (127.0.0.1:8481)
#
#  Input: ONE domain (e.g. Ayush8481.com)
#
#  Endpoints exposed by the in-app proxy:
#    GET  /Strem?path=/xyz/abx[&token=..][&src=..]
#          → fetches Ayush8481.com/xyz/abx, extracts the video URL
#            (mpd / m3u8 / mp4) + DRM license URL, returns a minimal
#            HTML page that plays ONLY the video (no site UI).
#    GET  /S/<host>/<path>       → CORS/Range proxy for any media URL
#    GET  /health                → "OK"
#
#  The WebView loads Ayush8481.com normally. A small floating
#  "▶ Video only" button is auto-injected when a <video> is present;
#  tap it → opens the video-only player.
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Domain only (e.g. Ayush8481.com) — protocol auto-added"
        required: false
      app_name:
        description: "App name"
        required: false
      package_name:
        description: "Package name (e.g. com.example.webapp)"
        required: false
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  # >>> THE ONLY THING YOU EDIT <<<
  BASE_URL: ${{ github.event.inputs.base_url || 'hotstar.com' }}

  APP_NAME: ${{ github.event.inputs.app_name || 'VideoOnly' }}
  PACKAGE_NAME: ${{ github.event.inputs.package_name || 'com.efuch.webapp' }}

  BLOCK_API: 'https://raw.githubusercontent.com/Ayush8481-dev/Ayush/refs/heads/main/Block.json'
  ICON_URL:  'https://static.vecteezy.com/system/resources/previews/056/505/637/non_2x/jiohotstar-app-icon-on-transparent-background-free-png.png'
  PROXY_PORT: '8481'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Android WebView project
        run: |
          set -e
          mkdir -p webapp && cd webapp
          PKG_PATH=$(echo "$PACKAGE_NAME" | tr . /)
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/drawable

          if [ -n "$ICON_URL" ]; then
            curl -fsSL "$ICON_URL" -o app/src/main/res/drawable/ic_launcher.png || true
          fi
          if [ -f app/src/main/res/drawable/ic_launcher.png ]; then
            export ICON_REF="@drawable/ic_launcher"
          else
            export ICON_REF="@android:drawable/sym_def_app_icon"
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace '__PKG__'
              compileSdk 34
              defaultConfig {
                  applicationId '__PKG__'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="__ICON_REF__"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|smallestScreenSize|screenLayout|uiMode|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/$PKG_PATH/MainActivity.java <<'EOF'
          package __PKG__;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.DisplayCutout;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final String BASE_URL_CFG   = "__BASE_URL__";
              private static final String BLOCK_API      = "__BLOCK_API__";
              private static final int    PROXY_PORT     = __PROXY_PORT__;
              private static final String TAG            = "WebApp";

              private static final String DESKTOP_UA =
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                      + "Chrome/124.0.0.0 Safari/537.36";
              private static final int DESKTOP_WIDTH = 1024;

              private static final String VIEWPORT_JS =
                      "(function(){if(window.__dw)return;window.__dw=1;"
                      + "var C='width=" + DESKTOP_WIDTH + ", user-scalable=yes';"
                      + "function a(){var h=document.head||document.documentElement;if(!h)return;"
                      + "var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';h.appendChild(m);}"
                      + "if(m.getAttribute('content')!==C)m.setAttribute('content',C);}"
                      + "a();new MutationObserver(a).observe(document.documentElement,"
                      + "{childList:true,subtree:true,attributes:true,attributeFilter:['content']});})();";

              // Injects a floating "Video only" button when a <video> exists
              private static final String INJECT_JS =
                  "(function(){if(window.__vo){return;}window.__vo=1;"
                + "function find(){var v=document.querySelector('video');"
                + "var b=document.getElementById('__vo_btn');"
                + "if(v&&!b){b=document.createElement('div');b.id='__vo_btn';b.textContent='\\u25B6 Video only';"
                + "b.style.cssText='position:fixed;top:12px;right:12px;z-index:2147483647;"
                + "background:#e50914;color:#fff;padding:10px 18px;border-radius:22px;"
                + "font:bold 14px system-ui,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.5);"
                + "cursor:pointer;user-select:none;';"
                + "b.onclick=function(){var p=location.pathname+location.search;"
                + "var s='';var vv=document.querySelector('video');"
                + "if(vv){s=vv.currentSrc||vv.src||'';if(s.indexOf('blob:')===0||s.indexOf('data:')===0)s='';}"
                + "var u='http://localhost:__PORT__/Strem?path='+encodeURIComponent(p);"
                + "if(s)u+='&src='+encodeURIComponent(s);location.href=u;};"
                + "document.body.appendChild(b);}"
                + "else if(!v&&b){b.remove();}}"
                + "setInterval(find,1500);find();})();";

              private FrameLayout frame, content, fullscreenContainer;
              private WebView web;
              private SharedPreferences prefs;

              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;
              private int padL, padT, padR, padB;

              private final Set<String> blockDomains = Collections.synchronizedSet(new HashSet<String>());
              private final Set<String> blockUrls    = Collections.synchronizedSet(new HashSet<String>());

              private ServerSocket proxyServerSocket;

              // ------------------------------------------------------------------
              //  BASE URL helpers
              // ------------------------------------------------------------------
              private String baseUrl() {
                  String b = BASE_URL_CFG == null ? "" : BASE_URL_CFG.trim();
                  if (b.isEmpty()) b = "https://example.com";
                  if (!b.startsWith("http://") && !b.startsWith("https://")) b = "https://" + b;
                  while (b.endsWith("/")) b = b.substring(0, b.length() - 1);
                  return b;
              }

              private String baseHost() {
                  try { return Uri.parse(baseUrl()).getHost(); }
                  catch (Exception e) { return ""; }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("blocklist", MODE_PRIVATE);

                  Window w = getWindow();
                  w.setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  w.setStatusBarColor(Color.BLACK);
                  w.setNavigationBarColor(Color.BLACK);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }

                  frame = new FrameLayout(this);
                  frame.setBackgroundColor(Color.BLACK);
                  content = new FrameLayout(this);
                  web = new WebView(this);
                  content.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  fullscreenContainer.setVisibility(View.GONE);
                  frame.addView(content, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                  frame.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(frame);
                  applyNormalSystemUi();

                  frame.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override
                      public WindowInsets onApplyWindowInsets(View v, WindowInsets in) {
                          int l = in.getSystemWindowInsetLeft(), t = in.getSystemWindowInsetTop();
                          int r = in.getSystemWindowInsetRight(), b = in.getSystemWindowInsetBottom();
                          if (Build.VERSION.SDK_INT >= 28) {
                              DisplayCutout dc = in.getDisplayCutout();
                              if (dc != null) {
                                  l = Math.max(l, dc.getSafeInsetLeft());
                                  t = Math.max(t, dc.getSafeInsetTop());
                                  r = Math.max(r, dc.getSafeInsetRight());
                                  b = Math.max(b, dc.getSafeInsetBottom());
                              }
                          }
                          padL = l; padT = t; padR = r; padB = b;
                          if (customView == null) content.setPadding(l, t, r, b);
                          return in;
                      }
                  });
                  frame.requestApplyInsets();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(DESKTOP_UA);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setTextZoom(100);
                  if (Build.VERSION.SDK_INT >= 19) WebView.setWebContentsDebuggingEnabled(true);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view; customCallback = cb;
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT));
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          content.setVisibility(View.INVISIBLE);
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          applyFullscreenSystemUi();
                      }
                      @Override public void onHideCustomView() { exitCustomView(); }
                      @Override public Bitmap getDefaultVideoPoster() {
                          return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageStarted(WebView v, String url, Bitmap f) {
                          super.onPageStarted(v, url, f);
                          v.evaluateJavascript(VIEWPORT_JS, null);
                      }
                      @Override public void onPageFinished(WebView v, String url) {
                          super.onPageFinished(v, url);
                          v.evaluateJavascript(VIEWPORT_JS, null);
                          String inject = INJECT_JS.replace("__PORT__", String.valueOf(PROXY_PORT));
                          v.evaluateJavascript(inject, null);
                      }
                      @Override public WebResourceResponse shouldInterceptRequest(
                              WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          // Log media/license URLs so the user can see them in logcat
                          if (isMediaUrl(url))   Log.d(TAG, "[MEDIA DETECTED] " + url);
                          if (isLicenseUrl(url)) Log.d(TAG, "[LICENSE DETECTED] " + url);
                          // Never block our own proxy
                          if (url.startsWith("http://localhost:" + PROXY_PORT)
                                  || url.startsWith("http://127.0.0.1:" + PROXY_PORT))
                              return super.shouldInterceptRequest(view, request);
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED: " + url);
                              return new WebResourceResponse("text/plain", "UTF-8",
                                      403, "Blocked", new HashMap<String, String>(),
                                      new ByteArrayInputStream(new byte[0]));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) { Log.d(TAG, "BLOCKED NAV: " + url); return true; }
                          String scheme = request.getUrl().getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl())); }
                          catch (Exception ignored) { }
                          return true;
                      }
                  });

                  startProxyServer();

                  String cached = prefs.getString("json", null);
                  final boolean hadCache = cached != null && parse(cached);
                  if (hadCache) web.loadUrl(baseUrl());

                  new Thread(new Runnable() {
                      @Override public void run() {
                          String json = download(BLOCK_API);
                          if (json != null && parse(json)) prefs.edit().putString("json", json).apply();
                          if (!hadCache) runOnUiThread(new Runnable() {
                              @Override public void run() { web.loadUrl(baseUrl()); }
                          });
                      }
                  }).start();
              }

              // ============================================================
              //  PROXY SERVER
              // ============================================================
              private void startProxyServer() {
                  try {
                      proxyServerSocket = new ServerSocket(PROXY_PORT, 50, InetAddress.getByName("127.0.0.1"));
                      Thread t = new Thread(new Runnable() {
                          @Override public void run() {
                              while (!proxyServerSocket.isClosed()) {
                                  try {
                                      final Socket client = proxyServerSocket.accept();
                                      Thread h = new Thread(new Runnable() {
                                          @Override public void run() { handleProxyClient(client); }
                                      });
                                      h.setDaemon(true); h.start();
                                  } catch (IOException e) {
                                      if (!proxyServerSocket.isClosed()) Log.e(TAG, "accept", e);
                                      break;
                                  }
                              }
                          }
                      });
                      t.setDaemon(true); t.start();
                      Log.d(TAG, "Proxy on 127.0.0.1:" + PROXY_PORT);
                  } catch (IOException e) {
                      Log.e(TAG, "Proxy start failed", e);
                  }
              }

              private void stopProxyServer() {
                  try {
                      if (proxyServerSocket != null && !proxyServerSocket.isClosed()) proxyServerSocket.close();
                  } catch (IOException ignored) { }
              }

              private void handleProxyClient(Socket client) {
                  HttpURLConnection conn = null;
                  try {
                      client.setSoTimeout(120000);
                      InputStream in = client.getInputStream();
                      OutputStream out = client.getOutputStream();
                      BufferedReader reader = new BufferedReader(new InputStreamReader(in, "UTF-8"));

                      String requestLine = reader.readLine();
                      if (requestLine == null || requestLine.isEmpty()) { client.close(); return; }
                      String[] parts = requestLine.split(" ");
                      if (parts.length < 3) { client.close(); return; }
                      String method = parts[0].toUpperCase(Locale.ROOT);
                      String rawTarget = parts[1];

                      Map<String, String> reqHeaders = new HashMap<String, String>();
                      int contentLength = 0;
                      String line;
                      while ((line = reader.readLine()) != null && !line.isEmpty()) {
                          int idx = line.indexOf(':');
                          if (idx > 0) {
                              String k = line.substring(0, idx).trim().toLowerCase(Locale.ROOT);
                              String v = line.substring(idx + 1).trim();
                              reqHeaders.put(k, v);
                              if (k.equals("content-length")) {
                                  try { contentLength = Integer.parseInt(v); } catch (Exception ignored) {}
                              }
                          }
                      }
                      byte[] reqBody = null;
                      if (contentLength > 0) {
                          reqBody = new byte[contentLength];
                          int read = 0;
                          while (read < contentLength) {
                              int r = in.read(reqBody, read, contentLength - read);
                              if (r < 0) break;
                              read += r;
                          }
                      }

                      if ("OPTIONS".equals(method)) {
                          writeHttpResponse(out, 204, "No Content", null, new byte[0]);
                          client.close(); return;
                      }

                      Uri uri = Uri.parse(rawTarget);
                      String path = uri.getPath() == null ? "" : uri.getPath();

                      if (path.equals("/health") || path.equals("/")) {
                          writeHttpResponse(out, 200, "OK", "text/plain", "OK".getBytes("UTF-8"));
                          client.close(); return;
                      }

                      if (path.equals("/Strem") || path.startsWith("/Strem/")) {
                          handleStrem(uri, out);
                          client.close(); return;
                      }

                      if (path.startsWith("/S/")) {
                          handleMediaProxy(method, path.substring(3), uri.getQuery(), reqHeaders, reqBody, out);
                          client.close(); return;
                      }

                      writeHttpResponse(out, 404, "Not Found", "text/plain", "Not Found".getBytes("UTF-8"));
                      client.close();

                  } catch (Exception e) {
                      Log.e(TAG, "handleProxyClient", e);
                      try {
                          OutputStream out = client.getOutputStream();
                          writeHttpResponse(out, 502, "Bad Gateway", "text/plain", "Proxy error".getBytes("UTF-8"));
                      } catch (IOException ignored) { }
                      try { client.close(); } catch (IOException ignored) { }
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              // ------------------------------------------------------------
              //  /Strem  →  build the video-only player page
              // ------------------------------------------------------------
              private void handleStrem(Uri uri, OutputStream out) throws IOException {
                  String streamPath = uri.getQueryParameter("path");
                  String token      = uri.getQueryParameter("token");
                  String clientSrc  = uri.getQueryParameter("src");

                  if (streamPath == null) streamPath = "/";
                  if (!streamPath.startsWith("/")) streamPath = "/" + streamPath;

                  String pageUrl = baseUrl() + streamPath;
                  if (token != null && !token.isEmpty() && !pageUrl.contains("token="))
                      pageUrl += (pageUrl.contains("?") ? "&" : "?") + "token=" + token;

                  Log.d(TAG, "STREM fetch: " + pageUrl);

                  String mediaUrl = null;
                  String mediaType = null;
                  String licenseUrl = null;

                  // 1) If client-side JS already gave us the video src, use it
                  if (clientSrc != null && !clientSrc.isEmpty()) {
                      mediaUrl = absoluteOrBase(clientSrc);
                      mediaType = detectType(mediaUrl);
                      Log.d(TAG, "STREM using client src: " + mediaUrl);
                  }

                  // 2) Otherwise fetch the page and extract
                  if (mediaUrl == null) {
                      String html = fetchText(pageUrl);
                      if (html != null) {
                          List<String> found = extractMediaUrls(html, pageUrl);
                          licenseUrl = extractLicenseUrl(html, pageUrl);
                          if (!found.isEmpty()) {
                              mediaUrl = found.get(0);
                              mediaType = detectType(mediaUrl);
                              Log.d(TAG, "STREM extracted: " + mediaUrl);
                          }
                      }
                  } else {
                      // best-effort license extraction still from page
                      String html = fetchText(pageUrl);
                      if (html != null) licenseUrl = extractLicenseUrl(html, pageUrl);
                  }

                  if (licenseUrl != null) Log.d(TAG, "[LICENSE] " + licenseUrl);
                  else Log.d(TAG, "[LICENSE] not found in page HTML (may be set at runtime — check logcat)");

                  // Proxy the media & license URLs
                  String proxiedMedia = mediaUrl != null ? proxyMediaUrl(mediaUrl) : null;
                  String proxiedLicense = licenseUrl != null ? proxyLicenseUrl(licenseUrl) : null;

                  String html = buildPlayerHtml(proxiedMedia, mediaType, proxiedLicense);
                  byte[] body = html.getBytes("UTF-8");
                  OutputStream o = out;
                  StringBuilder sb = new StringBuilder();
                  sb.append("HTTP/1.1 200 OK\r\n");
                  sb.append("Access-Control-Allow-Origin: *\r\n");
                  sb.append("Access-Control-Allow-Methods: GET, HEAD, OPTIONS\r\n");
                  sb.append("Access-Control-Allow-Headers: *\r\n");
                  sb.append("Content-Type: text/html; charset=utf-8\r\n");
                  sb.append("Content-Length: ").append(body.length).append("\r\n");
                  sb.append("Cache-Control: no-store\r\n");
                  sb.append("Connection: close\r\n\r\n");
                  o.write(sb.toString().getBytes("UTF-8"));
                  o.write(body);
                  o.flush();
              }

              private String absoluteOrBase(String url) {
                  if (url.startsWith("http://") || url.startsWith("https://")) return url;
                  if (url.startsWith("//")) return "https:" + url;
                  if (url.startsWith("/")) return baseUrl() + url;
                  return baseUrl() + "/" + url;
              }

              private String detectType(String url) {
                  if (url == null) return "unknown";
                  String u = url.toLowerCase(Locale.ROOT);
                  if (u.contains(".mpd")) return "mpd";
                  if (u.contains(".m3u8")) return "m3u8";
                  if (u.contains(".mp4") || u.contains(".m4v")) return "mp4";
                  if (u.contains(".webm")) return "webm";
                  return "media";
              }

              // Extract likely video URLs from the page HTML
              private List<String> extractMediaUrls(String html, String pageUrl) {
                  List<String> result = new ArrayList<String>();
                  Set<String> seen = new HashSet<String>();

                  // A) direct URLs of .mpd/.m3u8/.mp4/.webm
                  Matcher m = Pattern.compile(
                          "(https?:)?//[^\\s\"'<>()\\\\]+?\\.(?:mpd|m3u8|mp4|webm|m4v)(?:\\?[^\\s\"'<>()\\\\]*)?",
                          Pattern.CASE_INSENSITIVE).matcher(html);
                  while (m.find()) {
                      String u = m.group(0);
                      if (u.startsWith("//")) u = "https:" + u;
                      if (seen.add(u)) result.add(u);
                  }

                  // B) <video src="..."> and <source src="...">
                  Pattern tagP = Pattern.compile(
                          "<(?:video|source)[^>]+src\\s*=\\s*[\"']([^\"']+)[\"']",
                          Pattern.CASE_INSENSITIVE);
                  Matcher tm = tagP.matcher(html);
                  while (tm.find()) {
                      String u = resolveUrl(tm.group(1), pageUrl);
                      if (u != null && seen.add(u)) result.add(u);
                  }

                  // C) common JSON keys
                  Pattern jsonP = Pattern.compile(
                          "\"(?:file|src|source|url|stream|hls|dash|mpd|playlist|videoUrl|manifestUrl)\"\\s*:\\s*\"([^\"]+)\"",
                          Pattern.CASE_INSENSITIVE);
                  Matcher jm = jsonP.matcher(html);
                  while (jm.find()) {
                      String raw = jm.group(1);
                      if (raw.startsWith("blob:") || raw.startsWith("data:")) continue;
                      String u = resolveUrl(raw, pageUrl);
                      if (u != null && looksLikeMedia(u) && seen.add(u)) result.add(u);
                  }

                  // Sort: mpd first, then m3u8, then mp4
                  List<String> sorted = new ArrayList<String>();
                  for (String u : result) if (u.toLowerCase(Locale.ROOT).contains(".mpd")) sorted.add(u);
                  for (String u : result) if (u.toLowerCase(Locale.ROOT).contains(".m3u8")) sorted.add(u);
                  for (String u : result) if (!sorted.contains(u)) sorted.add(u);
                  return sorted;
              }

              private String extractLicenseUrl(String html, String pageUrl) {
                  Pattern p = Pattern.compile(
                          "[\"']?([A-Za-z0-9_./:-]*(?:license|widevine|playready|clearkey|drm|wv)[A-Za-z0-9_./:-]*)[\"']?",
                          Pattern.CASE_INSENSITIVE);
                  // More targeted: URLs containing license keywords
                  Matcher m = Pattern.compile(
                          "(https?:)?//[^\\s\"'<>()\\\\]+?(?:license|widevine|playready|clearkey|/drm/)[^\\s\"'<>()\\\\]*",
                          Pattern.CASE_INSENSITIVE).matcher(html);
                  if (m.find()) {
                      String u = m.group(0);
                      if (u.startsWith("//")) u = "https:" + u;
                      return u;
                  }
                  // Fallback: named keys
                  Matcher km = Pattern.compile(
                          "\"(?:licenseUrl|licenseServer|license_url|drmUrl|widevine)\"\\s*:\\s*\"([^\"]+)\"",
                          Pattern.CASE_INSENSITIVE).matcher(html);
                  if (km.find()) {
                      String u = resolveUrl(km.group(1), pageUrl);
                      return u;
                  }
                  return null;
              }

              private boolean looksLikeMedia(String u) {
                  String l = u.toLowerCase(Locale.ROOT);
                  return l.contains(".mpd") || l.contains(".m3u8") || l.contains(".mp4")
                          || l.contains(".webm") || l.contains(".m4v") || l.contains("/manifest")
                          || l.contains("format=mpd") || l.contains("format=m3u8");
              }

              private String resolveUrl(String ref, String baseUrlStr) {
                  try {
                      if (ref == null || ref.isEmpty()) return null;
                      if (ref.startsWith("http://") || ref.startsWith("https://")) return ref;
                      if (ref.startsWith("//")) return "https:" + ref;
                      if (ref.startsWith("/")) {
                          Uri b = Uri.parse(baseUrlStr);
                          return b.getScheme() + "://" + b.getHost() + ref;
                      }
                      // Relative to page
                      java.net.URL b = new java.net.URL(baseUrlStr);
                      java.net.URL u = new java.net.URL(b, ref);
                      return u.toString();
                  } catch (Exception e) { return null; }
              }

              // ------------------------------------------------------------
              //  /S/<host>/<path>  →  media proxy with CORS + Range
              // ------------------------------------------------------------
              private void handleMediaProxy(String method, String hostAndPath,
                                            String query,
                                            Map<String, String> reqHeaders,
                                            byte[] reqBody,
                                            OutputStream out) throws IOException {
                  if (hostAndPath.isEmpty()) {
                      writeHttpResponse(out, 400, "Bad Request", "text/plain",
                              "Missing host".getBytes("UTF-8"));
                      return;
                  }
                  String targetUrl = "https://" + hostAndPath;
                  if (query != null && !query.isEmpty()) targetUrl += "?" + query;

                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(targetUrl).openConnection();
                      conn.setRequestMethod("HEAD".equals(method) ? "HEAD" : ("POST".equals(method) ? "POST" : "GET"));
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(120000);
                      conn.setInstanceFollowRedirects(true);
                      conn.setDoInput(true);

                      if (reqHeaders.get("range") != null)
                          conn.setRequestProperty("Range", reqHeaders.get("range"));
                      if (reqHeaders.get("accept") != null)
                          conn.setRequestProperty("Accept", reqHeaders.get("accept"));
                      if (reqHeaders.get("content-type") != null)
                          conn.setRequestProperty("Content-Type", reqHeaders.get("content-type"));
                      String ua = reqHeaders.get("user-agent");
                      conn.setRequestProperty("User-Agent", ua != null ? ua : DESKTOP_UA);
                      conn.setRequestProperty("Referer", baseUrl());

                      if (reqBody != null && reqBody.length > 0) {
                          conn.setDoOutput(true);
                          OutputStream co = conn.getOutputStream();
                          co.write(reqBody); co.flush(); co.close();
                      }

                      int code = conn.getResponseCode();
                      String contentType = conn.getContentType();
                      if (contentType == null || contentType.isEmpty())
                          contentType = guessContentType(targetUrl);

                      // For MPD / M3U8 manifests, read fully, rewrite absolute URLs, send
                      String lower = targetUrl.toLowerCase(Locale.ROOT);
                      boolean isManifest = lower.contains(".mpd") || lower.contains(".m3u8");

                      byte[] payload;
                      int outCode = code;
                      if (code >= 200 && code < 300 && isManifest && !"HEAD".equals(method)) {
                          String raw = readAll(conn.getInputStream());
                          String rewritten;
                          if (lower.contains(".mpd")) rewritten = rewriteMpd(raw, hostAndPath);
                          else                        rewritten = rewriteM3u8(raw, hostAndPath);
                          payload = rewritten.getBytes("UTF-8");
                          if (lower.contains(".mpd") && (contentType == null || contentType.isEmpty()))
                              contentType = "application/dash+xml";
                          if (lower.contains(".m3u8") && (contentType == null || contentType.isEmpty()))
                              contentType = "application/vnd.apple.mpegurl";
                      } else if (code >= 200 && code < 300 && !"HEAD".equals(method)) {
                          payload = readAllBytes(conn.getInputStream());
                      } else if (code >= 400) {
                          InputStream err = conn.getErrorStream();
                          payload = err != null ? readAllBytes(err) : new byte[0];
                      } else {
                          payload = new byte[0];
                      }

                      String cl = conn.getHeaderField("Content-Length");
                      String cr = conn.getHeaderField("Content-Range");
                      String ar = conn.getHeaderField("Accept-Ranges");

                      StringBuilder head = new StringBuilder();
                      head.append("HTTP/1.1 ").append(outCode).append(' ')
                              .append(safe(conn.getResponseMessage())).append("\r\n");
                      head.append("Access-Control-Allow-Origin: *\r\n");
                      head.append("Access-Control-Allow-Methods: GET, HEAD, POST, OPTIONS\r\n");
                      head.append("Access-Control-Allow-Headers: *\r\n");
                      head.append("Access-Control-Expose-Headers: Content-Length, Content-Range, Accept-Ranges\r\n");
                      head.append("Content-Type: ").append(contentType).append("\r\n");
                      // If we rewrote the manifest, Content-Length is our payload size
                      if (isManifest) head.append("Content-Length: ").append(payload.length).append("\r\n");
                      else if (cl != null) head.append("Content-Length: ").append(cl).append("\r\n");
                      if (cr != null) head.append("Content-Range: ").append(cr).append("\r\n");
                      head.append("Accept-Ranges: ").append(ar != null ? ar : "bytes").append("\r\n");
                      head.append("Cache-Control: no-cache\r\n");
                      head.append("Connection: close\r\n\r\n");
                      out.write(head.toString().getBytes("UTF-8"));

                      if (!"HEAD".equals(method)) out.write(payload);
                      out.flush();

                  } catch (Exception e) {
                      Log.e(TAG, "media proxy error: " + targetUrl, e);
                      writeHttpResponse(out, 502, "Bad Gateway", "text/plain",
                              ("Proxy error: " + e.getMessage()).getBytes("UTF-8"));
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              // Rewrite relative-friendly: only absolute/protocol-relative/absolute-path URLs
              private String rewriteUrl(String url, String manifestHost) {
                  if (url == null || url.isEmpty()) return url;
                  if (url.startsWith("/S/")) return url;
                  if (url.startsWith("data:") || url.startsWith("blob:") || url.startsWith("javascript:")) return url;
                  if (url.startsWith("//")) return "/S/" + url.substring(2);
                  if (url.startsWith("http://"))  return "/S/" + url.substring(7);
                  if (url.startsWith("https://")) return "/S/" + url.substring(8);
                  if (url.startsWith("/")) return "/S/" + manifestHost + url;
                  return url; // relative — leave alone (browser resolves against /S/host/path)
              }

              private String rewriteM3u8(String content, String manifestHostAndPath) {
                  String host = manifestHostAndPath;
                  int slash = host.indexOf('/');
                  if (slash > 0) host = host.substring(0, slash);

                  StringBuilder sb = new StringBuilder();
                  for (String line : content.split("\n", -1)) {
                      String trimmed = line.trim();
                      if (trimmed.isEmpty()) { sb.append(line); sb.append('\n'); continue; }
                      if (trimmed.startsWith("#")) {
                          sb.append(rewriteUriAttrs(line, host));
                      } else {
                          sb.append(rewriteUrl(trimmed, host));
                      }
                      sb.append('\n');
                  }
                  return sb.toString();
              }

              private String rewriteUriAttrs(String line, String host) {
                  Pattern p = Pattern.compile("URI=\"([^\"]+)\"");
                  Matcher m = p.matcher(line);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      String rewritten = rewriteUrl(m.group(1), host);
                      m.appendReplacement(sb, "URI=\"" + Matcher.quoteReplacement(rewritten) + "\"");
                  }
                  m.appendTail(sb);
                  return sb.toString();
              }

              private String rewriteMpd(String content, String manifestHostAndPath) {
                  String host = manifestHostAndPath;
                  int slash = host.indexOf('/');
                  if (slash > 0) host = host.substring(0, slash);

                  content = rewriteMpdAttr(content, "media=\"", "\"", host);
                  content = rewriteMpdAttr(content, "initialization=\"", "\"", host);
                  content = rewriteMpdAttr(content, "sourceURL=\"", "\"", host);
                  content = rewriteMpdTag(content, "BaseURL", host);
                  content = rewriteMpdTag(content, "Location", host);
                  return content;
              }

              private String rewriteMpdAttr(String content, String prefix, String suffix, String host) {
                  Pattern p = Pattern.compile(Pattern.quote(prefix) + "([^\"]+)" + Pattern.quote(suffix));
                  Matcher m = p.matcher(content);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      String rewritten = rewriteUrl(m.group(1), host);
                      m.appendReplacement(sb, Matcher.quoteReplacement(prefix + rewritten + suffix));
                  }
                  m.appendTail(sb);
                  return sb.toString();
              }

              private String rewriteMpdTag(String content, String tag, String host) {
                  Pattern p = Pattern.compile("<" + tag + ">([^<]+)</" + tag + ">");
                  Matcher m = p.matcher(content);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      String rewritten = rewriteUrl(m.group(1).trim(), host);
                      m.appendReplacement(sb, Matcher.quoteReplacement("<" + tag + ">" + rewritten + "</" + tag + ">"));
                  }
                  m.appendTail(sb);
                  return sb.toString();
              }

              // ------------------------------------------------------------
              //  Player HTML
              // ------------------------------------------------------------
              private String proxyMediaUrl(String url) {
                  if (url == null) return null;
                  if (url.startsWith("//")) url = "https:" + url;
                  if (url.startsWith("http://"))  return "/S/" + url.substring(7);
                  if (url.startsWith("https://")) return "/S/" + url.substring(8);
                  return url;
              }

              private String proxyLicenseUrl(String url) {
                  return proxyMediaUrl(url);
              }

              private String buildPlayerHtml(String mediaUrl, String mediaType, String licenseUrl) {
                  String mediaJson;
                  try {
                      JSONObject o = new JSONObject();
                      if (mediaUrl != null)    o.put("url", mediaUrl);
                      if (mediaType != null)   o.put("type", mediaType);
                      if (licenseUrl != null)  o.put("licenseUrl", licenseUrl);
                      mediaJson = o.toString();
                  } catch (Exception e) { mediaJson = "{}"; }

                  return "<!DOCTYPE html>\n"
                  + "<html><head><meta charset=\"utf-8\">"
                  + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">"
                  + "<title>Video</title>"
                  + "<style>"
                  + "html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}"
                  + "video{width:100%;height:100%;object-fit:contain;background:#000}"
                  + "#status{position:fixed;bottom:8px;left:8px;color:#fff;font:12px system-ui;"
                  + "background:rgba(0,0,0,.7);padding:6px 10px;border-radius:6px;max-width:80vw;word-break:break-all}"
                  + "#back{position:fixed;top:8px;left:8px;z-index:10;color:#fff;background:rgba(0,0,0,.7);"
                  + "border:0;border-radius:20px;padding:8px 16px;font:bold 14px system-ui;cursor:pointer}"
                  + "</style>"
                  + "<script src=\"https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js\"></script>"
                  + "<script src=\"https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js\"></script>"
                  + "</head><body>"
                  + "<button id=\"back\" onclick=\"history.back()\">\u2190 Back</button>"
                  + "<video id=\"v\" controls autoplay playsinline></video>"
                  + "<div id=\"status\"></div>"
                  + "<script>(function(){"
                  + "var media=" + mediaJson + ";"
                  + "var video=document.getElementById('v');var status=document.getElementById('status');"
                  + "var t=setTimeout(function(){status.style.display='none'},8000);"
                  + "function log(s){console.log('[video-only]',s);status.textContent=s;status.style.display='block';"
                  + "clearTimeout(t);t=setTimeout(function(){status.style.display='none'},8000);}"
                  + "if(!media||!media.url){log('No video URL detected on the source page');return;}"
                  + "var url=media.url;log('Loading '+(media.type||'media')+'...');"
                  + "var isMpd=/\\.mpd(\\?|$)/i.test(url)||media.type==='mpd';"
                  + "var isM3u8=/\\.m3u8(\\?|$)/i.test(url)||media.type==='m3u8';"
                  + "if(isMpd&&window.shaka){shaka.polyfill.installAll();"
                  + "if(!shaka.Player.isBrowserSupported()){log('Shaka not supported');return;}"
                  + "var player=new shaka.Player(video);window.__player=player;"
                  + "player.addEventListener('error',function(e){log('Player err: '+(e.detail||e));});"
                  + "if(media.licenseUrl){var s={};s['com.widevine.alpha']=media.licenseUrl;"
                  + "player.configure({drm:{servers:s}});log('DRM Widevine -> '+media.licenseUrl);}"
                  + "player.load(url).then(function(){log('Playing DASH');video.play().catch(function(){});})"
                  + ".catch(function(e){log('DASH failed: '+e);});"
                  + "}else if(isM3u8&&window.Hls){if(Hls.isSupported()){"
                  + "var hls=new Hls();hls.loadSource(url);hls.attachMedia(video);"
                  + "hls.on(Hls.Events.MANIFEST_PARSED,function(){log('Playing HLS');video.play().catch(function(){});});"
                  + "hls.on(Hls.Events.ERROR,function(e,d){if(d&&d.fatal)log('HLS fatal: '+d.type);});"
                  + "window.__hls=hls;}else if(video.canPlayType('application/vnd.apple.mpegurl')){"
                  + "video.src=url;video.play().catch(function(){});}else{log('HLS not supported');}"
                  + "}else{video.src=url;video.play().catch(function(){});"
                  + "video.addEventListener('error',function(){log('Native playback failed');});"
                  + "log('Playing native');}}})();</script></body></html>";
              }

              // ------------------------------------------------------------
              //  HTTP helpers
              // ------------------------------------------------------------
              private static void writeHttpResponse(OutputStream out, int code, String msg,
                                                    String contentType, byte[] body)
                      throws IOException {
                  StringBuilder sb = new StringBuilder();
                  sb.append("HTTP/1.1 ").append(code).append(' ').append(msg).append("\r\n");
                  sb.append("Access-Control-Allow-Origin: *\r\n");
                  sb.append("Access-Control-Allow-Methods: GET, HEAD, POST, OPTIONS\r\n");
                  sb.append("Access-Control-Allow-Headers: *\r\n");
                  sb.append("Content-Type: ").append(contentType != null ? contentType : "text/plain").append("\r\n");
                  sb.append("Content-Length: ").append(body.length).append("\r\n");
                  sb.append("Connection: close\r\n\r\n");
                  out.write(sb.toString().getBytes("UTF-8"));
                  out.write(body);
                  out.flush();
              }

              private static String safe(String s) { return s == null ? "" : s; }

              private static String guessContentType(String url) {
                  if (url == null) return "application/octet-stream";
                  String u = url.toLowerCase(Locale.ROOT);
                  int q = u.indexOf('?'); if (q >= 0) u = u.substring(0, q);
                  if (u.endsWith(".mpd"))  return "application/dash+xml";
                  if (u.endsWith(".m3u8")) return "application/vnd.apple.mpegurl";
                  if (u.endsWith(".mp4") || u.endsWith(".m4s") || u.endsWith(".m4v")) return "video/mp4";
                  if (u.endsWith(".ts"))   return "video/mp2t";
                  if (u.endsWith(".webm")) return "video/webm";
                  if (u.endsWith(".mkv"))  return "video/x-matroska";
                  if (u.endsWith(".mp3"))  return "audio/mpeg";
                  if (u.endsWith(".aac"))  return "audio/aac";
                  if (u.endsWith(".json")) return "application/json";
                  if (u.endsWith(".xml"))  return "application/xml";
                  return "application/octet-stream";
              }

              private static byte[] readAllBytes(InputStream is) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192]; int n;
                  while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                  is.close();
                  return bo.toByteArray();
              }

              private static String readAll(InputStream is) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192]; int n;
                  while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                  is.close();
                  return new String(bo.toByteArray(), "UTF-8");
              }

              private String fetchText(String link) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(link).openConnection();
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", DESKTOP_UA);
                      c.setInstanceFollowRedirects(true);
                      int code = c.getResponseCode();
                      if (code < 200 || code >= 400) return null;
                      return readAll(c.getInputStream());
                  } catch (Exception e) {
                      Log.e(TAG, "fetchText", e); return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              // ------------------------------------------------------------
              //  Media / License detection helpers (used for logging)
              // ------------------------------------------------------------
              private static boolean isMediaUrl(String url) {
                  if (url == null) return false;
                  String u = url.toLowerCase(Locale.ROOT);
                  return u.contains(".mpd") || u.contains(".m3u8") || u.contains(".mp4")
                          || u.contains(".m4s") || u.contains(".ts?")
                          || u.contains("manifest") || u.contains("playlist");
              }

              private static boolean isLicenseUrl(String url) {
                  if (url == null) return false;
                  String u = url.toLowerCase(Locale.ROOT);
                  return u.contains("license") || u.contains("widevine")
                          || u.contains("playready") || u.contains("clearkey")
                          || u.contains("/drm/");
              }

              // ------------------------------------------------------------
              //  System UI + fullscreen
              // ------------------------------------------------------------
              private void applyNormalSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              private void applyFullscreenSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              private void exitCustomView() {
                  if (customView == null) return;
                  fullscreenContainer.removeView(customView);
                  fullscreenContainer.setVisibility(View.GONE);
                  content.setVisibility(View.VISIBLE);
                  customView = null;
                  WebChromeClient.CustomViewCallback cb = customCallback;
                  customCallback = null;
                  if (cb != null) cb.onCustomViewHidden();
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  applyNormalSystemUi();
                  content.setPadding(padL, padT, padR, padB);
                  frame.requestApplyInsets();
              }

              @Override public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      if (customView != null) applyFullscreenSystemUi();
                      else applyNormalSystemUi();
                  }
              }

              // ------------------------------------------------------------
              //  Block list
              // ------------------------------------------------------------
              private boolean parse(String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      Set<String> d = new HashSet<String>();
                      Set<String> u = new HashSet<String>();
                      JSONArray da = o.optJSONArray("blockDomains");
                      JSONArray ua = o.optJSONArray("blockUrls");
                      if (da != null) for (int i = 0; i < da.length(); i++)
                          d.add(da.getString(i).trim().toLowerCase(Locale.ROOT));
                      if (ua != null) for (int i = 0; i < ua.length(); i++)
                          u.add(endpointKey(ua.getString(i).trim()));
                      blockDomains.clear(); blockDomains.addAll(d);
                      blockUrls.clear();    blockUrls.addAll(u);
                      return true;
                  } catch (Exception e) { Log.e(TAG, "parse error", e); return false; }
              }

              private static String stripSlash(String s) {
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              private boolean isBlocked(String url) {
                  try {
                      String host = Uri.parse(url).getHost();
                      if (host != null && blockDomains.contains(host.toLowerCase(Locale.ROOT))) return true;
                      if (blockUrls.contains(endpointKey(url))) return true;
                  } catch (Exception ignored) { }
                  return false;
              }

              private static String endpointKey(String url) {
                  Uri u = Uri.parse(url);
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase(Locale.ROOT);
                  String path = u.getPath() == null ? "" : u.getPath().toLowerCase(Locale.ROOT);
                  return host + stripSlash(path);
              }

              private String download(String link) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(link).openConnection();
                      c.setConnectTimeout(5000); c.setReadTimeout(5000);
                      if (c.getResponseCode() != 200) return null;
                      return readAll(c.getInputStream());
                  } catch (Exception e) { Log.e(TAG, "download error", e); return null; }
                  finally { if (c != null) c.disconnect(); }
              }

              @Override public void onBackPressed() {
                  if (customView != null) exitCustomView();
                  else if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onPause()  { super.onPause();  web.onPause();  }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override protected void onDestroy() { stopProxyServer(); super.onDestroy(); }
          }
          EOF

          export PKG="$PACKAGE_NAME"
          export PORT="$PROXY_PORT"
          for f in app/build.gradle app/src/main/AndroidManifest.xml \
                   app/src/main/java/$PKG_PATH/MainActivity.java; do
            perl -pi -e 's/__PKG__/$ENV{PKG}/g;
                         s/__BASE_URL__/$ENV{BASE_URL}/g;
                         s/__BLOCK_API__/$ENV{BLOCK_API}/g;
                         s/__APP_NAME__/$ENV{APP_NAME}/g;
                         s/__ICON_REF__/$ENV{ICON_REF}/g;
                         s/__PROXY_PORT__/$ENV{PORT}/g' "$f"
          done

      - name: Build debug APK
        working-directory: webapp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp webapp/app/build/outputs/apk/debug/app-debug.apk out/webapp.apk

