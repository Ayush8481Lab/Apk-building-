                          IconButton(
                              onClick = { if (pl.id == vm.activeId) vm.refresh() else vm.select(pl.id) },
                              modifier = Modifier.tvFocus(CircleShape)
                          ) { Icon(Icons.Filled.Refresh, "Refresh") }
                          IconButton(onClick = { vm.delete(pl.id) }, modifier = Modifier.tvFocus(CircleShape)) {
                              Icon(Icons.Filled.Delete, "Delete")
                          }
                      }
                  }
                  val pl = vm.active()
                  if (pl != null) {
                      HorizontalDivider(color = Color(0xFF333333))
                      Text("EPG (XMLTV) for \"${pl.name}\"", fontSize = 20.sp, color = Gold)
                      var epgUrl by remember(pl.id, pl.epg) { mutableStateOf(pl.epg) }
                      OutlinedTextField(
