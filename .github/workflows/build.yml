          /* ================================================================== ROOT */

          @Composable
          fun AppRoot(vm: MainVM, pc: PlayerController, act: MainActivity) {
              // start / restart playback whenever a channel is (re)selected
              LaunchedEffect(vm.playNonce) {
                  vm.current?.let { pc.play(it, vm.userAgent, vm.extraHeaders) }
              }

              // sleep timer
              LaunchedEffect(vm.sleepAt) {
                  if (vm.sleepAt > 0L) {
                      val wait = vm.sleepAt - System.currentTimeMillis()
                      if (wait > 0) delay(wait)
                      pc.stop()
                      vm.fullscreen = false
                      vm.sleepAt = 0L
                      vm.toast = "Sleep timer: playback stopped"
                  }
              }

              // immersive landscape player
              DisposableEffect(vm.fullscreen) {
                  val w = act.window
                  val c = WindowCompat.getInsetsController(w, w.decorView)
                  if (vm.fullscreen) {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      c.hide(WindowInsetsCompat.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  onDispose {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      c.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              if (vm.fullscreen) PlayerScreen(vm, pc, act) else HomeScreen(vm)
          }

          /* ================================================================ PLAYER */

          @Composable
          fun PlayerScreen(vm: MainVM, pc: PlayerController, act: MainActivity) {
              var showUi by remember { mutableStateOf(true) }
              var showList by remember { mutableStateOf(false) }
              var dialog by remember { mutableStateOf("") }
              val focus = remember { FocusRequester() }
              val ch = vm.current
              val inPip = act.inPip

              LaunchedEffect(showUi, showList, dialog, vm.playNonce) {
                  if (showUi && !showList && dialog.isEmpty()) {
                      delay(5000)
                      showUi = false
                  }
              }
              LaunchedEffect(vm.playNonce) { showUi = true }
              LaunchedEffect(showList, dialog) {
                  if (!showList && dialog.isEmpty()) {
                      try {
                          focus.requestFocus()
                      } catch (e: Exception) {
                      }
                  }
              }

              BackHandler {
                  if (dialog.isNotEmpty()) dialog = ""
                  else if (showList) showList = false
                  else {
                      pc.stop()
                      vm.fullscreen = false
                  }
              }

              val resize = when (vm.aspect) {
                  1 -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                  2 -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                  else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
              }
              val nn = if (ch != null) vm.nowNext(ch) else Pair<Program?, Program?>(null, null)

              Box(
                  Modifier.fillMaxSize().background(Color.Black)
                      .onKeyEvent { e ->
                          if (e.type != KeyEventType.KeyDown || showList || dialog.isNotEmpty()) {
                              false
                          } else {
                              when (e.nativeKeyEvent.keyCode) {
                                  KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_CHANNEL_UP, KeyEvent.KEYCODE_PAGE_UP -> {
                                      vm.zap(1); true
                                  }
                                  KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_CHANNEL_DOWN, KeyEvent.KEYCODE_PAGE_DOWN -> {
                                      vm.zap(-1); true
                                  }
                                  KeyEvent.KEYCODE_DPAD_LEFT -> {
                                      showList = true; true
                                  }
                                  KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                                      if (!showUi) showUi = true else showList = true
                                      true
                                  }
                                  KeyEvent.KEYCODE_MENU, KeyEvent.KEYCODE_INFO -> {
                                      showUi = !showUi; true
                                  }
                                  else -> false
                              }
                          }
                      }
                      .focusRequester(focus)
                      .focusable()
              ) {
                  AndroidView(
                      factory = { c ->
                          PlayerView(c).apply {
                              useController = false
                              player = pc.player
                              setShutterBackgroundColor(android.graphics.Color.BLACK)
                              isFocusable = false
                              isFocusableInTouchMode = false
                              keepScreenOn = true
                          }
                      },
                      update = { it.resizeMode = resize },
                      modifier = Modifier.fillMaxSize()
                  )

                  // gesture layer: tap = toggle UI, double tap = last channel, swipe up/down = zap
                  Box(
                      Modifier.fillMaxSize()
                          .pointerInput(Unit) {
                              detectTapGestures(
                                  onTap = { if (showList) showList = false else showUi = !showUi },
                                  onDoubleTap = { vm.recall() }
                              )
                          }
                          .pointerInput(Unit) {
                              var total = 0f
                              detectVerticalDragGestures(
                                  onDragStart = { total = 0f },
                                  onDragEnd = {
                                      if (total < -120f) vm.zap(1) else if (total > 120f) vm.zap(-1)
                                  }
                              ) { _, dy -> total += dy }
                          }
                  )

                  if (pc.buffering && !inPip) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center), color = Color.White)
                  }
                  pc.error?.let {
                      Text(
                          it,
                          Modifier.align(Alignment.Center).padding(horizontal = 32.dp)
                              .background(Color(0xDD000000)).padding(14.dp),
                          color = Color.White, textAlign = TextAlign.Center, fontSize = 13.sp
                      )
                  }

                  AnimatedVisibility(visible = showUi && !inPip, enter = fadeIn(), exit = fadeOut()) {
                      Column(Modifier.fillMaxSize()) {
                          // ---- top bar
                          Row(
                              Modifier.fillMaxWidth()
                                  .background(Brush.verticalGradient(listOf(Color(0xCC000000), Color.Transparent)))
                                  .padding(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = {
                                  pc.stop()
                                  vm.fullscreen = false
                              }) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = Color.White) }
                              Text(
                                  ch?.name ?: "", Modifier.weight(1f), color = Color.White,
                                  fontSize = 18.sp, fontWeight = FontWeight.Bold, maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              if (ch != null && ch.num > 0) {
                                  val fav = ch.url in vm.favorites
                                  IconButton(onClick = { vm.toggleFav(ch) }) {
                                      Icon(
                                          if (fav) Icons.Filled.Star else Icons.Filled.StarBorder, "Favorite",
                                          tint = if (fav) Color(0xFFFFC107) else Color.White
                                      )
                                  }
                              }
                              IconButton(onClick = { vm.recall() }) { Icon(Icons.Filled.SwapHoriz, "Last channel", tint = Color.White) }
                              IconButton(onClick = { dialog = "audio" }) { Icon(Icons.Filled.Audiotrack, "Audio", tint = Color.White) }
                              IconButton(onClick = { dialog = "sub" }) { Icon(Icons.Filled.Subtitles, "Subtitles", tint = Color.White) }
                              IconButton(onClick = { dialog = "video" }) { Icon(Icons.Filled.HighQuality, "Quality", tint = Color.White) }
                              IconButton(onClick = { dialog = "aspect" }) { Icon(Icons.Filled.AspectRatio, "Aspect", tint = Color.White) }
                              IconButton(onClick = { dialog = "sleep" }) { Icon(Icons.Filled.Timer, "Sleep timer", tint = Color.White) }
                              IconButton(onClick = { dialog = "log" }) { Icon(Icons.Filled.BugReport, "Network log", tint = Color.White) }
                              IconButton(onClick = { act.enterPip() }) { Icon(Icons.Filled.PictureInPictureAlt, "PiP", tint = Color.White) }
                              IconButton(onClick = { showList = true }) { Icon(Icons.Filled.FormatListBulleted, "Channels", tint = Color.White) }
                          }

                          Spacer(Modifier.weight(1f))

                          // ---- bottom info bar
                          if (ch != null) {
                              Row(
                                  Modifier.fillMaxWidth()
                                      .background(Brush.verticalGradient(listOf(Color.Transparent, Color(0xDD000000))))
                                      .padding(16.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Logo(ch, 56.dp)
                                  Spacer(Modifier.width(14.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(
                                          (if (ch.num > 0) "${ch.num}  " else "") + ch.name,
                                          color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp
                                      )
                                      val now = nn.first
                                      val next = nn.second
                                      if (now != null) {
                                          Text(
                                              "${hm(now.start)} - ${hm(now.stop)}  ${now.title}",
                                              color = Color.White, fontSize = 14.sp, maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                          LinearProgressIndicator(
                                              progress = { progressOf(now, vm.now) },
                                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp).height(3.dp)
                                          )
                                      }
                                      if (next != null) {
                                          Text(
                                              "Next ${hm(next.start)}  ${next.title}",
                                              color = Color(0xFFB8C0CF), fontSize = 12.sp, maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                      }
                                  }
                                  if (pc.videoRes.isNotEmpty()) {
                                      Text(pc.videoRes, color = Color(0xFFB8C0CF), fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }

                  // ---- channel panel
                  AnimatedVisibility(
                      visible = showList && !inPip,
                      enter = slideInHorizontally { -it },
                      exit = slideOutHorizontally { -it }
                  ) {
                      ChannelPanel(vm) { showList = false }
                  }
              }

              // ---- dialogs
              when (dialog) {
                  "audio" -> TrackDialog("Audio", C.TRACK_TYPE_AUDIO, pc, null) { dialog = "" }
                  "sub" -> TrackDialog("Subtitles", C.TRACK_TYPE_TEXT, pc, "Off") { dialog = "" }
                  "video" -> TrackDialog("Video quality", C.TRACK_TYPE_VIDEO, pc, "Auto") { dialog = "" }
                  "log" -> LogDialog { dialog = "" }
                  "aspect" -> SimpleDialog("Aspect ratio", listOf("Fit", "Zoom", "Stretch"), vm.aspect, { vm.updateAspect(it) }) { dialog = "" }
                  "sleep" -> {
                      val mins = listOf(15, 30, 45, 60, 90, 120)
                      SimpleDialog(
                          if (vm.sleepAt > 0) "Sleep timer (running)" else "Sleep timer",
                          mins.map { "$it minutes" } + "Off", -1,
                          { i ->
                              vm.sleepAt = if (i < mins.size) System.currentTimeMillis() + mins[i] * 60_000L else 0L
                          }
                      ) { dialog = "" }
                  }
              }
          }

          @Composable
          fun ChannelPanel(vm: MainVM, onPick: () -> Unit) {
              var g by remember { mutableStateOf(vm.group) }
              val all = listOf(G_ALL, G_FAV, G_RECENT) + vm.groups
              val list = remember(g, vm.channels, vm.favorites, vm.recents) { vm.filter(g) }
              val state = rememberLazyListState()
              LaunchedEffect(Unit) {
                  val i = list.indexOfFirst { it.url == vm.current?.url }
                  if (i > 0) state.scrollToItem(i)
              }
              Column(Modifier.width(400.dp).fillMaxHeight().background(Color(0xF00E1117))) {
                  Row(Modifier.fillMaxWidth().padding(4.dp), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { g = all[(all.indexOf(g) - 1 + all.size).mod(all.size)] }) {
                          Icon(Icons.Filled.ChevronLeft, "Previous group")
                      }
                      Text(g, Modifier.weight(1f), textAlign = TextAlign.Center, fontWeight = FontWeight.Bold, maxLines = 1)
                      IconButton(onClick = { g = all[(all.indexOf(g) + 1).mod(all.size)] }) {
                          Icon(Icons.Filled.ChevronRight, "Next group")
                      }
                  }
                  if (list.isEmpty()) {
                      Text("Nothing here yet", Modifier.padding(16.dp), color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
                  LazyColumn(state = state) {
                      items(list, key = { it.num }) { ch ->
                          ChannelRow(vm, ch, ch.url == vm.current?.url) {
                              vm.play(ch, list)
                              onPick()
                          }
                      }
                  }
              }
          }

          @Composable
          fun SimpleDialog(
              title: String, options: List<String>, selected: Int,
              onPick: (Int) -> Unit, onDismiss: () -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      LazyColumn {
                          itemsIndexed(options) { i, o ->
                              PickRow(o, i == selected) {
                                  onPick(i)
                                  onDismiss()
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun TrackDialog(title: String, type: Int, pc: PlayerController, offLabel: String?, onDismiss: () -> Unit) {
              val opts = pc.options(type)
              val disabled = pc.isDisabled(type)
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      LazyColumn {
                          if (offLabel != null) {
                              item {
                                  PickRow(offLabel, if (type == C.TRACK_TYPE_VIDEO) false else disabled) {
                                      if (type == C.TRACK_TYPE_VIDEO) pc.auto(type) else pc.disable(type)
                                      onDismiss()
                                  }
                              }
                          }
                          if (opts.isEmpty()) {
                              item { Text("No tracks available", color = MaterialTheme.colorScheme.onSurfaceVariant) }
                          }
                          itemsIndexed(opts) { _, o ->
                              PickRow(o.label, o.selected && !disabled && type != C.TRACK_TYPE_VIDEO) {
                                  pc.select(o)
                                  onDismiss()
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun LogDialog(onDismiss: () -> Unit) {
              var tick by remember { mutableStateOf(0) }
              val lines = remember(tick) { NetLog.snapshot().reversed() }
              val clip = LocalClipboardManager.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Network log (newest first)") },
                  text = {
                      LazyColumn(Modifier.heightIn(max = 320.dp)) {
                          if (lines.isEmpty()) item { Text("No requests yet") }
                          items(lines) { l ->
                              Text(l, fontSize = 11.sp, fontFamily = FontFamily.Monospace, modifier = Modifier.padding(vertical = 3.dp))
                          }
                      }
                  },
                  confirmButton = {
                      Row {
                          TextButton(onClick = { clip.setText(AnnotatedString(lines.joinToString("\n"))) }) { Text("Copy") }
                          TextButton(onClick = { NetLog.clear(); tick++ }) { Text("Clear") }
                          TextButton(onClick = { tick++ }) { Text("Refresh") }
                          TextButton(onClick = onDismiss) { Text("Close") }
                      }
                  }
              )
          }
          __SB_EOF__

