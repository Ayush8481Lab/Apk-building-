                      h.rv.layoutParams = l
                      h.rv.adapter = CardAdapter(r, pos)
                  }
              }

              inner class CardAdapter(private val row: Row, private val rowPos: Int) : RecyclerView.Adapter<CardVH>() {
                  private val cw = if (row.spotlight) stripW else cardW
                  private val ch = if (row.spotlight) stripH else cardH
                  override fun getItemCount() = row.items.size

                  // decode the next cards into memory + download their title images ahead of the focus
                  private fun warm(pos: Int) {
                      for (k in 1..7) {
                          val it = row.items.getOrNull(pos + k) ?: break
                          cardReq(cardUrl(row.spotlight, it), cw, ch).priority(Priority.LOW).preload()
                          if (!row.spotlight) Prefetch.add(it.logo)
                      }
                      row.items.getOrNull(pos - 1)?.let { cardReq(cardUrl(row.spotlight, it), cw, ch).priority(Priority.LOW).preload() }
                  }

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): CardVH {
                      val card = FrameLayout(this@MainActivity).apply {
                          layoutParams = RecyclerView.LayoutParams(cw, ch).apply { rightMargin = u(12) }
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      val iv = ImageView(this@MainActivity).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.rgb(26, 28, 42))
                          outlineProvider = roundOutline; clipToOutline = true
                      }
                      // text-only slide fallback (no image available)
                      val tvl = TextView(this@MainActivity).apply {
                          setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                          maxLines = 4; ellipsize = TextUtils.TruncateAt.END
                          setPadding(u(8), u(8), u(8), u(8)); visibility = View.GONE
                      }
                      tx(tvl, 14f)
                      val border = View(this@MainActivity).apply {
                          background = GradientDrawable().apply {
                              setColor(Color.TRANSPARENT); setStroke(u(3), Color.WHITE); cornerRadius = u(8).toFloat()
                          }
                          alpha = 0f
                      }
                      card.addView(iv, FrameLayout.LayoutParams(-1, -1))
                      card.addView(tvl, FrameLayout.LayoutParams(-1, -1))
                      card.addView(border, FrameLayout.LayoutParams(-1, -1))
                      if (row.spotlight) {
                          val play = TextView(this@MainActivity).apply { text = "▶"; setTextColor(Color.WHITE) }
                          tx(play, 12f)
                          card.addView(play, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { setMargins(u(8), 0, 0, u(6)) })
                      }
                      return CardVH(card, iv, border, tvl)
                  }

                  override fun onBindViewHolder(h: CardVH, pos: Int) {
                      val item = row.items[pos]
                      val url = cardUrl(row.spotlight, item)
                      cardReq(url, cw, ch).priority(Priority.HIGH).into(h.iv)
                      if (pos == 0) warm(0)
                      h.tv.text = item.title
                      h.tv.visibility = if (url == null) View.VISIBLE else View.GONE
                      h.card.scaleX = 1f; h.card.scaleY = 1f; h.border.alpha = 0f
                      h.card.setOnFocusChangeListener { v, has ->
                          v.animate().scaleX(if (has) 1.1f else 1f).scaleY(if (has) 1.1f else 1f).setDuration(150).start()
                          h.border.animate().alpha(if (has) 1f else 0f).setDuration(150).start()
                          v.translationZ = if (has) u(10).toFloat() else 0f
                          if (has) { warm(pos); onCardFocus(item, row, pos, rowPos) }
                      }
                      // SHOW (listing rows AND spotlight) -> show detail page. Any other VOD (episode, trailer...) -> nothing yet.
                      h.card.setOnClickListener {
                          if (item.sub == SUB_SHOW) openDetail(item, h.card)
                      }
                  }
              }

              // vertical episode list: thumbnail left, title / "E16 • 08 Nov 2026 • 1h 14m" / description right
