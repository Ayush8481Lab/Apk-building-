              ) {
                  Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f)) {
                      if (url.isNotBlank()) {
                          Banner(url, Modifier.fillMaxSize())
                      } else {
                          Box(
                              Modifier.fillMaxSize().background(
                                  Brush.linearGradient(listOf(Accent.copy(alpha = 0.22f), Accent2.copy(alpha = 0.12f)))
