              val expanded = vm.pane == 0
              Column(Modifier.width(width).fillMaxHeight().background(SideBg)) {
                  Box(Modifier.fillMaxWidth().height(200.dp), contentAlignment = Alignment.Center) {
                      if (expanded) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("StreamBox", color = Gold, fontSize = 30.sp, fontWeight = FontWeight.Bold)
                              Text("IPTV Player", color = TextDim, fontSize = 16.sp)
                          }
                      }
                  }
                  Spacer(Modifier.height(30.dp))
                  SideItem(vm, "Search", Icons.Filled.Search, 0, expanded)
                  SideItem(vm, "TV", Icons.Filled.Tv, 1, expanded)
                  SideItem(vm, "Recordings", Icons.Filled.FiberDvr, 2, expanded)
                  SideItem(vm, "My list", Icons.Filled.BookmarkBorder, 3, expanded)
                  Spacer(Modifier.weight(1f))
                  SideItem(vm, "Settings", Icons.Filled.Settings, 4, expanded)
                  Spacer(Modifier.height(24.dp))
              }
          }

          @Composable
          fun SideItem(vm: MainVM, label: String, icon: ImageVector, idx: Int, expanded: Boolean) {
              val sel = vm.side == idx
              Row(
                  Modifier.padding(horizontal = 24.dp, vertical = 6.dp).fillMaxWidth().height(58.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(if (expanded && sel) SideSel else Color.Transparent)
                      .tap {
                          vm.side = idx
                          vm.pane = if (idx == 1 && vm.playlists.isNotEmpty()) 1 else 2
                      },
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Spacer(Modifier.width(17.dp))
                  Icon(icon, label, tint = if (sel) Color.White else Color(0xFF8A8A8A), modifier = Modifier.size(28.dp))
                  if (expanded) {
                      Spacer(Modifier.width(18.dp))
                      Text(label, fontSize = 22.sp, color = Color.White, maxLines = 1)
                  }
