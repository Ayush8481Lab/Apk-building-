                          Icon(Icons.Filled.History, null, tint = Color.White, modifier = Modifier.size(44.dp))
                          Text("History", color = Color.White, fontSize = 22.sp, modifier = Modifier.padding(top = 6.dp, bottom = 22.dp))
                      }
