          @Composable
          fun HomeScreen(vm: MainVM) {
              var tab by rememberSaveable { mutableIntStateOf(0) }
              var dlg by remember { mutableStateOf("") }
              val snack = remember { SnackbarHostState() }
              val wide = LocalConfiguration.current.screenWidthDp >= 720

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                  if (uri != null) {
                      val nm = uri.lastPathSegment?.substringAfterLast('/')?.take(30) ?: "Local playlist"
                      vm.addFile(uri, nm)
                  }
              }
              val onAdd: (String) -> Unit = { kind ->
                  if (kind == "file") picker.launch(arrayOf("*/*")) else dlg = kind
              }
              val onOpen: (Channel, List<Channel>) -> Unit = { ch, l ->
                  vm.play(ch, l)
                  vm.fullscreen = true
              }

              LaunchedEffect(vm.toast) {
                  vm.toast?.let {
                      snack.showSnackbar(it)
                      vm.toast = null
                  }
              }

              val tabs: List<Pair<String, ImageVector>> = listOf(
                  "TV" to Icons.Filled.LiveTv,
                  "Guide" to Icons.Filled.Schedule,
                  "Search" to Icons.Filled.Search,
                  "Settings" to Icons.Filled.Settings
              )

              Scaffold(
                  snackbarHost = { SnackbarHost(snack) },
                  bottomBar = {
                      if (!wide) {
                          NavigationBar {
                              tabs.forEachIndexed { i, t ->
                                  NavigationBarItem(
                                      selected = tab == i, onClick = { tab = i },
                                      icon = { Icon(t.second, t.first) }, label = { Text(t.first) }
                                  )
                              }
                          }
                      }
                  }
              ) { pad ->
                  Row(Modifier.padding(pad).fillMaxSize()) {
                      if (wide) {
                          NavigationRail {
                              Spacer(Modifier.height(12.dp))
                              tabs.forEachIndexed { i, t ->
                                  NavigationRailItem(
                                      selected = tab == i, onClick = { tab = i },
                                      icon = { Icon(t.second, t.first) }, label = { Text(t.first) }
                                  )
                              }
                          }
                      }
                      Column(Modifier.weight(1f).fillMaxHeight()) {
                          if (vm.loading) LinearProgressIndicator(Modifier.fillMaxWidth())
                          if (vm.playlists.isEmpty() && tab != 3) {
                              Welcome(onAdd)
                          } else when (tab) {
                              0 -> ChannelsTab(vm, onOpen)
                              1 -> GuideTab(vm, onOpen)
                              2 -> SearchTab(vm, onOpen)
                              else -> SettingsTab(vm, onAdd)
                          }
                      }
                  }
              }

              when (dlg) {
                  "url" -> FormDialog(
                      "Add playlist", listOf("Name", "M3U / M3U8 URL", "EPG URL (optional)"), "Add",
                      { dlg = "" }
                  ) { v -> if (v[1].isNotBlank()) vm.addUrl(v[0], v[1], v[2]) }
                  "xtream" -> FormDialog(
                      "Xtream Codes", listOf("Name", "Server (http://host:port)", "Username", "Password"), "Add",
                      { dlg = "" }
                  ) { v -> if (v[1].isNotBlank() && v[2].isNotBlank()) vm.addXtream(v[0], v[1], v[2], v[3]) }
                  "quick" -> FormDialog(
                      "Quick play",
                      listOf("Stream URL (m3u8, ts, mpd...)", "DRM: clearkey or widevine (optional)", "License URL or KID:KEY (optional)"),
                      "Play",
                      { dlg = "" }
                  ) { v -> vm.quickPlay(v[0], v[1], v[2]) }
              }
          }

