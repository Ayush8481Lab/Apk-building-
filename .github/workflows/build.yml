                              fontSize = 18.sp, maxLines = 1, overflow = TextOverflow.Ellipsis
                          )
                          Spacer(Modifier.height(6.dp))
                          Box(Modifier.fillMaxWidth().height(3.dp).background(Color(0xFF555555))) {
                              if (np != null) {
