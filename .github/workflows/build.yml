                  epgAt[k] = System.currentTimeMillis()
                  val l = withContext(Dispatchers.IO) {
                      try { EpgApi.fetch(id, offset) } catch (e: Exception) { null }
                  }
                  if (l != null) epg[k] = l else epgAt.remove(k)
