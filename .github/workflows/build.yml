          /* ================================================================ DIALOGS */

          @Composable
          fun Dialogs(vm: MainVM, pc: PlayerController, act: MainActivity) {
              val close = { vm.dialog = "" }
              when (vm.dialog) {
                  "url" -> FormDialog("Add playlist", listOf("Name", "M3U / M3U8 URL", "EPG URL (optional)"), "Add", close) { v ->
                      if (v[1].isNotBlank()) vm.addUrl(v[0], v[1], v[2])
                  }
                  "xtream" -> FormDialog("Xtream Codes", listOf("Name", "Server (http://host:port)", "Username", "Password"), "Add", close) { v ->
                      if (v[1].isNotBlank() && v[2].isNotBlank()) vm.addXtream(v[0], v[1], v[2], v[3])
                  }
                  "quick" -> FormDialog(
                      "Quick play",
                      listOf("Stream URL (m3u8, ts, mpd...)", "DRM: clearkey or widevine (optional)", "License URL or KID:KEY (optional)"),
                      "Play", close
                  ) { v -> vm.quickPlay(v[0], v[1], v[2]) }

                  "options" -> {
                      val ch = if (vm.fullscreen && !vm.guideOverlay) vm.current else vm.shown.getOrNull(vm.chIdx)
                      if (ch == null) close() else {
                          val fav = ch.url in vm.favorites
                          SimpleDialog(
                              ch.name,
                              listOf(if (fav) "Remove from favorites" else "Add to favorites", "Play full screen"),
                              -1, true, close
                          ) { i ->
                              if (i == 0) vm.toggleFav(ch)
                              else {
                                  if (vm.current?.url != ch.url) vm.play(ch, vm.shown)
                                  vm.enterFull()
                              }
                          }
                      }
                  }
                  "menu" -> {
                      val keys = listOf("audio", "sub", "video", "aspect", "sleep", "fav", "pip", "log")
                      val favNow = vm.current?.let { it.url in vm.favorites } == true
                      SimpleDialog(
                          "Options",
                          listOf("Audio track", "Subtitles", "Video quality", "Aspect ratio", "Sleep timer",
                              if (favNow) "Remove from favorites" else "Add to favorites", "Picture-in-picture", "Network log"),
                          -1, false, close
                      ) { i ->
                          when (keys[i]) {
                              "fav" -> {
                                  vm.current?.let { vm.toggleFav(it) }
                                  vm.dialog = ""
                              }
                              "pip" -> {
                                  vm.dialog = ""
                                  act.enterPip()
                              }
                              else -> vm.dialog = keys[i]
                          }
                      }
                  }
                  "history" -> {
                      val l = vm.recents.mapNotNull { u -> vm.channels.firstOrNull { it.url == u } }
                      if (l.isEmpty()) SimpleDialog("History", listOf("Nothing watched yet"), -1, true, close) { }
                      else SimpleDialog("History", l.map { it.name }, -1, true, close) { i -> vm.play(l[i], vm.channels) }
                  }
                  "audio" -> TrackDialog("Audio", C.TRACK_TYPE_AUDIO, pc, null, close)
                  "sub" -> TrackDialog("Subtitles", C.TRACK_TYPE_TEXT, pc, "Off", close)
                  "video" -> TrackDialog("Video quality", C.TRACK_TYPE_VIDEO, pc, "Auto", close)
                  "log" -> LogDialog(close)
                  "aspect" -> SimpleDialog("Aspect ratio", listOf("Fit", "Zoom", "Stretch"), vm.aspect, true, close) { vm.updateAspect(it) }
                  "sleep" -> {
                      val mins = listOf(15, 30, 45, 60, 90, 120)
                      SimpleDialog(
                          if (vm.sleepAt > 0) "Sleep timer (running)" else "Sleep timer",
                          mins.map { "$it minutes" } + "Off", -1, true, close
                      ) { i ->
                          vm.sleepAt = if (i < mins.size) System.currentTimeMillis() + mins[i] * 60_000L else 0L
                      }
                  }
              }
          }

          @Composable
          fun SimpleDialog(
              title: String, options: List<String>, selected: Int, closeOnPick: Boolean,
              onDismiss: () -> Unit, onPick: (Int) -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                  text = {
                      LazyColumn(Modifier.heightIn(max = 380.dp)) {
                          itemsIndexed(options) { i, o ->
                              PickRow(o, i == selected) {
                                  onPick(i)
                                  if (closeOnPick) onDismiss()
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun TrackDialog(title: String, type: Int, pc: PlayerController, offLabel: String?, onDismiss: () -> Unit) {
              val opts = pc.options(type)
              val disabled = pc.isDisabled(type)
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      LazyColumn(Modifier.heightIn(max = 380.dp)) {
                          if (offLabel != null) {
                              item {
                                  PickRow(offLabel, if (type == C.TRACK_TYPE_VIDEO) false else disabled) {
                                      if (type == C.TRACK_TYPE_VIDEO) pc.auto(type) else pc.disable(type)
                                      onDismiss()
                                  }
                              }
                          }
                          if (opts.isEmpty()) {
                              item { Text("No tracks available", color = TextDim) }
                          }
                          itemsIndexed(opts) { _, o ->
                              PickRow(o.label, o.selected && !disabled && type != C.TRACK_TYPE_VIDEO) {
                                  pc.select(o)
                                  onDismiss()
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          @Composable
          fun LogDialog(onDismiss: () -> Unit) {
              var tick by remember { mutableStateOf(0) }
              val lines = remember(tick) { NetLog.snapshot().reversed() }
              val clip = LocalClipboardManager.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Network log (newest first)") },
                  text = {
                      LazyColumn(Modifier.heightIn(max = 320.dp)) {
                          if (lines.isEmpty()) item { Text("No requests yet") }
                          items(lines) { l ->
                              Text(l, fontSize = 11.sp, fontFamily = FontFamily.Monospace, modifier = Modifier.padding(vertical = 3.dp))
                          }
                      }
                  },
                  confirmButton = {
                      Row {
                          TextButton(onClick = { clip.setText(AnnotatedString(lines.joinToString("\n"))) }) { Text("Copy") }
                          TextButton(onClick = { NetLog.clear(); tick++ }) { Text("Clear") }
                          TextButton(onClick = { tick++ }) { Text("Refresh") }
                          TextButton(onClick = onDismiss) { Text("Close") }
                      }
                  }
              )
          }
          __SB_EOF__

          mkdir -p app/src/main/java/com/streambox/player
          cat > app/src/main/java/com/streambox/player/MainActivity.kt <<'__SB_EOF__'
          package com.streambox.player

          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.viewModels
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.unit.Density
          import androidx.core.app.PictureInPictureModeChangedInfo
          import androidx.core.util.Consumer

          class MainActivity : ComponentActivity() {
              private val vm: MainVM by viewModels()
              private lateinit var pc: PlayerController

              var inPip by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  super.onCreate(savedInstanceState)
                  pc = PlayerController(this)

                  addOnPictureInPictureModeChangedListener(Consumer<PictureInPictureModeChangedInfo> { info ->
                      inPip = info.isInPictureInPictureMode
                  })

                  setContent {
                      // The whole UI is laid out on a 1340dp-wide canvas (same proportions as the TiviMate
                      // screenshots) and scaled to any TV / phone resolution.
                      val dm = resources.displayMetrics
                      val longSide = maxOf(dm.widthPixels, dm.heightPixels).toFloat()
                      CompositionLocalProvider(LocalDensity provides Density(longSide / 1340f, 1f)) {
                          AppTheme {
                              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  AppRoot(vm, pc, this@MainActivity)
                              }
                          }
                      }
                  }
                  handleIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIntent(intent)
              }

              private fun handleIntent(i: Intent?) {
                  if (i?.action == Intent.ACTION_VIEW) {
                      i.data?.toString()?.let { vm.quickPlay(it) }
                  }
              }

              fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          enterPictureInPictureMode(
                              PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                          )
                      } catch (e: Exception) {
                          // device without PiP support
                      }
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (vm.fullscreen && pc.player.isPlaying) enterPip()
              }

              override fun onStart() {
                  super.onStart()
                  // resume after having been stopped in the background
                  if (vm.current != null) vm.playNonce++
              }

              override fun onStop() {
                  super.onStop()
                  pc.stop()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (isFinishing) pc.release()
              }
          }
          __SB_EOF__


      - name: Build debug APK
        working-directory: StreamBoxApp
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: StreamBoxApp
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp StreamBoxApp/app/build/outputs/apk/debug/app-debug.apk out/StreamBox-debug.apk
          cp StreamBoxApp/app/build/outputs/apk/release/app-release.apk out/StreamBox-release.apk || true
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamBox-APK
          path: out/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StreamBox build ${{ github.run_number }}
          files: out/*.apk
