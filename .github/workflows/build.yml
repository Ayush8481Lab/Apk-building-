          @Composable
          fun SearchPage(vm: MainVM) {
              var q by rememberSaveable { mutableStateOf("") }
              val fr = pageFocus(vm)
              val res = remember(q, vm.channels, vm.epg) { vm.search(q) }
              Column(Modifier.fillMaxSize().padding(horizontal = 32.dp, vertical = 24.dp)) {
                  OutlinedTextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
                      placeholder = { Text("Search channels, categories, programs") },
                      leadingIcon = { Icon(Icons.Filled.Search, null) },
                      modifier = Modifier.fillMaxWidth().focusRequester(fr)
                  )
                  Spacer(Modifier.height(10.dp))
                  LazyColumn(Modifier.weight(1f)) {
                      items(res, key = { it.num }) { ch ->
                          ListRow(vm, ch, Modifier) {
                              vm.play(ch, res)
                              vm.enterFull()
                          }
                      }
                  }
              }
          }

          @Composable
          fun MyListPage(vm: MainVM) {
              val fr = pageFocus(vm)
              val favs = remember(vm.channels, vm.favorites) { vm.channels.filter { it.url in vm.favorites } }
              Column(Modifier.fillMaxSize().padding(horizontal = 32.dp, vertical = 24.dp)) {
                  Text("My list - favorite channels", fontSize = 26.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(12.dp))
                  if (favs.isEmpty()) Text("Long-press OK on a channel in the TV guide to add it here.", color = TextDim)
                  LazyColumn(Modifier.weight(1f)) {
                      itemsIndexed(favs, key = { _, c -> c.num }) { i, ch ->
                          ListRow(vm, ch, if (i == 0) Modifier.focusRequester(fr) else Modifier) {
                              vm.play(ch, favs)
                              vm.enterFull()
                          }
                      }
                  }
              }
          }

