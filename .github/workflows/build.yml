          /**
           * Menu row (nav + categories + fullscreen category column): rounded, gold when selected / current,
           * light fill + white rim while the remote is on it, optional item count on the right.
           */
          @Composable
          fun MenuItem(
              label: String,
              icon: ImageVector?,
              selected: Boolean,
              u: Float,
              modifier: Modifier = Modifier,
              trailing: String? = null,
              onFocus: ((Boolean) -> Unit)? = null,
              onClick: () -> Unit
          ) {
              val src = remember { MutableInteractionSource() }
              val focused by src.collectIsFocusedAsState()
              val cb by rememberUpdatedState(onFocus)
              LaunchedEffect(focused) {
                  cb?.invoke(focused)
              }
              val shape = RoundedCornerShape((12 * u).dp)
              val bg = if (focused) Color(0x33FFFFFF) else if (selected) Color(0x6678611B) else Color.Transparent
              Row(
                  modifier.fillMaxWidth().height((58 * u).dp)
                      .clip(shape)
                      .background(bg)
                      .then(if (focused) Modifier.border(1.5.dp, Color(0xCCFFFFFF), shape) else Modifier)
                      .combinedClickable(interactionSource = src, indication = null, onClick = onClick)
                      .padding(start = (18 * u).dp, end = (14 * u).dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (selected) {
                      Box(Modifier.width((4 * u).dp).height((26 * u).dp).clip(RoundedCornerShape(2.dp)).background(GoldDate))
                      Spacer(Modifier.width((12 * u).dp))
                  }
                  if (icon != null) {
                      Icon(icon, null, tint = if (selected) GoldDate else Color.White, modifier = Modifier.size((28 * u).dp))
                      Spacer(Modifier.width((18 * u).dp))
                  }
                  Text(
                      label, color = if (selected) GoldDate else Color.White, fontSize = (24 * u).sp,
                      maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f)
                  )
                  if (trailing != null) {
                      Spacer(Modifier.width((8 * u).dp))
                      Text(trailing, color = TextDim, fontSize = (19 * u).sp, maxLines = 1)
                  }
              }
          }

          /** Far-left panel (level 2): logo, TV, Search and Settings (bottom). RIGHT moves into the categories panel. */
          @Composable
          fun NavPanel(vm: MainVM, navFr: FocusRequester, catFr: FocusRequester, w: Dp, u: Float) {
              val go: (Int) -> Unit = { t ->
                  vm.tab = t
                  vm.menuLevel = if (t == 0) 1 else 0
              }
              val req: (Int) -> Modifier = { t -> if (t == vm.tab) Modifier.focusRequester(navFr) else Modifier }
              Column(
                  Modifier.width(w).fillMaxHeight()
                      .background(Brush.verticalGradient(listOf(Color(0xF22E2E2E), Color(0xF21A1A1A))))
                      .onPreviewKeyEvent { e ->
                          if (e.type == KeyEventType.KeyDown && e.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                              try {
                                  catFr.requestFocus()
                              } catch (x: Exception) {
                              }
                              true
                          } else {
                              false
                          }
                      }
                      .padding(horizontal = (22 * u).dp, vertical = (24 * u).dp)
              ) {
                  Column(
                      Modifier.fillMaxWidth().height((216 * u).dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Box(
                          Modifier.size((92 * u).dp).clip(CircleShape)
                              .background(Color(0x26EBD07A))
                              .border(2.dp, GoldDate.copy(alpha = 0.8f), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(Icons.Filled.LiveTv, null, tint = GoldDate, modifier = Modifier.size((50 * u).dp))
                      }
                      Spacer(Modifier.height((10 * u).dp))
                      Text("Live TV", color = GoldDate, fontSize = (28 * u).sp)
                      Text("${vm.channels.size} channels", color = TextDim, fontSize = (18 * u).sp)
                  }
                  Spacer(Modifier.height((20 * u).dp))
                  Box(Modifier.fillMaxWidth().height(1.dp).background(AxisLine))
                  Spacer(Modifier.height((20 * u).dp))
                  MenuItem("TV", Icons.Filled.LiveTv, vm.tab == 0, u, req(0)) { go(0) }
                  Spacer(Modifier.height((10 * u).dp))
                  MenuItem("Search", Icons.Filled.Search, vm.tab == 2, u, req(2)) { go(2) }
                  Spacer(Modifier.weight(1f))
                  MenuItem("Settings", Icons.Filled.Settings, vm.tab == 3, u, req(3)) { go(3) }
              }
          }

          /**
           * Categories panel (level 1 and 2). Moving the remote over a category shows its channels at once (no OK needed);
           * OK or RIGHT hides the menu, LEFT opens the nav panel.
           */
          @Composable
          fun CatPanel(vm: MainVM, navFr: FocusRequester, catFr: FocusRequester, w: Dp, u: Float) {
              val all = listOf(G_FAV, G_ALL, G_RECENT) + vm.categories
              val counts = remember(all, vm.channels, vm.favorites, vm.recents) { all.associateWith { vm.filter(it).size } }
              val focusCat = if (vm.tab == 0) vm.category else G_ALL
              Column(
                  Modifier.width(w).fillMaxHeight()
                      .background(Color(0xF0181818))
                      .onPreviewKeyEvent { e ->
                          val k = e.nativeKeyEvent.keyCode
                          if (e.type != KeyEventType.KeyDown) {
                              false
                          } else if (k == KeyEvent.KEYCODE_DPAD_LEFT) {
                              if (vm.menuLevel < 2) {
                                  vm.menuLevel = 2
                              } else {
                                  try {
                                      navFr.requestFocus()
                                  } catch (x: Exception) {
                                  }
                              }
                              true
                          } else if (k == KeyEvent.KEYCODE_DPAD_RIGHT) {
                              vm.menuLevel = 0
                              true
                          } else {
                              false
                          }
                      }
              ) {
                  Column(
                      Modifier.fillMaxWidth().height((200 * u).dp).padding(start = (26 * u).dp, end = (24 * u).dp),
                      verticalArrangement = Arrangement.Bottom
                  ) {
                      Text("Categories", color = GoldDate, fontSize = (30 * u).sp)
                      Spacer(Modifier.height((4 * u).dp))
                      Text("Move to preview, OK to close", color = TextDim, fontSize = (17 * u).sp, maxLines = 1)
                      Spacer(Modifier.height((14 * u).dp))
                      Box(Modifier.fillMaxWidth().height(1.dp).background(AxisLine))
                  }
                  LazyColumn(
                      Modifier.weight(1f),
                      contentPadding = PaddingValues(start = (20 * u).dp, end = (20 * u).dp, top = (14 * u).dp, bottom = (80 * u).dp),
                      verticalArrangement = Arrangement.spacedBy((4 * u).dp)
                  ) {
                      items(all) { g ->
                          MenuItem(
                              g, null, g == vm.category && vm.tab == 0, u,
                              if (g == focusCat) Modifier.focusRequester(catFr) else Modifier,
                              trailing = counts[g]?.toString(),
                              onFocus = { f ->
                                  if (f && (vm.category != g || vm.tab != 0)) {
                                      vm.category = g
                                      vm.tab = 0
                                  }
                              }
                          ) {
                              vm.category = g
                              vm.tab = 0
                              vm.menuLevel = 0
                          }
                      }
                  }
              }
          }

          /* ============================================================== GUIDE (EPG) */

          /**
           * The programme guide: time axis on top, one row per channel (number, logo, name | programme blocks laid out
           * on a real time scale), a vertical line for "now". LEFT / RIGHT move over the blocks of a row,
           * UP / DOWN jump straight to the LIVE block of the previous / next channel (the channel column is never focused).
           */
          @Composable
          fun EpgGrid(vm: MainVM, u: Float, onPick: (Channel, List<Channel>) -> Unit) {
              val list = remember(vm.channels, vm.category, vm.favorites, vm.recents) { vm.filter(vm.category) }
              val state = rememberLazyListState()
              val scope = rememberCoroutineScope()
              var pending by remember { mutableStateOf<String?>(null) }
              val base = remember(vm.now / 7_200_000L) { (vm.now / 1_800_000L) * 1_800_000L }
              val win = remember { Animatable(0f) }
              var winTarget by remember { mutableFloatStateOf(0f) }
              val curIdx = list.indexOfFirst { it.id == vm.current?.id }
              val focusIdx = if (curIdx >= 0) curIdx else 0

              LaunchedEffect(winTarget) {
                  win.animateTo(winTarget, tween(200, easing = FastOutSlowInEasing))
              }
              LaunchedEffect(base) {
                  winTarget = 0f
                  win.snapTo(0f)
              }

              LaunchedEffect(list, vm.epgTick) {
                  snapshotFlow {
                      val v = state.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }

              LaunchedEffect(vm.category) {
                  vm.hover = null
                  state.scrollToItem((focusIdx - 2).coerceAtLeast(0))
              }

              LaunchedEffect(vm.category, vm.menuLevel) {
                  if (vm.menuLevel == 0) {
                      delay(250)
                      list.getOrNull(focusIdx)?.let { pending = it.id }
                  }
              }

              LaunchedEffect(pending) {
                  if (pending != null) {
                      delay(900)
                      pending = null
                  }
              }

              BoxWithConstraints(Modifier.fillMaxSize()) {
                  // everything fits the screen: channel column = 29 % of the width, the rest shows exactly 2 hours
                  val chanW = (maxWidth.value * 0.29f).dp
                  val axisH = (60 * u).dp
                  val rowH = (maxHeight - axisH) / 8
                  val g = rowH.value / 58f
                  val visMin = 120f
                  val dpm = (maxWidth.value - chanW.value) / visMin

                  val onCell: (Channel, Program) -> Unit = { ch, p ->
                      vm.hover = Pair(ch, p)
                      val s = (p.start - base) / 60000f
                      val e = (p.stop - base) / 60000f
                      var t = winTarget
                      if (e <= t + 3f) {
                          t = s - visMin * 0.1f
                      } else if (s >= t + visMin - 12f) {
                          t = s - visMin * 0.55f
                      }
                      t = t.coerceAtLeast(0f)
                      if (Math.abs(t - winTarget) > 0.01f) winTarget = t
                  }

                  // UP / DOWN: jump to the LIVE block of the neighbouring channel, window goes back to "now"
                  val onVert: (String, Int) -> Unit = { id, d ->
                      val i = list.indexOfFirst { it.id == id }
                      val t = i + d
                      if (i >= 0 && t in list.indices) {
                          winTarget = 0f
                          pending = list[t].id
                          val v = state.layoutInfo.visibleItemsInfo
                          val fi = v.firstOrNull()?.index ?: 0
                          val li = v.lastOrNull()?.index ?: 0
                          if (d < 0 && t <= fi) {
                              scope.launch { state.animateScrollToItem((t - 1).coerceAtLeast(0)) }
                          } else if (d > 0 && t >= li) {
                              scope.launch { state.animateScrollToItem((t - 6).coerceAtLeast(0)) }
                          }
                      }
                  }

                  Column(Modifier.fillMaxSize()) {
                      TimeAxis(vm, u, chanW, axisH, dpm, visMin, base, win)
                      if (list.isEmpty()) {
                          Text("Nothing here yet", color = Dim, modifier = Modifier.padding(24.dp))
                      }
                      LazyColumn(state = state, modifier = Modifier.fillMaxWidth().weight(1f)) {
                          itemsIndexed(list, key = { _, c -> c.id }) { i, ch ->
                              EpgRow(
                                  vm, ch, i + 1, g, rowH, chanW, base, win, winTarget, visMin, dpm, pending,
                                  { pending = null }, onCell, onVert
                              ) { onPick(ch, list) }
                          }
                      }
                  }

                  // "now" line with its dot, drawn over the blocks (layout phase only, no recomposition)
                  Box(Modifier.padding(start = chanW).fillMaxSize().clipToBounds()) {
                      val dotD = (9 * u).dp
                      Box(
                          Modifier
                              .offset {
                                  val x = ((((vm.now - base) / 60000f) - win.value) * dpm).dp.roundToPx()
                                  IntOffset(x - dotD.roundToPx() / 2, 0)
                              }
                              .padding(top = axisH - dotD)
                              .width(dotD)
                              .fillMaxHeight()
                      ) {
                          Box(
                              Modifier.align(Alignment.TopCenter).padding(top = dotD / 2)
                                  .width((1.6f * u).dp.coerceAtLeast(1.dp)).fillMaxHeight().background(NowLine)
                          )
                          Box(Modifier.align(Alignment.TopCenter).size(dotD).clip(CircleShape).background(NowDot))
                      }
                  }
              }
          }

          /** Date + current time on the left, half-hour labels on the real time scale, thin line underneath. */
          @Composable
          fun TimeAxis(
              vm: MainVM,
              u: Float,
              chanW: Dp,
              axisH: Dp,
              dpm: Float,
              visMin: Float,
              base: Long,
              win: Animatable<Float, AnimationVector1D>
          ) {
              val first by remember { derivedStateOf { Math.floor(((win.value - 20f) / 30f).toDouble()).toInt() } }
              val count = ((visMin + 40f) / 30f).toInt() + 2
              Box(Modifier.fillMaxWidth().height(axisH)) {
                  Box(Modifier.fillMaxSize().padding(start = chanW - (50 * u).dp).clipToBounds()) {
                      for (k in maxOf(first, 0) until maxOf(first, 0) + count) {
                          key(k) {
                              Box(
                                  Modifier
                                      .offset { IntOffset(((k * 30f - win.value) * dpm).dp.roundToPx(), 0) }
                                      .padding(top = (26 * u).dp)
                                      .width((100 * u).dp),
                                  contentAlignment = Alignment.TopCenter
                              ) {
                                  Text(tickText(base + k * 1_800_000L), color = TextDim, fontSize = (21 * u).sp, fontFamily = CondLight, maxLines = 1)
                              }
                          }
                      }
                  }
                  Text(
                      dateText(vm.now), color = GoldDate, fontSize = (21 * u).sp, maxLines = 1, overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.padding(start = (24 * u).dp, top = (26 * u).dp).widthIn(max = chanW - (70 * u).dp)
                  )
                  Box(Modifier.align(Alignment.BottomStart).fillMaxWidth().height(1.dp).background(AxisLine))
              }
          }

          /** One guide row: channel column (number, logo, name, playing marker) + programme blocks. */
          @Composable
          fun EpgRow(
              vm: MainVM,
              ch: Channel,
              num: Int,
              u: Float,
              rowH: Dp,
              chanW: Dp,
              base: Long,
              win: Animatable<Float, AnimationVector1D>,
              winTarget: Float,
              visMin: Float,
              dpm: Float,
              pending: String?,
              onFocusDone: () -> Unit,
              onCell: (Channel, Program) -> Unit,
              onVert: (String, Int) -> Unit,
              onPick: () -> Unit
          ) {
              val all by remember(ch.id, base) { derivedStateOf { vm.timeline(ch, base) } }
              val rowHot by remember(ch.id) { derivedStateOf { (vm.hover?.first?.id ?: vm.current?.id) == ch.id } }
              val playing = ch.id == vm.current?.id
              val myFr = remember { FocusRequester() }
              val cu = minOf(u, chanW.value / 330f)

              // only blocks near the visible window are composed
              val lo = winTarget - 150f
              val hi = winTarget + visMin + 240f
              val shown = remember(all, lo, hi, base) {
                  val src = if (all.isEmpty()) {
                      listOf(Program(base, base + 86_400_000L, "No schedule available", "", "", "", ""))
                  } else {
                      all
                  }
                  val out = ArrayList<Program>()
                  for (p in src) {
                      if ((p.stop - base) / 60000f <= lo || (p.start - base) / 60000f >= hi) continue
                      out.add(p)
                  }
                  out
              }
              val liveStart = shown.firstOrNull { vm.now >= it.start && vm.now < it.stop }?.start ?: shown.firstOrNull()?.start
              val firstStart = all.firstOrNull()?.start ?: base

              // focus requests (initial focus, UP / DOWN jumps) arrive here
              LaunchedEffect(pending) {
                  if (pending == ch.id) {
                      var ok = false
                      var n = 0
                      while (!ok && n < 10) {
                          try {
                              myFr.requestFocus()
                              ok = true
                          } catch (e: Exception) {
                              delay(50)
                          }
                          n++
                      }
                      onFocusDone()
                  }
              }

              val lastStop = all.lastOrNull()?.stop ?: 0L
              LaunchedEffect(ch.id, lastStop, winTarget) {
                  if (lastStop > 0L && (lastStop - base) / 60000f < winTarget + visMin + 180f) vm.loadMoreDays(ch.id)
              }

              Row(Modifier.fillMaxWidth().height(rowH)) {
                  Row(
                      Modifier.width(chanW).fillMaxHeight()
                          .focusProperties { canFocus = false }
                          .combinedClickable(onLongClick = { vm.toggleFav(ch) }, onClick = onPick)
                          .padding(start = (24 * cu).dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(Modifier.width((40 * cu).dp), contentAlignment = Alignment.Center) {
                          Text(num.toString(), color = Color.White, fontSize = (21 * cu).sp, maxLines = 1)
                      }
                      Spacer(Modifier.width((14 * cu).dp))
                      Box(Modifier.width((64 * cu).dp).height((46 * cu).dp), contentAlignment = Alignment.Center) {
                          if (ch.logo.isNotBlank()) {
                              AsyncImage(
                                  model = ch.logo, contentDescription = null, contentScale = ContentScale.Fit,
                                  modifier = Modifier.fillMaxSize()
                              )
                          } else {
                              Text(ch.name.take(1).uppercase(), color = Color.White, fontSize = (20 * cu).sp)
                          }
                      }
                      Spacer(Modifier.width((16 * cu).dp))
                      Text(
                          ch.name, color = if (playing) GoldName else Color.White, fontSize = (22 * cu).sp,
                          maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f)
                      )
                      if (playing) {
                          Icon(
                              Icons.Filled.PlayArrow, null, tint = GoldArrow,
                              modifier = Modifier.padding(horizontal = (10 * cu).dp).size((28 * cu).dp)
                          )
                      } else {
                          Spacer(Modifier.width((48 * cu).dp))
                      }
                  }
                  Box(Modifier.weight(1f).fillMaxHeight().clipToBounds()) {
                      for (p in shown) {
                          key(p.start) {
                              EpgCell(
                                  vm, ch, p, u, base, win, dpm, rowH, rowHot,
                                  p.start == firstStart,
                                  if (p.start == liveStart) Modifier.focusRequester(myFr) else Modifier,
                                  { onCell(ch, p) }, { d -> onVert(ch.id, d) }, onPick
                              )
                          }
                      }
                  }
              }
          }

          /**
           * One programme block. Width / position follow the (animated) time window in the layout phase, so sliding
           * the guide never recomposes. UP / DOWN are handled here (jump to the live block of the next row).
           */
          @Composable
          fun EpgCell(
              vm: MainVM,
              ch: Channel,
              p: Program,
              u: Float,
              base: Long,
              win: Animatable<Float, AnimationVector1D>,
              dpm: Float,
              rowH: Dp,
              rowHot: Boolean,
              first: Boolean,
              frMod: Modifier,
              onFocus: () -> Unit,
              onVert: (Int) -> Unit,
              onClick: () -> Unit
          ) {
              val src = remember { MutableInteractionSource() }
              val focused by src.collectIsFocusedAsState()
              val s = (p.start - base) / 60000f
              val e = (p.stop - base) / 60000f
              val gap = (4 * u).dp
              val cellH = rowH - (3 * u).dp
              val inset = (1.5f * u).dp
              val cb by rememberUpdatedState(onFocus)
              LaunchedEffect(focused) {
                  if (focused) cb()
              }
              val bg = if (focused) GoldCell else if (rowHot) CellHot else CellBg
              Box(
                  Modifier
                      .offset {
                          val w0 = win.value
                          val left = if (s < w0 && e > w0) 0f else (s - w0)
                          IntOffset((left * dpm).dp.roundToPx(), inset.roundToPx())
                      }
                      .layout { m, _ ->
                          val w0 = win.value
                          val wMin = if (s < w0 && e > w0) (e - w0) else (e - s)
                          val w = ((wMin * dpm).dp.roundToPx() - gap.roundToPx()).coerceAtLeast(0)
                          val h = cellH.roundToPx()
                          val pl = m.measure(Constraints.fixed(w, h))
                          layout(w, h) { pl.place(0, 0) }
                      }
                      .onPreviewKeyEvent { ev ->
                          if (ev.type != KeyEventType.KeyDown) {
                              false
                          } else {
                              val k = ev.nativeKeyEvent.keyCode
                              if (k == KeyEvent.KEYCODE_DPAD_UP) {
                                  onVert(-1)
                                  true
                              } else if (k == KeyEvent.KEYCODE_DPAD_DOWN) {
                                  onVert(1)
                                  true
                              } else if (first && k == KeyEvent.KEYCODE_DPAD_LEFT) {
                                  if (vm.menuLevel == 0) vm.menuLevel = 1
                                  true
                              } else {
                                  false
                              }
                          }
                      }
                      .then(frMod)
                      .clip(RoundedCornerShape((4 * u).dp))
                      .background(bg)
                      .combinedClickable(
                          interactionSource = src,
                          indication = null,
                          onLongClick = { vm.toggleFav(ch) },
                          onClick = onClick
                      ),
                  contentAlignment = Alignment.CenterStart
              ) {
                  Text(
                      p.title.ifBlank { "-" },
                      color = if (focused) Color(0xFFFFFFF8) else if (rowHot) Color.White else CellText,
                      fontSize = (21 * u).sp, fontFamily = CondFont, maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.padding(start = (18 * u).dp, end = (6 * u).dp)
                  )
              }
          }

          /* ============================================================== SEARCH */

          @Composable
          fun ChannelGrid(
              vm: MainVM,
              list: List<Channel>,
              modifier: Modifier,
              onOpen: (Channel, List<Channel>) -> Unit
          ) {
              val wide = isWide()
              val gs = rememberLazyGridState()
              LaunchedEffect(list, vm.epgTick) {
                  snapshotFlow {
                      val v = gs.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }
              LazyVerticalGrid(
                  state = gs,
                  columns = GridCells.Adaptive(if (wide) 250.dp else 170.dp),
                  contentPadding = PaddingValues(horizontal = 24.dp, vertical = 18.dp),
                  horizontalArrangement = Arrangement.spacedBy(20.dp),
                  verticalArrangement = Arrangement.spacedBy(22.dp),
                  modifier = modifier.fillMaxWidth()
              ) {
                  items(list, key = { it.id }) { ch ->
                      ChannelCard(vm, ch) { onOpen(ch, list) }
                  }
              }
          }

          /**
           * Search result card: the live programme's banner is the card (programme title shows until the image loads),
           * the channel name sits under it. A thin bar shows how far the programme is.
           */
          @Composable
          fun ChannelCard(vm: MainVM, ch: Channel, onOpen: () -> Unit) {
              val np = vm.nowNext(ch).first
              val fav = ch.id in vm.favorites
              val url = if (np != null) bannerUrl(np) else ""
              Column(
                  Modifier.fillMaxWidth()
                      .focusGlow(
                          corner = 14.dp, focusScale = 1.07f,
                          onFocused = { vm.focused = ch },
                          onLongClick = { vm.toggleFav(ch) },
                          onClick = onOpen
                      )
              ) {
                  Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f).clip(RoundedCornerShape(14.dp))) {
                      BannerBox(url, np?.title?.ifBlank { ch.name } ?: ch.name, Modifier.fillMaxSize(), 14.sp)
                      if (np != null) {
                          LinearProgressIndicator(
                              progress = { progressOf(np, vm.now) },
                              modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().height(3.dp),
                              color = Accent, trackColor = Color.Black.copy(alpha = 0.45f)
                          )
                      }
                      if (fav) {
                          Icon(
                              Icons.Filled.Star, "Favorite", tint = Color(0xFFFFC107),
                              modifier = Modifier.align(Alignment.TopEnd).padding(8.dp).size(20.dp)
                          )
                      }
                  }
                  Text(
                      ch.name, color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 15.sp,
                      maxLines = 1, overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.padding(start = 4.dp, top = 8.dp, end = 4.dp)
                  )
              }
          }

          @Composable
          fun SearchTab(vm: MainVM, onOpen: (Channel, List<Channel>) -> Unit) {
              var q by rememberSaveable { mutableStateOf("") }
              val res = vm.search(q)
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
                      placeholder = { Text("Search channels, categories, programmes", color = Dim) },
                      leadingIcon = { Icon(Icons.Filled.Search, null, tint = GoldDate) },
                      colors = glassFieldColors(),
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 24.dp, vertical = 12.dp)
                  )
                  if (q.trim().length >= 2) {
                      Text(
                          "${res.size} result" + (if (res.size == 1) "" else "s"), color = Dim, fontSize = 13.sp,
                          modifier = Modifier.padding(horizontal = 30.dp)
                      )
                  } else {
                      Text(
                          "Type at least 2 letters", color = Dim, fontSize = 13.sp,
                          modifier = Modifier.padding(horizontal = 30.dp)
