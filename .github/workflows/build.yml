          cat > app/src/main/res/drawable/ic_settings.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></vector>
          EOF

          cat > app/src/main/java/com/example/livtv/App.kt <<'EOF'
          package com.example.livtv

          import android.app.Application
          import com.bumptech.glide.Glide
          import com.bumptech.glide.GlideBuilder
          import com.bumptech.glide.MemoryCategory
          import com.bumptech.glide.integration.okhttp3.OkHttpUrlLoader
          import com.bumptech.glide.load.engine.cache.InternalCacheDiskCacheFactory
          import com.bumptech.glide.load.engine.executor.GlideExecutor
          import com.bumptech.glide.load.model.GlideUrl
          import okhttp3.Request
          import java.io.InputStream

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  Prefetch.app = this
                  try {
                      // 8 download/decode threads (default is ~4). Background prefetch only uses 3 of them,
                      // so the banner / title image you are looking at never waits behind prefetch downloads.
                      Glide.init(this, GlideBuilder()
                          .setSourceExecutor(GlideExecutor.newSourceBuilder().setThreadCount(8).setName("liv-source").build())
                          .setDiskCache(InternalCacheDiskCacheFactory(this, 400L * 1024 * 1024)))
                  } catch (e: Exception) { }
                  try {
                      // Glide downloads through the shared OkHttp client (HTTP/2, keep-alive, parallel)
                      Glide.get(this).registry.replace(GlideUrl::class.java, InputStream::class.java, OkHttpUrlLoader.Factory(Net.client))
                      // bigger memory cache => images already seen / warmed show instantly
                      Glide.get(this).setMemoryCategory(MemoryCategory.HIGH)
                  } catch (e: Exception) { }
                  // open DNS + TLS + HTTP/2 connection to the image CDN and API now, so the first images don't pay for it
                  Thread {
                      for (u in listOf("https://origin-staticv2.sonyliv.com/", "https://apiv3.sonyliv.com/")) {
                          try { Net.client.newCall(Request.Builder().url(u).head().build()).execute().close() } catch (e: Exception) { }
                      }
                  }.apply { isDaemon = true; start() }
              }
          }
          EOF

          cat > app/src/main/java/com/example/livtv/MainActivity.kt <<'EOF'
          package com.example.livtv

          import android.app.Activity
          import android.app.UiModeManager
          import android.content.Context
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.TextUtils
          import android.util.TypedValue
          import android.view.*
          import android.view.animation.DecelerateInterpolator
          import android.widget.*
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.VideoSize
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.LinearSmoothScroller
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide
          import com.bumptech.glide.Priority
          import com.bumptech.glide.load.DataSource
          import com.bumptech.glide.load.DecodeFormat
          import com.bumptech.glide.load.engine.DiskCacheStrategy
          import com.bumptech.glide.load.engine.GlideException
          import com.bumptech.glide.load.engine.bitmap_recycle.BitmapPool
          import com.bumptech.glide.load.resource.bitmap.BitmapTransformation
          import com.bumptech.glide.load.resource.bitmap.FitCenter
          import com.bumptech.glide.request.RequestListener
          import com.bumptech.glide.request.target.Target
          import okhttp3.ConnectionPool
          import okhttp3.Dispatcher
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Callable
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.LinkedBlockingDeque
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          const val BASE = "https://apiv3.sonyliv.com/AGL/4.9/R/ENG/WEB/IN/UP"
          const val SHOWS_URL = "$BASE/PAGE-V2/2240?from=0&to=50&kids_safe=false&utm_source=google&utm_medium=organic"
          const val DETAIL_URL = "https://apiv3.sonyliv.com/AGL/4.8/R/ENG/WEB/IN/UP/DETAIL-V2/"
          const val EP_URL = "https://apiv3.sonyliv.com/AGL/2.6/R/ENG/WEB/IN/UP/CONTENT/DETAIL/BUNDLE/"
          const val EP_PAGE = 30
          const val TRAILER_MUTED = false      // false = trailers play WITH sound

          // Only items with this objectSubtype open the show detail page. Everything else (EPISODE, TRAILER, ...) is "under development": click does nothing.
          const val SUB_SHOW = "SHOW"

          // ---- LAYOUT KNOBS (units are for a 1280px wide screen, scaled automatically) ----
          // Left edge of title image + tag + meta + description + buttons. SAME value on the Shows page and the detail page.
          // 126 = exactly where the row titles / first card start on the Shows page.
          const val CONTENT_LEFT = 126
          // Extra push of the title PNG to the right (0 = flush with the text under it, try 20, 40 ... to move it more right)
          const val LOGO_SHIFT_X = 0

          // ---- IMAGE WIDTHS (CDN params: ?h=auto&w=<n>&q=eco). Smaller = much faster download + decode. ----
          const val W_LOGO = 900               // title image = masthead_logo_rectangualar ONLY, ?h=auto&w=900&q=eco
          const val W_BG = 1500                // all background banners
          const val W_PORTRAIT = 500           // portrait cards (shown ~170-260px wide, 500 is already 2x sharp)
          const val W_SPOT = 600               // spotlight strips
          const val W_EP = 480                 // episode thumbnails (shown ~310-460px wide)

          data class Item(
              val id: String, val title: String, val portrait: String?, val landscape: String?,
              val bg: String?, val logo: String?, val meta: String, val desc: String, val trailer: String?, val spot: String?,
              val cid: String, val sub: String
          )

          class Row(val title: String, val spotlight: Boolean, val items: List<Item>)
          class Season(val id: String, val title: String, val count: Int, val num: Int, val air: Long)
          class Ep(val id: String, val title: String, val num: Int, val desc: String, val thumb: String?, val dur: Int, val air: Long)
          class DetailData(val seasons: List<Season>, val embedded: Map<String, List<Ep>>, val latest: Ep?)

          // Cuts the transparent border off a title PNG so the visible artwork starts exactly at the left edge of the text under it.
          // Robust version: faint glow / compression noise is ignored (alpha > 48 and at least 2 pixels per column / row).
          // Fast version: scans ONE row at a time (no giant pixel array).
          class TrimTransform : BitmapTransformation() {
              override fun updateDiskCacheKey(messageDigest: MessageDigest) {
                  messageDigest.update("trim_alpha_v2".toByteArray())
              }
              override fun equals(other: Any?) = other is TrimTransform
              override fun hashCode() = 987655
              override fun transform(pool: BitmapPool, toTransform: Bitmap, outWidth: Int, outHeight: Int): Bitmap {
                  if (!toTransform.hasAlpha()) return toTransform
                  val w = toTransform.width
                  val h = toTransform.height
                  val line = IntArray(w)
                  val cols = IntArray(w)
                  val rws = IntArray(h)
                  for (y in 0 until h) {
                      toTransform.getPixels(line, 0, w, 0, y, w, 1)
                      var c = 0
                      for (x in 0 until w) {
                          if ((line[x] ushr 24) > 48) { cols[x]++; c++ }
                      }
                      rws[y] = c
                  }
                  var minX = 0; while (minX < w && cols[minX] < 2) minX++
                  var maxX = w - 1; while (maxX >= 0 && cols[maxX] < 2) maxX--
                  var minY = 0; while (minY < h && rws[minY] < 2) minY++
                  var maxY = h - 1; while (maxY >= 0 && rws[maxY] < 2) maxY--
                  if (maxX < minX || maxY < minY) return toTransform
                  if (minX == 0 && minY == 0 && maxX == w - 1 && maxY == h - 1) return toTransform
                  return Bitmap.createBitmap(toTransform, minX, minY, maxX - minX + 1, maxY - minY + 1)
              }
          }

          object Net {
              val client: OkHttpClient = OkHttpClient.Builder()
                  .dispatcher(Dispatcher().apply { maxRequests = 96; maxRequestsPerHost = 32 })
                  .connectionPool(ConnectionPool(16, 5, TimeUnit.MINUTES))
                  .connectTimeout(12, TimeUnit.SECONDS)
                  .readTimeout(20, TimeUnit.SECONDS)
                  .build()
          }

          object Api {
              val pool = Executors.newFixedThreadPool(6)
              @Volatile var lastError = ""

              // Edit headers here if the API asks for more (token, device id, etc.)
              fun get(url: String): JSONObject? {
                  return try {
                      val req = Request.Builder().url(url)
                          .header("User-Agent", "Mozilla/5.0 (Linux; Android 12; TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36")
                          .header("Accept", "application/json, text/plain, */*")
                          .header("Origin", "https://www.sonyliv.com")
                          .header("Referer", "https://www.sonyliv.com/")
                          .header("x-via-device", "true")
                          .build()
                      Net.client.newCall(req).execute().use { r ->
                          if (r.isSuccessful) JSONObject(r.body!!.string())
                          else { lastError = "HTTP " + r.code + " for " + url.take(90); null }
                      }
                  } catch (e: Exception) {
                      lastError = e.toString()
                      null
                  }
              }
          }

          // CDN resizing: small + eco quality = much faster  ->  url?h=auto&w=<w>&q=eco
          fun img(u: String?, w: Int): String? =
              if (u.isNullOrBlank()) null else u + (if (u.contains("?")) "&" else "?") + "h=auto&w=" + w + "&q=eco"

          // safe string getter: null when missing / JSON null / blank
          fun JSONObject.str(k: String): String? {
              if (!has(k) || isNull(k)) return null
              val v = optString(k, "")
              return if (v.isBlank() || v == "null") null else v
          }

          // Ad containers / ad slides (LAUNCHER_ITEM "TEST ... AD Spotlight ...", ad_template, ad_unit ...) never show up as rows or cards.
          fun isAd(o: JSONObject): Boolean {
              val layout = o.optString("layout").lowercase()
              if (layout == "ad_template" || layout.startsWith("ad_")) return true
              val ed = o.optJSONObject("editorialMetadata")
              if (ed != null && (ed.str("ad_unit") != null || ed.str("ad_unit_v1") != null || ed.str("ad_type") != null)) return true
              val m = o.optJSONObject("metadata") ?: return false
              if (m.str("ad_unit") != null || m.str("ad_unit_mweb") != null) return true
              val t = m.str("title") ?: m.str("label") ?: o.optString("title")
              return t.startsWith("AD ") || t.startsWith("Ad ") || t.contains("Above Spotlight", true) || t.contains("AD Spotlight", true)
          }

          fun fmtDur(sec: Int): String {
              if (sec <= 0) return ""
              val h = sec / 3600
              val m = (sec % 3600) / 60
              return if (h > 0) "${h}h ${m}m" else "$m mins"
          }

          fun fmtDate(ms: Long, withYear: Boolean): String {
              if (ms <= 0L) return ""
              return SimpleDateFormat(if (withYear) "dd MMM yyyy" else "dd MMM", Locale.ENGLISH).format(Date(ms))
          }

          // 3 background threads, download to disk only (no bitmaps in RAM), wait only briefly while the visible images load.
          // Glide has 8 source threads (see App.kt) so these 3 can never starve the images on screen.
          object Prefetch {
              lateinit var app: Context
              @Volatile var gate = true
              private val queue = LinkedBlockingDeque<String>()
              private val seen = java.util.Collections.synchronizedSet(HashSet<String>())

              private fun loop() {
                  while (true) {
                      try {
                          val u = queue.takeFirst()
                          var w = 0
                          while (!gate && w < 12) { Thread.sleep(100); w++ }
                          Glide.with(app).downloadOnly().load(u).diskCacheStrategy(DiskCacheStrategy.DATA)
                              .submit().get(20, TimeUnit.SECONDS)
                      } catch (e: Exception) { }
                  }
              }

              private val workers = List(3) { Thread { loop() }.apply { isDaemon = true; start() } }

              fun add(url: String?, first: Boolean = false) {
                  if (url == null || !seen.add(url)) return
                  if (first) queue.addFirst(url) else queue.addLast(url)
                  while (queue.size > 300) queue.pollLast()?.let { seen.remove(it) }
              }
          }

          // trailer url from any platformVariant (not only the first one)
          fun trailerFrom(o: JSONObject): String? {
              val arr = o.optJSONArray("platformVariants")
              if (arr != null) for (i in 0 until arr.length()) {
                  val pv = arr.optJSONObject(i) ?: continue
                  val u = pv.optString("trailerUrl")
                  if (u.startsWith("http") && pv.optBoolean("trailerAutoPlayEligibility", true)) return u
              }
              val e = o.optJSONObject("metadata")?.optJSONObject("emfAttributes")
              val u2 = e?.optString("trailer_url").orEmpty()
              return if (u2.startsWith("http")) u2 else null
          }

          // editorialMetadata.poster_background is a JSON string: {"SONY_ANDROID_TV":"url", ...}
          fun bgFromJson(js: String?): String? {
              if (js.isNullOrBlank()) return null
              return try {
                  val j = JSONObject(js)
                  var u = j.optString("SONY_ANDROID_TV")
                  if (u.isBlank()) u = j.optString("JIO_ANDROID_TV")
                  if (u.isBlank()) { val k = j.keys(); if (k.hasNext()) u = j.optString(k.next()) }
                  if (u.isBlank()) null else u
              } catch (e: Exception) { null }
          }

          // Lenient parser: CONTENT_ITEM and any other slide type that has an image.
          // Ads (LAUNCHER_ITEM ad slides) and image-less (text-only) slides are dropped.
          // Title image: ONLY masthead_logo_rectangualar (always ?h=auto&w=900&q=eco), no fallbacks.
          // Description priority: shortDescription -> launcher_short_description -> longDescription
          fun parseItem(o: JSONObject): Item? {
              val low = o.optString("layout").lowercase()
              if (isAd(o) || low.contains("template") || low.contains("promotion")) return null
              val m = o.optJSONObject("metadata") ?: JSONObject()
              val ed = o.optJSONObject("editorialMetadata") ?: JSONObject()
              val am = o.optJSONObject("assetMetadata") ?: JSONObject()
              val e = m.optJSONObject("emfAttributes") ?: JSONObject()
              val ae = am.optJSONObject("emfAttributes") ?: JSONObject()
              fun s(k: String): String? = e.str(k) ?: ae.str(k)
              fun ev(k: String): String? = ed.str(k)

              val title = m.str("title") ?: am.str("title") ?: ev("card_name") ?: ""
              val landscape = s("thumbnail") ?: s("landscape_thumb") ?: ev("landscape_image")
              val portrait = s("portrait_thumb") ?: ev("poster") ?: ev("mweb_poster")
              val bgU = s("tv_background_image") ?: bgFromJson(ev("poster_background")) ?: s("detail_cover_bg_V2")
              val spotU = s("mweb_spotlight")
              if (landscape == null && portrait == null && bgU == null && spotU == null) return null   // no text-only slides

              val cid = am.str("contentId") ?: m.str("contentId") ?: o.optString("id")
              val id = m.str("contentId") ?: o.optString("id")
              val sub = (m.str("objectSubtype") ?: am.str("objectSubtype") ?: "").uppercase()

              val parts = ArrayList<String>()
              s("IMDB")?.let { parts.add("IMDb $it") }
              (s("region_of_origin") ?: m.str("language"))?.let { parts.add(it) }
              m.optJSONArray("genres")?.optString(0)?.takeIf { it.isNotBlank() }?.let { parts.add(it) }

              val desc = m.str("shortDescription") ?: ev("launcher_short_description") ?: m.str("longDescription") ?: ""
              val logoU = img(s("masthead_logo_rectangualar"), W_LOGO)
              return Item(id, title, portrait, landscape, bgU, logoU, parts.joinToString(" • "), desc, trailerFrom(o), spotU, cid, sub)
          }

          fun parseEp(o: JSONObject?): Ep? {
              if (o == null) return null
              val m = o.optJSONObject("metadata") ?: return null
              val e = m.optJSONObject("emfAttributes") ?: JSONObject()
              val thumb = e.str("thumbnail") ?: e.str("landscape_thumb")
              val title = m.str("episodeTitle") ?: m.str("title") ?: ""
              val desc = m.str("shortDescription") ?: m.str("longDescription") ?: ""
              return Ep(m.optString("contentId"), title, m.optInt("episodeNumber"), desc, thumb, m.optInt("duration"), m.optLong("originalAirDate"))
          }

          // seasons / bundles (newest first) + the episodes already embedded in the show response
          fun parseSeasons(show: JSONObject): DetailData {
              val tmp = ArrayList<Season>()
              val emb = HashMap<String, List<Ep>>()
              var latest: Ep? = null
              val sc = show.optJSONArray("containers")
              if (sc != null) for (k in 0 until sc.length()) {
                  val c = sc.optJSONObject(k) ?: continue
                  if (c.optString("layout") != "BUNDLE_ITEM") continue
                  val sid = c.optString("id")
                  if (sid.isBlank()) continue
                  val cm = c.optJSONObject("metadata")
                  val st = cm?.str("title") ?: ("Season " + (tmp.size + 1))
                  tmp.add(Season(sid, st, c.optInt("episodeCount"), cm?.optInt("season") ?: 0, cm?.optLong("originalAirDate") ?: 0L))
                  val inner = c.optJSONArray("containers")
                  val list = ArrayList<Ep>()
                  if (inner != null) for (q in 0 until inner.length()) parseEp(inner.optJSONObject(q))?.let { list.add(it) }
                  emb[sid] = list
                  val ep = list.firstOrNull()
                  val cur = latest
                  if (ep != null && (cur == null || ep.air > cur.air)) latest = ep
              }
              val sorted = tmp.sortedWith(compareByDescending<Season> { it.num }.thenByDescending { it.air })
              return DetailData(sorted, emb, latest)
          }

          // detail page image urls: title = masthead_logo_rectangualar only (w=900), background w=1500
          fun detLogoUrl(show: JSONObject): String? {
              val e = show.optJSONObject("metadata")?.optJSONObject("emfAttributes") ?: return null
              return img(e.str("masthead_logo_rectangualar"), W_LOGO)
          }

          fun detBgUrl(show: JSONObject): String? {
              val e = show.optJSONObject("metadata")?.optJSONObject("emfAttributes") ?: return null
              return img(e.str("tv_background_image") ?: e.str("detail_cover_bg_V2") ?: e.str("thumbnail"), W_BG)
          }

