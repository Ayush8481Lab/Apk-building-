          /** TiviMate menu row: optional icon, 24 px label; gold when selected (nav), grey when the remote is on it. */
          @Composable
          fun MenuItem(
              label: String,
              icon: ImageVector?,
              selected: Boolean,
              u: Float,
              modifier: Modifier = Modifier,
              onFocus: ((Boolean) -> Unit)? = null,
              onClick: () -> Unit
          ) {
              val src = remember { MutableInteractionSource() }
              val focused by src.collectIsFocusedAsState()
              val cb by rememberUpdatedState(onFocus)
              LaunchedEffect(focused) {
                  cb?.invoke(focused)
              }
              val bg = if (selected) NavSel else if (focused) MenuFocus else Color.Transparent
              Row(
                  modifier.fillMaxWidth().height((58 * u).dp)
                      .clip(RoundedCornerShape((10 * u).dp))
                      .background(bg)
                      .combinedClickable(interactionSource = src, indication = null, onClick = onClick)
                      .padding(start = (if (icon != null) 19 else 18).times(u).dp, end = (12 * u).dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (icon != null) {
                      Icon(icon, null, tint = Color.White, modifier = Modifier.size((28 * u).dp))
                      Spacer(Modifier.width((19 * u).dp))
                  }
                  Text(label, color = Color.White, fontSize = (24 * u).sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
              }
          }

          /** Far-left panel (level 2): logo, Search, TV, Settings (bottom). RIGHT moves into the categories panel. */
          @Composable
          fun NavPanel(vm: MainVM, navFr: FocusRequester, catFr: FocusRequester, w: Dp, u: Float) {
              val go: (Int) -> Unit = { t ->
                  vm.tab = t
                  // TV -> show the categories next; Search / Settings -> open the page
                  vm.menuLevel = if (t == 0) 1 else 0
              }
              val req: (Int) -> Modifier = { t -> if (t == vm.tab) Modifier.focusRequester(navFr) else Modifier }
              Column(
                  Modifier.width(w).fillMaxHeight()
                      .background(NavBg)
                      .onPreviewKeyEvent { e ->
                          if (e.type == KeyEventType.KeyDown && e.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                              try {
                                  catFr.requestFocus()
                              } catch (x: Exception) {
                              }
                              true
                          } else {
                              false
                          }
                      }
                      .padding(horizontal = (24 * u).dp, vertical = (24 * u).dp)
              ) {
                  Column(
                      Modifier.fillMaxWidth().height((216 * u).dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Icon(Icons.Filled.LiveTv, null, tint = GoldDate, modifier = Modifier.size((72 * u).dp))
                      Spacer(Modifier.height((8 * u).dp))
                      Text("Live TV", color = GoldDate, fontSize = (26 * u).sp, fontWeight = FontWeight.Medium)
                  }
                  Spacer(Modifier.height((24 * u).dp))
                  MenuItem("Search", Icons.Filled.Search, vm.tab == 2, u, req(2)) { go(2) }
                  Spacer(Modifier.height((13 * u).dp))
                  MenuItem("TV", Icons.Filled.LiveTv, vm.tab == 0, u, req(0)) { go(0) }
                  Spacer(Modifier.weight(1f))
                  MenuItem("Settings", Icons.Filled.Settings, vm.tab == 3, u, req(3)) { go(3) }
              }
          }

          /**
           * Categories panel (level 1 and 2), text only like TiviMate. Moving the remote over a category shows its
           * channels at once (no OK needed); OK or RIGHT hides the menu, LEFT opens the nav panel.
           */
          @Composable
          fun CatPanel(vm: MainVM, navFr: FocusRequester, catFr: FocusRequester, w: Dp, u: Float) {
              val all = listOf(G_FAV, G_ALL, G_RECENT) + vm.categories
              val focusCat = if (vm.tab == 0) vm.category else G_ALL
              Column(
                  Modifier.width(w).fillMaxHeight()
                      .background(Bg)
                      .onPreviewKeyEvent { e ->
                          val k = e.nativeKeyEvent.keyCode
                          if (e.type != KeyEventType.KeyDown) {
                              false
                          } else if (k == KeyEvent.KEYCODE_DPAD_LEFT) {
                              if (vm.menuLevel < 2) {
                                  vm.menuLevel = 2
                              } else {
                                  try {
                                      navFr.requestFocus()
                                  } catch (x: Exception) {
                                  }
                              }
                              true
                          } else if (k == KeyEvent.KEYCODE_DPAD_RIGHT) {
                              vm.menuLevel = 0
                              true
                          } else {
                              false
                          }
                      }
              ) {
                  LazyColumn(
                      Modifier.weight(1f),
                      contentPadding = PaddingValues(start = (24 * u).dp, end = (24 * u).dp, top = (255 * u).dp, bottom = (80 * u).dp)
                  ) {
                      items(all) { g ->
                          MenuItem(
                              g, null, false, u,
                              if (g == focusCat) Modifier.focusRequester(catFr) else Modifier,
                              onFocus = { f ->
                                  if (f && (vm.category != g || vm.tab != 0)) {
                                      vm.category = g
                                      vm.tab = 0
                                  }
                              }
                          ) {
                              vm.category = g
                              vm.tab = 0
                              vm.menuLevel = 0
                          }
                      }
                  }
              }
          }

          /* ============================================================== GUIDE (EPG) */

          /**
           * The programme guide: time axis on top, one row per channel (number, logo, name | programme blocks laid out
           * on a real time scale), a vertical line for "now". The remote moves over the programme blocks in 2D like TiviMate;
           * the time window slides sideways by itself to keep the highlighted block visible.
           */
          @Composable
          fun EpgGrid(vm: MainVM, u: Float, onPick: (Channel, List<Channel>) -> Unit) {
              val list = remember(vm.channels, vm.category, vm.favorites, vm.recents) { vm.filter(vm.category) }
              val state = rememberLazyListState()
              var pending by remember { mutableStateOf<String?>(null) }
              // grid time zero = last half hour; re-based every two hours
              val base = remember(vm.now / 7_200_000L) { (vm.now / 1_800_000L) * 1_800_000L }
              val win = remember { Animatable(0f) }          // minutes after [base] shown at the left edge of the guide
              var winTarget by remember { mutableFloatStateOf(0f) }
              val curIdx = list.indexOfFirst { it.id == vm.current?.id }
              val focusIdx = if (curIdx >= 0) curIdx else 0

              LaunchedEffect(winTarget) {
                  win.animateTo(winTarget, tween(220, easing = FastOutSlowInEasing))
              }
              LaunchedEffect(base) {
                  winTarget = 0f
                  win.snapTo(0f)
              }

              // chunked EPG: whatever is on screen first (7 channels per chunk), then neighbours; reacts to scrolling
              LaunchedEffect(list, vm.epgTick) {
                  snapshotFlow {
                      val v = state.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }

              // new category / screen appears: show the playing channel, header goes back to the playing channel
              LaunchedEffect(vm.category) {
                  vm.hover = null
                  state.scrollToItem((focusIdx - 2).coerceAtLeast(0))
              }

              // focus the live programme of the playing channel on entering home, after fullscreen and after the menu closes
              LaunchedEffect(vm.category, vm.menuLevel) {
                  if (vm.menuLevel == 0) {
                      delay(250)
                      list.getOrNull(focusIdx)?.let { pending = it.id }
                  }
              }

              // safety: never keep a stale focus request
              LaunchedEffect(pending) {
                  if (pending != null) {
                      delay(900)
                      pending = null
                  }
              }

              BoxWithConstraints(Modifier.fillMaxSize()) {
                  val chanW = (400 * u).dp
                  val axisH = (60 * u).dp
                  val rowH = (maxHeight - axisH) / 8   // exactly 8 guide rows, like TiviMate
                  val dpm = 7.9f * u
                  val visMin = (maxWidth.value - chanW.value) / dpm

                  // every focused block: header follows it, the window slides so the block stays visible
                  val onCell: (Channel, Program) -> Unit = { ch, p ->
                      vm.hover = Pair(ch, p)
                      val s = (p.start - base) / 60000f
                      val e = (p.stop - base) / 60000f
                      var t = winTarget
                      if (s < t) {
                          t = s.coerceAtLeast(0f)
                      } else if (e > t + visMin) {
                          t = minOf(s, e - visMin).coerceAtLeast(0f)
                      }
                      if (t != winTarget) winTarget = t
                  }

                  Column(Modifier.fillMaxSize()) {
                      TimeAxis(vm, u, chanW, axisH, dpm, visMin, base, win)
                      if (list.isEmpty()) {
                          Text("Nothing here yet", color = Dim, modifier = Modifier.padding(24.dp))
                      }
                      LazyColumn(state = state, modifier = Modifier.fillMaxWidth().weight(1f)) {
                          itemsIndexed(list, key = { _, c -> c.id }) { i, ch ->
                              EpgRow(
                                  vm, ch, i + 1, u, rowH, chanW, base, win, winTarget, visMin, dpm, pending,
                                  { pending = null }, onCell
                              ) { onPick(ch, list) }
                          }
                      }
                  }

                  // "now" line with its dot, drawn over the blocks (layout phase only, no recomposition)
                  Box(Modifier.padding(start = chanW).fillMaxSize().clipToBounds()) {
                      val dotD = (9 * u).dp
                      Box(
                          Modifier
                              .offset {
                                  val x = ((((vm.now - base) / 60000f) - win.value) * dpm).dp.roundToPx()
                                  IntOffset(x - dotD.roundToPx() / 2, 0)
                              }
                              .padding(top = axisH - dotD)
                              .width(dotD)
                              .fillMaxHeight()
                      ) {
                          Box(
                              Modifier.align(Alignment.TopCenter).padding(top = dotD / 2)
                                  .width((1.6f * u).dp.coerceAtLeast(1.dp)).fillMaxHeight().background(NowLine)
                          )
                          Box(Modifier.align(Alignment.TopCenter).size(dotD).clip(CircleShape).background(NowDot))
                      }
                  }
              }
          }

          /** Date + current time on the left, half-hour labels on the real time scale, thin line underneath. */
          @Composable
          fun TimeAxis(
              vm: MainVM,
              u: Float,
              chanW: Dp,
              axisH: Dp,
              dpm: Float,
              visMin: Float,
              base: Long,
              win: Animatable<Float, AnimationVector1D>
          ) {
              val first by remember { derivedStateOf { Math.floor(((win.value - 20f) / 30f).toDouble()).toInt() } }
              val count = ((visMin + 40f) / 30f).toInt() + 2
              Box(Modifier.fillMaxWidth().height(axisH)) {
                  Box(Modifier.fillMaxSize().padding(start = chanW - (50 * u).dp).clipToBounds()) {
                      for (k in maxOf(first, 0) until maxOf(first, 0) + count) {
                          key(k) {
                              Box(
                                  Modifier
                                      .offset { IntOffset(((k * 30f - win.value) * dpm).dp.roundToPx(), 0) }
                                      .padding(top = (26 * u).dp)
                                      .width((100 * u).dp),
                                  contentAlignment = Alignment.TopCenter
                              ) {
                                  Text(tickText(base + k * 1_800_000L), color = TextDim, fontSize = (21 * u).sp, fontWeight = FontWeight.Light, maxLines = 1)
                              }
                          }
                      }
                  }
                  Text(
                      dateText(vm.now), color = GoldDate, fontSize = (21 * u).sp, fontWeight = FontWeight.Medium, maxLines = 1,
                      modifier = Modifier.padding(start = (24 * u).dp, top = (26 * u).dp)
                  )
                  Box(Modifier.align(Alignment.BottomStart).fillMaxWidth().height(1.dp).background(AxisLine))
              }
          }

          /** One guide row: channel column (number, logo, name, playing / recent marker) + programme blocks. */
          @Composable
          fun EpgRow(
              vm: MainVM,
              ch: Channel,
              num: Int,
              u: Float,
              rowH: Dp,
              chanW: Dp,
              base: Long,
              win: Animatable<Float, AnimationVector1D>,
              winTarget: Float,
              visMin: Float,
              dpm: Float,
              pending: String?,
              onFocusDone: () -> Unit,
              onCell: (Channel, Program) -> Unit,
              onPick: () -> Unit
          ) {
              val all by remember(ch.id, base) { derivedStateOf { vm.timeline(ch, base) } }
              val rowHot by remember(ch.id) { derivedStateOf { (vm.hover?.first?.id ?: vm.current?.id) == ch.id } }
              val playing = ch.id == vm.current?.id
              val myFr = remember { FocusRequester() }

              // only blocks near the visible window are composed
              val lo = winTarget - 60f
              val hi = winTarget + visMin + 240f
              val shown = remember(all, lo, hi, base) {
                  val src = if (all.isEmpty()) {
                      listOf(Program(base, base + 86_400_000L, "No schedule available", "", "", "", ""))
                  } else {
                      all
                  }
                  src.filter { (it.stop - base) / 60000f > lo && (it.start - base) / 60000f < hi }
              }
              val liveStart = shown.firstOrNull { vm.now >= it.start && vm.now < it.stop }?.start ?: shown.firstOrNull()?.start
              val firstStart = all.firstOrNull()?.start ?: base

              // initial focus (playing channel) arrives here
              LaunchedEffect(pending) {
                  if (pending == ch.id) {
                      var ok = false
                      var n = 0
                      while (!ok && n < 8) {
                          try {
                              myFr.requestFocus()
                              ok = true
                          } catch (e: Exception) {
                              delay(60)
                          }
                          n++
                      }
                      onFocusDone()
                  }
              }

              // scrolled towards the end of the loaded days: fetch the next day
              val lastStop = all.lastOrNull()?.stop ?: 0L
              LaunchedEffect(ch.id, lastStop, winTarget) {
                  if (lastStop > 0L && (lastStop - base) / 60000f < winTarget + visMin + 180f) vm.loadMoreDays(ch.id)
              }

              Row(Modifier.fillMaxWidth().height(rowH)) {
                  // channel column (touch: tap = play, long press = favourite; the remote never stops here)
                  Row(
                      Modifier.width(chanW).fillMaxHeight()
                          .focusProperties { canFocus = false }
                          .combinedClickable(onLongClick = { vm.toggleFav(ch) }, onClick = onPick)
                          .padding(start = (24 * u).dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(Modifier.width((40 * u).dp), contentAlignment = Alignment.Center) {
                          Text(num.toString(), color = Color.White, fontSize = (21 * u).sp, maxLines = 1)
                      }
                      Spacer(Modifier.width((14 * u).dp))
                      Box(Modifier.width((64 * u).dp).height((46 * u).dp), contentAlignment = Alignment.Center) {
                          if (ch.logo.isNotBlank()) {
                              AsyncImage(
                                  model = ch.logo, contentDescription = null, contentScale = ContentScale.Fit,
                                  modifier = Modifier.fillMaxSize()
                              )
                          } else {
                              Text(ch.name.take(1).uppercase(), color = Color.White, fontSize = (20 * u).sp)
                          }
                      }
                      Spacer(Modifier.width((16 * u).dp))
                      Text(
                          ch.name, color = if (playing) GoldName else Color.White, fontSize = (22 * u).sp, fontWeight = FontWeight.Medium,
                          maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f)
                      )
                      if (playing) {
                          Icon(
                              Icons.Filled.PlayArrow, null, tint = GoldArrow,
                              modifier = Modifier.padding(horizontal = (10 * u).dp).size((28 * u).dp)
                          )
                      } else {
                          Spacer(Modifier.width((48 * u).dp))
                      }
                  }
                  // programme blocks on the time scale
                  Box(Modifier.weight(1f).fillMaxHeight().clipToBounds()) {
                      for (p in shown) {
                          key(p.start) {
                              EpgCell(
                                  vm, ch, p, u, base, win, dpm, rowH, rowHot,
                                  p.start == firstStart,
                                  if (p.start == liveStart) Modifier.focusRequester(myFr) else Modifier,
                                  { onCell(ch, p) }, onPick
                              )
                          }
                      }
                  }
              }
          }

          /**
           * One programme block. Width / position follow the (animated) time window in the layout phase, so sliding
           * the guide never recomposes. Colours: normal #1E1E1E, other blocks of the highlighted row #454545,
           * highlighted block gold. Text is clipped at the block edge like TiviMate.
           */
          @Composable
          fun EpgCell(
              vm: MainVM,
              ch: Channel,
              p: Program,
              u: Float,
              base: Long,
              win: Animatable<Float, AnimationVector1D>,
              dpm: Float,
              rowH: Dp,
              rowHot: Boolean,
              first: Boolean,
              frMod: Modifier,
              onFocus: () -> Unit,
              onClick: () -> Unit
          ) {
              val src = remember { MutableInteractionSource() }
              val focused by src.collectIsFocusedAsState()
              val s = (p.start - base) / 60000f
              val e = (p.stop - base) / 60000f
              val gap = (4 * u).dp
              val cellH = rowH - (3 * u).dp
              val inset = (1.5f * u).dp
              val cb by rememberUpdatedState(onFocus)
              LaunchedEffect(focused) {
                  if (focused) cb()
              }
              val bg = if (focused) GoldCell else if (rowHot) CellHot else CellBg
              Box(
                  Modifier
                      .offset {
                          val w0 = win.value
                          val left = if (s < w0 && e > w0) 0f else (s - w0)
                          IntOffset((left * dpm).dp.roundToPx(), inset.roundToPx())
                      }
                      .layout { m, _ ->
                          val w0 = win.value
                          val wMin = if (s < w0 && e > w0) (e - w0) else (e - s)
                          val w = ((wMin * dpm).dp.roundToPx() - gap.roundToPx()).coerceAtLeast(0)
                          val h = cellH.roundToPx()
                          val pl = m.measure(Constraints.fixed(w, h))
                          layout(w, h) { pl.place(0, 0) }
                      }
                      .onPreviewKeyEvent { ev ->
                          if (ev.type == KeyEventType.KeyDown && first &&
                              ev.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_LEFT
                          ) {
                              if (vm.menuLevel == 0) vm.menuLevel = 1
                              true
                          } else {
                              false
                          }
                      }
                      .then(frMod)
                      .clip(RoundedCornerShape((4 * u).dp))
                      .background(bg)
                      .combinedClickable(
                          interactionSource = src,
                          indication = null,
                          onLongClick = { vm.toggleFav(ch) },
                          onClick = onClick
                      ),
                  contentAlignment = Alignment.CenterStart
              ) {
                  Text(
                      p.title.ifBlank { "-" },
                      color = if (focused) Color(0xFFFFFFF8) else if (rowHot) Color.White else CellText,
                      fontSize = (21 * u).sp, fontFamily = CondFont, maxLines = 1, softWrap = false,
                      overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.padding(start = (18 * u).dp, end = (10 * u).dp)
                  )
              }
          }

          /* ============================================================== SEARCH */

          @Composable
          fun ChannelGrid(
              vm: MainVM,
              list: List<Channel>,
              modifier: Modifier,
              onOpen: (Channel, List<Channel>) -> Unit
          ) {
              val wide = isWide()
              val gs = rememberLazyGridState()
              LaunchedEffect(list, vm.epgTick) {
                  snapshotFlow {
                      val v = gs.layoutInfo.visibleItemsInfo
                      Pair(v.firstOrNull()?.index ?: 0, v.lastOrNull()?.index ?: 0)
                  }.collect { r -> vm.loadEpgFor(list, r.first, r.second) }
              }
              LazyVerticalGrid(
                  state = gs,
                  columns = GridCells.Adaptive(if (wide) 230.dp else 160.dp),
                  contentPadding = PaddingValues(horizontal = 22.dp, vertical = 18.dp),
                  horizontalArrangement = Arrangement.spacedBy(18.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp),
                  modifier = modifier.fillMaxWidth()
              ) {
                  items(list, key = { it.id }) { ch ->
                      ChannelCard(vm, ch) { onOpen(ch, list) }
                  }
              }
          }

          @Composable
          fun ChannelCard(vm: MainVM, ch: Channel, onOpen: () -> Unit) {
              val np = vm.nowNext(ch).first
              val fav = ch.id in vm.favorites
              val url = if (np != null) bannerUrl(np) else ""
              Column(
                  Modifier.fillMaxWidth()
                      .focusGlow(
                          corner = 22.dp, focusScale = 1.08f,
                          onFocused = { vm.focused = ch },
                          onLongClick = { vm.toggleFav(ch) },
                          onClick = onOpen
                      )
                      .glass(RoundedCornerShape(22.dp), 0.10f)
              ) {
                  Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f)) {
                      if (url.isNotBlank()) {
                          Banner(url, Modifier.fillMaxSize())
                      } else {
                          Box(
                              Modifier.fillMaxSize().background(
                                  Brush.linearGradient(listOf(Accent.copy(alpha = 0.22f), Accent2.copy(alpha = 0.12f)))
                              )
                          )
                      }
                      Box(
                          Modifier.fillMaxSize().background(
                              Brush.verticalGradient(listOf(Color.Transparent, Color(0xAA05070D)))
                          )
                      )
                      Box(Modifier.align(Alignment.BottomStart).padding(8.dp)) { Logo(ch, 36.dp) }
                      if (fav) {
                          Icon(
                              Icons.Filled.Star, "Favorite", tint = Color(0xFFFFC107),
                              modifier = Modifier.align(Alignment.TopEnd).padding(8.dp).size(20.dp)
                          )
                      }
                  }
                  Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      Text(ch.name, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(
                          np?.title ?: ch.category, fontSize = 12.sp, color = Dim,
                          maxLines = 1, overflow = TextOverflow.Ellipsis
                      )
                      if (np != null) {
                          LinearProgressIndicator(
                              progress = { progressOf(np, vm.now) },
                              modifier = Modifier.fillMaxWidth().padding(top = 3.dp).height(3.dp),
                              color = Accent, trackColor = Color.White.copy(alpha = 0.15f)
                          )
                      }
                  }
              }
          }

          @Composable
          fun SearchTab(vm: MainVM, onOpen: (Channel, List<Channel>) -> Unit) {
              var q by rememberSaveable { mutableStateOf("") }
              val res = vm.search(q)
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
                      placeholder = { Text("Search channels, categories, programmes", color = Dim) },
                      leadingIcon = { Icon(Icons.Filled.Search, null, tint = Dim) },
                      colors = glassFieldColors(),
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 22.dp, vertical = 12.dp)
                  )
                  ChannelGrid(vm, res, Modifier.weight(1f), onOpen)
              }
          }

          /* ============================================================= SETTINGS */

          @Composable
          fun Section(title: String, content: @Composable () -> Unit) {
              Column(
                  Modifier.fillMaxWidth().glass(RoundedCornerShape(26.dp), 0.09f).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text(title, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                  content()
              }
          }

          @Composable
          fun SettingsTab(vm: MainVM) {
              val mins = if (vm.expire > 0) ((vm.expire * 1000 - (vm.now + Http.jar.skew)) / 60_000L).coerceAtLeast(0) else -1L
              val t = vm.token
              val masked = "*".repeat((t.length - 4).coerceAtLeast(0)) + t.takeLast(4)
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(22.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Section("Account") {
                      Text("Access token: $masked", color = Dim)
                      Text("${vm.channels.size} channels", color = Dim)
                      GlassButton("Change access token", icon = Icons.Filled.Lock) { vm.logout() }
                  }
                  Section("Session") {
                      Text(
                          if (mins >= 0) "Keys and stream links expire in about $mins min" else "Expiry unknown",
                          color = Dim
                      )
                      Text("Reloaded automatically 10 minutes before expiry.", color = Dim, fontSize = 12.sp)
                      GlassButton("Refresh now", icon = Icons.Filled.Refresh) { vm.refresh() }
                  }
                  Section("Player") {
                      OutlinedTextField(
                          value = vm.userAgent, onValueChange = { vm.setUa(it) }, singleLine = true,
                          label = { Text("Stream User-Agent") }, colors = glassFieldColors(),
                          shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()
                      )
                      OutlinedTextField(
                          value = vm.extraHeaders, onValueChange = { vm.updateExtraHeaders(it) },
                          label = { Text("Extra headers (Name: value, one per line)") },
                          minLines = 3, colors = glassFieldColors(),
                          shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()
                      )
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Resume last channel fullscreen on launch", Modifier.weight(1f))
                          Switch(checked = vm.resumeLast, onCheckedChange = { vm.setResume(it) })
                      }
                  }
                  Text(
                      "Menu: Back (or LEFT on the first programme of a row) slides the categories in, Back again adds TV / Search / Settings. " +
                          "Moving over a category shows it at once, OK (or RIGHT) hides the menu. " +
                          "The remote moves over the programme guide in all four directions; the header shows the highlighted programme. " +
                          "OK on a programme plays its channel, OK on the playing channel goes fullscreen, long OK adds the channel to Favorites. " +
                          "Long-press Back also goes fullscreen. EPG is cached for 30 minutes.\n\n" +
                          "Fullscreen remote: UP / DOWN change channel, LEFT or OK opens the channel list (RIGHT hides it), " +
                          "MENU opens options (audio, subtitles, quality, aspect, sleep timer), INFO shows the info card, " +
                          "BACK leaves fullscreen.",
                      fontSize = 12.sp, color = Dim
                  )
              }
          }
