          EOF
          cat > app/src/main/res/drawable/ic_movie.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M18,4l2,4h-3l-2,-4h-2l2,4h-3l-2,-4H8l2,4H7L5,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V4h-4z"/></vector>
          EOF
          cat > app/src/main/res/drawable/ic_sports.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M19,5h-2V3H7v2H5c-1.1,0 -2,0.9 -2,2v1c0,2.55 1.92,4.63 4.39,4.94 0.63,1.5 1.98,2.63 3.61,2.96V19H7v2h10v-2h-4v-3.1c1.63,-0.33 2.98,-1.46 3.61,-2.96C19.08,12.63 21,10.55 21,8V7c0,-1.1 -0.9,-2 -2,-2zM5,8V7h2v3.82C5.84,10.4 5,9.3 5,8zM19,8c0,1.3 -0.84,2.4 -2,2.82V7h2v1z"/></vector>
          EOF
          cat > app/src/main/res/drawable/ic_settings.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></vector>
          EOF

          cat > app/src/main/java/com/example/livtv/App.kt <<'EOF'
          package com.example.livtv

          import android.app.Application
          import com.bumptech.glide.Glide
          import com.bumptech.glide.integration.okhttp3.OkHttpUrlLoader
          import com.bumptech.glide.load.model.GlideUrl
          import java.io.InputStream

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  Prefetch.app = this
                  try {
                      // Glide downloads through the shared OkHttp client (HTTP/2, keep-alive, parallel)
                      Glide.get(this).registry.replace(GlideUrl::class.java, InputStream::class.java, OkHttpUrlLoader.Factory(Net.client))
                  } catch (e: Exception) { }
              }
          }
          EOF

          cat > app/src/main/java/com/example/livtv/MainActivity.kt <<'EOF'
          package com.example.livtv

          import android.app.Activity
          import android.app.UiModeManager
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.TextUtils
          import android.util.DisplayMetrics
          import android.util.TypedValue
          import android.view.*
          import android.widget.*
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.LinearSmoothScroller
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide
          import com.bumptech.glide.load.resource.drawable.DrawableTransitionOptions
          import org.json.JSONObject
          import android.graphics.drawable.Drawable
          import com.bumptech.glide.Priority
          import com.bumptech.glide.load.DataSource
          import com.bumptech.glide.load.DecodeFormat
          import com.bumptech.glide.load.engine.DiskCacheStrategy
          import com.bumptech.glide.load.engine.GlideException
          import com.bumptech.glide.request.RequestListener
          import com.bumptech.glide.request.target.Target
          import android.content.Context
          import androidx.media3.common.VideoSize
          import java.util.concurrent.LinkedBlockingDeque
          import okhttp3.ConnectionPool
          import okhttp3.Dispatcher
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.Callable
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          const val BASE = "https://apiv3.sonyliv.com/AGL/4.9/R/ENG/WEB/IN/UP"
          const val SHOWS_URL = "$BASE/PAGE-V2/2240?from=0&to=50&kids_safe=false&utm_source=google&utm_medium=organic"
          const val TRAILER_MUTED = true

          data class Item(
              val id: String, val title: String, val portrait: String?, val landscape: String?,
              val bg: String?, val logo: String?, val meta: String, val desc: String, val trailer: String?, val spot: String?
          )

          class Row(val title: String, val spotlight: Boolean, val items: List<Item>)

          object Net {
              val client: OkHttpClient = OkHttpClient.Builder()
                  .dispatcher(Dispatcher().apply { maxRequests = 64; maxRequestsPerHost = 24 })
                  .connectionPool(ConnectionPool(12, 5, TimeUnit.MINUTES))
                  .connectTimeout(12, TimeUnit.SECONDS)
                  .readTimeout(20, TimeUnit.SECONDS)
                  .build()
          }

          object Api {
              val pool = Executors.newFixedThreadPool(3)
              @Volatile var lastError = ""

              // Edit headers here if the API asks for more (token, device id, etc.)
              fun get(url: String): JSONObject? {
                  return try {
                      val req = Request.Builder().url(url)
                          .header("User-Agent", "Mozilla/5.0 (Linux; Android 12; TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36")
                          .header("Accept", "application/json, text/plain, */*")
                          .header("Origin", "https://www.sonyliv.com")
                          .header("Referer", "https://www.sonyliv.com/")
                          .header("x-via-device", "true")
                          .build()
                      Net.client.newCall(req).execute().use { r ->
                          if (r.isSuccessful) JSONObject(r.body!!.string())
                          else { lastError = "HTTP " + r.code + " for " + url.take(90); null }
                      }
                  } catch (e: Exception) {
                      lastError = e.toString()
                      null
                  }
              }
          }

          // CDN resizing: small + eco quality = much faster
          fun img(u: String?, w: Int): String? =
              if (u.isNullOrBlank()) null else u + (if (u.contains("?")) "&" else "?") + "h=auto&w=" + w + "&q=eco"

          // ONE background thread, downloads to disk only (no bitmaps in RAM), waits while the visible banner loads
          object Prefetch {
              lateinit var app: Context
              @Volatile var gate = true
              private val queue = LinkedBlockingDeque<String>()
              private val seen = java.util.Collections.synchronizedSet(HashSet<String>())
              private val worker = Thread {
                  while (true) {
                      try {
                          val u = queue.takeFirst()
                          var w = 0
                          while (!gate && w < 40) { Thread.sleep(100); w++ }
                          Glide.with(app).downloadOnly().load(u).diskCacheStrategy(DiskCacheStrategy.DATA)
                              .submit().get(20, TimeUnit.SECONDS)
                      } catch (e: Exception) { }
                  }
              }.apply { isDaemon = true; start() }

              fun add(url: String?, first: Boolean = false) {
                  if (url == null || !seen.add(url)) return
                  if (first) queue.addFirst(url) else queue.addLast(url)
                  while (queue.size > 50) queue.pollLast()?.let { seen.remove(it) }
              }
          }

          fun parseItem(o: JSONObject): Item? {
              if (o.optString("layout") != "CONTENT_ITEM") return null
              val m = o.optJSONObject("metadata") ?: return null
              val e = m.optJSONObject("emfAttributes") ?: JSONObject()
              val pv = o.optJSONArray("platformVariants")?.optJSONObject(0)
              fun s(k: String): String? = e.optString(k, "").ifBlank { null }
              val parts = ArrayList<String>()
              s("IMDB")?.let { parts.add("IMDb $it") }
              (s("region_of_origin") ?: m.optString("language")).takeIf { it.isNotBlank() }?.let { parts.add(it) }
              m.optJSONArray("genres")?.optString(0)?.takeIf { it.isNotBlank() }?.let { parts.add(it) }
              val trailer = if (pv != null && pv.optBoolean("hasTrailer") && pv.optBoolean("trailerAutoPlayEligibility", true))
                  pv.optString("trailerUrl").takeIf { it.startsWith("http") } else null
              return Item(
                  m.optString("contentId"), m.optString("title"),
                  s("portrait_thumb"), s("thumbnail") ?: s("landscape_thumb"),
                  s("tv_background_image"), s("masthead_logo_v1"),
                  parts.joinToString(" • "), m.optString("shortDescription"), trailer, s("mweb_spotlight")
              )
          }

          class MainActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private var W = 1280
              private var H = 720
              private fun u(v: Int) = (v * W / 1280f).toInt()
              private fun tx(t: TextView, size: Float) = t.setTextSize(TypedValue.COMPLEX_UNIT_PX, size * W / 1280f)

              private lateinit var root: FrameLayout
              private lateinit var content: FrameLayout
              private lateinit var bg: ImageView
              private lateinit var videoView: TextureView
              private lateinit var info: LinearLayout
              private lateinit var logo: ImageView
              private lateinit var titleTv: TextView
              private lateinit var metaTv: TextView
              private lateinit var descTv: TextView
              private lateinit var rowRv: RecyclerView
              private lateinit var status: TextView
              private lateinit var remote: LinearLayout
              private lateinit var chip: TextView
              private lateinit var rowAdapter: RowAdapter
              private val tabViews = ArrayList<ImageView>()
              private val tabNames = listOf("Search", "Home", "Shows", "Movies", "Sports", "Settings")
              private val rows = ArrayList<Row>()
              private var hero: Item? = null
              private var player: ExoPlayer? = null
              private var lastSnap = -1
              private var tab = 2
              private var loaded = false
              private var heroRun: Runnable? = null
              private var trailerRun: Runnable? = null
              private var revealed = false
              private var boxW = 0; private var boxH = 0
              private lateinit var videoBox: FrameLayout
              private var heroToken = 0
              private var cardW = 0; private var cardH = 0; private var stripW = 0; private var stripH = 0
              private var padV = 0; private var titleH = 0; private var rowH = 0; private var rvH = 0
              private var logoW = 0; private var logoH = 0; private var bgW = 1280; private var bgH = 720

              // identical options for preload + real load => disk/memory cache hit, downsampled decode
              private fun cardReq(url: String?, w: Int, h: Int) = Glide.with(this).load(url).override(w, h).centerCrop()
                  .format(DecodeFormat.PREFER_RGB_565).diskCacheStrategy(DiskCacheStrategy.ALL)
              private fun bgReq(url: String?) = Glide.with(this).load(url).override(bgW, bgH).centerCrop()
                  .diskCacheStrategy(DiskCacheStrategy.ALL)
              private fun logoReq(url: String?) = Glide.with(this).load(url).override(logoW, logoH).fitCenter()
                  .diskCacheStrategy(DiskCacheStrategy.ALL)
              private val roundOutline = object : ViewOutlineProvider() {
                  override fun getOutline(view: View, outline: Outline) {
                      outline.setRoundRect(0, 0, view.width, view.height, u(8).toFloat())
                  }
              }

              private fun lp(w: Int, h: Int, g: Int = Gravity.NO_GRAVITY) = FrameLayout.LayoutParams(w, h, g)

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val dm = resources.displayMetrics
                  W = max(dm.widthPixels, dm.heightPixels)
                  H = min(dm.widthPixels, dm.heightPixels)
                  cardH = (H * 0.27f).toInt(); cardW = cardH * 2 / 3
                  stripH = (H * 0.155f).toInt(); stripW = stripH * 16 / 9
                  padV = (H * 0.024f).toInt(); titleH = (H * 0.06f).toInt()
                  rowH = titleH + cardH + 2 * padV
                  rvH = rowH + titleH + padV / 2          // one full row + ONLY the next row's title
                  logoH = (H * 0.27f).toInt(); logoW = logoH * 16 / 9
                  bgW = min(W, 1280); bgH = bgW * 9 / 16
                  boxW = (W * 0.67f).toInt(); boxH = (H * 0.725f).toInt()   // trailer area
                  buildUi()
                  setContentView(root)
                  hideBars()
                  selectTab(2)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              @Suppress("DEPRECATION")
              private fun hideBars() {
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
              }

              // ---------------------------------------------------------------- UI
              private fun buildUi() {
                  val dark = Color.argb(255, 5, 6, 12)
                  root = FrameLayout(this).apply { setBackgroundColor(dark) }
                  content = FrameLayout(this)
                  root.addView(content, lp(-1, -1))

                  bg = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  content.addView(bg, lp(-1, -1))

                  // trailer plays ONLY inside this box (right side, above the thumbnail strip)
                  videoBox = FrameLayout(this).apply { alpha = 0f; visibility = View.GONE }
                  videoView = TextureView(this)
                  videoBox.addView(videoView, lp(boxW, boxH, Gravity.CENTER))
                  content.addView(videoBox, lp(boxW, boxH, Gravity.TOP or Gravity.END))

                  val left = View(this).apply {
                      background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(dark, Color.argb(235, 5, 6, 12), Color.argb(0, 5, 6, 12)))
                  }
                  content.addView(left, lp((W * 0.62).toInt(), -1))
                  val bottom = View(this).apply {
                      background = GradientDrawable(GradientDrawable.Orientation.BOTTOM_TOP,
                          intArrayOf(dark, Color.argb(240, 5, 6, 12), Color.argb(0, 5, 6, 12)))
                  }
                  content.addView(bottom, lp(-1, (H * 0.62).toInt(), Gravity.BOTTOM))

                  info = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  logo = ImageView(this).apply { scaleType = ImageView.ScaleType.FIT_START }
                  titleTv = TextView(this).apply {
                      setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; maxLines = 2; visibility = View.GONE
                  }
                  tx(titleTv, 34f)
                  metaTv = TextView(this).apply { setTextColor(Color.parseColor("#E0E0E0")); typeface = Typeface.DEFAULT_BOLD }
                  tx(metaTv, 13f)
                  descTv = TextView(this).apply {
                      setTextColor(Color.parseColor("#D0D0D8")); maxLines = 3; ellipsize = TextUtils.TruncateAt.END
                  }
                  tx(descTv, 14f)
                  info.addView(logo, LinearLayout.LayoutParams(logoH * 16 / 9, logoH))
                  info.addView(titleTv, LinearLayout.LayoutParams(-2, -2))
                  info.addView(metaTv, LinearLayout.LayoutParams(-2, -2).apply { topMargin = u(8) })
                  info.addView(descTv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = u(8) })
                  content.addView(info, lp((W * 0.42).toInt(), -2).apply { leftMargin = u(125); topMargin = (H * 0.06).toInt() })

                  rowRv = RecyclerView(this).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity)
                      clipChildren = false; clipToPadding = false
                      itemAnimator = null
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isFocusable = false; isFocusableInTouchMode = false
                      setPadding(0, 0, 0, rvH - rowH)
                  }
                  rowAdapter = RowAdapter()
                  rowRv.adapter = rowAdapter
                  content.addView(rowRv, lp(-1, rvH, Gravity.BOTTOM).apply { leftMargin = u(80); bottomMargin = (H * 0.008f).toInt() })

                  // status / placeholder text
                  status = TextView(this).apply {
                      setTextColor(Color.WHITE); gravity = Gravity.CENTER; text = "Loading…"
                  }
                  tx(status, 18f)
                  root.addView(status, lp(-1, -2, Gravity.CENTER))

                  // sidebar
                  val side = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL or Gravity.CENTER_VERTICAL
                      background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(Color.argb(230, 0, 0, 0), Color.argb(0, 0, 0, 0)))
                  }
                  val icons = intArrayOf(R.drawable.ic_search, R.drawable.ic_home, R.drawable.ic_tv,
                      R.drawable.ic_movie, R.drawable.ic_sports, R.drawable.ic_settings)
                  for (i in icons.indices) {
                      val iv = ImageView(this).apply {
                          setImageResource(icons[i]); contentDescription = tabNames[i]
                          setPadding(u(9), u(9), u(9), u(9))
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      iv.setOnFocusChangeListener { _, _ -> styleTab(i) }
                      iv.setOnClickListener { selectTab(i) }
                      tabViews.add(iv)
                      side.addView(iv, LinearLayout.LayoutParams(u(40), u(40)).apply { topMargin = u(16) })
                  }
                  root.addView(side, lp(u(76), -1))

                  val brand = TextView(this).apply {
                      text = "liv"; setTextColor(Color.parseColor("#FFC107")); typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC)
                  }
                  tx(brand, 26f)
                  root.addView(brand, lp(-2, -2).apply { leftMargin = u(16); topMargin = u(14) })

                  buildRemote()
              }

              private fun styleTab(i: Int) {
                  val v = tabViews[i]
                  val f = v.isFocused
                  val s = i == tab
                  v.setColorFilter(if (f || s) Color.WHITE else Color.argb(150, 255, 255, 255))
                  v.background = if (f || s) GradientDrawable().apply {
                      shape = GradientDrawable.OVAL; setColor(Color.argb(if (f) 70 else 35, 255, 255, 255))
                  } else null
                  v.animate().scaleX(if (f) 1.12f else 1f).scaleY(if (f) 1.12f else 1f).setDuration(120).start()
              }

              private fun selectTab(i: Int) {
                  tab = i
                  for (k in tabViews.indices) styleTab(k)
                  if (i == 2) {
                      content.visibility = View.VISIBLE
                      status.visibility = if (rows.isEmpty()) View.VISIBLE else View.GONE
                      if (!loaded) { loaded = true; loadShows() } else hero?.let { scheduleTrailer(it) }
                  } else {
                      stopTrailer()
                      content.visibility = View.GONE
                      status.visibility = View.VISIBLE
                      status.text = tabNames[i] + " — not wired yet"
                  }
              }

              // ---------------------------------------------------------------- Remote overlay
              private fun rbtn(label: String, w: Int = 52, h: Int = 46, action: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label; t.setTextColor(Color.WHITE); t.gravity = Gravity.CENTER; t.typeface = Typeface.DEFAULT_BOLD
                  tx(t, 16f)
                  t.background = GradientDrawable().apply { cornerRadius = u(12).toFloat(); setColor(Color.argb(255, 52, 56, 72)) }
                  t.isFocusable = false
                  t.setOnClickListener { action() }
                  t.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.86f).scaleY(0.86f).setDuration(60).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                      }
                      false
                  }
                  t.layoutParams = LinearLayout.LayoutParams(u(w), u(h)).apply { setMargins(u(3), u(3), u(3), u(3)) }
                  return t
              }

              private fun spacer(): View = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(u(52), u(46)).apply { setMargins(u(3), u(3), u(3), u(3)) }
              }

              private fun hrow(vararg v: View): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                  v.forEach { addView(it) }
              }

              private fun buildRemote() {
                  val tv = (getSystemService(UI_MODE_SERVICE) as UiModeManager).currentModeType == Configuration.UI_MODE_TYPE_TELEVISION
                  remote = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(u(10), u(6), u(10), u(10))
                      background = GradientDrawable().apply { cornerRadius = u(22).toFloat(); setColor(Color.argb(215, 22, 24, 34)) }
                      elevation = u(10).toFloat()
                  }
                  val handle = TextView(this).apply {
                      text = "⋮⋮  drag  ⋮⋮"; setTextColor(Color.argb(170, 255, 255, 255)); gravity = Gravity.CENTER
                      setPadding(0, u(4), 0, u(6))
                  }
                  tx(handle, 11f)
                  handle.setOnTouchListener(object : View.OnTouchListener {
                      var ox = 0f; var oy = 0f; var tx0 = 0f; var ty0 = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { ox = e.rawX; oy = e.rawY; tx0 = remote.translationX; ty0 = remote.translationY }
                              MotionEvent.ACTION_MOVE -> { remote.translationX = tx0 + e.rawX - ox; remote.translationY = ty0 + e.rawY - oy }
                          }
                          return true
                      }
                  })
                  remote.addView(handle)
                  remote.addView(hrow(spacer(), rbtn("▲") { move(View.FOCUS_UP) }, spacer()))
                  remote.addView(hrow(rbtn("◀") { move(View.FOCUS_LEFT) }, rbtn("OK") { currentFocus?.performClick() }, rbtn("▶") { move(View.FOCUS_RIGHT) }))
                  remote.addView(hrow(spacer(), rbtn("▼") { move(View.FOCUS_DOWN) }, spacer()))
                  remote.addView(hrow(rbtn("BACK", 80) { onBackPressed() }, rbtn("HIDE", 80) { remote.visibility = View.GONE }))
                  root.addView(remote, lp(-2, -2, Gravity.BOTTOM or Gravity.END).apply { setMargins(0, 0, u(24), u(24)) })

                  chip = TextView(this).apply {
                      text = "REMOTE"; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(u(12), u(6), u(12), u(6))
                      background = GradientDrawable().apply { cornerRadius = u(14).toFloat(); setColor(Color.argb(200, 52, 56, 72)) }
                      setOnClickListener { remote.visibility = if (remote.visibility == View.VISIBLE) View.GONE else View.VISIBLE }
                  }
                  tx(chip, 11f)
                  root.addView(chip, lp(-2, -2, Gravity.TOP or Gravity.END).apply { setMargins(0, u(12), u(16), 0) })
                  if (tv) { remote.visibility = View.GONE; chip.visibility = View.GONE }
              }

              private fun move(dir: Int) {
                  val f = currentFocus
                  if (f == null) { rowRv.getChildAt(0)?.requestFocus(); return }
                  f.focusSearch(dir)?.requestFocus(dir)
              }

              private fun hit(v: View, ev: MotionEvent): Boolean {
                  if (!v.isShown) return false
                  val r = Rect()
                  return v.getGlobalVisibleRect(r) && r.contains(ev.rawX.toInt(), ev.rawY.toInt())
              }

              // swipe up/down/left/right = D-pad, tap = OK
              private var sx = 0f
              private var sy = 0f
              private var swiped = false
              private var forward = false

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.actionMasked == MotionEvent.ACTION_DOWN) forward = hit(remote, ev) || hit(chip, ev)
                  if (forward) return super.dispatchTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { sx = ev.rawX; sy = ev.rawY; swiped = false }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = ev.rawX - sx
                          val dy = ev.rawY - sy
                          if (max(abs(dx), abs(dy)) > u(55)) {
                              val d = if (abs(dy) > abs(dx)) { if (dy < 0) View.FOCUS_UP else View.FOCUS_DOWN }
                              else { if (dx < 0) View.FOCUS_LEFT else View.FOCUS_RIGHT }
                              move(d); swiped = true; sx = ev.rawX; sy = ev.rawY
                          }
                      }
                      MotionEvent.ACTION_UP -> if (!swiped) currentFocus?.performClick()
                  }
                  return true
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  val f = currentFocus
                  if (tab == 2 && f != null && tabViews.none { it === f }) tabViews[tab].requestFocus()
                  else super.onBackPressed()
              }

              // ---------------------------------------------------------------- Data
              private fun loadShows() {
                  status.text = "Loading…"; status.visibility = View.VISIBLE
                  Thread {
                      val page = Api.get(SHOWS_URL)
                      val cs = page?.optJSONObject("resultObj")?.optJSONArray("containers")
                      if (cs == null) {
                          ui.post { status.text = "Could not load Shows page\n" + Api.lastError + "\n\nSelect Shows again to retry"; loaded = false }
                          return@Thread
                      }
                      class Job(val title: String, val spot: Boolean, val f: Future<JSONObject?>)
                      val jobs = ArrayList<Job>()
                      var gotSpot = false
                      for (i in 0 until cs.length()) {
                          val c = cs.optJSONObject(i) ?: continue
                          val layout = c.optString("layout")
                          val spot = layout == "spotlight_layout"
                          if (!spot && layout != "portrait_layout") continue   // skips ads, cards, landscape, square...
                          if (spot) { if (gotSpot) continue; gotSpot = true }
                          val uri = c.optJSONObject("retrieveItems")?.optString("uri").orEmpty()
                          if (uri.isEmpty()) continue
                          val title = c.optJSONObject("metadata")?.optString("title").orEmpty()
                          val url = BASE + uri + (if (spot) "" else "&from=0&to=15")
                          jobs.add(Job(title, spot, Api.pool.submit(Callable<JSONObject?> { Api.get(url) })))
                      }
                      for (j in jobs) {
                          val res = try { j.f.get() } catch (e: Exception) { null }
                          val arr = res?.optJSONObject("resultObj")?.optJSONArray("containers")
                          val items = ArrayList<Item>()
                          if (arr != null) for (k in 0 until arr.length()) {
                              arr.optJSONObject(k)?.let { parseItem(it) }?.let { items.add(it) }
                          }
                          if (items.isEmpty()) continue
                          val row = Row(j.title, j.spot, items)
                          ui.post { addRow(row) }
                      }
                      ui.post { if (rows.isEmpty()) status.text = "No rows returned\n" + Api.lastError }
                  }.start()
              }

              private fun addRow(r: Row) {
                  rows.add(r)
                  rowAdapter.notifyItemInserted(rows.size - 1)
                  if (tab == 2) status.visibility = View.GONE
                  if (rows.size == 1) focusFirst(12)
                  if (r.spotlight) r.items.drop(1).forEach { prefetchHero(it) }
                  else if (rows.size <= 3) prefetchRow(r, 8)
              }

              private fun focusFirst(tries: Int) {
                  ui.postDelayed({
                      val ok = rowRv.getChildAt(0)?.requestFocus() ?: false
                      if (!ok && tries > 0) focusFirst(tries - 1)
                  }, 300)
              }

              // ---------------------------------------------------------------- Hero + trailer
              private fun heroUrl(i: Item) = img(i.bg ?: i.spot ?: i.landscape, 1500)
              private fun cardUrl(spot: Boolean, i: Item) =
                  if (spot) img(i.spot ?: i.landscape ?: i.portrait, 700) else img(i.portrait ?: i.landscape, 700)
              private fun prefetchHero(i: Item, first: Boolean = false) {
                  Prefetch.add(heroUrl(i), first); Prefetch.add(i.logo, first)
              }
              private fun prefetchRow(r: Row, n: Int) {
                  r.items.take(n).forEach { Prefetch.add(cardUrl(r.spotlight, it)) }
                  r.items.firstOrNull()?.let { prefetchHero(it) }
              }

              private fun onCardFocus(item: Item, row: Row, pos: Int, rowPos: Int) {
                  snapTo(rowPos)
                  heroRun?.let { ui.removeCallbacks(it) }
                  val r = Runnable {
                      showHero(item)
                      row.items.getOrNull(pos + 1)?.let { prefetchHero(it) }
                  }
                  heroRun = r
                  ui.postDelayed(r, 150)
              }

              private fun snapTo(pos: Int) {
                  if (pos == lastSnap) return
                  lastSnap = pos
                  for (d in 1..2) rows.getOrNull(pos + d)?.let { prefetchRow(it, 8) }   // next rows, in order, after banner
                  val s = object : LinearSmoothScroller(this) {
                      override fun getVerticalSnapPreference() = SNAP_TO_START
                      override fun calculateSpeedPerPixel(dm: DisplayMetrics) = 45f / dm.densityDpi
                  }
                  s.targetPosition = pos
                  rowRv.layoutManager?.startSmoothScroll(s)
              }

              private fun showHero(item: Item) {
                  if (hero?.id == item.id && hero?.title == item.title) return
                  hero = item
                  stopTrailer(false)
                  val token = ++heroToken
                  revealed = false
                  Prefetch.gate = false                      // banner of this screen first; prefetch waits
                  // hide old banner + text immediately => banner and text never mismatch
                  info.animate().cancel(); info.alpha = 0f
                  bg.animate().cancel(); bg.animate().alpha(0f).setDuration(100).start()
                  metaTv.text = item.meta
                  descTv.text = item.desc
                  var pending = 1 + (if (item.logo != null) 1 else 0)
                  val done: () -> Unit = {
                      if (token == heroToken) { pending--; if (pending <= 0) reveal(item, token) }
                  }
                  val listener = object : RequestListener<Drawable> {
                      override fun onLoadFailed(e: GlideException?, model: Any?, target: Target<Drawable>, isFirstResource: Boolean): Boolean {
                          done(); return false
                      }
                      override fun onResourceReady(resource: Drawable, model: Any, target: Target<Drawable>, dataSource: DataSource, isFirstResource: Boolean): Boolean {
                          done(); return false
                      }
                  }
                  Glide.with(this).clear(bg)
                  bgReq(heroUrl(item)).priority(Priority.IMMEDIATE).listener(listener).into(bg)
                  if (item.logo != null) {
                      logo.visibility = View.VISIBLE; titleTv.visibility = View.GONE
                      Glide.with(this).clear(logo)
                      logoReq(item.logo).priority(Priority.IMMEDIATE).listener(listener).into(logo)
                  } else {
                      logo.setImageDrawable(null); logo.visibility = View.GONE
                      titleTv.text = item.title; titleTv.visibility = View.VISIBLE
                  }
                  ui.postDelayed({ reveal(item, token) }, 3000)   // safety if network is slow
              }

              private fun reveal(item: Item, token: Int) {
                  if (token != heroToken || revealed) return
                  revealed = true
                  Prefetch.gate = true
                  bg.animate().cancel(); bg.animate().alpha(1f).setDuration(300).start()
                  info.animate().cancel(); info.animate().alpha(1f).setDuration(300).start()
                  scheduleTrailer(item)      // trailer only after banner + title are on screen
              }

              private fun scheduleTrailer(item: Item) {
                  stopTrailer(false)
                  val t = item.trailer ?: return
                  val r = Runnable { playTrailer(t) }
                  trailerRun = r
                  ui.postDelayed(r, 700)
              }

              private fun playTrailer(url: String) {
                  try {
                      videoBox.animate().cancel(); videoBox.alpha = 0f; videoBox.visibility = View.VISIBLE
                      val p = player ?: ExoPlayer.Builder(this).build().also { pl ->
                          player = pl
                          pl.repeatMode = Player.REPEAT_MODE_ONE
                          if (TRAILER_MUTED) pl.volume = 0f
                          // cap decode size => stable on weak TV boxes
                          pl.trackSelectionParameters = pl.trackSelectionParameters.buildUpon().setMaxVideoSize(1280, 720).build()
                          pl.addListener(object : Player.Listener {
                              override fun onVideoSizeChanged(videoSize: VideoSize) {
                                  if (videoSize.width == 0 || videoSize.height == 0) return
                                  val ar = videoSize.width * videoSize.pixelWidthHeightRatio / videoSize.height
                                  var w = boxW
                                  var h = (w / ar).toInt()
                                  if (h < boxH) { h = boxH; w = (h * ar).toInt() }       // cover the marked area
                                  videoView.layoutParams = FrameLayout.LayoutParams(w, h, Gravity.CENTER)
                              }
                              override fun onRenderedFirstFrame() {
                                  videoBox.animate().cancel(); videoBox.animate().alpha(1f).setDuration(450).start()
                                  bg.animate().cancel(); bg.animate().alpha(0f).setDuration(450).start()   // no thumbnail behind video
                              }
                              override fun onPlayerError(error: PlaybackException) {
                                  videoBox.alpha = 0f; videoBox.visibility = View.GONE
                                  bg.animate().cancel(); bg.animate().alpha(1f).setDuration(250).start()
                              }
                          })
                      }
                      p.setVideoTextureView(videoView)
                      p.setMediaItem(MediaItem.fromUri(url))
                      p.prepare()
                      p.playWhenReady = true
                  } catch (e: Exception) {
                      videoBox.visibility = View.GONE
                  }
              }

              private fun stopTrailer(restoreBg: Boolean = true) {
                  trailerRun?.let { ui.removeCallbacks(it) }
                  videoBox.animate().cancel()
                  videoBox.alpha = 0f
                  videoBox.visibility = View.GONE
                  if (restoreBg && revealed) { bg.animate().cancel(); bg.animate().alpha(1f).setDuration(250).start() }
                  player?.let { it.stop(); it.clearMediaItems() }
              }

              override fun onStop() { super.onStop(); stopTrailer() }
              override fun onDestroy() { super.onDestroy(); player?.release(); player = null }

              // ---------------------------------------------------------------- Adapters
              inner class RowVH(val root: LinearLayout, val title: TextView, val rv: RecyclerView) : RecyclerView.ViewHolder(root)
              inner class CardVH(val card: FrameLayout, val iv: ImageView, val border: View) : RecyclerView.ViewHolder(card)

              inner class RowAdapter : RecyclerView.Adapter<RowVH>() {
                  override fun getItemCount() = rows.size
                  override fun onCreateViewHolder(p: ViewGroup, t: Int): RowVH {
                      val r = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.BOTTOM
                          clipChildren = false; clipToPadding = false
                          layoutParams = RecyclerView.LayoutParams(-1, rowH)       // fixed row height => exact snapping
                      }
                      val tv = TextView(this@MainActivity).apply {
                          setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                          gravity = Gravity.CENTER_VERTICAL; setPadding(u(46), 0, 0, 0)
                      }
                      tx(tv, 17f)
                      val rv = RecyclerView(this@MainActivity).apply {
                          layoutManager = LinearLayoutManager(this@MainActivity, LinearLayoutManager.HORIZONTAL, false)
                          clipChildren = false; clipToPadding = false; itemAnimator = null
                          overScrollMode = View.OVER_SCROLL_NEVER
                          isFocusable = false; isFocusableInTouchMode = false
                          setHasFixedSize(true); setItemViewCacheSize(3)
                          setPadding(u(46), padV, u(60), padV)
                      }
                      r.addView(tv, LinearLayout.LayoutParams(-1, titleH))
                      r.addView(rv, LinearLayout.LayoutParams(-1, cardH + 2 * padV))
                      return RowVH(r, tv, rv)
                  }

                  override fun onBindViewHolder(h: RowVH, pos: Int) {
                      val r = rows[pos]
                      h.title.text = r.title
                      // spotlight: strip sits at the bottom of its row, title hidden
                      h.title.visibility = if (r.spotlight) View.GONE else View.VISIBLE
                      val l = h.rv.layoutParams
                      l.height = (if (r.spotlight) stripH else cardH) + 2 * padV
                      h.rv.layoutParams = l
                      h.rv.adapter = CardAdapter(r, pos)
                  }
              }

              inner class CardAdapter(private val row: Row, private val rowPos: Int) : RecyclerView.Adapter<CardVH>() {
                  private val cw = if (row.spotlight) stripW else cardW
                  private val ch = if (row.spotlight) stripH else cardH
                  override fun getItemCount() = row.items.size

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): CardVH {
                      val card = FrameLayout(this@MainActivity).apply {
                          layoutParams = RecyclerView.LayoutParams(cw, ch).apply { rightMargin = u(12) }
                          isFocusable = true; isFocusableInTouchMode = true; isClickable = true
                      }
                      val iv = ImageView(this@MainActivity).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.rgb(26, 28, 42))
                          outlineProvider = roundOutline; clipToOutline = true
                      }
                      val border = View(this@MainActivity).apply {
                          background = GradientDrawable().apply {
                              setColor(Color.TRANSPARENT); setStroke(u(3), Color.WHITE); cornerRadius = u(8).toFloat()
                          }
                          alpha = 0f
                      }
                      card.addView(iv, FrameLayout.LayoutParams(-1, -1))
                      card.addView(border, FrameLayout.LayoutParams(-1, -1))
                      if (row.spotlight) {
                          val play = TextView(this@MainActivity).apply { text = "▶"; setTextColor(Color.WHITE) }
                          tx(play, 12f)
                          card.addView(play, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply { setMargins(u(8), 0, 0, u(6)) })
                      }
                      return CardVH(card, iv, border)
                  }

                  override fun onBindViewHolder(h: CardVH, pos: Int) {
                      val item = row.items[pos]
                      cardReq(cardUrl(row.spotlight, item), cw, ch).into(h.iv)
                      h.card.scaleX = 1f; h.card.scaleY = 1f; h.border.alpha = 0f
                      h.card.setOnFocusChangeListener { v, has ->
                          v.animate().scaleX(if (has) 1.1f else 1f).scaleY(if (has) 1.1f else 1f).setDuration(150).start()
                          h.border.animate().alpha(if (has) 1f else 0f).setDuration(150).start()
                          v.translationZ = if (has) u(10).toFloat() else 0f
                          if (has) onCardFocus(item, row, pos, rowPos)
                      }
                      h.card.setOnClickListener {
                          Toast.makeText(this@MainActivity, item.title, Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }

          EOF


      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LivTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
