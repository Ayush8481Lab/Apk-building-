          import androidx.activity.viewModels
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.core.app.PictureInPictureModeChangedInfo
          import androidx.core.util.Consumer
          import coil.Coil
          import coil.ImageLoader
          import coil.disk.DiskCache
          import coil.memory.MemoryCache

          class MainActivity : ComponentActivity() {
              private val vm: MainVM by viewModels()
              private lateinit var pc: PlayerController

              var inPip by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  super.onCreate(savedInstanceState)
                  Coil.setImageLoader(
                      ImageLoader.Builder(this)
                          .memoryCache { MemoryCache.Builder(this).maxSizePercent(0.25).build() }
                          .diskCache {
                              DiskCache.Builder().directory(cacheDir.resolve("img")).maxSizeBytes(120L * 1024 * 1024).build()
                          }
                          .crossfade(false)
                          .respectCacheHeaders(false)
                          .build()
                  )
                  pc = PlayerController(this)

                  addOnPictureInPictureModeChangedListener(Consumer<PictureInPictureModeChangedInfo> { info ->
                      inPip = info.isInPictureInPictureMode
                  })

                  setContent {
                      AppTheme {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              AppRoot(vm, pc, this@MainActivity)
                          }
                      }
                  }
              }

              fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          enterPictureInPictureMode(
                              PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                          )
                      } catch (e: Exception) {
                          // device without PiP support
                      }
                  }
              }

              // Long-press Back on the home screen -> fullscreen the playing channel.
              override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK && event.repeatCount == 0) {
                      event.startTracking()
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyLongPress(keyCode: Int, event: KeyEvent): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK &&
                      vm.phase == Phase.READY && !vm.fullscreen && vm.current != null
                  ) {
                      vm.openFullscreen()
                      return true
                  }
                  return super.onKeyLongPress(keyCode, event)
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (vm.fullscreen && pc.player.isPlaying) enterPip()
              }

              override fun onStart() {
                  super.onStart()
                  vm.checkExpiry()
                  if (vm.current != null) vm.playNonce++
              }

              override fun onStop() {
                  super.onStop()
                  pc.stop()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (isFinishing) pc.release()
              }
          }
          __SB_EOF__


      - name: Build debug APK
        working-directory: LiveTVApp
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: LiveTVApp
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp LiveTVApp/app/build/outputs/apk/debug/app-debug.apk out/LiveTV-debug.apk
          cp LiveTVApp/app/build/outputs/apk/release/app-release.apk out/LiveTV-release.apk || true
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-APK
          path: out/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live TV build ${{ github.run_number }}
          files: out/*.apk
