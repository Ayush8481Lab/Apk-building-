                  }
              }

              fun active(): Playlist? = playlists.firstOrNull { it.id == activeId }

              /* ------------------------------------------------------------ playlists */

              fun addUrl(name: String, url: String, epgUrl: String) {
                  val pl = Playlist(
                      newId(), name.ifBlank { "Playlist ${playlists.size + 1}" },
                      url.trim(), false, epgUrl.trim()
                  )
                  register(pl)
              }

              fun addXtream(name: String, server: String, user: String, pass: String) {
                  var s = server.trim().trimEnd('/')
                  if (!s.startsWith("http", true)) s = "http://$s"
                  val m3u = "$s/get.php?username=$user&password=$pass&type=m3u_plus&output=ts"
                  val epgUrl = "$s/xmltv.php?username=$user&password=$pass"
                  register(Playlist(newId(), name.ifBlank { "Xtream" }, m3u, false, epgUrl))
              }

              fun addFile(uri: Uri, name: String) {
                  val pl = Playlist(newId(), name.ifBlank { "Local playlist" }, "", true)
                  viewModelScope.launch {
                      try {
                          withContext(Dispatchers.IO) {
                              val input = getApplication<Application>().contentResolver.openInputStream(uri)
                                  ?: throw Exception("Cannot open file")
                              input.use { i -> store.file(pl.id).outputStream().use { i.copyTo(it) } }
                          }
                          register(pl)
