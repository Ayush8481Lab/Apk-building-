                          withContext(Dispatchers.IO) {
                              Net.download(pl.source, userAgent, store.file(pl.id), true)
                          }
                      }
                      playlists = playlists.map {
                          if (it.id == pl.id) it.copy(updated = System.currentTimeMillis()) else it
                      }
                      store.savePlaylists(playlists)
                      loadLocal(true)
                      toast = "Loaded ${channels.size} channels"
                  } catch (e: Exception) {
                      toast = "Failed: ${e.message}"
                  }
                  loading = false
              }

              private suspend fun loadLocal(forceEpg: Boolean) {
