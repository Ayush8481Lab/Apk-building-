          private val DBG_FMT = SimpleDateFormat("dd HH:mm", Locale.ENGLISH)

          @Composable
          fun EpgDebugDialog(vm: MainVM, onDismiss: () -> Unit) {
              val ch = vm.current
              val lines = remember(ch?.id, vm.now / 60_000L) {
                  val out = ArrayList<String>()
                  if (ch == null) {
                      out.add("No channel playing")
                  } else {
                      out.add(ch.name + "  (id " + ch.id + ")")
                      for (o in 0 until vm.daysLoaded(ch.id)) {
                          val l = vm.epg["${ch.id}:$o"]
                          out.add("")
                          out.add("RAW day offset $o: " + (l?.size?.toString() ?: "not loaded"))
                          var maxStop = Long.MIN_VALUE
                          l?.sortedBy { it.start }?.forEach {
                              val ov = if (maxStop != Long.MIN_VALUE && it.start < maxStop - 1000L) {
                                  "   !! overlaps previous by " + ((maxStop - it.start) / 60_000L) + " min"
                              } else {
                                  ""
                              }
                              out.add(DBG_FMT.format(Date(it.start)) + " - " + DBG_FMT.format(Date(it.stop)) + "  " + it.title + ov)
                              maxStop = maxOf(maxStop, it.stop)
                          }
                      }
                      out.add("")
                      out.add("CLEANED schedule used by the app:")
                      vm.fullTimeline(ch).forEach {
                          out.add(DBG_FMT.format(Date(it.start)) + " - " + DBG_FMT.format(Date(it.stop)) + "  " + it.title)
                      }
                  }
                  out
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = Color(0xF21A2030),
                  shape = RoundedCornerShape(24.dp),
                  title = { Text("EPG data") },
                  text = {
                      LazyColumn(Modifier.heightIn(max = 340.dp)) {
                          items(lines) { l ->
                              Text(l, fontSize = 11.sp, fontFamily = FontFamily.Monospace, modifier = Modifier.padding(vertical = 1.dp))
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }
