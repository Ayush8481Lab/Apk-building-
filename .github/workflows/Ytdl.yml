name: Build YtLive APK (JSON + Fast + Per-Video)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project files
        run: |
          mkdir -p app/src/main/java/com/example/ytlive
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtLive"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.ytlive'
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.ytlive"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a' }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }

              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
              implementation 'androidx.media3:media3-ui:1.4.1'

              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # Intentionally empty.
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">YtLive</string>
              <string-array name="quality_labels">
                  <item>1080p</item>
                  <item>720p</item>
                  <item>480p</item>
                  <item>360p</item>
                  <item>Best</item>
              </string-array>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:orientation="vertical"
              android:padding="16dp"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <EditText
                  android:id="@+id/urlInput"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="YouTube URL or 11-char video ID"
                  android:inputType="textUri"
                  android:importantForAutofill="no"
                  android:autofillHints="" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginTop="8dp">

                  <Spinner
                      android:id="@+id/qualitySpinner"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:entries="@array/quality_labels" />

                  <Button
                      android:id="@+id/playButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Play" />

                  <Button
                      android:id="@+id/jsonButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:text="Show JSON" />
              </LinearLayout>

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:fontFamily="monospace"
                  android:textSize="11sp"
                  android:maxLines="8"
                  android:scrollbars="vertical"
                  android:text="Idle" />

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  app:use_controller="true" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/example/ytlive/MainActivity.kt <<'EOF'
          package com.example.ytlive

          import android.app.AlertDialog
          import android.os.Bundle
          import android.text.method.ScrollingMovementMethod
          import android.util.Log
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.MediaItem
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.dash.DashMediaSource
          import androidx.media3.exoplayer.hls.HlsMediaSource
          import androidx.media3.exoplayer.source.MediaSource
          import androidx.media3.exoplayer.source.MergingMediaSource
          import androidx.media3.exoplayer.source.ProgressiveMediaSource
          import androidx.media3.ui.PlayerView
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject

          data class ResolvedStreams(val videoUrl: String, val audioUrl: String?)

          enum class Quality(val maxHeight: Int, val label: String) {
              Q1080(1080, "1080p"), Q720(720, "720p"),
              Q480(480, "480p"), Q360(360, "360p"), BEST(9999, "Best")
          }

          class MainActivity : AppCompatActivity() {

              private lateinit var player: ExoPlayer
              @Volatile private var ytReady = false

              private data class CacheKey(val url: String, val maxHeight: Int)
              private data class CachedResult(
                  val streams: ResolvedStreams,
                  val json: String,
                  val timestamp: Long
              )
              private val cache = mutableMapOf<CacheKey, CachedResult>()
              private val cacheTtlMs = 5 * 60 * 1000L

              private var lastJson: String = ""

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val urlInput = findViewById<EditText>(R.id.urlInput)
                  val qualitySpinner = findViewById<Spinner>(R.id.qualitySpinner)
                  val playBtn = findViewById<Button>(R.id.playButton)
                  val jsonBtn = findViewById<Button>(R.id.jsonButton)
                  val status = findViewById<TextView>(R.id.status)
                  val playerView = findViewById<PlayerView>(R.id.playerView)

                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player

                  playBtn.setOnClickListener {
                      val raw = urlInput.text.toString().trim()
                      if (raw.isEmpty()) {
                          status.text = "Enter a URL or video ID"
                          return@setOnClickListener
                      }
                      val url = normalizeYouTubeInput(raw)
                      val quality = Quality.entries[qualitySpinner.selectedItemPosition]
                      status.text = "Resolving (${quality.label})…"
                      lifecycleScope.launch {
                          try {
                              val result = resolveCached(url, quality.maxHeight)
                              lastJson = result.json
                              val streams = result.streams

                              val dataSource = DefaultHttpDataSource.Factory()
                                  .setUserAgent("Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36")
                                  .setAllowCrossProtocolRedirects(true)

                              val source = buildMediaSource(streams, dataSource)
                              player.setMediaSource(source)
                              player.prepare()
                              player.playWhenReady = true
                              player.seekToDefaultPosition()

                              val mode = if (streams.audioUrl != null) "merged video+audio" else "muxed"
                              status.text = buildString {
                                  appendLine("Playing ($mode)")
                                  appendLine("Video URL: ${streams.videoUrl}")
                                  append("Audio URL: ${streams.audioUrl ?: "none"}")
                              }
                          } catch (t: Throwable) {
                              Log.e("YtLive", "resolve failed", t)
                              status.text = "Error: ${t.message}"
                          }
                      }
                  }

                  jsonBtn.setOnClickListener {
                      if (lastJson.isEmpty()) {
                          status.text = "No JSON yet — press Play first"
                          return@setOnClickListener
                      }
                      showJsonDialog(lastJson)
                  }
              }

              private fun showJsonDialog(json: String) {
                  val scroll = ScrollView(this)
                  val tv = TextView(this)
                  tv.text = json
                  tv.textSize = 10f
                  tv.setPadding(24, 24, 24, 24)
                  tv.movementMethod = ScrollingMovementMethod()
                  scroll.addView(tv)
                  AlertDialog.Builder(this)
                      .setTitle("yt-dlp JSON (full)")
                      .setView(scroll)
                      .setPositiveButton("Close", null)
                      .show()
              }

              private fun normalizeYouTubeInput(input: String): String {
                  val trimmed = input.trim()
                  if (Regex("^[A-Za-z0-9_-]{11}$").matches(trimmed)) {
                      return "https://www.youtube.com/watch?v=$trimmed"
                  }
                  return trimmed
              }

              private suspend fun resolveCached(url: String, maxHeight: Int): CachedResult {
                  val key = CacheKey(url, maxHeight)
                  val now = System.currentTimeMillis()
                  cache[key]?.let {
                      if (now - it.timestamp < cacheTtlMs) return it
                  }
                  val fresh = resolveWithJson(url, maxHeight)
                  cache[key] = fresh
                  return fresh
              }

              private suspend fun resolveWithJson(url: String, maxHeight: Int): CachedResult =
                  withContext(Dispatchers.IO) {
                      if (!ytReady) {
                          YoutubeDL.getInstance().init(applicationContext)
                          ytReady = true
                      }

                      val req = YoutubeDLRequest(url)
                      req.addOption("--extractor-args", "youtube:player_client=android")
                      req.addOption("--no-warnings")
                      req.addOption("--no-call-home")
                      req.addOption("--no-cache-dir")
                      req.addOption("--socket-timeout", "10")
                      req.addOption("--retries", "1")
                      req.addOption("-f", "bv[height<=$maxHeight]+ba/b[height<=$maxHeight]/b")
                      req.addOption("-J")

                      val response = YoutubeDL.getInstance().execute(req)
                      // FIX: response.out is a String, not a List<String>. -J already emits one JSON string.
                      val jsonStr = response.out.trim()

                      Log.d("YtLiveJSON", jsonStr)

                      val root = JSONObject(jsonStr)

                      var videoUrl: String? = null
                      var audioUrl: String? = null

                      root.optJSONArray("requested_formats")?.let { rf ->
                          for (i in 0 until rf.length()) {
                              val f = rf.getJSONObject(i)
                              val u = pickUrl(f) ?: continue
                              val vcodec = f.optString("vcodec", "none")
                              val acodec = f.optString("acodec", "none")
                              when {
                                  vcodec != "none" && acodec == "none" -> videoUrl = u
                                  vcodec == "none" && acodec != "none" -> audioUrl = u
                                  vcodec != "none" && acodec != "none" -> videoUrl = u
                              }
                          }
                      }

                      if (videoUrl == null) {
                          root.optJSONArray("formats")?.let { fs ->
                              var bestVideoH = -1
                              var bestAudioBr = -1
                              for (i in 0 until fs.length()) {
                                  val f = fs.getJSONObject(i)
                                  val u = pickUrl(f) ?: continue
                                  val vcodec = f.optString("vcodec", "none")
                                  val acodec = f.optString("acodec", "none")
                                  val h = f.optInt("height", 0)
                                  val abr = f.optInt("abr", 0)
                                  if (vcodec != "none" && acodec == "none" && h <= maxHeight && h > bestVideoH) {
                                      videoUrl = u; bestVideoH = h
                                  }
                                  if (vcodec == "none" && acodec != "none" && abr > bestAudioBr) {
                                      audioUrl = u; bestAudioBr = abr
                                  }
                              }
                          }
                      }

                      if (videoUrl.isNullOrEmpty()) {
                          val top = root.optString("manifest_url", "")
                              .ifEmpty { root.optString("url", "") }
                          if (top.isNotEmpty()) videoUrl = top
                      }

                      if (videoUrl.isNullOrEmpty()) {
                          throw IllegalStateException("No playable URL found in JSON (see Show JSON)")
                      }

                      CachedResult(
                          streams = ResolvedStreams(videoUrl, audioUrl),
                          json = jsonStr,
                          timestamp = System.currentTimeMillis()
                      )
                  }

              private fun pickUrl(f: JSONObject): String? {
                  f.optString("url", "").takeIf { it.isNotEmpty() }?.let { return it }
                  f.optString("manifest_url", "").takeIf { it.isNotEmpty() }?.let { return it }
                  f.optString("fragment_base_url", "").takeIf { it.isNotEmpty() }?.let { return it }
                  return null
              }

              private fun buildMediaSource(
                  streams: ResolvedStreams,
                  dataSourceFactory: DefaultHttpDataSource.Factory
              ): MediaSource {
                  fun sourceFor(url: String): MediaSource = when {
                      url.contains(".m3u8") ->
                          HlsMediaSource.Factory(dataSourceFactory)
                              .createMediaSource(MediaItem.fromUri(url))
                      url.contains(".mpd") ->
                          DashMediaSource.Factory(dataSourceFactory)
                              .createMediaSource(MediaItem.fromUri(url))
                      else ->
                          ProgressiveMediaSource.Factory(dataSourceFactory)
                              .createMediaSource(MediaItem.fromUri(url))
                  }

                  val videoSource = sourceFor(streams.videoUrl)
                  return if (streams.audioUrl != null) {
                      MergingMediaSource(videoSource, sourceFor(streams.audioUrl))
                  } else {
                      videoSource
                  }
              }

              override fun onStop() { super.onStop(); player.pause() }
              override fun onDestroy() { super.onDestroy(); player.release() }
          }
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- Project tree ---"
          find . -type f -not -path './.git/*' | sort

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
